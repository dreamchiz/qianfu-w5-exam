PAPERS.push({id:'p2',name:'W4 Grammar 小考',sub:'Past Simple & Used to（過去式與 used to）',icon:'⏳',subj:'Grammar',parts:[
{k:'A',t:'Write the past simple of the verbs.',zh:'寫出動詞的過去式（想一想它是規則還是不規則變化）',pts:1,type:'tx',q:[
{p:'drive → ___',a:'drove',ex:'drive → drove（不規則）。',kp:'g_past'},
{p:'stop → ___',a:'stopped',ex:'stop → stopped（規則）。短母音＋一個子音結尾，要重複子音再加 ed。',kp:'g_past'},
{p:'fly → ___',a:'flew',ex:'fly → flew（不規則）。',kp:'g_past'},
{p:'change → ___',a:'changed',ex:'change → changed（規則）。e 結尾直接加 d。',kp:'g_past'},
{p:'lay → ___',a:'laid',ex:'lay（放置；下蛋）→ laid（不規則）。不要寫成 layed。',kp:'g_past'},
{p:'enjoy → ___',a:'enjoyed',ex:'enjoy → enjoyed（規則）。母音＋y 結尾，直接加 ed。',kp:'g_past'},
{p:'try → ___',a:'tried',ex:'try → tried（規則）。子音＋y 結尾，把 y 改 i 再加 ed。',kp:'g_past'},
{p:'travel → ___',a:['traveled','travelled'],ex:'travel → traveled（美式）或 travelled（英式）都對（規則）。',kp:'g_past'},
{p:'think → ___',a:'thought',ex:'think → thought（不規則）。gh 不發音。',kp:'g_past'},
{p:'go → ___',a:'went',ex:'go → went（不規則）。',kp:'g_past'}]},
{k:'B',t:'Complete the sentences with the past tense of the verbs in the box.',zh:'用框框裡動詞的過去式完成句子',pts:3,type:'tx',box:['visit','see','find','leave','run','write','catch','be','ring','freeze'],q:[

{p:'Yesterday, Lily ___ a letter to her best friend.',a:'wrote',zh:'昨天 Lily 寫了一封信給她最好的朋友。',ex:'write → wrote（不規則）。yesterday 表示過去。',kp:'g_past'},
{p:'The lake ___ completely during the cold winter last year.',a:'froze',zh:'去年寒冷的冬天，湖完全結冰了。',ex:'freeze → froze（不規則）。',kp:'g_past'},
{p:'Kevin ___ his grandparents last weekend.',a:'visited',zh:'Kevin 上週末去拜訪了他的祖父母。',ex:'visit → visited（規則）。',kp:'g_past'},
{p:'___ the students excited about the school game yesterday?',a:'Were',zh:'學生們昨天對學校的比賽感到興奮嗎？',ex:'be 動詞的過去式：主詞 the students 是複數 → Were（單數用 was）。問句把 Were 放最前面。',kp:'g_past'},
{p:'I ___ my keys in my backpack this morning.',a:'found',zh:'我今天早上在背包裡找到了鑰匙。',ex:'find → found（不規則）。',kp:'g_past'},

{p:'The children ___ to the playground when the bell rang.',a:'ran',zh:'鐘響時，孩子們跑到操場。',ex:'run → ran（不規則）。',kp:'g_past'},
{p:'We ___ the last bus home after the concert.',a:'caught',zh:'音樂會結束後，我們趕上了最後一班公車回家。',ex:'catch → caught（不規則）。catch the bus 趕上公車。',kp:'g_past'},

{k:'C',t:'Circle one mistake in each sentence and write the correct answer.',zh:'先點出句子裡錯的字，再寫出正確的字',pts:2,type:'fx',q:[

{p:'My brother teached me how to ride a bike.',wr:'teached',a:'taught',zh:'我哥哥教我怎麼騎腳踏車。',ex:'teach 是不規則動詞：teach → taught，沒有 teached。',kp:'g_past'},
{p:'Did Dad used to do the laundry?',wr:'used',a:'use',zh:'爸爸以前會洗衣服嗎？',ex:'問句有 Did 時，後面用原形：Did … use to …?（沒有 d）。',kp:'g_usedto'},

{k:'D',t:'Change the sentences into negative or interrogative sentences.',zh:'把句子改成否定句（negative）或問句（interrogative），整句寫出來',pts:4,type:'sn',q:[
{p:'The typhoon caused serious damage to the city last night. (negative)',a:['The typhoon didn\'t cause serious damage to the city last night.'],zh:'颱風昨晚沒有對城市造成嚴重的損害。',ex:'否定句：didn\'t ＋ 原形。caused → didn\'t cause。',kp:'g_did'},
{p:'Kevin spent all his money last weekend. (interrogative)',a:['Did Kevin spend all his money last weekend?'],zh:'Kevin 上週末把他所有的錢都花光了嗎？',ex:'問句：Did ＋ 主詞 ＋ 原形？spent → Did … spend …?',kp:'g_did'},
{p:'The girl used to forget her homework. (negative)',a:['The girl didn\'t use to forget her homework.'],zh:'那個女孩以前不會忘記帶作業。',ex:'used to 的否定：didn\'t use to ＋ 原形（use 沒有 d）。',kp:'g_usedto'},

{p:'Joe used to be tall and strong. (interrogative)',a:['Did Joe use to be tall and strong?'],zh:'Joe 以前又高又壯嗎？',ex:'Did Joe use to be …?（use 沒有 d）。',kp:'g_usedto'}]},
{k:'E',t:'Use the verbs and "used to" to complete the dialogue.',zh:'用 used to 和括號裡的動詞完成對話（a 是孫子，b 是奶奶）',pts:3,type:'tx',q:[
{p:'a: Grandma, ___ (you/go) to school by bus when you were young?',a:'did you use to go',zh:'奶奶，妳年輕的時候是坐公車上學的嗎？',ex:'問句在句中：did ＋ you ＋ use to ＋ go。use 沒有 d。',kp:'g_usedto'},
{p:'b: No, I didn\'t. I ___ (walk) to school with my friends.',a:'used to walk',zh:'不是，我以前都跟朋友走路上學。',ex:'肯定句：used to ＋ 原形 → used to walk。',kp:'g_usedto'},
{p:'b: We ___ (not/have) school buses.',a:['didn\'t use to have','did not use to have'],zh:'我們以前沒有校車。',ex:'否定：didn\'t use to ＋ 原形 → didn\'t use to have。',kp:'g_usedto'},
{p:'a: ___ (you/play) sports after school?',a:'Did you use to play',zh:'妳以前放學後會做運動嗎？',ex:'Did you use to play …?（句首大寫 Did）。',kp:'g_usedto'},
{p:'b: Yes, I did. We ___ (ride) our bikes in the park near our school.',a:'used to ride',zh:'會啊，我們以前會在學校附近的公園騎腳踏車。',ex:'used to ride。',kp:'g_usedto'},
{p:'a: What ___ (you/do) on weekends?',a:'did you use to do',zh:'妳以前週末都做什麼？',ex:'What ＋ did you use to do？',kp:'g_usedto'},
{p:'b: I ___ (visit) my grandparents and help them in the garden.',a:'used to visit',zh:'我以前會去看我的祖父母，幫他們整理花園。',ex:'used to visit。',kp:'g_usedto'},
{p:'a: ___ (you/have) a computer at home?',a:'Did you use to have',zh:'妳以前家裡有電腦嗎？',ex:'Did you use to have …?',kp:'g_usedto'},
{p:'b: No, we didn\'t. We ___ (not/own) one.',a:['didn\'t use to own','did not use to own'],zh:'沒有，我們以前沒有電腦。',ex:'didn\'t use to own。own 擁有。',kp:'g_usedto'},

]});

{p:'Lisa used to wear glasses when she was younger. [interrogative]',a:['Did Lisa use to wear glasses when she was younger?'],zh:'Lisa 小時候有戴眼鏡嗎？',ex:'Did Lisa use to wear …?（use 沒有 d）',kp:'g_usedto'}]},

{type:'sl',w:'muscle',u:[2,4],s:[3],ex:'muscle：sc 的 c 不發音（/ˈmʌsəl/）。'},
{type:'mc',p:'[sc]ience',o:['[sc]arf','[s]un','[sk]y'],a:1,ex:'science 的 sc 唸 /s/，跟 sun 一樣。scarf、sky 是 /sk/。'},
{type:'mc',p:'[ph]oto',o:['[f]ive','[p]en','[h]at'],a:0,ex:'photo 的 ph 唸 /f/，跟 five 一樣。'},
{type:'ox',p:'[sc]hool — [sc]issors',a:1,ex:'school 的 sc 唸 /sk/；scissors 的 sc 唸 /s/ → X。'}]},
{id:'ph_ch',subj:'Phonics',name:'ch 的三種唸法',rule:'① /tʃ/：chair、chicken、chipmunk、check（最常見）。② /ʃ/：chef、Chicago（法文來的字，像 sh）。③ /k/：choir、school、Christmas（像 k）。',ex:['chair','chicken','chef','Chicago','choir','school'],q:[
{type:'mc',p:'[ch]ef',o:['[ch]air','[sh]ip','[k]ing'],a:1,ex:'chef 的 ch 唸 /ʃ/，跟 ship 的 sh 一樣。'},
{type:'mc',p:'[ch]oir',o:['[ch]icken','[sh]oe','[k]ite'],a:2,ex:'choir 的 ch 唸 /k/，跟 kite 一樣。'},
{type:'mc',p:'Which "ch" sounds different?',o:['[ch]ips','[ch]in','[ch]ef'],a:2,ex:'chips、chin 都是 /tʃ/；chef 是 /ʃ/。'},
{type:'ox',p:'s[ch]ool — [ch]oir',a:0,ex:'school、choir 的 ch 都唸 /k/ → O。'}]},
{id:'ph_wh',subj:'Phonics',name:'wh 唸 /w/ 或 /h/',rule:'wh 大多唸 /w/：white、whine、whirl、whisper、what、when。但 who、whose、whole 的 wh 唸 /h/。',ex:['white','whine','whirl','whisper','who','whose'],q:[
{type:'mc',p:'[wh]isper',o:['[w]ind','[h]at','[wr]ap'],a:0,ex:'whisper 的 wh 唸 /w/，跟 wind 一樣。'},
{type:'mc',p:'[wh]o',o:['[w]e','[h]ot','[wh]en'],a:1,ex:'who 的 wh 唸 /h/，跟 hot 一樣。'},
{type:'ox',p:'[wh]ine — [wh]ose',a:1,ex:'whine 是 /w/；whose 是 /h/ → X。'},
{type:'ox',p:'[wh]irl — [w]orm',a:0,ex:'whirl、worm 開頭都是 /w/ → O。'}]},
/* ---------- Phonics：r 控制母音 ---------- */
{id:'ph_ar',subj:'Phonics',name:'ar 唸 /ɑr/（不重音唸 /ɚ/）',rule:'ar 在重音位置唸 /ɑr/（像「啊兒」）：cart、park、hard、large、scarf、guitar、tart、shark。但字尾不重音的 -ar 唸 /ɚ/：dollar、collar。',ex:['cart','park','guitar','shark','dollar'],q:[
{type:'mc',p:'{c[ar]t}',o:['doll[ar]','f[ar]m','w[ar]m'],a:1,ex:'cart、farm 的 ar 都唸 /ɑr/。dollar 唸 /ɚ/；warm 的 ar 唸 /ɔr/（特殊）。'},
{type:'ox',p:'st[ar] — doll[ar]',a:1,ex:'star 唸 /ɑr/；dollar 的 ar 不重音唸 /ɚ/ → X。'},
{type:'ox',p:'y[ar]d — sm[ar]t',a:0,ex:'yard、smart 都是 /ɑr/ → O。'},
{type:'mc',p:'Which word has a different "ar" sound?',o:['p[ar]k','h[ar]d','doll[ar]'],a:2,ex:'park、hard 是 /ɑr/；dollar 是 /ɚ/。'}]},
{id:'ph_or',subj:'Phonics',name:'or 唸 /ɔr/（字尾 -or 唸 /ɚ/）',rule:'or 在重音位置唸 /ɔr/（像「喔兒」）：for、horse、thorn、corn、sport、north、storm、store。但字尾不重音的 -or 唸 /ɚ/：doctor、actor、author（跟 teacher 的 er 一樣）。',ex:['for','horse','corn','north','doctor','actor'],q:[
{type:'mc',p:'{f[or]k}',o:['act[or]','h[or]n','doct[or]'],a:1,ex:'fork、horn 都是 /ɔr/。actor、doctor 字尾唸 /ɚ/。'},
{type:'ox',p:'doct[or] — teach[er]',a:0,ex:'doctor、teacher 字尾不重音，都唸 /ɚ/ → O。'},
{type:'ox',p:'st[or]m — auth[or]',a:1,ex:'storm 是 /ɔr/；author 字尾是 /ɚ/ → X。'},
{type:'mc',p:'Which word has a different "or" sound?',o:['sp[or]t','th[or]n','act[or]'],a:2,ex:'sport、thorn 是 /ɔr/；actor 是 /ɚ/。'}]},
{id:'ph_er',subj:'Phonics',name:'er / ir / ur 都唸 /ɝ/',rule:'er、ir、ur 三種拼法都唸 /ɝ/（像「兒」）：germ、person、verb、observe／third、dirty、whirl、circle、first、girl、bird／nurse、curl、turkey。',ex:['person','third','bird','nurse','turkey','circle'],q:[
{type:'mc',p:'{b[ir]d}',o:['h[er]','h[ar]d','h[or]n'],a:0,ex:'bird 的 ir、her 的 er 都是 /ɝ/。'},
{type:'ox',p:'g[ir]l — t[ur]tle',a:0,ex:'girl、turtle 都是 /ɝ/ → O。'},
{type:'ox',p:'n[ur]se — n[or]th',a:1,ex:'nurse 是 /ɝ/；north 是 /ɔr/ → X。'},
{type:'mc',p:'Which word has a different sound?',o:['sh[ir]t','c[ur]l','c[or]n'],a:2,ex:'shirt、curl 是 /ɝ/；corn 是 /ɔr/。'}]},
{id:'ph_ear',subj:'Phonics',name:'/ɪr/：ear、eer',rule:'唸 /ɪr/（像「一兒」）：ear（hear、near、year、gear、spear、smear、rear、clear、fear、dear、tears 眼淚）、eer（peer、deer、sneer、career、engineer）。⚠️ 同樣拼 ear，bear、pear、wear、swear 卻唸 /ɛr/！',ex:['hear','near','gear','deer','engineer','career'],q:[
{type:'mc',p:'{d[eer]}',o:['b[ear]','cl[ear]','h[air]'],a:1,ex:'deer、clear 都是 /ɪr/。bear、hair 是 /ɛr/。'},
{type:'ox',p:'f[ear] — p[ear]',a:1,ex:'fear 是 /ɪr/；pear 是 /ɛr/ → X（拼法一樣，唸法不同！）。'},
{type:'ox',p:'y[ear] — sn[eer]',a:0,ex:'year、sneer 都是 /ɪr/ → O。'},
{type:'mc',p:'Which word has a different sound?',o:['n[ear]','w[ear]','app[ear]'],a:1,ex:'near、appear 是 /ɪr/；wear 是 /ɛr/。'}]},
{id:'ph_air',subj:'Phonics',name:'/ɛr/：air、are、ear(bear)',rule:'唸 /ɛr/（像「欸兒」）：air（hair、chair、pair、fair、air、affair、despair、stairs）、are（hare、stare、spare、rare、care、fare、aware、silverware）、ear（bear、pear、wear、swear）。',ex:['hair','chair','stare','rare','bear','wear'],q:[
{type:'mc',p:'{c[are]}',o:['h[ear]','p[air]','h[er]'],a:1,ex:'care、pair 都是 /ɛr/。hear 是 /ɪr/。'},
{type:'ox',p:'sw[ear] — ch[air]',a:0,ex:'swear、chair 都是 /ɛr/ → O。'},
{type:'ox',p:'r[are] — r[ear]',a:1,ex:'rare 是 /ɛr/；rear 是 /ɪr/ → X。'},
{type:'mc',p:'Which word has a different sound?',o:['st[air]s','sp[are]','sp[ear]'],a:2,ex:'stairs、spare 是 /ɛr/；spear 是 /ɪr/。'}]},
{id:'ph_vocab',subj:'Phonics',name:'Phonics 單字意思',rule:'考卷上的單字要知道意思：volunteer 志工／自願、nearly 幾乎、despair 絕望、smear 塗抹、rare 稀有的、weigh 秤重、fetch 去拿回來、pledge 發誓、assign 分派、trainer 教練、observe 觀察、gear 裝備、engineer 工程師、blush 臉紅、during 在…期間、aware 注意到的。',ex:['volunteer','nearly','despair','observe','gear','aware'],q:[
{type:'mc',p:'{observe}',o:['觀察','發誓','臉紅','分派'],a:0,ex:'observe 觀察。'},
{type:'mc',p:'{rare}',o:['稀有的','後面的','酸的','有皺紋的'],a:0,ex:'rare 稀有的。'},
{type:'tx',h:'幾乎（near ＋ ly）',p:'It is ___ time for dinner.',a:'nearly',zh:'快到晚餐時間了。',ex:'nearly 幾乎；快要。'},
{type:'tx',h:'自願幫忙（不拿錢）',p:'Many students ___ to clean the park.',a:'volunteer',zh:'很多學生自願去打掃公園。',ex:'volunteer 自願。'}]},
/* ---------- Grammar ---------- */
{id:'g_past',subj:'Grammar',name:'過去式：規則與不規則',rule:'規則：一般加 ed（visited）；e 結尾加 d（changed）；子音＋y → ied（tried、studied）；母音＋y 直接加 ed（enjoyed）；短母音＋單子音 → 重複子音加 ed（stopped）。不規則要背：go→went、see→saw、write→wrote、ring→rang、freeze→froze、catch→caught、bring→brought、think→thought、teach→taught、choose→chose、throw→threw、drive→drove、fly→flew、lay→laid、leave→left、find→found、run→ran、read→read、ride→rode、wear→wore、spend→spent、be→was/were。',ex:['I visited my grandma.','He brought some fruit.','She wore a dress.'],q:[
{type:'tx',p:'plan → ___',a:'planned',ex:'plan → planned（短母音＋單子音，重複 n）。'},
{type:'tx',p:'study → ___',a:'studied',ex:'study → studied（子音＋y，y 改 i）。'},
{type:'tx',p:'play → ___',a:'played',ex:'play → played（母音＋y，直接加 ed）。'},
{type:'tx',p:'teach → ___',a:'taught',ex:'teach → taught（不規則）。'},
{type:'tx',p:'ride → ___',a:'rode',ex:'ride → rode（不規則）。'},
{type:'tx',p:'spend → ___',a:'spent',ex:'spend → spent（不規則）。'},
{type:'tx',p:'They ___ (be) at the zoo yesterday.',a:'were',zh:'他們昨天在動物園。',ex:'They 複數 → were。'}]},
{id:'g_did',subj:'Grammar',name:'did / didn\'t ＋ 原形',rule:'過去式的否定句和問句要借 did：否定 didn\'t ＋ 原形；問句 Did ＋ 主詞 ＋ 原形？動詞「不能」再用過去式（didn\'t went ✘ → didn\'t go ✔）。couldn\'t 後面也接原形。',ex:['I didn\'t go to school.','Did you see the rainbow?','He couldn\'t come.'],q:[
{type:'mc',p:'She didn\'t ___ her homework yesterday.',o:['finish','finished','finishing'],a:0,zh:'她昨天沒有寫完功課。',ex:'didn\'t ＋ 原形：didn\'t finish。'},
{type:'mc',p:'Did you ___ the movie last night?',o:['saw','see','seeing'],a:1,zh:'你昨晚有看那部電影嗎？',ex:'Did ＋ 主詞 ＋ 原形：Did you see …?'},
{type:'fx',p:'Did Tom went to the park yesterday?',wr:'went',a:'go',zh:'Tom 昨天有去公園嗎？',ex:'Did 後面接原形：go。'},
{type:'sn',p:'Amy ate a big lunch today. (negative)',a:['Amy didn\'t eat a big lunch today.'],zh:'Amy 今天沒有吃很豐盛的午餐。',ex:'ate → didn\'t eat。'},
{type:'sn',p:'Ben broke the window. (interrogative)',a:['Did Ben break the window?'],zh:'Ben 打破窗戶了嗎？',ex:'broke → Did Ben break …?'}]},
{id:'g_usedto',subj:'Grammar',name:'used to（以前常常…）',rule:'used to ＋ 原形：以前常常做（現在沒有了）。否定：didn\'t use to ＋ 原形。問句：Did ＋ 主詞 ＋ use to ＋ 原形？⚠️ 有 did／didn\'t 時是 use to（沒有 d）。',ex:['I used to live in Taichung.','She didn\'t use to like fish.','Did you use to play the piano?'],q:[
{type:'mc',p:'My dad ___ play baseball when he was young.',o:['used to','use to','using to'],a:0,zh:'我爸爸年輕時常打棒球。',ex:'肯定句：used to ＋ 原形。'},
{type:'mc',p:'Did you ___ have long hair?',o:['used to','use to','uses to'],a:1,zh:'你以前留長頭髮嗎？',ex:'Did ＋ 主詞 ＋ use to（沒有 d）。'},
{type:'mc',p:'We used to ___ in a small house.',o:['live','lived','living'],a:0,zh:'我們以前住在一間小房子裡。',ex:'used to ＋ 原形：used to live。'},
{type:'fx',p:'She didn\'t used to like vegetables.',wr:'used',a:'use',zh:'她以前不喜歡吃蔬菜。',ex:'didn\'t use to（沒有 d）。'},
{type:'sn',p:'Tim used to ride his bike to school. (interrogative)',a:['Did Tim use to ride his bike to school?'],zh:'Tim 以前騎腳踏車上學嗎？',ex:'Did Tim use to ride …?'}]},
{id:'g_to',subj:'Grammar',name:'後面接 to ＋ 原形的動詞',rule:'這些動詞後面接 to V：want、hope、decide、plan、promise、refuse、manage、offer、would like、learn、need。句型：It is nice to V、too ＋ 形容詞 ＋ to V、what to do、去某地「為了」做某事（went to the store to buy…）。',ex:['I hope to see you.','He refused to answer.','I am too tired to study.'],q:[
{type:'mc',p:'They decided ___ a new car.',o:['buy','to buy','buying'],a:1,zh:'他們決定買一台新車。',ex:'decide ＋ to V。'},
{type:'mc',p:'She promised ___ me a postcard.',o:['send','sending','to send'],a:2,zh:'她答應要寄明信片給我。',ex:'promise ＋ to V。'},
{type:'tx',p:'I need ___ (finish) my report tonight.',a:'to finish',zh:'我今晚需要完成報告。',ex:'need ＋ to V。'},
{type:'tx',p:'He went to the library ___ (borrow) some books.',a:'to borrow',zh:'他去圖書館借書。',ex:'表示目的：to ＋ 原形。'},
{type:'fx',p:'She wants going to the beach.',wr:'going',a:'to go',zh:'她想去海邊。',ex:'want ＋ to V：wants to go。'}]},
{id:'g_ing',subj:'Grammar',name:'後面接 V-ing 的動詞與介系詞',rule:'這些動詞後面接 V-ing：enjoy、finish、mind、avoid、suggest、stop、regret、practice、keep。spend ＋ 時間 ＋ V-ing。go ＋ V-ing（go camping、go swimming）。介系詞（at、in、about、of、before、after、look forward to 的 to）後面也接 V-ing：good at playing、interested in collecting、excited about meeting。',ex:['I enjoy reading.','He spends an hour practicing.','She is good at drawing.'],q:[
{type:'mc',p:'My mom suggested ___ a taxi.',o:['take','to take','taking'],a:2,zh:'媽媽建議搭計程車。',ex:'suggest ＋ V-ing。'},
{type:'mc',p:'Thank you for ___ me.',o:['help','helping','to help'],a:1,zh:'謝謝你幫我。',ex:'for 是介系詞 → V-ing。'},
{type:'tx',p:'Please keep ___ (practice) every day.',a:'practicing',zh:'請每天持續練習。',ex:'keep ＋ V-ing。'},
{type:'tx',p:'We went ___ (swim) in the lake.',a:'swimming',zh:'我們去湖裡游泳。',ex:'go ＋ V-ing：went swimming（重複 m）。'},
{type:'fx',p:'I am interested in learn English.',wr:'learn',a:'learning',zh:'我對學英文有興趣。',ex:'介系詞 in 後面接 V-ing。'},
{type:'sn',p:'Mia / spends / an hour / draw / every day',a:['Mia spends an hour drawing every day.'],zh:'Mia 每天花一小時畫畫。',ex:'spend ＋ 時間 ＋ V-ing。'}]},
{id:'g_bare',subj:'Grammar',name:'後面接原形動詞',rule:'情態助動詞（can、could、should、must、will、may）後面接原形：can run、should drink、must wash、couldn\'t go。let ＋ 人 ＋ 原形、make ＋ 人 ＋ 原形：let me go、made us laugh（不加 to）。',ex:['You should drink water.','Let me help you.','The joke made me laugh.'],q:[
{type:'mc',p:'My mom made me ___ my room.',o:['clean','to clean','cleaning'],a:0,zh:'媽媽叫我打掃房間。',ex:'make ＋ 人 ＋ 原形。'},
{type:'mc',p:'You must ___ quiet in the library.',o:['are','be','being'],a:1,zh:'在圖書館你一定要安靜。',ex:'must ＋ 原形 be。'},
{type:'tx',p:'Let him ___ (play) with us.',a:'play',zh:'讓他跟我們一起玩。',ex:'let ＋ 人 ＋ 原形。'},
{type:'fx',p:'She can speaks three languages.',wr:'speaks',a:'speak',zh:'她會說三種語言。',ex:'can 後面接原形：can speak（不加 s）。'},
{type:'sn',p:'Dad / let / me / watch / TV',a:['Dad let me watch TV.','Dad lets me watch TV.'],zh:'爸爸讓我看電視。',ex:'let ＋ 人 ＋ 原形。'}]},
{id:'g_both',subj:'Grammar',name:'to V 和 V-ing 都可以的動詞',rule:'continue、start、begin、like、love、hate 後面接 to V 或 V-ing 都可以：continued playing ＝ continued to play。',ex:['It started to rain.','It started raining.'],q:[
{type:'mc',p:'It began ___ after lunch. (選出「不能」用的)',o:['to snow','snowing','snow'],a:2,full:'It began to snow after lunch.',zh:'午餐後開始下雪。',ex:'begin ＋ to V 或 V-ing 都可以，但不能接原形 snow。'},
{type:'tx',p:'They continued ___ (talk) after class. (寫 V-ing)',a:'talking',zh:'他們下課後繼續聊天。',ex:'continue ＋ V-ing（也可寫 to talk）。'}]},
{id:'g_objto',subj:'Grammar',name:'tell / advise / ask ＋ 人 ＋ to V',rule:'tell、advise、ask、want ＋ 人 ＋ to ＋ 原形：told us to run、advised me to drink。（注意 let、make 不加 to）',ex:['The coach told us to run.','Mom asked me to help.'],q:[
{type:'mc',p:'The teacher asked us ___ quiet.',o:['be','to be','being'],a:1,zh:'老師要我們保持安靜。',ex:'ask ＋ 人 ＋ to V。'},
{type:'tx',p:'My doctor advised me ___ (sleep) more.',a:'to sleep',zh:'醫生建議我多睡一點。',ex:'advise ＋ 人 ＋ to V。'},
{type:'mc',p:'Mom told me ___ my teeth.',o:['brush','to brush','brushing'],a:1,zh:'媽媽叫我刷牙。',ex:'tell ＋ 人 ＋ to V。'}]},
{id:'g_some',subj:'Grammar',name:'some / any / no / every 複合字',rule:'① 肯定句用 some-：something、someone、somewhere。② 否定句（not、n\'t）和一般問句用 any-：anything、anyone、anywhere。③「提供／邀請」的問句（Would you like…? Can I get you…?）用 some-。④ no- 本身就是否定：nothing、nobody、nowhere，不要再加 not。⑤ every-：everyone 每個人、everything 一切、everywhere 到處。⑥ 形容詞放在後面：something cold、somewhere special。⑦ anywhere 在肯定句是「任何地方都可以」。',ex:['I have something to tell you.','I don\'t know anything.','There is nobody here.','Would you like something to eat?'],q:[
{type:'mc',p:'There isn\'t ___ in the box.',o:['something','anything','nothing'],a:1,zh:'箱子裡沒有東西。',ex:'否定句 isn\'t ＋ anything。'},
{type:'mc',p:'Would you like ___ to eat?',o:['something','anything','nothing'],a:0,zh:'你想吃點東西嗎？',ex:'提供的問句 → something。'},
{type:'mc',p:'I looked for my cat, but she was ___.',o:['nowhere','anywhere','somewhere'],a:0,zh:'我找我的貓，但到處都找不到她。',ex:'肯定句表示「哪裡都沒有」→ nowhere。'},
{type:'tx',p:'I didn\'t see ___ at the bus stop. (人)',a:['anyone','anybody'],zh:'我在公車站沒看到任何人。',ex:'否定句 didn\'t → anyone／anybody。'},
{type:'tx',p:'Let\'s eat ___ sweet after dinner. (東西)',a:'something',zh:'晚餐後我們吃點甜的吧。',ex:'肯定句 → something；形容詞 sweet 放後面。'},
{type:'fx',p:'There isn\'t nobody in the room.',wr:'nobody',a:['anybody','anyone'],zh:'房間裡沒有人。',ex:'isn\'t 已經是否定，要用 anybody／anyone（或改成 There is nobody）。'}]},
{id:'g_every',subj:'Grammar',name:'everyone / nobody 用單數動詞',rule:'everyone、everybody、everything、someone、nobody、nothing 都當「單數」：現在式動詞要加 s／es，be 動詞用 is／has。Everyone has…、Nobody knows…、Everything is…',ex:['Everyone has a book.','Nobody knows the answer.','Everything is ready.'],q:[
{type:'mc',p:'Everybody ___ the new teacher.',o:['like','likes','liking'],a:1,zh:'大家都喜歡新老師。',ex:'Everybody 單數 → likes。'},
{type:'mc',p:'Nothing ___ impossible.',o:['is','are','be'],a:0,zh:'沒有不可能的事。',ex:'Nothing 單數 → is。'},
{type:'fx',p:'Someone are knocking on the door.',wr:'are',a:'is',zh:'有人在敲門。',ex:'Someone 單數 → is。'}]},
/* ---------- Reading ---------- */
{id:'rd_vocab',subj:'Reading',name:'Reading 單字',rule:'individual 個人、tight 緊的、fund 資金、model 模仿、destruction 破壞、compassionate 有同情心的、unpredictable 難以預料的、accountable 要負責的、constant 不變的、foundation 基金會／地基。',ex:['individual','tight','fund','model','destruction','compassionate','unpredictable','accountable','constant','foundation'],q:[

function rnd(n){return Math.floor(Math.random()*n);}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=rnd(i+1),t=a[i];a[i]=a[j];a[j]=t;}return a;}
function has(a,x){return a.indexOf(x)>=0;}
function pad(n){return n<10?'0'+n:''+n;}

function fmtTime(t){var d=new Date(t);return (d.getMonth()+1)+'/'+d.getDate()+' '+pad(d.getHours())+':'+pad(d.getMinutes());}
function fmtDur(sec){sec=Math.round(sec||0);var m=Math.floor(sec/60),s=sec%60;return m?(m+' 分 '+s+' 秒'):(s+' 秒');}

function each(a,f){for(var i=0;i<a.length;i++)f(a[i],i);}
function strip(s){return String(s).replace(/[\[\]{}]/g,'');}
function slug(s){return String(s).toLowerCase().replace(/[’']/g,'').replace(/[^a-z0-9]+/g,'_').replace(/^_|_$/g,'');}
function hash(s){var h=5381,i;s=String(s);for(i=0;i<s.length;i++){h=((h<<5)+h+s.charCodeAt(i))|0;}return (h>>>0).toString(36);}

/* ---------- 文字比對 ---------- */
var CONTR=[[/\bcan['’]t\b/g,'can not'],[/\bcannot\b/g,'can not'],[/\bwon['’]t\b/g,'will not'],[/\b(\w+)n['’]t\b/g,'$1 not'],[/\bi['’]m\b/g,'i am'],[/\bit['’]s\b/g,'it is'],[/\blet['’]s\b/g,'let us'],[/\bno-one\b/g,'no one']];
function norm(s){
  s=String(s||'').replace(/[‘’ʼ`]/g,"'").replace(/[“”]/g,'"').toLowerCase();
  for(var i=0;i<CONTR.length;i++)s=s.replace(CONTR[i][0],CONTR[i][1]);
  s=s.replace(/travelling/g,'traveling').replace(/travelled/g,'traveled');
  s=s.replace(/[.,!?;:"()]/g,' ').replace(/\s+/g,' ').replace(/^\s+|\s+$/g,'');
  return s;
}
function same(a,b){return norm(a)===norm(b);}
function anyOf(list,v){for(var i=0;i<list.length;i++)if(same(list[i],v))return true;return false;}

var audioEl=null;
function ttsSay(t){if(!HAS_TTS||!t)return;try{window.speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=0.85;window.speechSynthesis.speak(u);}catch(e){}}
function playFile(path,fallback){
  try{
    if(!audioEl){audioEl=document.createElement('audio');audioEl.preload='none';document.body.appendChild(audioEl);}
    audioEl.onerror=function(){ttsSay(fallback);};
    audioEl.src='a/'+path+'.mp3';audioEl.load();
    var p=audioEl.play();if(p&&p['catch'])p['catch'](function(){ttsSay(fallback);});
  }catch(e){ttsSay(fallback);}
}
function audKey(t){t=strip(t).replace(/^\s+|\s+$/g,'');if(/^[A-Za-z'’-]+$/.test(t))return 'w/'+slug(t);return 's/'+hash(norm(t));}
function say(t){var k=audKey(t);if(AUD[k])playFile(k,strip(t));else ttsSay(strip(t));}

(function(){
  each(PAPERS,function(p){PMAP[p.id]=p;p.qids=[];
    each(p.parts,function(pt){
      each(pt.q,function(q,i){
        var o={};for(var k in q)if(q.hasOwnProperty(k))o[k]=q[k];

        if(!o.type)o.type=pt.type;if(o.box==null&&!q.type)o.box=pt.box;if(o.pts==null)o.pts=pt.pts;if(o.fx==null&&!q.type)o.fx=pt.fx;
        prep(o);Q[o.id]=o;p.qids.push(o.id);
      });
    });

  });

      o.id='k_'+k.id+'_'+(i+1);o.kp=k.id;o.pid='kp';o.pts=o.pts||2;o.part={k:'',t:'重點題',zh:'重點：'+k.name};
      prep(o);Q[o.id]=o;KQ[k.id].push(o.id);});
  });
})();
function prep(o){
  if(o.type==='ox'){o.o=['O 一樣','X 不一樣'];o.fx=1;}
  if(o.type==='tx'){
    var nb=o.p?(o.p.split('___').length-1):0;o.nb=Math.max(1,nb);
    var a=o.a;if(typeof a==='string')a=[a];
    if(o.nb===1&&a.length&&typeof a[0]==='string')o.ans=[a];else o.ans=a;
    if(!o.full){
      if(o.p&&nb){var parts=o.p.split('___'),s=parts[0],i;for(i=1;i<parts.length;i++)s+='{'+o.ans[i-1][0]+'}'+parts[i];o.fullM=s;}
    }else o.fullM=o.full;
  }
  if(o.type==='fx'){o.tok=o.p.split(' ');var w=o.wr.split(' '),i,j;o.span=[];
    for(i=0;i<o.tok.length;i++){var okk=true;for(j=0;j<w.length;j++){if(!o.tok[i+j]||strip(o.tok[i+j]).replace(/[.,!?]$/,'')!==w[j]){okk=false;break;}}if(okk){for(j=0;j<w.length;j++)o.span.push(i+j);break;}}
    o.ans=typeof o.a==='string'?[o.a]:o.a;
    var t2=o.tok.slice(),first=o.span[0],last=o.span[o.span.length-1],tail=(t2[last].match(/[.,!?]+$/)||[''])[0];
    t2.splice(first,o.span.length,'{'+o.ans[0]+'}'+tail);o.fullM=t2.join(' ');
  }
  if(o.type==='mc'&&o.p&&o.p.indexOf('___')>=0&&!o.full){o.fullM=o.p.replace('___','{'+strip(o.o[o.a])+'}');}
  if(o.type==='sn'||o.type==='or'){o.fullM=typeof o.a==='string'?o.a:o.a[0];}
  if(o.full&&!o.fullM)o.fullM=o.full;
  if(o.fullM&&o.type==='tx')o.fullM=o.fullM.replace(/\s*\((?:[a-z]+ ?\/ ?)*[a-z]+\)/g,'').replace(/^[ab]: /,'');
}
function speakText(q){
  if(q.fullM)return strip(q.fullM);
  if(q.type==='mc'&&q.p&&!/^\{?[\w\[\]]+\}?$/.test(q.p)&&/[a-z] [a-z]/i.test(q.p))return strip(q.p);
  if(q.type==='tx'&&q.p&&q.p.indexOf('___')<0)return strip(q.p);
  return '';
}
function qTitle(q){if(q.pid==='kp')return '⭐ 重點題｜'+KMAP[q.kp].name;var p=PMAP[q.pid];return p.name+' · Part '+q.part.k+' 第 '+q.n+' 題';}

var SY={last:0,err:''},syncTimer=null,syncBusy=false;
function fbOn(){return !!(FB&&FB.projectId&&FB.apiKey);}
function fbUrl(path){return 'https://firestore.googleapis.com/v1/projects/'+FB.projectId+'/databases/(default)/documents/'+path+'?key='+encodeURIComponent(FB.apiKey);}
function req(method,url,body,cb){
  try{var x=new XMLHttpRequest();x.open(method,url,true);if(body)x.setRequestHeader('Content-Type','application/json');
    x.onreadystatechange=function(){if(x.readyState!==4)return;var j=null;try{j=JSON.parse(x.responseText);}catch(e){}cb(x.status,j);};
    x.send(body?JSON.stringify(body):null);}catch(e){cb(0,null);}
}
function shared(){return {v:1,created:S.created,wb:S.wb,boostDone:S.boostDone,mail:S.mail,cfgAt:S.cfgAt||0,att:ATT};}
function merge(r){
  if(!r||!r.wb)return false;
  var before=JSON.stringify(shared()),k;
  for(k in r.wb)if(r.wb.hasOwnProperty(k)){var a=S.wb[k],b=r.wb[k];if(!a||(b.u||0)>(a.u||0))S.wb[k]=b;}
  if(r.boostDone&&(!S.boostDone||r.boostDone<S.boostDone))S.boostDone=r.boostDone;
  if(r.created&&r.created<S.created)S.created=r.created;
  if((r.cfgAt||0)>(S.cfgAt||0)){S.cfgAt=r.cfgAt;if(r.mail)S.mail=r.mail;}
  var have={};each(ATT,function(a){have[a.id]=1;});
  each(r.att||[],function(a){if(a&&a.id&&!have[a.id]){ATT.push(a);have[a.id]=1;}});
  ATT.sort(function(x,y){return x.d-y.d;});
  return JSON.stringify(shared())!==before;
}
function schedSync(ms){if(!fbOn())return;if(syncTimer)clearTimeout(syncTimer);syncTimer=setTimeout(function(){syncTimer=null;syncNow();},ms||0);}
function syncNow(done){
  if(!fbOn()||syncBusy){if(done)done(false);return;}
  syncBusy=true;
  function fail(m){syncBusy=false;SY.err=m;saveSy();if(done)done(false);}
  req('GET',fbUrl('qf15/mt_state'),null,function(st,j){
    if(st!==200&&st!==404)return fail('讀取失敗 '+st);
    var changed=false;
    if(st===200&&j&&j.fields&&j.fields.json){try{changed=merge(JSON.parse(j.fields.json.stringValue));}catch(e){}}
    saveLocal();
    req('PATCH',fbUrl('qf15/mt_state'),{fields:{json:{stringValue:JSON.stringify(shared())},u:{integerValue:String(now())}}},function(st2){
      syncBusy=false;
      if(st2!==200)return fail('寫入失敗 '+st2);
      SY.last=now();SY.err='';saveSy();
      if(changed&&onHome)goHome();
      if(done)done(true);
    });
  });
}

var mailBusy=false;

  if(mailBusy||!S.mailQ.length||!S.mail)return;mailBusy=true;
  var body=S.mailQ[0],parts=[],k;for(k in body)if(body.hasOwnProperty(k))parts.push(encodeURIComponent(k)+'='+encodeURIComponent(body[k]));

    x.setRequestHeader('Content-Type','application/x-www-form-urlencoded');x.setRequestHeader('Accept','application/json');

      if(ok){S.mailQ.shift();save();if(S.mailQ.length)setTimeout(flushMail,1500);}else save();};

/* rich：[x]=底線 {x}=粗體；可點字 */
var FRAG={};each('ar er ir ur or ear eer air are ere ore oor igh eigh ough gh ph sh ch tch dge kn wr gn mb sc sk ng th wh ed es ing ly n\'t ies ied dg'.split(' '),function(x){FRAG[x]=1;});
function rich(text,click){
  text=String(text==null?'':text);
  var chars=[],u=0,b=0,i,c,ipa=0;
  for(i=0;i<text.length;i++){c=text.charAt(i);
    if(c==='/'&&!ipa&&/^\/[^\/\s]{1,16}\//.test(text.slice(i))){ipa=1;chars.push([c,u,b,1]);continue;}
    if(ipa){chars.push([c,u,b,1]);if(c==='/')ipa=0;continue;}
    if(c==='['){u=1;continue;}if(c===']'){u=0;continue;}if(c==='{'){b=1;continue;}if(c==='}'){b=0;continue;}
    chars.push([c,u,b]);}
  function isW(ch){return /[A-Za-z0-9'’é]/.test(ch);}
  function runs(arr){var o='',cu=-1,cb=-1,buf='';
    function fl(){if(!buf)return;var cls=(cu?'ul ':'')+(cb?'bd':'');o+=cls?'<span class="'+cls+'">'+buf+'</span>':buf;buf='';}
    for(var k=0;k<arr.length;k++){if(arr[k][1]!==cu||arr[k][2]!==cb){fl();cu=arr[k][1];cb=arr[k][2];}buf+=arr[k][0]==='_'?'_':esc(arr[k][0]);}
    fl();return o;}
  var out='',seg=[],inW=false;
  function flush(){if(!seg.length)return;
    if(inW){var w='';for(var k=0;k<seg.length;k++)w+=seg[k][0];w=w.replace(/^['’]+|['’]+$/g,'');
      out+=click&&/[A-Za-z]/.test(w)&&!FRAG[w.toLowerCase()]&&(w.length>1||/^[aI]$/.test(w))?'<span class="wd" data-k="'+esc(w)+'">'+runs(seg)+'</span>':runs(seg);}
    else out+=runs(seg);seg=[];}
  for(i=0;i<chars.length;i++){var w2=!chars[i][3]&&(isW(chars[i][0])||(chars[i][0]==='-'&&inW&&chars[i+1]&&/[A-Za-z]/.test(chars[i+1][0])));
    if(w2!==inW){flush();inW=w2;}seg.push(chars[i]);}
  flush();
  return out.replace(/_{3,}/g,'<span class="blank">　　　</span>');
}

  if(GLOSS[n])return {w:k,g:GLOSS[n]};
  var base=n.replace(/'s$/,'');if(GLOSS[base])return {w:k,g:GLOSS[base],b:base!==n?base:''};
  if(IRR[n]&&GLOSS[IRR[n]])return {w:k,g:GLOSS[IRR[n]],b:IRR[n]};
  var tr=[[/ies$/,'y'],[/ied$/,'y'],[/es$/,''],[/s$/,''],[/ed$/,''],[/ed$/,'e'],[/d$/,''],[/ing$/,''],[/ing$/,'e'],[/(.)\1ed$/,'$1'],[/(.)\1ing$/,'$1'],[/ly$/,''],[/er$/,''],[/est$/,'']],i;

/* 加強考試：所有未訂正錯題＋重點題 */
function genBoost(){
  var wr=unfixed(),cnt={},k,out=[],used={};
  each(wbList(),function(id){var kp=Q[id].kp;cnt[kp]=(cnt[kp]||0)+1;});
  each(KPS,function(kp){
    var mine=[];each(wr,function(id){if(Q[id].kp===kp.id){mine.push(id);used[id]=1;}});
    var n=cnt[kp.id]?Math.min(3,KQ[kp.id].length):Math.min(1,KQ[kp.id].length);
    var kq=shuffle(KQ[kp.id]).filter(function(id){return !used[id];}).slice(0,n);
    each(shuffle(mine.concat(kq)),function(id){out.push(id);});
  });
  each(wr,function(id){if(!used[id]&&!has(out,id))out.push(id);});
  return out;
}
/* 混合大考：上次錯題＋未訂正＋重點＋各卷 */
function genBig(){
  var lb=lastBig(),pick=[],seen={},i;
  function add(id){if(!seen[id]&&Q[id]&&pick.length<BIG_N){seen[id]=1;pick.push(id);}}
  var lastIds={};if(lb)each(lb.q,function(r){lastIds[r[0]]=1;});
  if(lb){var lw=[];each(lb.q,function(r){if(r[2]<r[3])lw.push(r[0]);});each(lw.slice(0,20),add);}
  var uf=unfixed().sort(function(a,b){return S.wb[b].wc-S.wb[a].wc;});each(uf.slice(0,10),add);
  var everW=wbList().filter(function(id){return !seen[id];});each(shuffle(everW).slice(0,6),add);
  /* 重點題：先挑錯最多的重點 */
  var kc={};each(wbList(),function(id){kc[Q[id].kp]=(kc[Q[id].kp]||0)+S.wb[id].wc;});
  var kps=shuffle(KPS.map(function(k){return k.id;})).sort(function(a,b){return (kc[b]||0)-(kc[a]||0);});
  var nk=0;for(i=0;i<kps.length&&nk<10;i++){var cand=shuffle(KQ[kps[i]]).filter(function(id){return !seen[id]&&!lastIds[id];});if(cand.length){add(cand[0]);nk++;}}
  /* 其餘：各卷平均，避開上一卷用過的 */
  var pools={};each(PORDER,function(p){pools[p]=shuffle(PMAP[p].qids.filter(function(id){return !seen[id];})).sort(function(a,b){return (lastIds[a]?1:0)-(lastIds[b]?1:0);});});
  var guard=0;while(pick.length<BIG_N&&guard<500){guard++;each(PORDER,function(p){if(pick.length<BIG_N&&pools[p].length)add(pools[p].shift());});}
  /* 依科目排序 */
  var order={};each(SUBJ,function(s,i2){order[s]=i2;});
  function sj(id){var q=Q[id];return q.pid==='kp'?KMAP[q.kp].subj:PMAP[q.pid].subj;}
  var bySub={};each(pick,function(id){var s=sj(id);(bySub[s]=bySub[s]||[]).push(id);});
  var out=[];each(SUBJ,function(s){if(bySub[s])out=out.concat(shuffle(bySub[s]));});
  return out;
}

function isAnswered(q,a){
  if(a==null)return false;
  if(q.type==='tx'){for(var i=0;i<a.length;i++)if(String(a[i]).replace(/\s/g,''))return true;return false;}
  if(q.type==='mc'||q.type==='ox')return typeof a==='number';
  if(q.type==='ms'||q.type==='sl'||q.type==='or')return a.length>0;
  if(q.type==='fx')return a.s.length>0||!!String(a.c).replace(/\s/g,'');
  if(q.type==='sn')return !!String(a).replace(/\s/g,'');
  return false;
}

/* ---------- 判分 ---------- */
function grade(q,a){ /* 回傳 0~1 */
  if(!isAnswered(q,a))return 0;
  if(q.type==='tx'){var ok=0,i;for(i=0;i<q.nb;i++){if(anyOf(q.ans[i],a[i]||''))ok+=(q.pts&&q.pts.length?q.pts[i]:1);}
    return ok/(q.pts&&q.pts.length?q.pts[0]+q.pts[1]:q.nb);}
  if(q.type==='mc'||q.type==='ox')return a===q.a?1:0;
  if(q.type==='ms'){var s=a.slice().sort().join(','),t=q.a.slice().sort().join(',');return s===t?1:0;}
  if(q.type==='sl'){return a.slice().sort().join(',')===q.s.slice().sort().join(',')?1:0;}
  if(q.type==='fx'){var sOK=a.s.length>0;each(a.s,function(x){if(!has(q.span,x))sOK=false;});
    var c=String(a.c||''),cOK=anyOf(q.ans,c)||(q.alt&&anyOf(q.alt,c));
    if(!cOK&&sOK){var wr=q.span.map(function(x){return strip(q.tok[x]);}).join(' ');var full=q.tok.join(' ').replace(wr,c);var want=strip(q.fullM);if(same(full,want))cOK=true;}
    return (sOK?0.5:0)+(cOK?0.5:0);}
  if(q.type==='sn'){var arr=typeof q.a==='string'?[q.a]:q.a;return anyOf(arr,a)?1:0;}
  if(q.type==='or'){var built=a.map(function(ci){return q.c[ci];}).join(' ');return same(built,q.a)?1:0;}
  return 0;
}
function ansText(q,a){
  if(!isAnswered(q,a))return '（沒寫）';
  if(q.type==='tx')return a.join(' / ');
  if(q.type==='mc'||q.type==='ox')return strip(q.o[a]);
  if(q.type==='ms')return a.map(function(i){return strip(q.o[i]);}).join('、');
  if(q.type==='sl')return '劃掉 '+a.slice().sort().map(function(i){return q.w.charAt(i);}).join('、');
  if(q.type==='fx')return '圈「'+a.s.slice().sort().map(function(i){return q.tok[i];}).join(' ')+'」改成「'+a.c+'」';
  if(q.type==='sn')return a;
  if(q.type==='or')return a.map(function(ci){return q.c[ci];}).join(' ');
  return '';
}
function correctText(q){
  if(q.type==='tx')return q.ans.map(function(x){return x.join(' 或 ');}).join(' / ');
  if(q.type==='mc'||q.type==='ox')return strip(q.o[q.a]);
  if(q.type==='ms')return q.a.map(function(i){return strip(q.o[i]);}).join('、');
  if(q.type==='sl')return '劃掉 '+q.s.map(function(i){return q.w.charAt(i);}).join('、');
  if(q.type==='fx')return '圈「'+q.wr+'」改成「'+q.ans.join(' 或 ')+'」';
  if(q.type==='sn')return (typeof q.a==='string'?[q.a]:q.a).join('  或  ');
  if(q.type==='or')return q.a;
  return '';
}
function plainQ(q){if(q.p)return strip(q.p);if(q.h)return q.h;if(q.w)return q.w;if(q.c)return q.c.join(' / ');return '';}

  if(fresh&&wrongIds.length){
    if(at.k==='paper'&&papersDone()===PORDER.length&&!S.boostDone)h+='<button class="btn pri big" id="toBoost">💪 全部試卷都考完了！去加強考試</button>';
    h+='<button class="btn '+(at.k==='paper'&&papersDone()===PORDER.length&&!S.boostDone?'':'pri ')+'big" id="fixNow">🎯 馬上練這次的 '+wrongIds.length+' 題錯題</button>';
  }else if(fresh&&at.k==='paper'){var nx=nextStep();if(nx)h+='<button class="btn pri big" id="nx">'+esc(nx.label)+'</button>';}
  if(fresh&&at.k==='big'&&at.sc<100)h+='<div class="fixinfo c">下一次大考會再考這次錯的題目（換順序、換選項位置）</div>';
  h+='<div class="tabs"><button class="tab on" data-f="all">全部解析（'+rows.length+'）</button><button class="tab" data-f="wrong">只看錯題（'+wrongIds.length+'）</button></div><div id="alist"></div>';
  h+='<button class="btn ghost" data-go="home">回首頁</button>';
  setView(h);
  function list(f){var o='';each(rows,function(r,i){var q=Q[r[0]];if(!q)return;var wrong=r[2]<r[3];if(f==='wrong'&&!wrong)return;
      o+='<div class="acard'+(wrong?' bad':'')+'"><div class="ah"><span class="am">'+(wrong?'❌':'✅')+'</span> 第 '+(i+1)+' 題 <span class="zhs">'+esc(qTitle(q))+'</span><span class="ap">'+fmtPts(r[2])+' / '+r[3]+'</span></div>'+
        (wrong||f==='wrong'?reviewCard(q,r[1],r[2],true):'<div class="more" data-i="'+i+'">看解析 ▾</div><div class="mbody hide" id="mb'+i+'"></div>')+'</div>';});
    $('alist').innerHTML=o||'<div class="done">沒有錯題 🎉</div>';
    each($('alist').querySelectorAll('.more'),function(el){el.addEventListener('click',function(){var i=+el.getAttribute('data-i'),b=$('mb'+i);b.innerHTML=reviewCard(Q[rows[i][0]],rows[i][1],rows[i][2],false);b.className='mbody';el.className='hide';},false);});
  }
  list('all');
  each(app.querySelectorAll('.tab'),function(el){el.addEventListener('click',function(){each(app.querySelectorAll('.tab'),function(t){t.className='tab';});el.className='tab on';list(el.getAttribute('data-f'));},false);});
  on('fixNow','click',function(){startFix(wrongIds.filter(function(id){return S.wb[id]&&!S.wb[id].fx;}),kindName(at)+' 錯題練習');});
  on('toBoost','click',startBoost);
  on('nx','click',function(){nextStep().go();});
}
function fmtPts(x){return Math.round(x*10)/10;}

/* 解析卡：題目＋正確答案＋你的答案＋說明（所有英文字可點、有發音） */
function reviewCard(q,a,earned,showYours){
  var h='<div class="rpz">'+esc(q.part.zh||'')+'</div>',full=q.fullM;
  if(q.box&&q.type==='tx')h+='<div class="bank sm">'+q.box.map(function(b){return '<span class="wd" data-k="'+esc(b)+'">'+esc(b)+'</span>';}).join('')+'</div>';
  if(q.type==='tx'){
    if(q.h)h+='<div class="qhint">'+esc(q.h)+'</div>';
    if(full)h+='<div class="exd">'+spk(full)+' '+rich(full,1)+(q.zh?'<div class="zhs">'+esc(q.zh)+'</div>':'')+'</div>';
    else{if(q.p)h+='<div class="exd">'+spk(q.p)+' '+rich(q.p,1)+(q.zh?'<div class="zhs">'+esc(q.zh)+'</div>':'')+'</div>';
      h+='<div class="exw">'+q.ans[0].map(function(x){return '<span class="wd" data-k="'+esc(x)+'">'+esc(x)+'</span> '+spk(x);}).join(' ')+'</div>';}
  }else if(q.type==='mc'||q.type==='ox'||q.type==='ms'){
    if(q.p){var pp=full?full:q.p;h+='<div class="exd">'+(/[a-z] [a-z]/i.test(strip(pp))?spk(pp)+' ':'')+rich(pp,1)+(q.zh?'<div class="zhs">'+esc(q.zh)+'</div>':'')+'</div>';}
    h+='<div class="olist">';
    each(q.o,function(o,i){var isC=q.type==='ms'?has(q.a,i):i===q.a,isU=q.type==='ms'?(a&&has(a,i)):a===i;
      var single=/^[\w\[\]'’ .()-]+$/.test(o)&&strip(o).split(' ').length<=2&&q.type!=='ox';
      h+='<div class="ol'+(isC?' oc':'')+(isU&&!isC?' ou':'')+'">'+(isC?'✔ ':(isU?'✘ ':'・'))+rich(o,q.type!=='ox')+(q.type!=='ox'&&/[a-z]/i.test(strip(o))?' '+spk(single?strip(o).replace(/ \(n\.\)/,''):o):'')+(isU&&!isC?' <span class="yl">← 你選的</span>':'')+'</div>';});
    h+='</div>';
  }else if(q.type==='sl'){
    h+='<div class="letters">';for(var j=0;j<q.w.length;j++){var inU=j>=q.u[0]&&j<q.u[1];h+='<span class="lt'+(inU?' u':'')+(has(q.s,j)?' x':'')+'">'+esc(q.w.charAt(j))+'</span>';}
    h+='</div><div class="exw"><span class="wd" data-k="'+q.w+'">'+q.w+'</span> '+spk(q.w)+'</div>';
  }else if(q.type==='fx'){
    h+='<div class="exd"><span class="lab">原句</span>';each(q.tok,function(t,i){h+=(has(q.span,i)?'<s class="bad">'+esc(t)+'</s>':rich(t,1))+' ';});
    h+='</div><div class="exd"><span class="lab">改正</span>'+spk(full)+' '+rich(full,1)+(q.zh?'<div class="zhs">'+esc(q.zh)+'</div>':'')+'</div>';
  }else if(q.type==='sn'||q.type==='or'){
    h+='<div class="exd"><span class="lab">題目</span>'+(q.p?rich(q.p,1):esc(q.c.join(' / ')))+'</div>';
    h+='<div class="exd"><span class="lab">答案</span>'+spk(full)+' '+rich(full,1)+(q.zh?'<div class="zhs">'+esc(q.zh)+'</div>':'')+'</div>';
    if(typeof q.a!=='string'&&q.a.length>1)h+='<div class="zhs">也可以寫：'+q.a.slice(1).map(esc).join('／')+'</div>';
  }
  var right=grade(q,a)===1;
  if(showYours&&!right){
    h+='<div class="yours"><span class="lab">你的答案</span><span class="ua">'+diffHTML(q,a)+'</span></div>';
    if(q.type!=='mc'&&q.type!=='ox'&&q.type!=='ms')h+='<div class="yours"><span class="lab">正確答案</span><span class="ca">'+esc(correctText(q))+'</span></div>';
  }
  h+='<div class="note">💡 '+rich(q.ex,1)+'</div>';
  if(q.kp&&KMAP[q.kp])h+='<div class="kpl">📌 重點：'+esc(KMAP[q.kp].name)+'</div>';
  return h;
}
function diffHTML(q,a){
  var t=ansText(q,a);
  if(q.type==='tx'&&isAnswered(q,a)&&q.nb===1){var want=q.ans[0][0],got=String(a[0]||'').replace(/^\s+|\s+$/g,'');
    if(got&&!/\s/.test(got)&&!/\s/.test(want)){var o='',i;for(i=0;i<got.length;i++){o+=(got.charAt(i).toLowerCase()===(want.charAt(i)||'').toLowerCase())?esc(got.charAt(i)):'<span class="bad">'+esc(got.charAt(i))+'</span>';}
      if(want.length>got.length)o+='<span class="miss">'+new Array(want.length-got.length+1).join('_')+'</span>';return o;}}
  return esc(t);
}
function kpCard(kp){var k=KMAP[kp];if(!k)return '';
  return '<div class="kpc"><div class="ct">📌 重點：'+esc(k.name)+'</div><div>'+rich(k.rule,1)+'</div>'+(k.ex.length?'<div class="kex">'+k.ex.map(function(x){return '<span class="pk">'+rich(x,1)+' '+spk(x)+'</span>';}).join('')+'</div>':'')+'</div>';}

/* ---------- 錯題本 ---------- */
function showBook(filter){
  var all=wbList(),f=filter||'';
  var h=bar('📒 錯題本')+'<div class="tabs"><button class="tab'+(f===''?' on':'')+'" data-f="">未訂正（'+unfixed().length+'）</button><button class="tab'+(f==='all'?' on':'')+'" data-f="all">全部（'+all.length+'）</button>';
  each(PORDER,function(p){var n=all.filter(function(id){return Q[id].pid===p;}).length;if(n)h+='<button class="tab'+(f===p?' on':'')+'" data-f="'+p+'">'+esc(PMAP[p].name)+'（'+n+'）</button>';});
  var nk=all.filter(function(id){return Q[id].pid==='kp';}).length;if(nk)h+='<button class="tab'+(f==='kp'?' on':'')+'" data-f="kp">重點題（'+nk+'）</button>';
  h+='</div>';
  var ids=all.filter(function(id){if(f==='')return !S.wb[id].fx;if(f==='all')return true;return Q[id].pid===f;});
  ids.sort(function(a,b){return S.wb[b].wc-S.wb[a].wc||S.wb[b].lw-S.wb[a].lw;});
  var uf=ids.filter(function(id){return !S.wb[id].fx;});
  if(uf.length)h+='<button class="btn pri big" id="prac">🎯 練習這裡的 '+uf.length+' 題未訂正錯題</button>';
  if(!ids.length)h+='<div class="done">這裡沒有錯題 🎉</div>';
  each(ids,function(id,i){var w=S.wb[id],q=Q[id];
    h+='<div class="acard'+(w.fx?'':' bad')+'"><div class="ah"><span class="am">'+(w.fx?'✅':'❌')+'</span> '+esc(qTitle(q))+'<span class="ap">錯 '+w.wc+' 次'+(w.fx?' · 已訂正':'')+'</span></div><div class="zhs">'+rich(plainQ(q).slice(0,90))+'</div><div class="more" data-i="'+i+'">看解析 ▾</div><div class="mbody hide" id="bk'+i+'"></div></div>';});
  setView(h);
  each(app.querySelectorAll('.tab'),function(el){el.addEventListener('click',function(){showBook(el.getAttribute('data-f'));},false);});
  each(app.querySelectorAll('.more'),function(el){el.addEventListener('click',function(){var i=+el.getAttribute('data-i'),b=$('bk'+i);b.innerHTML=reviewCard(Q[ids[i]],null,0,false)+kpCard(Q[ids[i]].kp);b.className='mbody';el.className='hide';},false);});
  on('prac','click',function(){startFix(uf,'錯題練習');});
}

/* ---------- 重點整理 ---------- */
function showKP(){
  var cnt={};each(wbList(),function(id){if(!S.wb[id].fx)cnt[Q[id].kp]=(cnt[Q[id].kp]||0)+1;});
  var h=bar('⭐ 重點整理')+'<div class="fixinfo">考試常考的規則，所有英文字都可以點來查意思、聽發音。紅色數字是這個重點還沒訂正的錯題。</div>';
  each(SUBJ,function(sj){h+='<div class="sec">'+SUBJ_ZH[sj]+'</div>';
    each(KPS,function(k){if(k.subj!==sj)return;h+='<div class="kpc"><div class="ct">'+esc(k.name)+(cnt[k.id]?' <span class="cnt">'+cnt[k.id]+'</span>':'')+'</div><div>'+rich(k.rule,1)+'</div>'+(k.ex.length?'<div class="kex">'+k.ex.map(function(x){return '<span class="pk">'+rich(x,1)+' '+spk(x)+'</span>';}).join('')+'</div>':'')+
      (cnt[k.id]?'<button class="btn sm" data-kpf="'+k.id+'">練這個重點的錯題</button>':'')+'</div>';});});
  setView(h);
  each(app.querySelectorAll('[data-kpf]'),function(el){el.addEventListener('click',function(){var kp=el.getAttribute('data-kpf');startFix(unfixed().filter(function(id){return Q[id].kp===kp;}).concat(KQ[kp]),'重點：'+KMAP[kp].name);},false);});
}

/* ---------- 紀錄 ---------- */
function showRecords(){
  var h=bar('📊 考試紀錄');
  var bl=attsOf('big');
  if(bl.length){h+='<div class="card"><div class="ct">混合大考分數走勢</div><div class="chart">';
    each(bl.slice(-12),function(a){h+='<div class="cb"><div class="cbar '+(a.sc===100?'g':a.sc>=80?'o':'r')+'" style="height:'+Math.max(4,a.sc)+'px"></div><div class="cv">'+a.sc+'</div></div>';});
    h+='</div></div>';}
  h+='<div class="card"><div class="ct">各試卷</div>';
  each(PORDER,function(p){var l=attsOf('paper',p);h+='<div class="prow"><span class="pl w">'+esc(PMAP[p].name)+'</span><span class="pr w">'+(l.length?l.map(function(a){return a.sc;}).join('→'):'未考')+'</span></div>';});
  h+='</div>';
  if(!ATT.length)h+='<div class="done">還沒有紀錄</div>';
  var list=ATT.slice().reverse();
  each(list,function(a,i){h+='<div class="rec" data-i="'+i+'"><b class="'+(a.sc===100?'g':'')+'">'+a.sc+(a.k==='boost'||a.k==='fix'?'%':'')+'</b><span>'+esc(kindName(a))+'<small>'+fmtTime(a.d)+' · '+a.n+' 題 · '+fmtDur(a.du)+'</small></span><i>›</i></div>';});
  setView(h);
  each(app.querySelectorAll('.rec'),function(el){el.addEventListener('click',function(){showResult(list[+el.getAttribute('data-i')],false);},false);});
}

/* ---------- 設定 ---------- */
function showSettings(){
  var h=bar('⚙️ 設定')+'<div class="card"><div class="ct">📧 成績寄到這個信箱</div><input type="text" id="mail" value="'+esc(S.mail)+'" autocapitalize="off" autocorrect="off"><button class="btn" id="mailSave">儲存</button><button class="btn" id="mailTest">寄一封測試信</button><div class="zhs">每考完一份試卷、加強考試、混合大考都會寄成績。'+(S.mailQ.length?'（還有 '+S.mailQ.length+' 封排隊中）':'')+(S.mailLast?'<br>上次結果：'+esc(S.mailLast):'')+'</div></div>';
  h+='<div class="card"><div class="ct">☁️ 雲端同步</div>'+(syncLine()||'<div class="zhs">未設定</div>')+'<button class="btn" id="syncBtn">立即同步</button></div>';
  h+='<div class="card"><div class="ct">🧹 重設</div><div class="zhs">會刪除這個網站所有考試紀錄和錯題本（包含雲端）。</div><button class="btn danger" id="reset">重設全部紀錄</button></div>';
  setView(h);
  on('mailSave','click',function(){S.mail=$('mail').value.replace(/\s/g,'');S.cfgAt=now();save();toast('已儲存');});
  on('mailTest','click',function(){S.mail=$('mail').value.replace(/\s/g,'');S.mailQ.push({_subject:'千賦 期中考複習：測試信','內容':'這是測試信，之後考完試會寄成績到這裡。',_template:'box',_captcha:'false'});save();flushMail();toast('已送出，請到信箱收信（第一次要按啟用）');});
  on('syncBtn','click',function(){toast('同步中…');syncNow(function(ok){toast(ok?'同步完成':'同步失敗，稍後再試');showSettings();});});
  on('reset','click',function(){var w=prompt('確定要刪除全部紀錄嗎？請輸入 RESET');if(w!=='RESET')return;var m=S.mail;S=blank();S.mail=m;S.att=[];ATT=S.att;S.u=now();CUR=null;saveCur();saveLocal();
    if(fbOn())req('PATCH',fbUrl('qf15/mt_state'),{fields:{json:{stringValue:JSON.stringify(shared())},u:{integerValue:String(now())}}},function(){});toast('已重設');goHome();});
}

/* ---------- 啟動 ---------- */
app=$('app');load();loadSy();goHome();
if(fbOn())setTimeout(function(){syncNow();},300);
setTimeout(flushMail,2000);
document.addEventListener('visibilitychange',function(){if(!document.hidden&&fbOn())schedSync(500);},false);
window.__T={cur:function(){return CUR;},startPaper:startPaper,startBig:startBig,startBoost:startBoost,goHome:goHome,showBook:showBook,showKP:showKP,showRecords:showRecords,showSettings:showSettings,renderPrac:renderPrac,ATT:function(){return ATT;},reviewCard:reviewCard,kpCard:kpCard,rich:rich,KPS:KPS,Q:Q,grade:grade,genBig:genBig,genBoost:genBoost,PMAP:PMAP,KQ:KQ,S:function(){return S;},lookup:lookup,speakText:speakText,audKey:audKey};
})();
</script>
