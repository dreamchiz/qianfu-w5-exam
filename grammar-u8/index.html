<script>
/* ===== 規則 ===== g: t=to+原形, b=原形, i=V-ing */
var RULES={
 T1:{g:'t',name:'這些動詞 + to 原形',key:'advise, agree, ask, decide, expect, forget, hope, manage, need, offer, promise, refuse, seem, want（還有 invite, arrange）',why:'是「to 家族」動詞，後面要 to + 原形'},
 T2:{g:'t',name:'be + 形容詞 + to 原形',key:'happy, nice, sorry, sad…',why:'是「be + 形容詞」，後面要 to + 原形'},
 T3:{g:'t',name:'疑問詞 + to 原形',key:'how / what / where / who + to',why:'是疑問詞（how/what/where/who），後面要 to + 原形'},
 T4:{g:'t',name:'too / enough + to 原形',key:'too + 形容詞 + to…／形容詞 + enough + to…',why:'有 too 或 enough，後面要 to + 原形'},
 T5:{g:'t',name:'表示「為了…」+ to 原形',key:'去超市「為了」買牛奶 → to buy',why:'這裡是「為了要…」（目的），用 to + 原形'},
 T6:{g:'t',name:'would like / love / prefer + to 原形',key:"would like, would love, would prefer（'d like, 'd love, 'd prefer）",why:'有 would！would like / love / prefer 後面要 to + 原形'},
 B1:{g:'b',name:'情態助動詞 + 原形',key:'can, could, may, might, must, should, will（還有 have to / has to）',why:'是情態助動詞，後面直接接原形，不加 to'},
 B2:{g:'b',name:'let / make + 人 + 原形',key:'let me use…, make him tidy…',why:'是 let / make + 人，後面直接接原形，不加 to'},
 I1:{g:'i',name:'like 家族 + V-ing',key:'like, love, dislike, hate, prefer',why:'是 like / love / dislike / hate / prefer，後面用 V-ing'},
 I2:{g:'i',name:'go + V-ing（去做活動）',key:'go swimming, go shopping, go scuba diving…',why:'是 go + 活動，用 V-ing'},
 I3:{g:'i',name:'開始/結束 + V-ing',key:'start, begin, finish, stop, continue',why:'是 start / begin / finish / stop / continue，後面用 V-ing'},
 I4:{g:'i',name:'介係詞 + V-ing',key:'at, of, about, in, for, without…（look forward to 的 to 也是）',why:'前面是介係詞，介係詞後面一定用 V-ing'},
 I5:{g:'i',name:'enjoy 家族 + V-ing',key:'avoid, enjoy, look forward to, mind, regret, spend, suggest（還有 deny）',why:'是「enjoy 家族」動詞，後面用 V-ing'}
};
var GN={t:'to + 原形',b:'原形',i:'V-ing'};

 [id, 規則, 句子(___是空格), 原形, 答案型(t/b/i), 關鍵字, 中文, 選項(可省)]
 id 是字母開頭的 = 講義原題 */

/* ================= 動詞形式 ================= */
function ing(v){if(ING_X[v])return ING_X[v];if(/ie$/.test(v))return v.slice(0,-2)+'ying';if(/[^e]e$/.test(v))return v.slice(0,-1)+'ing';return v+'ing';}
function form(it,g){return g==='t'?'to '+it.v:(g==='b'?it.v:ing(it.v));}
function ans(it){return form(it,it.g);}
function options(it){
  if(it.o)return it.o.slice();
  var o=[form(it,'t'),form(it,'b'),form(it,'i')];
  if(FLEX[it.id])o[0]='to '+ing(it.v);
  return o;
}
function wrongForms(it){var o=options(it),r=[],c=ans(it);for(var i=0;i<o.length;i++)if(o[i]!==c&&!(FLEX[it.id]&&o[i]==='to '+it.v))r.push(o[i]);return r;}
function norm(s){return String(s||'').toLowerCase().replace(/[’‘]/g,"'").replace(/[.,!?;:"]/g,' ').replace(/\s+/g,' ').replace(/^\s+|\s+$/g,'');}
function judge(it,u){var n=norm(u),c=norm(ans(it));if(n===c)return 1;if(ALT[it.v]&&it.g==='i'&&n===ALT[it.v])return 1;if(FLEX[it.id]&&n===norm('to '+it.v))return 2;return 0;}

function sentHTML(it,fill,cls){
  var s=it.s,p=s.indexOf('___'),pre=s.slice(0,p),post=s.slice(p+3),k=it.k,q=pre.lastIndexOf(k),h;
  if(q>=0&&k)h=esc(pre.slice(0,q))+'<span class="kw">'+esc(k)+'</span>'+esc(pre.slice(q+k.length));else h=esc(pre);
  return h+(fill===null?'<span class="blank">&nbsp;?&nbsp;</span>':'<span class="'+(cls||('ans '+it.g))+'">'+esc(fill)+'</span>')+esc(post);
}
function sentPlain(it,fill){var s=it.s;return s.replace('___',fill);}

    '<button class="btn pri" style="display:inline-block;width:'+(n>0?'48':'98')+'%;margin:6px 1%" id="next">'+(n===SLIDES.length-1?'✔ 完成，去原卷訂正':'下一張 →')+'</button></div>';
  setView(h);

/* ================= 出題 ================= */
var Q=null; /* {kind, list:[{id,type}], i, res:[], t0, max} */
function pickType(id,avoid,pool){var p=shuffle(pool||['pick','type','sort','tf']),l=S.it[id]&&S.it[id].lt;for(var i=0;i<p.length;i++)if(p[i]!==l&&p[i]!==avoid)return p[i];return p[0];}
function byRule(){var m={},i;for(i=0;i<ALLID.length;i++){var r=IT[ALLID[i]].r;(m[r]=m[r]||[]).push(ALLID[i]);}return m;}
function weakRules(n){var a=RULE_IDS.slice();a.sort(function(x,y){var ax=ruleAcc(x),ay=ruleAcc(y);if(ax<0)ax=60;if(ay<0)ay=60;return ax-ay;});return a.slice(0,n);}
function makeList(kind,arg){
  var L=[],i,used={},m=byRule(),ids;
  function add(id,t){if(used[id])return false;used[id]=1;L.push({id:id,type:t});return true;}
  if(kind==='book'){ids=[];for(var k in BOOK_WRONG)if(BOOK_WRONG.hasOwnProperty(k))ids.push(k);for(i=0;i<ids.length;i++)add(ids[i],'type');}
  else if(kind==='sort'){
    var gs={t:[],b:[],i:[]};for(i=0;i<ALLID.length;i++)gs[IT[ALLID[i]].g].push(ALLID[i]);
    var want={t:7,b:6,i:7},g;for(g in want){var sh=shuffle(gs[g]);for(i=0;i<want[g];i++)add(sh[i],'sort');}L=shuffle(L);}
  else if(kind==='big'){
    var types=shuffle(['pick','pick','pick','pick','pick','pick','pick','pick','type','type','type','type','type','type','type','type','type','sort','sort','sort','sort','tf','tf','tf','tf']);
    var cand=[];
    for(i=0;i<RULE_IDS.length;i++){var pool=shuffle(m[RULE_IDS[i]]);pool.sort(function(a,b){return itScore(a)-itScore(b);});cand.push(pool[0]);}
    var wr=weakRules(4),extra=[];
    for(i=0;i<wr.length;i++){var p2=shuffle(m[wr[i]]);extra.push(p2[0],p2[1]);}
    var bw=shuffle(Object.keys?Object.keys(BOOK_WRONG):[]);
    var rest=shuffle(ALLID);rest.sort(function(a,b){return itScore(a)-itScore(b);});
    var all=cand.concat(extra,bw.slice(0,4),rest);
    for(i=0;i<all.length&&L.length<25;i++)add(all[i],null);
    L=shuffle(L);
    /* 指派題型：盡量不同於上次 */
    for(i=0;i<L.length;i++){var lt=S.it[L[i].id]&&S.it[L[i].id].lt,j;for(j=0;j<types.length;j++)if(types[j]!==lt)break;if(j===types.length)j=0;L[i].type=types.splice(j,1)[0];}
  }
  else if(kind==='fix'){ids=shuffle(unfixedIds()).slice(0,8);for(i=0;i<ids.length;i++)add(ids[i],fixType(ids[i]));}
  else if(kind==='prac'||kind==='weak'){
    var rs=kind==='weak'?weakRules(3):[];
    if(kind==='prac')for(i=0;i<RULE_IDS.length;i++)if(arg==='all'||RULES[RULE_IDS[i]].g===arg)rs.push(RULE_IDS[i]);
    var pl=[];for(i=0;i<rs.length;i++)pl=pl.concat(m[rs[i]]);pl=shuffle(pl);
    for(i=0;i<pl.length&&L.length<12;i++)add(pl[i],pickType(pl[i]));
  }
  return L;
}
function itScore(id){var s=S.it[id];if(!s)return 0;return (s.c||0)*2-(s.w||0)*3+(BOOK_WRONG[id]?-2:0)+Math.random();}
function fixType(id){var w=S.wb[id];if(!w||!w.ok.length)return Math.random()<.5?'sort':'pick';var hasT=false;for(var i=0;i<w.ok.length;i++)if(w.ok[i]==='type')hasT=true;return hasT?(Math.random()<.5?'pick':'tf'):'type';}
function start(kind,arg){
  if(kind==='fix'&&!unfixed()){toast('目前沒有錯題要訂正！');return;}
  if(kind==='big'&&unfixed()){toast('還有 '+unfixed()+' 題錯題要先訂正喔！');start('fix');return;}
  var L=makeList(kind,arg);if(!L.length){toast('沒有題目');return;}
  Q={kind:kind,arg:arg,list:L,i:0,res:[],t0:+new Date(),cnt:{}};
  if(kind==='book')bookIntro();else ask();
}
function bookIntro(){

   '<div class="tip">💡 先看空格「前面是誰」！<br>藍 to + 原形　綠 原形　紫 V-ing</div></div><button class="btn pri big" id="st">開始</button>';
  setView(h);on('bk','click',home);on('st','click',ask);

      '<button class="opt half" data-t="1" style="color:#22a05b">✔ 對</button><button class="opt half" data-t="0" style="color:#e5484d">✘ 錯</button>';
  }
  h+='</div>';
  setView(h);
  on('bk','click',function(){if(Q.i===0||confirm('要離開這次測驗嗎？（這次不記分）'))home();});
  if(q.type==='pick')each('.opt',function(b){b.addEventListener('click',function(){var v=b.getAttribute('data-v');done(v===ans(it)?1:0,v);},false);});
  if(q.type==='sort')each('.opt',function(b){b.addEventListener('click',function(){var g=b.getAttribute('data-g');done(g===it.g?1:0,GN[g]);},false);});
  if(q.type==='tf')each('.opt',function(b){b.addEventListener('click',function(){var t=b.getAttribute('data-t')==='1';done(t===q.right?1:0,t?'對':'錯');},false);});
  if(q.type==='type'){
    var inp=$('inp');
    var sub=function(){var v=inp.value;if(!norm(v)){toast('先寫答案喔');return;}inp.blur();done(judge(it,v),v);};
    on('ok','click',sub);inp.addEventListener('keydown',function(e){if(e.keyCode===13){e.preventDefault();sub();}},false);
    setTimeout(function(){try{inp.focus();}catch(e){}},50);
  }

function record(it,type,ok){
  var s=S.it[it.id]||(S.it[it.id]={c:0,w:0});s.lt=type;if(ok)s.c++;else s.w++;
  var l=S.rl[it.r]||(S.rl[it.r]=[]);l.push(ok?1:0);if(l.length>12)l.shift();
  var w=S.wb[it.id];
  if(!ok){if(!w)w=S.wb[it.id]={n:0,ok:[],fixed:false,t:+new Date()};w.n++;w.ok=[];w.fixed=false;}
  else if(w&&!w.fixed){w.ok.push(type);var hasT=false,i;for(i=0;i<w.ok.length;i++)if(w.ok[i]==='type')hasT=true;if(w.ok.length>=2&&hasT)w.fixed=true;}
}
function done(r,u){
  var q=Q.list[Q.i],it=IT[q.id],ok=r>0;
  record(it,q.type,ok);
  Q.res.push({id:it.id,type:q.type,ok:ok,u:u});
  if(Q.kind==='fix'){var w=S.wb[it.id];
    if(w&&!w.fixed&&Q.cnt[it.id]<4)Q.list.push({id:it.id,type:fixType(it.id)});}
  save();
  if(ok&&r===1){
    var qc=$('qc'),f=document.createElement('div');f.className='okflash a-pop';f.innerHTML='✔ 答對了！';qc.appendChild(f);
    if(Q.kind==='book'||q.type==='type')say(it.id);
    later(next,Q.kind==='book'?1300:750);
  }else explain(q,it,ok,u);
}

function next(){Q.i++;if(Q.i<Q.list.length)ask();else finish();}
function finish(){
  var n=Q.res.length,c=0,i,first={},firstN=0,firstC=0;
  for(i=0;i<n;i++){if(Q.res[i].ok)c++;if(!first[Q.res[i].id]){first[Q.res[i].id]=1;firstN++;if(Q.res[i].ok)firstC++;}}
  var score=Q.kind==='fix'?Math.round(firstC*100/firstN):Math.round(c*100/n);
  if(Q.kind==='big')score=c*4;
  var at={k:Q.kind,t:+new Date(),sc:score,n:n,c:c,sec:Math.round((+new Date()-Q.t0)/1000),wr:[]};
  for(i=0;i<n;i++)if(!Q.res[i].ok&&at.wr.indexOf(Q.res[i].id)<0)at.wr.push(Q.res[i].id);
  S.att.push(at);if(S.att.length>300)S.att.shift();
  var d=dayRec();d[Q.kind]=(d[Q.kind]||0)+1;
  if(Q.kind==='book')S.bookDone=true;
  var newBest=false;
  if(Q.kind==='big'){if(score>S.best){S.best=score;newBest=true;}if(score===100)S.passed=true;queueMail(at);}
  save();
  var h=bar(KIND_NAME[Q.kind]+' 成績',true)+'<div class="card" style="text-align:center"><div class="score">'+score+'<small> 分</small></div>'+
    '<div class="qzh">答對 '+c+' / '+n+' 題 · 用時 '+Math.floor(at.sec/60)+' 分 '+(at.sec%60)+' 秒</div>';
  if(Q.kind==='big'&&score===100)h+='<div class="trophy a-pop">🏆 100 分！U8 文法過關！</div>';
  else if(newBest)h+='<div class="trophy">⭐ 新的最高分！</div>';
  h+='</div>';
  /* 依三色分類 */
  var gc={t:[0,0],b:[0,0],i:[0,0]};for(i=0;i<n;i++){var gg=IT[Q.res[i].id].g;gc[gg][1]++;if(Q.res[i].ok)gc[gg][0]++;}
  h+='<div class="card"><div class="ct">三種答對率</div>';
  var gs=['t','b','i'];for(i=0;i<3;i++){var x=gc[gs[i]];if(!x[1])continue;var p=Math.round(x[0]*100/x[1]);h+='<div class="rr"><span class="rn ct-'+gs[i]+'"><b>'+GN[gs[i]]+'</b></span><span class="rb"><div class="bg-'+gs[i]+'" style="width:'+p+'%"></div></span><span class="rp">'+x[0]+'/'+x[1]+'</span></div>';}
  h+='</div>';
  if(at.wr.length){h+='<div class="card"><div class="ct">錯的題目（已放進錯題本）</div>';for(i=0;i<at.wr.length;i++){var it=IT[at.wr[i]];h+='<div class="wbi">'+sentHTML(it,ans(it))+'<div class="m">'+esc(RULES[it.r].name)+'</div></div>';}h+='</div>';}
  var uf=unfixed();
  if(uf)h+='<button class="btn pri big" id="tofix">❌ 去錯題訂正（'+uf+' 題）</button>';
  else{var r=route(),nx=null;for(i=0;i<r.length;i++)if(!r[i].ok){nx=r[i];break;}
    if(nx)h+='<button class="btn pri big" id="tonx">下一關：'+nx.n.replace(/^\S+\s/,'')+'</button>';}
  h+='<button class="btn" id="tohome">回首頁</button>';
  setView(h);on('bk','click',home);on('tohome','click',home);on('tofix','click',function(){start('fix');});
  on('tonx','click',function(){var r=route();for(var j=0;j<r.length;j++)if(!r[j].ok){goStep(r[j].k);return;}home();});
}

/* ================= 專項練習 ================= */
function pracMenu(){
  var h=bar('專項練習',true)+
   '<button class="opt g c-t" id="p_t">🔵 to + 原形（12 題）</button>'+
   '<button class="opt g c-b" id="p_b">🟢 原形（12 題）</button>'+
   '<button class="opt g c-i" id="p_i">🟣 V-ing（12 題）</button>'+
   '<button class="opt g" id="p_all">🌈 三種混合（12 題）</button>'+
   '<button class="opt g c-k" id="p_weak">💪 我最弱的 3 種規則（12 題）</button>';
  setView(h);on('bk','click',home);
  on('p_t','click',function(){start('prac','t');});on('p_b','click',function(){start('prac','b');});on('p_i','click',function(){start('prac','i');});
  on('p_all','click',function(){start('prac','all');});on('p_weak','click',function(){start('weak');});
}

/* ================= 錯題本 ================= */
function wrongBook(){
  var h=bar('錯題本',true),k,l=[],i,uf=unfixed();
  for(k in S.wb)if(S.wb.hasOwnProperty(k))l.push(k);
  l.sort(function(a,b){return (S.wb[a].fixed?1:0)-(S.wb[b].fixed?1:0)||S.wb[b].n-S.wb[a].n;});
  if(uf)h+='<button class="btn pri big" id="fx">❌ 開始錯題訂正（'+uf+' 題）</button><div class="qzh" style="text-align:center">每題要答對 2 次，其中 1 次是「寫寫看」，才算訂正完成。</div>';
  if(!l.length)h+='<div class="card">目前沒有錯題 👍</div>';
  else{h+='<div class="card">';for(i=0;i<l.length;i++){var it=IT[l[i]],w=S.wb[l[i]];
    h+='<div class="wbi" data-id="'+it.id+'">'+(w.fixed?'✅ ':'⬜ ')+sentHTML(it,ans(it))+'<div class="m"><span class="tag c-'+it.g+'">'+GN[it.g]+'</span>錯 '+w.n+' 次 · '+esc(RULES[it.r].name)+(w.fixed?' · 已訂正':' · 進度 '+w.ok.length+'/2')+'</div></div>';}
    h+='</div>';}
  setView(h);on('bk','click',home);on('fx','click',function(){start('fix');});
  each('.wbi',function(e){e.addEventListener('click',function(){say(e.getAttribute('data-id'));},false);});
}

/* ================= 成績紀錄 ================= */
function records(){
  var h=bar('成績紀錄',true),i,big=[];
  for(i=0;i<S.att.length;i++)if(S.att[i].k==='big')big.push(S.att[i]);
  if(big.length){var last=big.slice(-15);h+='<div class="card"><div class="ct">大考分數走勢</div><div class="trend">';
    for(i=0;i<last.length;i++)h+='<div class="tcol"><div>'+last[i].sc+'</div><div class="tb'+(last[i].sc===100?' g':'')+'" style="height:'+Math.max(4,last[i].sc)+'px"></div></div>';
    h+='</div></div>';}
  h+='<div class="card"><div class="ct">各規則答對率（最近 12 題）</div>';
  for(i=0;i<RULE_IDS.length;i++){var r=RULE_IDS[i],p=ruleAcc(r),g=RULES[r].g;
    h+='<div class="rr"><span class="rn">'+esc(RULES[r].name)+'</span><span class="rb"><div class="bg-'+g+'" style="width:'+(p<0?0:p)+'%"></div></span><span class="rp">'+(p<0?'—':p+'%')+'</span></div>';}
  h+='<button class="btn" id="wk">💪 練最弱的 3 種</button></div>';
  h+='<div class="card"><div class="ct">所有紀錄</div>';
  if(!S.att.length)h+='<div class="qzh">還沒有紀錄</div>';
  for(i=S.att.length-1;i>=0&&i>=S.att.length-40;i--){var a=S.att[i];h+='<div class="att">'+fmtT(a.t)+'　'+KIND_NAME[a.k]+'<b>'+a.sc+' 分</b><div class="qzh" style="margin:0">'+a.c+'/'+a.n+' 題'+(a.wr.length?' · 錯：'+a.wr.length+' 題':'')+'</div></div>';}
  h+='</div><button class="btn ghost" id="rst">重設全部紀錄（家長）</button>';
  setView(h);on('bk','click',home);on('wk','click',function(){start('weak');});
  on('rst','click',function(){var p=prompt('家長密碼（同單字網站，預設 1234）');var pw='1234';try{var o=JSON.parse(localStorage.getItem(KEY_W15)||'null');if(o&&o.pin)pw=String(o.pin);}catch(e){}
    if(p===pw&&confirm('確定清除 U8 文法的全部紀錄？')){S=blank();save();home();}else if(p!==null&&p!==pw)toast('密碼不對');});
}

/* ================= 成績寄信（沿用單字網站設定的信箱） ================= */
function mailAddr(){try{var o=JSON.parse(localStorage.getItem(KEY_W15)||'null');if(o&&o.mail)return o.mail;}catch(e){}return 'dreamchiz@gmail.com';}
function queueMail(at){
  var lines=[],i;for(i=0;i<at.wr.length;i++){var it=IT[at.wr[i]];lines.push('✘ '+sentPlain(it,ans(it))+'（'+RULES[it.r].name+'）');}
  S.mailQ.push({_subject:'千賦 U8 文法大考 '+at.sc+' 分',時間:fmtT(at.t),分數:at.sc+' 分（'+at.c+'/'+at.n+'）',用時:Math.round(at.sec/60)+' 分鐘',錯題:lines.join('\n')||'全對 🎉',_template:'box',_captcha:'false'});
  if(S.mailQ.length>20)S.mailQ.shift();save();
}
var mailBusy=false;
function flushMail(){
  if(mailBusy||!S.mailQ.length)return;mailBusy=true;
  var b=S.mailQ[0],p=[],k;for(k in b)if(b.hasOwnProperty(k))p.push(encodeURIComponent(k)+'='+encodeURIComponent(b[k]));
  try{var x=new XMLHttpRequest();x.open('POST','https://formsubmit.co/ajax/'+encodeURIComponent(mailAddr()),true);
    x.setRequestHeader('Content-Type','application/x-www-form-urlencoded');x.setRequestHeader('Accept','application/json');
    x.onreadystatechange=function(){if(x.readyState!==4)return;mailBusy=false;var ok=false;try{var r=JSON.parse(x.responseText);ok=(r.success===true||r.success==='true');}catch(e){}
      if(ok){S.mailQ.shift();save();if(S.mailQ.length)setTimeout(flushMail,1500);}};
    x.send(p.join('&'));}catch(e){mailBusy=false;}
}

load();home();
