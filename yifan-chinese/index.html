<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="意帆國文">
<meta name="theme-color" content="#F6F8FB">
<title>意帆國文衝刺｜論語選</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>:root{padding-top:env(safe-area-inset-top,0px)}img{max-width:100%}[hidden]{display:none!important}

/* 版面概念：國中生的筆記本——紙張底色、紅筆標重點、藍筆寫答案；手機底部分頁，平板電腦左側分頁 */
:root{
  --paper:#F6F8FB;--sheet:#FFFFFF;--line:#E1E7F0;--rule:#C9D3E3;--ink:#1B2333;--ink2:#556074;
  --red:#C8322E;--blue:#2350C8;--green:#1F8A4C;--ok:#17845A;--okbg:#E5F4EC;--bad:#C8322E;--badbg:#FBE9E8;--warn:#A86A00;--warnbg:#FFF4DC;
  --hand:'LXGW WenKai TC','Kaiti TC','STKaiti','BiauKai',serif;--sans:'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif;--mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;--r:10px}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--paper:#11151D;--sheet:#181E29;--line:#252D3B;--rule:#303A4C;--ink:#E7EBF3;--ink2:#9AA5B8;--red:#FF6E68;--blue:#86A6FF;--green:#55C98A;--ok:#4CC48C;--okbg:#173327;--bad:#FF6E68;--badbg:#3A1E1F;--warn:#F2B544;--warnbg:#382B12;color-scheme:dark}}
:root[data-theme=dark]{--paper:#11151D;--sheet:#181E29;--line:#252D3B;--rule:#303A4C;--ink:#E7EBF3;--ink2:#9AA5B8;--red:#FF6E68;--blue:#86A6FF;--green:#55C98A;--ok:#4CC48C;--okbg:#173327;--bad:#FF6E68;--badbg:#3A1E1F;--warn:#F2B544;--warnbg:#382B12;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.65;padding-bottom:calc(72px + env(safe-area-inset-bottom,0px));-webkit-text-size-adjust:100%}
.wrap{max-width:820px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 28px}
h1,h2,h3{font-family:var(--hand);text-wrap:balance;margin:0;line-height:1.3}
h2{font-size:1.45rem}h3{font-size:1.15rem}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.r{color:var(--red)}.b{color:var(--blue)}
u{text-decoration-color:var(--red);text-decoration-thickness:2px;text-underline-offset:3px}
p{margin:0}
/* 標題列 */
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:8px 12px;padding-block:6px 12px;border-bottom:2px solid var(--ink)}
.top h1{font-size:1.55rem;min-width:0}
.top h1 small{display:block;font-family:var(--sans);font-size:.78rem;color:var(--ink2);font-weight:500;letter-spacing:.06em}
.count{font-family:var(--mono);text-align:right;line-height:1.1}.count b{font-size:1.9rem;color:var(--red)}.count span{display:block;font-family:var(--sans);font-size:.74rem;color:var(--ink2)}
.units{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
/* 分頁 */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--sheet);border-top:1px solid var(--rule);display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom,0);padding-left:env(safe-area-inset-left,0);padding-right:env(safe-area-inset-right,0)}
nav.tabs button{border:0;background:0 0;padding:8px 2px 9px;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:.78rem;color:var(--ink2);cursor:pointer;position:relative}
nav.tabs svg{width:23px;height:23px}
nav.tabs button[aria-current=true]{color:var(--red);font-weight:700}
.dot{min-width:18px;height:18px;border-radius:9px;background:var(--red);color:#fff;font-size:.68rem;line-height:18px;padding:0 5px;position:absolute;top:3px;left:calc(50% + 6px);font-family:var(--mono)}
.subtabs{display:flex;gap:4px;border-bottom:1px solid var(--rule);margin-top:14px;overflow-x:auto}
.subtabs button{border:0;background:0 0;padding:8px 14px;font-weight:700;color:var(--ink2);cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
.subtabs button[aria-current=true]{color:var(--ink);border-bottom-color:var(--red)}
/* 共用元件 */
.section{margin-top:16px;display:flex;flex-direction:column;gap:14px}
.sheet{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.label{font-size:.74rem;letter-spacing:.12em;color:var(--ink2);font-weight:700}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1.5px solid var(--rule);background:var(--sheet);border-radius:999px;padding:4px 13px;cursor:pointer;font-size:.9rem;line-height:1.5}
.chip[aria-pressed=true]{border-color:var(--ink);background:var(--ink);color:var(--sheet)}
.chip.flag{border-color:var(--red);color:var(--red)}
.btn{border:2px solid var(--ink);background:var(--ink);color:var(--sheet);border-radius:8px;padding:9px 16px;font-weight:700;cursor:pointer;font-size:.98rem}
.btn.ghost{background:0 0;color:var(--ink)}.btn.red{background:var(--red);border-color:var(--red);color:#fff}.btn.sm{padding:5px 11px;font-size:.88rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.muted{color:var(--ink2);font-size:.9rem}
.pill{display:inline-block;font-size:.72rem;font-weight:700;border-radius:4px;padding:1px 7px;letter-spacing:.03em;vertical-align:middle;white-space:nowrap}
.pill.bad{background:var(--badbg);color:var(--bad)}.pill.ok{background:var(--okbg);color:var(--ok)}.pill.warn{background:var(--warnbg);color:var(--warn)}.pill.info{background:color-mix(in srgb,var(--blue) 14%,transparent);color:var(--blue)}.pill.gray{background:var(--line);color:var(--ink2)}
.stars{color:var(--warn);letter-spacing:1px;font-size:.84rem}
.cols{display:grid;gap:14px}.cols>*{min-width:0}
.meter{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.meter div{background:var(--sheet);border:1px solid var(--line);border-radius:8px;padding:10px;text-align:center}
.meter b{display:block;font-family:var(--mono);font-size:1.5rem;font-variant-numeric:tabular-nums}.meter span{font-size:.78rem;color:var(--ink2)}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;background:var(--ok);transition:width .3s}
.bar.red i{background:var(--red)}
.banner{border:2px dashed var(--blue);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.banner ul{margin:0;padding-left:1.2em}
.tasks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.tasks li{display:grid;grid-template-columns:1.6em 1fr auto;gap:8px;align-items:center;padding:8px 10px;border-radius:8px;background:var(--paper)}
.tasks li b.n{font-family:var(--mono);color:var(--red)}
/* 架構 */
.root{border:2px solid var(--ink);border-radius:var(--r);padding:12px 14px;font-family:var(--hand);font-size:1.15rem;background:var(--sheet)}
.tree{display:grid;gap:10px}
.node{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;text-align:left;background:var(--sheet);border:1.5px solid var(--rule);border-radius:8px;padding:10px 12px;cursor:pointer;width:100%}
.node.main{border-color:var(--red);border-width:2px}
.node.sum{border-color:var(--blue);border-style:dashed;border-width:2px}
.node .k{font-family:var(--hand);font-weight:700;font-size:1.05rem}
.node .s{display:block;font-size:.84rem;color:var(--ink2)}
.node .tag{font-size:.75rem;font-weight:700;border-radius:4px;padding:1px 6px}
.node.main .tag{background:var(--badbg);color:var(--red)}.node .tag{background:var(--line);color:var(--ink2)}.node.sum .tag{background:color-mix(in srgb,var(--blue) 14%,transparent);color:var(--blue)}
.seen{color:var(--ok);font-size:.8rem;white-space:nowrap}
.branch{padding-left:18px;border-left:2px solid var(--rule);display:grid;gap:8px;margin-left:14px}
/* 學習卡 */
.learn h2{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.learn .body{display:flex;flex-direction:column;gap:12px;margin-top:10px}
.kt{border-collapse:collapse;width:100%;font-size:.95rem}
.kt th,.kt td{border:1px solid var(--rule);padding:6px 9px;text-align:left;vertical-align:top}
.kt th{background:var(--paper);white-space:nowrap}
.kt tr.hl td{background:color-mix(in srgb,var(--red) 6%,transparent)}
.tblwrap{overflow-x:auto}.kt.big{min-width:560px}
.pts{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:4px}
.why{background:var(--paper);border-left:4px solid var(--blue);padding:10px 12px;border-radius:0 8px 8px 0}
.note{font-size:.93rem;color:var(--ink2)}
.mnemo{border:2px dashed var(--blue);border-radius:var(--r);padding:10px 14px;font-family:var(--hand);font-size:1.08rem}
.mnemo b{color:var(--blue)}
.flow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-family:var(--hand);font-size:1.15rem}
.flow span{border:1.5px solid var(--rule);border-radius:8px;padding:4px 12px;background:var(--sheet)}
.flow span.hot{border-color:var(--red);color:var(--red);font-weight:700}
.flow i{font-style:normal;color:var(--ink2)}
.stations{display:grid;gap:6px}
.stations div{display:grid;grid-template-columns:4.2em 1fr;gap:10px;padding:7px 10px;background:var(--paper);border-radius:6px}
.stations b{font-family:var(--hand);font-size:1.05rem}
/* 動畫區 */
.lab{border:1px solid var(--line);border-radius:var(--r);padding:12px;background:var(--sheet);display:flex;flex-direction:column;gap:10px}
.lab h3{font-size:1.08rem;display:flex;gap:8px;align-items:center}
.lab h3::before{content:'';width:9px;height:9px;border-radius:50%;background:var(--red);flex:none}
.stage{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:10px;overflow-x:auto}
.stage svg{display:block;width:100%;height:auto;max-width:560px;margin:0 auto}
.readout{padding:9px 12px;border-left:4px solid var(--blue);background:var(--paper);font-size:.96rem;min-height:2.4em;border-radius:0 6px 6px 0}
.readout.bad{border-color:var(--red)}.readout.ok{border-color:var(--ok)}
.matchgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.matchgrid button{border:1.5px solid var(--rule);background:var(--sheet);border-radius:8px;padding:8px;cursor:pointer;text-align:center;font-size:.95rem}
.matchgrid button.sel{border-color:var(--blue);background:color-mix(in srgb,var(--blue) 12%,var(--sheet))}
.matchgrid button.done{border-color:var(--ok);background:var(--okbg);color:var(--ok);cursor:default}
.matchgrid button.no{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.jbars{display:grid;gap:6px}
.jbars>div{display:grid;grid-template-columns:3.6em 1fr 3em;gap:8px;align-items:center;font-size:.9rem}
.jbars .bar{height:12px}.jbars .bar i{transition:width .7s ease}
.jbars em{font-style:normal;font-family:var(--mono);text-align:right;font-variant-numeric:tabular-nums}
.stepper{display:flex;gap:6px;flex-wrap:wrap}
.stepper button{border:1.5px solid var(--rule);background:var(--sheet);border-radius:999px;padding:3px 11px;cursor:pointer;font-size:.86rem}
.stepper button[aria-current=true]{border-color:var(--red);background:var(--red);color:#fff}
.tubes{display:flex;gap:16px;justify-content:center;align-items:flex-end;flex-wrap:wrap;padding:6px}
.tube{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:.84rem;text-align:center;max-width:7.5em}
.tube .glass{width:44px;height:120px;border:2.5px solid var(--ink2);border-top:0;border-radius:0 0 22px 22px;position:relative;overflow:hidden}
.tube .liq{position:absolute;left:0;right:0;bottom:0;height:62%;transition:background-color 1.4s ease}
.tube .drop{position:absolute;left:50%;top:-14px;width:9px;height:12px;margin-left:-4.5px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;opacity:0}
.tube .drop.go{animation:drop .7s ease-in forwards}
@keyframes drop{0%{transform:translateY(0);opacity:1}85%{opacity:1}100%{transform:translateY(60px);opacity:0}}
.bath{position:relative;border-radius:10px;padding:8px 10px 14px;transition:background-color .6s}
.bath.on{background:color-mix(in srgb,var(--red) 10%,transparent)}
.bath.on::after{content:'♨ 隔水加熱中';position:absolute;right:8px;bottom:2px;font-size:.75rem;color:var(--red)}
.slider{display:grid;grid-template-columns:5.5em 1fr 4.5em;gap:10px;align-items:center}
.slider input{width:100%;accent-color:var(--red)}
.slider output{font-family:var(--mono);text-align:right}
/* 逐步圖解 */
.walk .stage svg{max-width:420px}
.wsvg .pt{transition:opacity .35s;cursor:pointer}
.wsvg.dim .pt{opacity:.25}
.wsvg .pt.hl{opacity:1!important;filter:drop-shadow(0 0 3px var(--red)) drop-shadow(0 0 7px var(--red))}
.wsvg .lb,.wsvg .ar,.wsvg .rev{opacity:0;transition:opacity .4s}
.wsvg .ar,.wsvg #wBolus,.wsvg .rev,.wsvg .lb line{pointer-events:none}.wsvg .lb{cursor:pointer}
.wsvg .lb.show,.wsvg .ar.show,.wsvg .rev.show{opacity:1}
.wsvg .lb.cur text{fill:var(--red)!important;font-weight:700}
.mn{display:flex;flex-wrap:wrap;gap:6px;font-family:var(--hand);font-size:1.15rem}
.mn span{border:1.5px dashed var(--rule);border-radius:6px;padding:1px 9px;color:var(--ink2);transition:all .3s}
.mn span.on{border-color:var(--blue);border-style:solid;color:var(--blue);font-weight:700}
.wcard{margin:0;padding-left:1.4em;display:flex;flex-direction:column;gap:3px;font-size:.95rem}
.wcard:empty{display:none}
.wcard li.warn b{color:var(--red)}
/* 題目 */
.qcard{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px}
.qmeta{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:.8rem;color:var(--ink2)}
.qtext{font-size:1.06rem;font-weight:500}
.fig{overflow-x:auto;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:8px}
.fig .qimg{display:block;max-width:100%;height:auto;margin:4px auto;background:#fff}
.fig .qimg.wide{max-width:none;width:640px}
.opt .oimg{display:block;max-width:120px;width:100%;height:auto;background:#fff;border-radius:4px}
.fig svg{display:block;width:100%;max-width:440px;height:auto;margin:0 auto}
.fig table{border-collapse:collapse;margin:0 auto;font-size:.88rem;font-variant-numeric:tabular-nums}
.fig td,.fig th{border:1px solid var(--rule);padding:4px 9px;text-align:center}
.fig th{background:var(--sheet);font-weight:700}
.figrow{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:center}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:grid;grid-template-columns:2em 1fr;gap:8px;align-items:start;text-align:left;border:1.5px solid var(--rule);background:var(--sheet);border-radius:8px;padding:10px 12px;cursor:pointer;font-size:1rem;line-height:1.5}
.opt .L{font-family:var(--mono);font-weight:600;color:var(--ink2)}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt.sel{border-color:var(--blue);background:color-mix(in srgb,var(--blue) 10%,var(--sheet))}
.opt.right{border-color:var(--ok);background:var(--okbg)}.opt.right .L{color:var(--ok)}
.opt.wrong{border-color:var(--bad);background:var(--badbg)}.opt.wrong .L{color:var(--bad)}
.opt:disabled{cursor:default}
.verdict{border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.verdict.ok{background:var(--okbg)}.verdict.bad{background:var(--badbg)}.verdict.hint{background:var(--warnbg)}
.verdict h4{margin:0;font-size:1.03rem}.verdict.ok h4{color:var(--ok)}.verdict.bad h4{color:var(--bad)}.verdict.hint h4{color:var(--warn)}
.reasons{display:flex;flex-wrap:wrap;gap:6px}
.reasons button{border:1.5px solid var(--bad);background:var(--sheet);color:var(--bad);border-radius:999px;padding:4px 12px;cursor:pointer;font-size:.88rem}
.reasons button[aria-pressed=true]{background:var(--bad);color:#fff}
.pips{display:inline-flex;gap:4px;vertical-align:middle}.pips i{width:11px;height:11px;border-radius:50%;border:2px solid var(--ok)}.pips i.on{background:var(--ok)}
.wb{display:grid;grid-template-columns:1fr auto;gap:6px 10px;align-items:center;padding:10px 0;border-bottom:1px dashed var(--line)}
.wb:last-child{border-bottom:0}.wb .q{font-size:.94rem;min-width:0}
.wb .m{font-size:.78rem;color:var(--ink2);grid-column:1/-1}
details summary{cursor:pointer;font-weight:700}
.sheetgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(36px,1fr));gap:6px}
.sheetgrid button{height:36px;border-radius:6px;border:1.5px solid var(--rule);background:var(--sheet);font-family:var(--mono);cursor:pointer;font-size:.85rem}
.sheetgrid button.done{background:var(--ink);color:var(--sheet);border-color:var(--ink)}
.sheetgrid button.cur{outline:3px solid var(--red);outline-offset:1px}
.sheetgrid button.r{background:var(--okbg);color:var(--ok);border-color:var(--ok)}.sheetgrid button.w{background:var(--badbg);color:var(--bad);border-color:var(--bad)}
.score{font-family:var(--mono);font-size:3.8rem;line-height:1;color:var(--red);font-variant-numeric:tabular-nums}.score small{font-size:1.15rem;color:var(--ink2)}
.hist{width:100%;border-collapse:collapse;font-size:.92rem;font-variant-numeric:tabular-nums}
.hist td,.hist th{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}.hist td:first-child{white-space:normal}
.hist tr.click{cursor:pointer}.hist tr.click:hover td{background:var(--paper)}
.confirm{border:2px solid var(--red);border-radius:8px;padding:12px;background:var(--badbg);display:flex;flex-direction:column;gap:8px}
.lock{border:2px dashed var(--rule);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:8px}
textarea{width:100%;min-height:90px;font-family:var(--mono);font-size:.78rem;border:1.5px solid var(--rule);border-radius:8px;padding:8px;background:var(--paper);color:var(--ink)}
.shot{border:2px solid var(--ink);border-radius:var(--r);padding:14px;background:var(--sheet);display:flex;flex-direction:column;gap:6px}
.typecard{display:flex;flex-direction:column;gap:8px}
.typecard .hd{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.typecard dl{display:grid;grid-template-columns:4.5em 1fr;gap:4px 10px;margin:0;font-size:.93rem}
.typecard dt{color:var(--ink2);font-weight:700}.typecard dd{margin:0}
@media (min-width:720px){.cols{grid-template-columns:1fr 1fr;align-items:start}.cols .span{grid-column:1/-1}.meter{grid-template-columns:repeat(4,1fr)}}
@media (min-width:900px){body{padding-bottom:0;padding-left:96px;font-size:17px}
 nav.tabs{top:0;bottom:0;right:auto;width:96px;grid-template-columns:1fr;grid-auto-rows:min-content;gap:4px;padding-top:calc(24px + env(safe-area-inset-top,0px));border-top:0;border-right:1px solid var(--rule)}
 nav.tabs button{padding:12px 4px;font-size:.86rem}nav.tabs button[aria-current=true]{background:var(--paper);box-shadow:inset 3px 0 0 var(--red)}
 .wrap{max-width:1040px;padding-left:max(32px,env(safe-area-inset-left,0px));padding-right:max(32px,env(safe-area-inset-right,0px))}.qwrap{max-width:780px}.top h1{font-size:2rem}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.noanim *{transition:none!important;animation:none!important}

/* 國文：逐步圖解 */
.cw-fig{display:flex;flex-direction:column;gap:10px}
.cw-fig [data-p]{cursor:pointer;transition:opacity .3s,background-color .3s,color .3s}
.cw-fig.dim [data-p]:not(.hl){opacity:.28}
.cw-text{font-family:var(--hand);font-size:1.32rem;line-height:2;letter-spacing:.04em}
.cw-text span[data-p]{border-radius:6px;padding:2px 3px;margin:0 1px}
.cw-text span.hl,.cw-cmp div.hl,.cw-yin .hl,.cw-chars div.hl,.cw-pairs div.hl,.cw-km .hl,.cw-box.hl,.cw-root.hl,.cw-sum.hl{background:color-mix(in srgb,var(--red) 14%,var(--sheet));color:var(--red);box-shadow:0 0 0 2px var(--red)}

<script>

(function () {

// k: orig 講義題 / var 錯題類題 / ext 題型延伸 / adapt 外部改編 / key 重點題

const W = (c, ug) => ({ w: 1, c, ug: ug ? 1 : 0 });
const V = of => ({ of });

/* ===== T1 字音 ===== */
q("c4-w03", "T1", 1, "orig", "講義 p.69 國字注音 8", "「奉養」父母的「養」，注音是？", ["一ㄤˋ", "一ㄤˇ", "一ㄤ", "一ㄤˊ"],

q("c4-w03a", "T1", 1, "var", "類題", "下列「養」字，何者讀作一ㄤˋ？", ["今之孝者，是謂能「養」", "至於犬馬，皆能有「養」", "修「養」品德", "「養」兒防老"],

q("c4-w03b", "T1", 2, "var", "類題", "下列各組「養」字，何者讀音前後相同？", ["奉「養」雙親／孝「養」祖母", "「養」育之恩／奉「養」父母", "飼「養」寵物／供「養」長輩", "「養」氣／是謂能「養」"],
  "奉養、孝養都是晚輩供養長輩，同讀一ㄤˋ。養育、飼養、養氣讀一ㄤˇ；奉養、供養長輩、是謂能養讀一ㄤˋ，所以其他三組前後不同。", V("c4-w03"));
q("c4-w04", "T1", 1, "orig", "講義 p.69 國字注音 9（空白未答）", "孔子學習射箭、駕「馭」馬車，可謂允文允武。「馭」的注音是？", ["ㄩˋ", "ㄩˊ", "ㄨˋ", "ㄧㄡˋ"],

q("c4-w04a", "T1", 1, "var", "類題", "孔門「六藝」（禮、樂、射、御、書、數）中的「御」指的是什麼？", ["駕馭車馬", "防禦敵人", "皇帝使用的物品", "抵抗外侮"],
  "六藝的「御」＝駕車，跟「駕馭」的馭同義，課文前哨站說孔子學習射箭、駕馭馬車。", V("c4-w04"));
q("c4-w04b", "T1", 2, "var", "類題", "下列「」中的字，何者讀音與「駕馭」的「馭」相同？", ["射、「御」、書、數", "「娛」樂", "「漁」夫", "「于」是"],
  "馭、御都讀ㄩˋ。娛、漁、于都讀ㄩˊ（二聲），聲調不同。", V("c4-w04"));
q("c4-w07", "T1", 2, "orig", "講義 p.70 學力活用 1（仿107會考）", "下列詞語「」中的字，何組讀音相同？", ["受到「庇」護／「比」鄰而居", "不「謀」而合／「媒」體造勢", "奉「養」父母／不痛不「癢」", "名「傳」天下／獨斷「專」行"],
  "庇ㄅㄧˋ；「比鄰」的比是「緊靠」，課本讀ㄅㄧˋ，兩字相同。其他三組都能確定不同：謀ㄇㄡˊ／媒ㄇㄟˊ；奉養<b>一ㄤˋ</b>／癢一ㄤˇ（陷阱：只差聲調）；傳ㄔㄨㄢˊ／專ㄓㄨㄢ。就算不確定「比」，用刪去法也能選出來。", Object.assign(W("記憶不牢", 1), { h: "奉養的「養」讀幾聲？「癢」讀幾聲？" }));
q("c4-w07a", "T1", 2, "var", "類題", "下列「」中的字，何組讀音不同？", ["奉「養」父母／「養」育子女", "「省」察／反「省」", "「傳」授／「傳」遞", "未成一「簣」／「潰」堤"],
  "奉養一ㄤˋ、養育一ㄤˇ，聲調不同。省察、反省都讀ㄒㄧㄥˇ；傳授、傳遞都讀ㄔㄨㄢˊ；簣、潰都讀ㄎㄨㄟˋ。", V("c4-w07"));
q("c4-w07b", "T1", 3, "var", "類題", "下列「」中的字，何組讀音相同？", ["吾日三「省」吾身／晨昏定「省」", "「省」略／反「省」", "自「傳」／「傳」授", "飼「養」／奉「養」"],
  "三省（反省）和晨昏定省（探望問候）都讀ㄒㄧㄥˇ。省略ㄕㄥˇ／反省ㄒㄧㄥˇ；自傳ㄓㄨㄢˋ／傳授ㄔㄨㄢˊ；飼養一ㄤˇ／奉養一ㄤˋ。", V("c4-w07"));
q("c4-o01", "T1", 1, "orig", "講義 p.69 國字注音 6", "吾日三「省」吾身的「省」，注音是？", ["ㄒㄧㄥˇ", "ㄕㄥˇ", "ㄒㄧㄥ", "ㄕㄥ"],
  "檢討、反省讀ㄒㄧㄥˇ（反省、內省、省察）；節省、省略、省份讀ㄕㄥˇ。");
q("c4-o02", "T1", 2, "orig", "講義 p.69 國字注音 7・注釋⑩", "「傳」不習乎的「傳」，注音與意思是？", ["ㄔㄨㄢˊ，老師所傳授的課業", "ㄓㄨㄢˋ，解釋經書的文字", "ㄔㄨㄢˊ，傳遞給別人", "ㄓㄨㄢˋ，記載一生的傳記"],
  "課本注釋⑩：傳不習乎＝老師所傳授的課業是否還未溫習呢？傳音ㄔㄨㄢˊ，意思是傳授。ㄓㄨㄢˋ是左傳、自傳、傳記的「傳」。");
q("c4-o03", "T1", 1, "orig", "講義 p.69 國字注音 10", "記「載」的「載」，注音是？", ["ㄗㄞˇ", "ㄗㄞˋ", "ㄓㄞ", "ㄘㄞˊ"],
  "記載、刊載、一年半載讀ㄗㄞˇ；載重、載運、裝載讀ㄗㄞˋ。");
q("c4-o04", "T1", 2, "orig", "課文注釋⑧", "「為」人謀而不忠乎的「為」，讀音和意思是？", ["ㄨㄟˋ，替", "ㄨㄟˊ，做", "ㄨㄟˊ，堆", "ㄨㄟˋ，因為"],
  "注釋⑧：為，音ㄨㄟˋ，替。「為人謀」＝替別人辦事。");
q("c4-o05", "T1", 2, "orig", "課文注釋③", "譬如「為」山的「為」，讀音和意思是？", ["ㄨㄟˊ，堆（堆土成山）", "ㄨㄟˋ，替", "ㄨㄟˋ，為了", "ㄨㄟˊ，成為"],
  "注釋③：為山＝堆土成山，為音ㄨㄟˊ。和「為人謀」的ㄨㄟˋ（替）不同，兩個一起考最常見。");
q("c4-e101", "T1", 2, "ext", "題型延伸", "下列「省」字的讀音，何者與其他三者不同？", ["「省」錢", "「省」親", "「省」悟", "發人深「省」"],
  "省錢＝節約，讀ㄕㄥˇ。省親（探望）、省悟（領悟）、發人深省都讀ㄒㄧㄥˇ。");
q("c4-e102", "T1", 1, "ext", "題型延伸", "下列「傳」字，何者讀作ㄓㄨㄢˋ？", ["「傳」記", "「傳」染", "眉目「傳」情", "「傳」喚"],
  "傳記＝記載某人一生事跡的文字，讀ㄓㄨㄢˋ。傳染、傳情、傳喚都讀ㄔㄨㄢˊ。");
q("c4-e103", "T1", 3, "ext", "題型延伸", "下列「」中的字，何組讀音前後相同？", ["左「傳」／自「傳」", "「傳」授／「傳」記", "奉「養」父母／「養」寵物", "「省」略／「省」察"],

q("c4-e104", "T1", 2, "ext", "題型延伸", "小華說：「『晨昏定省』的省，跟『省錢』一樣唸ㄕㄥˇ。」他說得對嗎？", ["不對，晨昏定省是探望問候，讀ㄒㄧㄥˇ", "對，兩個都讀ㄕㄥˇ", "不對，晨昏定省讀ㄒㄧㄥ（一聲）", "對，省字只有一種讀音"],
  "晨昏定省＝早晚向父母問安，省是探望、問候，讀ㄒㄧㄥˇ。省錢是節約，讀ㄕㄥˇ。");
q("c4-e105", "T1", 3, "adapt", "改編自 新北市崇林國中 107學年度第一學期第二次段考", "下列文句「」中的字，何者讀音標示正確？", ["逝者如斯夫！不「舍」晝夜：ㄕㄜˇ", "未成一「簣」：ㄍㄨㄟˋ", "是謂能「養」：一ㄤˇ", "「傳」不習乎：ㄓㄨㄢˋ"],

q("c4-e106", "T1", 2, "ext", "題型延伸", "「謀」「媒」「煤」三個字，讀音的關係是？", ["謀讀ㄇㄡˊ，媒、煤讀ㄇㄟˊ", "三字都讀ㄇㄟˊ", "三字都讀ㄇㄡˊ", "謀、媒讀ㄇㄡˊ，煤讀ㄇㄟˊ"],
  "講義易混淆字：謀ㄇㄡˊ（計謀、謀生）；媒ㄇㄟˊ（媒人、媒體）；煤ㄇㄟˊ（煤炭）。");

/* ===== T2 字形・改錯 ===== */
q("c4-w01", "T2", 1, "orig", "講義 p.69 國字注音 3", "季路個性急「ㄗㄠˋ」，寫成國字是？", ["躁", "燥", "噪", "澡"],
  "急躁、浮躁跟「腳」有關：人一急就跺腳，所以是<b>足字旁</b>。乾燥是火字旁（火烤就乾）；噪音是口字旁（嘴巴吵）；洗澡是水字旁。你寫成「燥」，是和『乾燥』記混了。", Object.assign(W("記憶不牢", 1), { h: "急起來會做什麼動作？跟哪個部首有關？" }));

  "心浮氣躁（足字旁）；天乾物燥（火）；噪音（口）；洗澡（水）。", V("c4-w01"));
q("c4-w01b", "T2", 2, "var", "類題", "下列文句，何者用字完全正確？", ["季路個性魯莽急躁，好逞血氣之勇", "冬天天氣乾躁，記得多喝水", "工地的燥音讓人無法專心", "他心浮氣燥，做事半途而廢"],
  "急躁用足字旁。乾燥用火字旁；噪音用口字旁；心浮氣躁用足字旁。", V("c4-w01"));

      const s = C.steps[self.k]; mark(s.p);
      out.className = "readout"; out.innerHTML = `<b>自己背 ${self.k + 1}／${n}</b>：看發亮的地方，先說出它的<b>意思和重點</b>，再按「看答案」。`;
      el.querySelector('[data-c="show"]').disabled = false; el.querySelector('[data-c="ok"]').disabled = true; el.querySelector('[data-c="ng"]').disabled = true;
    }
    function selfEnd() {
      out.className = "readout " + (self.ok === n ? "ok" : "bad");
      out.innerHTML = `<b>自己背完成：答對 ${self.ok}／${n}</b>${self.miss.length ? `<br>再看一次：${self.miss.map(k => C.steps[k].name).join("、")}` : "<br>全部記住了！"}`;
      self = null; ctl.hidden = false; selfRow.hidden = true; card.hidden = false; cardLb.hidden = false; mark([]);
    }
    el.querySelectorAll("[data-st]").forEach(b => b.onclick = () => { if (self) return; stop(); set(+b.dataset.st); });
    el.querySelector('[data-c="play"]').onclick = () => {
      if (timer) return stop();
      if (!animOn()) return showAll();
      if (i >= n - 1) set(-1);
      set(i + 1); playB.textContent = "⏸ 暫停";
      timer = setInterval(() => { if (!document.body.contains(el)) return stop(); if (i >= n - 1) return stop(); set(i + 1); }, 2600);
    };
    el.querySelector('[data-c="prev"]').onclick = () => { stop(); set(i - 1); };
    el.querySelector('[data-c="next"]').onclick = () => { stop(); set(i + 1); };
    el.querySelector('[data-c="all"]').onclick = showAll;
    el.querySelector('[data-c="reset"]').onclick = () => { stop(); set(-1); };
    el.querySelector('[data-c="self"]').onclick = () => { stop(); set(-1); self = { k: 0, ok: 0, miss: [] }; ctl.hidden = true; selfRow.hidden = false; card.hidden = true; cardLb.hidden = true; mnUpto(-1); selfStep(); };
    el.querySelector('[data-c="show"]').onclick = () => { if (!self) return; const s = C.steps[self.k]; out.innerHTML = `<b>${s.name}</b><br>${s.note}<br><span class="muted">你剛剛說對了嗎？</span>`; el.querySelector('[data-c="show"]').disabled = true; el.querySelector('[data-c="ok"]').disabled = false; el.querySelector('[data-c="ng"]').disabled = false; };
    const grade = ok => { if (!self) return; if (ok) self.ok++; else self.miss.push(self.k); self.k++; if (self.k >= n) selfEnd(); else selfStep(); };
    el.querySelector('[data-c="ok"]').onclick = () => grade(true);
    el.querySelector('[data-c="ng"]').onclick = () => grade(false);
    el.querySelector('[data-c="quit"]').onclick = () => { if (!self) return; self = null; ctl.hidden = false; selfRow.hidden = true; card.hidden = false; cardLb.hidden = false; set(-1); };
    parts.forEach(x => x.addEventListener("click", e => {
      e.stopPropagation(); if (self) return;
      const key = x.dataset.p, j = C.steps.findIndex(s => s.p.includes(key));
      if (j >= 0) { stop(); set(j); }
      else { stop(); mark([key]); out.className = "readout bad"; out.innerHTML = (C.extra && C.extra[key]) || "這個部分不在這份背誦清單裡。"; }
    }));
  },
  csort(el) {
    const C = window.CSORT[el.dataset.set]; if (!C) return;
    let items = [], k = 0, ok = 0, wrong = [];
    const start = () => { items = C.items.slice().sort(() => Math.random() - .5); k = 0; ok = 0; wrong = []; draw(); };
    el.innerHTML = `<div class="lab"><h3>${C.title}</h3><div class="cw-sortq"></div><div class="row cw-sortb">${C.cats.map((c, j) => `<button class="btn sm ${j ? "red" : ""}" data-cat="${j}">${c}</button>`).join("")}</div><div class="readout" aria-live="polite">看到成語，按「褒義」或「貶義」。</div><div class="row"><button class="btn sm ghost" data-c="again">重來</button></div></div>`;
    const qd = el.querySelector(".cw-sortq"), out = el.querySelector(".readout"), btns = el.querySelectorAll("[data-cat]");
    function draw() {
      if (k >= items.length) { qd.innerHTML = `<b>${ok}／${items.length}</b>`; btns.forEach(b => b.disabled = true); out.className = "readout " + (ok === items.length ? "ok" : "bad"); out.innerHTML = ok === items.length ? "全部分對！" : `再看一次：${wrong.join("、")}`; return; }
      btns.forEach(b => b.disabled = false); qd.innerHTML = `<span class="muted">${k + 1}／${items.length}</span><b>${items[k][0]}</b>`;
    }
    btns.forEach(b => b.onclick = () => {
      const it = items[k]; if (!it) return; const right = +b.dataset.cat === it[1];
      if (right) ok++; else wrong.push(it[0]);
      out.className = "readout " + (right ? "ok" : "bad"); out.innerHTML = `${right ? "對！" : "不對。"}「${it[0]}」是<b>${C.cats[it[1]]}</b>：${(C.why || {})[it[0]] || ""}`;
      k++; setTimeout(draw, 0);
    });
    el.querySelector('[data-c="again"]').onclick = start;
    start();
  }
};

function submitQuiz() {

        <div class="reasons">${REASONS.map(z => `<button data-qr="${id}" data-r="${z}" aria-pressed="${last && last.r === z}">${z}</button>`).join("")}</div></div>`; }).join("")}</div>` : `<div class="sheet"><b>全對！</b></div>`}
    <div class="row"><button class="btn" id="toBook">去錯題本</button><button class="btn ghost" id="toRec">成績紀錄</button></div></div>`;

function chart(qs) {

  const pts = qs.map((r, i) => [X(i), Y(r.score)]);
  return `<div class="fig"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="分數走勢">
    ${[40, 60, 80, 100].map(v => `<line x1="${ox}" x2="${ox + w}" y1="${Y(v)}" y2="${Y(v)}" style="stroke:var(--line)"/><text x="${ox - 6}" y="${Y(v) + 4}" text-anchor="end" style="fill:var(--ink2);font-size:11px;font-family:var(--mono)">${v}</text>`).join("")}
    <line x1="${ox}" x2="${ox + w}" y1="${Y(96)}" y2="${Y(96)}" style="stroke:var(--red);stroke-dasharray:5 4"/><text x="${ox + w}" y="${Y(96) - 5}" text-anchor="end" style="fill:var(--red);font-size:11px;font-family:var(--sans)">目標 96</text>

    ${pts.map((p, i) => `<circle cx="${p[0]}" cy="${p[1]}" r="${i === pts.length - 1 ? 5 : 3.5}" style="fill:var(--blue)"/><text x="${p[0]}" y="${H - 8}" text-anchor="middle" style="fill:var(--ink2);font-size:11px;font-family:var(--mono)">${qs[i].n}</text>`).join("")}
    <text x="${pts[pts.length - 1][0]}" y="${pts[pts.length - 1][1] - 9}" text-anchor="middle" style="fill:var(--ink);font-size:12px;font-weight:700;font-family:var(--mono)">${qs[qs.length - 1].score}</text></svg></div>`;
}
function recView() {
  const qs = S.U[S.unit].quizzes, rd = readiness(S.unit);

  return `<div class="section qwrap"><div class="sheet"><div class="row" style="justify-content:space-between"><div class="label">分數走勢（${UNITS[S.unit].name}）</div><span class="pill ${rd[1]}">${rd[0]}</span></div>${chart(qs)}</div>

function bindQuiz() {
  const u = S.unit, U = S.U[u];
  const on = (id, f) => { const e = $("#" + id); if (e) e.onclick = f; };
  on("toPractice", () => go("practice", "types"));
  on("toRec", () => go("quiz", "rec"));
  on("toBook", () => go("book"));
  on("qStart", () => { const ids = buildQuiz(u); U.qz = { ids, orders: ids.map(id => orderFor(Q[id])), ans: {}, start: Date.now(), cur: 0 }; save(); render(); });
  view.querySelectorAll("[data-rec]").forEach(b => b.onclick = () => { S.view = +b.dataset.rec; S.sub.quiz = "result"; save(); render(); window.scrollTo(0, 0); });
  view.querySelectorAll("[data-qr]").forEach(b => b.onclick = () => { const x = st(b.dataset.qr); x.rs = x.rs || []; x.rs.push({ r: b.dataset.r, at: Date.now(), src: "測驗" + S.view }); save(); render(); });
  if (!U.qz || S.sub.quiz !== "test") { clearInterval(tick); return; }
  const z = U.qz;
  view.querySelectorAll("[data-j]").forEach(b => b.onclick = () => { z.cur = +b.dataset.j; confirmSubmit = false; save(); render(); });
  view.querySelectorAll("[data-qa]").forEach(b => b.onclick = () => { z.ans[z.cur] = +b.dataset.qa; save(); render(); });
  on("qPrev", () => { z.cur--; save(); render(); window.scrollTo(0, 0); });
  on("qNext", () => { z.cur++; save(); render(); window.scrollTo(0, 0); });
  on("qSub", () => { if (Object.keys(z.ans).length < z.ids.length) { confirmSubmit = true; render(); } else submitQuiz(); });
  on("qSubYes", submitQuiz);
  on("qSubNo", () => { confirmSubmit = false; render(); });
  clearInterval(tick);
  const upd = () => { const c = $("#clock"); if (!c) return clearInterval(tick); const m = Math.floor((Date.now() - z.start) / 6e4); c.textContent = `已用 ${m} 分鐘`; };

  enzyme(el) {
    el.innerHTML = `<div class="lab"><h3>酵素實驗台：溫度</h3><p class="muted">人體酵素最適溫度約 37°C；這支酵素超過 50°C 就永久失活。</p>
      <div class="slider"><label for="eT">溫度</label><input id="eT" type="range" min="0" max="80" value="37"><output id="eTo">37°C</output></div>
      <div class="bar"><i id="eBar" style="width:100%"></i></div><div class="readout" id="eOut"></div><div class="row"><button class="btn sm ghost" id="eNew">換一管新的酵素</button></div></div>
      <div class="lab" style="margin-top:10px"><h3>酵素實驗台：酸鹼值</h3>
      <div class="chips"><button class="chip" data-p="2" aria-pressed="true">胃的酵素</button><button class="chip" data-p="7">唾液的酵素</button><button class="chip" data-p="8.5">小腸的酵素</button></div>
      <div class="slider"><label for="eP">pH 值</label><input id="eP" type="range" min="0" max="14" step="0.5" value="2"><output id="ePo">2</output></div>
      <div class="bar"><i id="pBar" style="width:100%"></i></div><div class="readout" id="pOut2"></div></div>`;
    let dead = false, opt = 2;
    const T = el.querySelector("#eT"), P = el.querySelector("#eP");
    const act = t => t <= 37 ? Math.max(0.05, t / 37) : t <= 50 ? Math.cos((t - 37) / 13 * Math.PI / 2) : 0;
    const upT = () => {
      const t = +T.value; if (t > 50) dead = true;
      const a = dead ? 0 : act(t);
      el.querySelector("#eTo").textContent = t + "°C"; el.querySelector("#eBar").style.width = Math.round(a * 100) + "%";
      const o = el.querySelector("#eOut");
      o.className = "readout " + (dead ? "bad" : a > 0.8 ? "ok" : "");
      o.textContent = dead ? (t > 50 ? "超過 50°C：酵素結構被破壞，永久失活。" : `已經被高溫破壞過，就算降回 ${t}°C 也救不回來（活性 0）。`) : t < 20 ? `低溫：活性很低，但只是「暫時」的，回溫就恢復（像冰箱保存食物）。活性 ${Math.round(a * 100)}%` : `活性 ${Math.round(a * 100)}%${Math.abs(t - 37) <= 2 ? "，接近最適溫度。" : ""}`;
    };
    const upP = () => {
      const p = +P.value, a = Math.exp(-Math.pow((p - opt) / 1.8, 2));
      el.querySelector("#ePo").textContent = p; el.querySelector("#pBar").style.width = Math.round(a * 100) + "%";
      const o = el.querySelector("#pOut2"); o.className = "readout " + (a > 0.8 ? "ok" : a < 0.2 ? "bad" : "");
      o.textContent = `pH ${p}（${p < 7 ? "酸性" : p === 7 ? "中性" : "鹼性"}）：活性 ${Math.round(a * 100)}%。這種酵素最適 pH 約 ${opt}。`;
    };
    T.oninput = upT; P.oninput = upP;
    el.querySelector("#eNew").onclick = () => { dead = false; T.value = 37; upT(); };
    el.querySelectorAll("[data-p]").forEach(b => b.onclick = () => { opt = +b.dataset.p; el.querySelectorAll("[data-p]").forEach(x => x.setAttribute("aria-pressed", x === b)); upP(); });
    upT(); upP();
  },
  emulsify(el) {
    const big = `<circle cx="180" cy="60" r="45" style="fill:#F2D16B;stroke:#B89A2E"/>`;
    let small = ""; for (let i = 0; i < 27; i++) { const a = i * 2.4, r = 12 + (i % 9) * 6; small += `<circle cx="${(180 + Math.cos(a) * r * 2.2).toFixed(0)}" cy="${(60 + Math.sin(a) * r).toFixed(0)}" r="15" style="fill:#F2D16B;stroke:#B89A2E"/>`; }
    el.innerHTML = `<div class="lab"><h3>膽汁的乳化：把大油滴打散</h3><div class="stage"><svg viewBox="0 0 360 120" id="emS">${big}</svg></div>
      <div class="row"><button class="btn sm" id="emGo">加入膽汁</button><button class="btn sm ghost" id="emBack">重來</button></div><div class="readout" id="emOut">一大滴油，胰液的酵素只能從表面慢慢分解。</div></div>`;
    const s = el.querySelector("#emS"), out = el.querySelector("#emOut");
    el.querySelector("#emGo").onclick = () => { s.innerHTML = small; out.className = "readout ok"; out.textContent = "變成 27 顆小油滴，總表面積變成原來的 3 倍，酵素更容易分解。膽汁沒有酵素，脂質還沒被分解成脂肪酸和甘油。"; };
    el.querySelector("#emBack").onclick = () => { s.innerHTML = big; out.className = "readout"; out.textContent = "一大滴油，胰液的酵素只能從表面慢慢分解。"; };
  },
  lab(el) {
    const C = { iod: "#C98A2B", bb: "#2C2766", ben: "#8EC5E8", grn: "#7DBE5A", org: "#E8873A", red: "#C8452E", clr: "#DCE6F2" };
    const tubes = [
      { n: "澱粉液", st: 1, su: 0, why: "有澱粉、沒有糖" },
      { n: "葡萄糖液", st: 0, su: 3, why: "有糖、沒有澱粉" },
      { n: "澱粉液＋唾液 37°C", st: 0, su: 2, why: "唾液把澱粉分解成糖" },
      { n: "澱粉液＋煮沸過的唾液", st: 1, su: 0, why: "酵素被高溫破壞，澱粉還在" },
      { n: "水", st: 0, su: 0, why: "什麼都沒有（對照）" }
    ];
    el.innerHTML = `<div class="lab"><h3>試劑實驗室</h3><div class="bath" id="lBath"><div class="tubes">${tubes.map((t, i) => `<div class="tube"><div class="glass"><span class="drop" id="lD${i}"></span><div class="liq" id="lL${i}" style="background:${C.clr}"></div></div><span>${t.n}</span></div>`).join("")}</div></div>
      <div class="row"><button class="btn sm" id="lI">滴碘液</button><button class="btn sm" id="lB">滴本氏液</button><button class="btn sm red" id="lH" disabled>隔水加熱</button><button class="btn sm ghost" id="lR">重來</button></div>
      <div class="readout" id="lOut">選一種試劑。</div></div>`;
    const out = el.querySelector("#lOut"), bath = el.querySelector("#lBath"), H = el.querySelector("#lH");
    const drop = (col, cb) => { tubes.forEach((_, i) => { const d = el.querySelector("#lD" + i); d.style.background = col; d.classList.remove("go"); void d.offsetWidth; if (S.anim) d.classList.add("go"); }); setTimeout(cb, S.anim ? 650 : 0); };
    const color = f => tubes.forEach((t, i) => el.querySelector("#lL" + i).style.backgroundColor = f(t));
    el.querySelector("#lI").onclick = () => { H.disabled = true; bath.classList.remove("on"); drop(C.iod, () => { color(t => t.st ? C.bb : C.iod); out.className = "readout"; out.innerHTML = "碘液不用加熱。<b>藍黑色＝有澱粉</b>（澱粉液、煮沸過的唾液）；<b>黃褐色＝碘液原色＝沒有澱粉</b>（葡萄糖液、被唾液分解過的、水）。"; }); };
    el.querySelector("#lB").onclick = () => { bath.classList.remove("on"); drop(C.ben, () => { color(() => C.ben); H.disabled = false; out.className = "readout bad"; out.textContent = "全部都是淡藍色——本氏液還沒加熱，不能下結論。按「隔水加熱」。"; }); };
    H.onclick = () => { H.disabled = true; bath.classList.add("on"); setTimeout(() => { color(t => [C.ben, C.grn, C.org, C.red][t.su]); out.className = "readout ok"; out.innerHTML = "加熱後：<b>葡萄糖液變紅（糖多）</b>、<b>澱粉＋唾液變橙（唾液分解出糖）</b>；澱粉液、煮沸唾液、水維持淡藍（沒有糖）。"; }, S.anim ? 1200 : 0); };
    el.querySelector("#lR").onclick = () => { H.disabled = true; bath.classList.remove("on"); color(() => C.clr); out.className = "readout"; out.textContent = "選一種試劑。"; };
  },
  gate2(el) {
    el.innerHTML = `<div class="lab"><h3>半透膜實驗（經典題 13）</h3><div class="stage" id="mS"></div>
      <div class="row"><button class="btn sm" id="mWait">靜置一段時間</button><button class="btn sm" id="mI" disabled>兩邊滴碘液</button><button class="btn sm" id="mB" disabled>兩邊滴本氏液並加熱</button><button class="btn sm ghost" id="mR">重來</button></div><div class="readout" id="mOut">試管裝葡萄糖液（紅點），燒杯裝澱粉液（藍圈），膜只讓小分子通過。</div></div>`;
    const S0 = { moved: false, tube: "var(--sheet)", beak: "var(--sheet)" };
    const draw = () => {
      let g = "", s = ""; const gp = S0.moved ? [[170, 70], [178, 120], [100, 150], [250, 170], [130, 190], [230, 140]] : [[170, 70], [182, 92], [168, 112], [186, 124], [176, 146], [174, 60]];
      gp.forEach(([x, y]) => g += `<circle cx="${x}" cy="${y}" r="3.5" style="fill:var(--red)"/>`);
      [[110, 140], [130, 176], [240, 150], [228, 184], [104, 190]].forEach(([x, y]) => s += `<circle cx="${x}" cy="${y}" r="7" style="fill:none;stroke:var(--blue);stroke-width:2"/>`);
      el.querySelector("#mS").innerHTML = `<svg viewBox="0 0 360 230"><path d="M80 90v130h200V90" style="fill:none;stroke:var(--ink);stroke-width:2"/><rect x="82" y="120" width="196" height="98" style="fill:${S0.beak};transition:fill 1s"/><path d="M160 20v140h36V20" style="fill:${S0.tube};stroke:var(--ink);stroke-width:2;transition:fill 1s"/><line x1="156" y1="160" x2="200" y2="160" style="stroke:var(--ink);stroke-width:3"/>${g}${s}<text x="206" y="40" style="fill:var(--ink2);font-size:12px">試管</text><text x="286" y="130" style="fill:var(--ink2);font-size:12px">燒杯</text></svg>`;
    };
    draw();
    const out = el.querySelector("#mOut");
    el.querySelector("#mWait").onclick = () => { S0.moved = true; draw(); el.querySelector("#mI").disabled = el.querySelector("#mB").disabled = false; out.textContent = "葡萄糖（小）穿過膜，兩邊都有了；澱粉（大）過不去，還在燒杯。"; };
    el.querySelector("#mI").onclick = () => { S0.beak = "#2C2766"; S0.tube = "#C98A2B"; draw(); out.className = "readout"; out.textContent = "碘液：只有燒杯變藍黑（有澱粉），試管黃褐（沒有澱粉）。"; };
    el.querySelector("#mB").onclick = () => { S0.beak = "#E8873A"; S0.tube = "#C8452E"; draw(); out.className = "readout ok"; out.textContent = "本氏液加熱：試管和燒杯都變色，因為兩邊都有葡萄糖。這就是經典題 13 的答案。"; };
    el.querySelector("#mR").onclick = () => { S0.moved = false; S0.beak = S0.tube = "var(--sheet)"; draw(); el.querySelector("#mI").disabled = el.querySelector("#mB").disabled = true; out.className = "readout"; out.textContent = "試管裝葡萄糖液（紅點），燒杯裝澱粉液（藍圈），膜只讓小分子通過。"; };
  },
  journey(el) {
    const J = window.JOURNEY; let i = -1, timer = null;
    el.innerHTML = `<div class="lab"><h3>一口漢堡的旅程</h3><div class="stepper">${J.map((s, k) => `<button data-js="${k}">${s.at}</button>`).join("")}</div>
      <div class="label">離開這一站時，還沒被消化的量</div>
      <div class="jbars"><div><span>澱粉</span><div class="bar"><i id="jS" style="width:100%;background:var(--blue)"></i></div><em id="jSv">100%</em></div>
      <div><span>蛋白質</span><div class="bar"><i id="jP" style="width:100%;background:var(--red)"></i></div><em id="jPv">100%</em></div>
      <div><span>脂質</span><div class="bar"><i id="jF" style="width:100%;background:var(--warn)"></i></div><em id="jFv">100%</em></div></div>
      <div class="readout" id="jOut">按「自動播放」或點任一站。</div><div class="row"><button class="btn sm" id="jPlay">自動播放</button></div></div>`;
    const set = k => { i = k; const s = J[k]; [["S", s.s], ["P", s.p], ["F", s.f]].forEach(([n, v]) => { el.querySelector("#j" + n).style.width = v + "%"; el.querySelector("#j" + n + "v").textContent = v + "%"; }); el.querySelector("#jOut").innerHTML = `<b>${s.at}</b>：${s.txt}`; el.querySelectorAll("[data-js]").forEach(b => b.setAttribute("aria-current", +b.dataset.js === k)); };
    el.querySelectorAll("[data-js]").forEach(b => b.onclick = () => { clearInterval(timer); set(+b.dataset.js); });
    el.querySelector("#jPlay").onclick = () => { clearInterval(timer); if (!S.anim) return set(J.length - 1); set(0); timer = setInterval(() => { if (i >= J.length - 1 || !document.body.contains(el)) return clearInterval(timer); set(i + 1); }, 2200); };
  }
};
function mountAnims() { view.querySelectorAll("[data-anim]").forEach(el => { const f = ANIM[el.dataset.anim] || ((window.ANIM_EXTRA || {})[el.dataset.anim] ? (e => window.ANIM_EXTRA[e.dataset.anim](e, () => S.anim)) : null); if (f && !el.dataset.done) { el.dataset.done = 1; try { f(el); } catch (e) { el.innerHTML = ""; } } }); }

/* ========== 開始 ========== */
load();
if (S.tab === "practice" && S.sub.practice === "run" && !S.pm) S.sub.practice = "types";
render();
}();

</script>
</body></html>
