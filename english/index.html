<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>English Talent Season · 千賦的英文闖關</title>
<style>
:root{
  --stage:#201642; --deep:#140D2B; --gold:#F5C243; --golddim:#8C6E22;
  --paper:#FFFCF3; --ink:#241C1A; --soft:#6B6157; --line:rgba(36,28,26,.13);
  --mint:#3FBF8F; --coral:#F2604C; --sky:#5AA9E6;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:var(--sans);
  background:radial-gradient(120% 60% at 50% -8%,#3A2A6B 0%,var(--stage) 45%,var(--deep) 100%) fixed;
  color:#fff;min-height:100vh;padding:0 0 88px;font-size:16px;
}
.wrap{max-width:600px;margin:0 auto;padding:0 18px}
button{font-family:inherit}
:focus-visible{outline:3px solid #fff;outline-offset:2px}
.hide{display:none!important}

/* topbar */
html{background:#140D2B}
:root{padding-top:env(safe-area-inset-top,0px)}
#topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:8;background:rgba(20,13,43,.9);backdrop-filter:blur(10px);
  border-bottom:1px solid rgba(255,255,255,.1)}
#topbar .wrap{display:flex;align-items:center;gap:10px;height:56px}
#back{background:none;border:none;color:var(--gold);font-size:22px;cursor:pointer;padding:4px 6px;line-height:1}
#title{font-size:17px;font-weight:700;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#topbar .pct{font-size:13px;color:var(--gold);font-weight:700}

/* generic */
h2{font-size:22px;font-weight:800;letter-spacing:-.01em;margin:22px 0 10px}
h3{font-size:15px;font-weight:700;margin:0 0 8px}
.muted{color:rgba(255,255,255,.55);font-size:14px;line-height:1.6}
.bar{height:7px;border-radius:99px;background:rgba(255,255,255,.14);overflow:hidden}
.bar i{display:block;height:100%;background:var(--gold);border-radius:99px;transition:width .4s}
.bar.mint i{background:var(--mint)} .bar.sky i{background:var(--sky)}
.btn{width:100%;padding:14px;border-radius:11px;border:1px solid rgba(255,255,255,.18);
  background:rgba(255,255,255,.09);color:#fff;font-size:15px;font-weight:600;cursor:pointer}
.btn:hover{background:rgba(255,255,255,.16)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#2A1E05}
.btn.gold:hover{background:#FFD264}
.btn:disabled{opacity:.4;cursor:default}
.row{display:flex;gap:8px;margin-top:12px}
.row .btn{flex:1}
.row .btn.slim{flex:0 0 56px;font-size:19px;padding:14px 0}

/* roadmap */
.season{margin:20px 0 8px;text-align:center}
.season .marq{display:inline-block;padding:6px 18px;border-radius:99px;border:2px solid var(--gold);
  color:var(--gold);font-size:11px;letter-spacing:.16em;font-weight:700}
.season h1{margin:12px 0 4px;font-size:29px;font-weight:800;letter-spacing:-.02em}
.season p{margin:0;font-size:13px;color:rgba(255,255,255,.5)}
.overall{margin:18px 0 8px;background:rgba(255,255,255,.06);border-radius:14px;padding:16px 16px 14px;
  border:1px solid rgba(255,255,255,.1)}
.overall .top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:9px}
.overall b{font-size:24px;font-weight:800;color:var(--gold)}

.stops{position:relative;margin:14px 0 0;padding-left:28px}
.stops::before{content:"";position:absolute;left:9px;top:14px;bottom:14px;width:2px;
  background:repeating-linear-gradient(180deg,rgba(255,255,255,.22) 0 6px,transparent 6px 12px)}
.stop{position:relative;margin-bottom:10px}
.dot{position:absolute;left:-28px;top:16px;width:20px;height:20px;border-radius:50%;
  background:var(--deep);border:2px solid rgba(255,255,255,.28);display:flex;align-items:center;
  justify-content:center;font-size:11px}
.stop.done .dot{background:var(--gold);border-color:var(--gold);color:#2A1E05}
.stop.open .dot{border-color:var(--gold)}
.tile{width:100%;text-align:left;background:var(--paper);color:var(--ink);border:none;border-radius:4px;
  padding:14px 16px;cursor:pointer;box-shadow:0 8px 18px rgba(0,0,0,.24);display:block}
.tile.lock{background:rgba(255,255,255,.07);color:rgba(255,255,255,.45);box-shadow:none;cursor:default;
  border:1px dashed rgba(255,255,255,.2)}
.tile .h{display:flex;align-items:center;gap:8px}
.tile .h b{font-size:17px;font-weight:800}
.tile .h span{margin-left:auto;font-size:13px;font-weight:700;color:var(--soft)}
.tile.lock .h span{color:rgba(255,255,255,.4)}
.tile .sub{font-size:13px;color:var(--soft);margin:3px 0 9px}
.tile.lock .sub{color:rgba(255,255,255,.4)}
.tile .bar{background:rgba(36,28,26,.12);height:6px}
.tile.match{background:linear-gradient(135deg,#F5C243,#E8A93B);color:#2A1E05}
.tile.match .sub,.tile.match .h span{color:rgba(42,30,5,.7)}
.tile.match .bar{background:rgba(42,30,5,.18)} .tile.match .bar i{background:#2A1E05}

/* lesson tabs */
.tabs2{display:flex;gap:7px;margin:16px 0 6px}
.tabs2 button{flex:1;padding:11px 4px;border-radius:10px;border:1px solid rgba(255,255,255,.14);
  background:rgba(255,255,255,.07);color:rgba(255,255,255,.7);font-size:14px;font-weight:600;cursor:pointer}
.tabs2 button[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:#2A1E05}

/* paper card */
.paper{background:var(--paper);color:var(--ink);border-radius:4px;padding:20px;
  box-shadow:0 14px 28px rgba(0,0,0,.28)}
.pin::before{content:"";position:absolute;top:-9px;left:50%;transform:translateX(-50%);
  width:16px;height:16px;border-radius:50%;background:var(--coral);box-shadow:0 3px 5px rgba(0,0,0,.35)}

/* flashcard */
.bulbs{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;margin:14px 0 10px}
.bulb{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.2)}
.bulb.seen{background:var(--golddim)} .bulb.now{background:var(--gold);box-shadow:0 0 0 4px rgba(245,194,67,.2)}
.fc{position:relative;background:var(--paper);color:var(--ink);border-radius:4px;padding:24px 20px;
  box-shadow:0 14px 30px rgba(0,0,0,.3);min-height:150px}
.fc .word{font-size:34px;font-weight:800;letter-spacing:-.02em;line-height:1.1;word-break:break-word}
.fc .metarow{display:flex;align-items:center;gap:10px;margin-top:8px;flex-wrap:wrap}
.fc .zh{font-size:21px;font-weight:700}
.fc .pos{font-size:13px;color:var(--soft);font-style:italic}
.fc .forms{font-size:13px;color:var(--soft);margin-top:5px}
.blk{margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.blk .lab{font-size:11px;color:#A2988C;letter-spacing:.1em;margin-bottom:6px}
.en{font-size:16px;line-height:1.75}
.zhtr{font-size:14px;color:var(--soft);line-height:1.6;margin-top:5px}
.tk{cursor:pointer;border-radius:3px;padding:0 1px}
.tk:hover{background:rgba(90,169,230,.2)}
.tk.hit{background:rgba(245,194,67,.45);font-weight:700}
.spk{background:none;border:1px solid var(--line);border-radius:99px;cursor:pointer;
  font-size:13px;padding:3px 9px;color:var(--soft)}
.spk:hover{background:rgba(36,28,26,.06)}

/* popup */
#pop{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--paper);color:var(--ink);
  border-radius:16px 16px 0 0;padding:20px 20px calc(22px + env(safe-area-inset-bottom));
  box-shadow:0 -10px 40px rgba(0,0,0,.5);max-width:600px;margin:0 auto}
#pop .pw{font-size:27px;font-weight:800}
#pop .pp{font-size:13px;color:var(--soft);font-style:italic;margin-top:2px}
#pop .pz{font-size:19px;font-weight:600;margin-top:8px}
#pop .prow{display:flex;gap:8px;margin-top:14px}
#pop .prow button{flex:1;padding:12px;border-radius:10px;border:1px solid var(--line);
  background:#fff;color:var(--ink);font-size:14px;font-weight:600;cursor:pointer}
#pop .prow button.on{background:var(--mint);border-color:var(--mint);color:#04301F}
#pop .close{position:absolute;top:14px;right:16px;background:none;border:none;font-size:20px;
  color:var(--soft);cursor:pointer}

/* stage list */
.wrow{display:flex;align-items:center;gap:10px;background:var(--paper);color:var(--ink);
  border-radius:4px;padding:13px 15px;margin-bottom:8px;cursor:pointer;border:none;width:100%;text-align:left;
  box-shadow:0 6px 14px rgba(0,0,0,.2)}
.wrow b{font-size:17px;font-weight:800} .wrow i{font-size:13px;color:var(--soft);font-style:normal}
.wrow .dots{margin-left:auto;display:flex;gap:4px}
.wrow .dots s{width:9px;height:9px;border-radius:50%;background:rgba(36,28,26,.15);display:block}
.wrow .dots s.on{background:var(--mint)}
.wrow.done{background:linear-gradient(135deg,#FFF6DC,#FFE9AE)}
.star{font-size:16px}

/* quiz */
.qhead{display:flex;justify-content:space-between;align-items:baseline;margin:16px 0 10px;
  font-size:13px;color:rgba(255,255,255,.55)}
.qhead b{color:var(--gold);font-size:15px}
.qtype{font-size:12px;color:#A2988C;margin:0 0 12px;text-align:center}
.qtext{font-size:20px;line-height:1.5;font-weight:600;margin:0;text-align:center}
.qtext.big{font-size:28px;font-weight:800}
.gap{color:var(--coral);letter-spacing:.06em}
.opts{display:grid;gap:8px;margin-top:12px}
.opt{padding:15px 16px;border-radius:10px;text-align:left;cursor:pointer;background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.16);color:#fff;font-size:16px;font-weight:600}
.opt:hover:not(:disabled){background:rgba(255,255,255,.17)}
.opt:disabled{cursor:default}
.opt.right{background:var(--mint);border-color:var(--mint);color:#04301F}
.opt.wrong{background:var(--coral);border-color:var(--coral);color:#3B0D06}
.opt.fade{opacity:.38}
.opt.sel{border-color:var(--gold);background:rgba(245,194,67,.2)}
.bl{display:inline-block;margin:2px 3px;padding:3px 6px;border:none;border-bottom:2px solid var(--coral);
  background:rgba(242,96,76,.08);font:inherit;font-weight:700;color:var(--ink);border-radius:4px 4px 0 0;text-align:center}
.bl.ok{border-bottom-color:var(--mint);background:rgba(63,191,143,.15)}
.bl.bad{background:rgba(242,96,76,.22)}
.bl.dc{border-bottom-color:var(--ink);background:transparent;padding:3px 2px}
.bl.dc.ok{border-bottom-color:var(--mint);background:rgba(63,191,143,.15)}
.bl.dc.bad{border-bottom-color:var(--coral);background:rgba(242,96,76,.22)}
.spellbox{display:flex;gap:8px;margin-top:12px}
.spellbox input{flex:1;padding:15px;border-radius:10px;border:1px solid rgba(255,255,255,.22);
  background:rgba(255,255,255,.08);color:#fff;font-family:inherit;font-size:18px;font-weight:600}
.spellbox input::placeholder{color:rgba(255,255,255,.34);font-weight:400}
.verdict{margin-top:12px;padding:14px 16px;border-radius:10px;font-size:14px;line-height:1.6}
.verdict.ok{background:rgba(63,191,143,.18);border:1px solid rgba(63,191,143,.5)}
.verdict.no{background:rgba(242,96,76,.18);border:1px solid rgba(242,96,76,.5)}
.verdict strong{display:block;font-size:16px;margin-bottom:3px}
.combo{text-align:center;font-size:13px;color:var(--gold);font-weight:700;height:18px;margin-top:8px}
.rc-ta{width:100%;min-height:96px;margin-top:12px;padding:14px;border-radius:10px;border:1px solid rgba(255,255,255,.22);
  background:rgba(255,255,255,.08);color:#fff;font-family:inherit;font-size:17px;line-height:1.5;resize:vertical}
.rc-ta::placeholder{color:rgba(255,255,255,.35)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;min-height:50px}
.chips.ans{background:var(--paper);border-radius:4px;padding:12px;min-height:64px;align-content:flex-start}
.chip{padding:11px 13px;border-radius:10px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.1);
  color:#fff;font-family:inherit;font-size:15px;font-weight:600;cursor:pointer;text-align:left}
.chips.ans .chip{background:#fff;color:var(--ink);border-color:var(--line)}
.chips.ans .ph{color:#B3A899;font-size:14px;padding:10px 4px}
.rcrow{padding:10px 0;border-bottom:1px dashed var(--line)}
.rcrow .en{font-size:17px;font-weight:600}
.rcmiss{color:var(--coral);font-weight:700}

/* result */
.result{text-align:center}
.score{font-size:54px;font-weight:800;line-height:1;letter-spacing:-.03em}
.score span{font-size:22px;color:#B3A899}
.badgebig{font-size:62px;line-height:1;margin-bottom:6px}

/* badges */
.bgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:12px}
.bcell{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:12px;
  padding:14px 6px;text-align:center}
.bcell.got{background:linear-gradient(155deg,rgba(245,194,67,.9),rgba(232,169,59,.75));border-color:var(--gold);color:#2A1E05}
.bcell .ic{font-size:27px;line-height:1;filter:grayscale(1) opacity(.45)}
.bcell.got .ic{filter:none}
.bcell .nm{font-size:11px;margin-top:6px;font-weight:700;line-height:1.35}
.bcell.champ{grid-column:1/-1;padding:20px 10px}
.bcell.champ .ic{font-size:44px}

/* lists */
.item{background:var(--paper);color:var(--ink);border-radius:4px;padding:14px 16px;margin-bottom:8px;
  box-shadow:0 6px 14px rgba(0,0,0,.2)}
.item .top{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.item .top b{font-size:18px;font-weight:800}
.item .top i{font-size:12px;color:var(--soft);font-style:italic}
.item .top em{font-size:16px;font-style:normal;font-weight:700;margin-left:auto}
.item p{margin:6px 0 0;font-size:14px;line-height:1.55;color:var(--soft)}
.item .del{background:none;border:none;color:var(--coral);font-size:13px;cursor:pointer;padding:2px 4px}
.empty{background:rgba(255,255,255,.05);border:1px dashed rgba(255,255,255,.2);border-radius:12px;
  padding:26px 18px;text-align:center;color:rgba(255,255,255,.5);font-size:14px;line-height:1.7}

/* nav */
nav{position:fixed;left:0;right:0;bottom:0;z-index:9;background:rgba(16,10,34,.94);
  backdrop-filter:blur(12px);border-top:1px solid rgba(255,255,255,.12);
  padding:8px 0 calc(8px + env(safe-area-inset-bottom))}
nav .wrap{display:flex;gap:4px}
nav button{flex:1;padding:8px 2px;border:none;background:none;cursor:pointer;border-radius:9px;
  color:rgba(255,255,255,.5);font-size:11px;font-weight:600;line-height:1.5}
nav button .ic{display:block;font-size:17px}
nav button[aria-pressed="true"]{color:var(--gold);background:rgba(245,194,67,.12)}

#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);z-index:30;
  background:rgba(20,13,43,.96);border:1px solid var(--gold);color:var(--gold);
  padding:11px 18px;border-radius:99px;font-size:14px;font-weight:600;opacity:0;
  transition:opacity .25s;pointer-events:none;max-width:88vw;text-align:center}
#toast.show{opacity:1}

/* ===== 首頁分類 & 文法 ===== */
.cats{display:grid;gap:10px;margin-top:16px}
.tile.cat{position:relative;padding-left:64px}
.cic{position:absolute;left:14px;top:50%;transform:translateY(-50%);font-size:32px;line-height:1}
.tile.lock .cic{filter:grayscale(1) opacity(.5)}
.vtools{display:flex;gap:8px;margin:12px 0 0}
.vtools .btn{padding:11px;font-size:14px}
.gform{background:#FFF6DC;border-left:4px solid var(--gold);padding:10px 12px;font-size:15px;line-height:1.8;border-radius:4px;color:var(--ink)}
.gform i{color:var(--soft)}
.gl{font-size:11px;color:#A2988C;letter-spacing:.1em;margin-bottom:6px}
.gdemo{padding:8px 0;border-bottom:1px dashed var(--line)}
.gdemo:last-of-type{border-bottom:none}
.gsent{display:flex;flex-wrap:wrap;gap:6px;min-height:50px;align-items:flex-start}
.sb{display:inline-flex;flex-direction:column;align-items:center;padding:7px 10px;border-radius:9px;color:#fff;animation:sbin .35s ease}
.sb b{font-size:17px;font-weight:800}
.sb i{font-style:normal;font-size:11px;margin-top:2px;opacity:.92}
.rS{background:#3E86C9}.rV{background:#E0A82E;color:#2A1E05}.rA{background:#8A63D2}.rN{background:#E0523F}.rO{background:#2FA57A}.rT{background:#6F6A80}
.sb.now{box-shadow:0 0 0 3px rgba(245,194,67,.7)}
@keyframes sbin{from{opacity:0;transform:translateY(8px) scale(.9)}to{opacity:1;transform:none}}
.gnote{font-size:14px;color:var(--soft);margin-top:6px;line-height:1.5}
.paper .btn{background:rgba(36,28,26,.06);color:var(--ink);border-color:var(--line)}
.paper .btn.gold{background:var(--gold);border-color:var(--gold);color:#2A1E05}
.paper .chips.ans{background:rgba(36,28,26,.04);padding:10px}
.gin{font-size:17px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<div id="topbar"><div class="wrap">
  <button id="back" class="hide" aria-label="返回">‹</button>
  <div id="title">千賦的英文學習</div>
  <div class="pct" id="toppct"></div>
</div></div>

<main id="app" class="wrap"></main>

<nav><div class="wrap">
  <button data-v="home" aria-pressed="true"><span class="ic">🏠</span>首頁</button>
  <button data-v="map" aria-pressed="false"><span class="ic">🔤</span>單字</button>
  <button data-v="gram" aria-pressed="false"><span class="ic">🧩</span>文法</button>
  <button data-v="miss" aria-pressed="false"><span class="ic">🔁</span>錯題本</button>
  <button data-v="book" aria-pressed="false"><span class="ic">📓</span>生字本</button>
  <button data-v="set" aria-pressed="false"><span class="ic">⚙️</span>設定</button>
</div></nav>

<div id="pop" class="hide"></div>
<div id="toast"></div>

<script>
/* ==================== 課程資料 ==================== */
const LESSONS=[



{id:"w1",week:1,book:"Wonders 4.1-2",title:"The Talent Show",pages:"p.38-41",words:[
{w:"accountable",pos:"adjective",forms:"",zh:"有責任的；要負責的",keys:["accountable"],
 def:"being responsible for something that you do",defZh:"對自己所做的事負起責任",
 ex:[{en:"Sam is held accountable for washing his dog.",zh:"Sam 要負責幫他的狗洗澡。"},
     {en:"I understand that you're friends, but you're still accountable for your own actions.",zh:"我知道你們是朋友，但你還是要為自己的行為負責。"}]},
{w:"advise",pos:"verb",forms:"advise · advised · advised",zh:"勸告；建議",keys:["advised","advise"],
 def:"to give an opinion or to inform",defZh:"提供意見或告知",
 ex:[{en:"A coach can advise you on how to improve your swimming.",zh:"教練可以建議你怎麼把游泳練得更好。"},
     {en:"\u201CI advise you to tell the truth,\u201D she said.",zh:"「我建議你說實話。」她說。"}]},
{w:"desperately",pos:"adverb",forms:"",zh:"拼命地；急切地",keys:["desperately"],
 def:"to try anything to change a hopeless situation",defZh:"為了改變沒希望的處境而什麼都願意試",
 ex:[{en:"The woman was desperately trying to remember where she had left her keys.",zh:"那位女士拼命想回想鑰匙放在哪裡。"},
     {en:"I desperately wanted to win, but it was more than that.",zh:"我非常想贏，但不只是這樣而已。"}]},
{w:"hesitate",pos:"verb",forms:"hesitate · hesitated · hesitated",zh:"猶豫；遲疑",keys:["hesitated","hesitate"],
 def:"to stop before you do something when you are unsure",defZh:"不確定的時候，做之前先停一下",
 ex:[{en:"The dog hesitated before jumping up to grab the food off the counter.",zh:"那隻狗猶豫了一下，才跳上去搶流理臺上的食物。"},
     {en:"I hesitated for a second before continuing.",zh:"我遲疑了一秒才繼續。"}]},
{w:"humiliated",pos:"adjective",forms:"",zh:"感到丟臉的；羞愧的",keys:["humiliated"],
 def:"to be made to feel ashamed or foolish",defZh:"被弄得覺得羞愧或愚蠢",
 ex:[{en:"Sarah felt humiliated when she forgot her lines.",zh:"Sarah 忘詞的時候覺得很丟臉。"},
     {en:"\u201CWe don't want to be humiliated, right?\u201D",zh:"「我們不想丟臉，對吧？」"}]},
{w:"inspiration",pos:"noun",forms:"",zh:"靈感；啟發",keys:["inspiration"],
 def:"something that motivates you, or gives you ideas",defZh:"激勵你、給你點子的東西",
 ex:[{en:"The girl found inspiration for her drawing in nature.",zh:"那個女孩從大自然裡找到畫畫的靈感。"},
     {en:"My inspiration came from that new TV show.",zh:"我的靈感來自那個新的電視節目。"}]},
{w:"self-esteem",pos:"noun",forms:"",zh:"自尊心；自信",keys:["self-esteem"],
 def:"respect for one's self",defZh:"對自己的尊重",
 ex:[{en:"Winning the soccer championship helped improve Billy's self-esteem.",zh:"贏得足球冠軍讓 Billy 更有自信。"},
     {en:"\u201CIt will be good for your self-esteem!\u201D",zh:"「這對你的自信心有幫助！」"}]},
{w:"uncomfortably",pos:"adverb",forms:"",zh:"不舒服地；不自在地",keys:["uncomfortably"],
 def:"uneasily, not in an easy way",defZh:"不自在地、不輕鬆地",
 ex:[{en:"Sonya's throat felt uncomfortably sore.",zh:"Sonya 的喉嚨痛得很不舒服。"},
     {en:"My grip on my books became uncomfortably tight.",zh:"我抓書的手不自在地愈抓愈緊。"}]},
{w:"individual",pos:"noun",forms:"",zh:"個人；單獨一人",keys:["individuals","individual"],
 def:"one member of a large group",defZh:"一大群人裡的其中一個人",
 ex:[{en:"Individuals could also participate in the competition.",zh:"個人也可以參加這場比賽。"},
     {en:"\u201CIt says acts can be individuals, partners, or small groups.\u201D",zh:"「上面說表演可以是個人、雙人或小組。」"}]},
{w:"curt",pos:"adjective",forms:"",zh:"說話簡短又不客氣的",keys:["curt"],
 def:"said or done in a quick and impolite way",defZh:"說得或做得又快又沒禮貌",
 ex:[{en:"Alan was very curt when he told me to clean the floor.",zh:"Alan 叫我掃地的時候口氣很衝。"},
     {en:"She was curt on the phone.",zh:"她在電話裡講話很不客氣。"}]}
]},
{id:"w2",week:2,book:"Wonders 4.1-2",title:"The Talent Show",pages:"p.38-41",words:[
{w:"bulletin board",pos:"noun",forms:"",zh:"布告欄",keys:["bulletin board"],
 def:"a board that hangs on a wall where important information is posted for everyone to see",
 defZh:"掛在牆上、張貼重要訊息給大家看的板子",
 ex:[{en:"The teacher pinned our art projects to the bulletin board for everyone to see.",zh:"老師把我們的美術作品釘在布告欄上讓大家看。"},
     {en:"Tina ran over to the bulletin board and read the poster.",zh:"Tina 跑到布告欄前看那張海報。"}]},
{w:"tight",pos:"adjective",forms:"tight · tighter · tightest",zh:"緊的；牢牢的",keys:["tighter","tight"],
 def:"held together firmly or closely",defZh:"抓得牢牢的、靠得很緊",
 ex:[{en:"My shoelaces were loose, so I tied them tighter so I wouldn't trip and fall.",zh:"我的鞋帶鬆了，所以我綁緊一點才不會絆倒。"},
     {en:"\u201COur act?\u201D I said, taking a tighter grip on my books.",zh:"「我們的表演？」我說，手把書抓得更緊。"}]},
{w:"grin",pos:"verb",forms:"grin · grinned · grinned",zh:"露齒而笑；咧嘴笑",keys:["grinned","grin"],
 def:"to smile so that the teeth are showing",defZh:"笑到露出牙齒",
 ex:[{en:"The boy began to grin when he saw the big birthday cake with candles.",zh:"男孩看到插著蠟燭的大蛋糕就笑開了。"},
     {en:"Tina grinned, pointed to the poster, and said, \u201CIt says acts can be individuals, partners, or small groups.\u201D",zh:"Tina 咧嘴一笑，指著海報說：「上面說表演可以是個人、雙人或小組。」"}]},
{w:"situation",pos:"noun",forms:"",zh:"情況；狀況",keys:["situation"],
 def:"a set of things that are happening at a certain place and time",defZh:"在某個時間、某個地方發生的一連串事情",
 ex:[{en:"When the puppy got stuck in the mud, we had to figure out how to deal with the situation.",zh:"小狗卡在泥巴裡的時候，我們得想辦法處理這個狀況。"},
     {en:"The problem is Tina always takes charge, I don't speak up, and then I end up feeling resentful about the whole situation.",zh:"問題是 Tina 老是作主，我不出聲，最後就對整件事感到不滿。"}]},
{w:"juggling act",pos:"noun",forms:"",zh:"同時應付很多事；拋接雜耍",keys:["juggling act"],
 def:"to throw several things into the air and keep them moving with at least one thing always in the air at all times",
 defZh:"把好幾樣東西拋到空中一直接住，隨時至少有一樣在空中",
 ex:[{en:"Trying to do all my homework, practice piano, play soccer, and help mom with chores feels like a juggling act.",zh:"又要寫功課、練鋼琴、踢足球，還要幫媽媽做家事，感覺像在拋接雜耍。"},
     {en:"I told her about my juggling act.",zh:"我跟她說了我的拋接表演。"}]},
{w:"recess",pos:"noun",forms:"",zh:"下課時間；休息時間",keys:["recess"],
 def:"the break in a school day for children to play",defZh:"上學日中間讓小孩玩的休息時間",
 ex:[{en:"During recess, we played tag and enjoyed running around the track.",zh:"下課時我們玩鬼抓人，也很喜歡繞著跑道跑。"},
     {en:"At recess, I ran around the track a couple of times just to let off some steam.",zh:"下課時我繞跑道跑了幾圈，只是想發洩一下。"}]},
{w:"respectful",pos:"adjective",forms:"",zh:"尊重的；有禮貌的",keys:["respectful"],
 def:"having or showing respect, being polite",defZh:"有禮貌、表現出尊重",
 ex:[{en:"Being respectful means listening to elders, and saying \u2018please\u2019 and \u2018thank you\u2019.",zh:"有禮貌就是聽長輩說話，並且說「請」和「謝謝」。"},
     {en:"\u201CSo, Tina is not being respectful of your ideas, but it sounds as if you aren't either.\u201D",zh:"「所以 Tina 不尊重你的想法，但聽起來你也沒有尊重她。」"}]},
{w:"point",pos:"verb",forms:"point · pointed · pointed",zh:"指；指向",keys:["pointed","point"],
 def:"to show where something or someone is by holding your finger or something else towards it",
 defZh:"用手指或別的東西朝著某處，指出人或東西在哪裡",
 ex:[{en:"During the field trip, the guide asked us to point to the animals we liked best at the zoo.",zh:"校外教學時，導覽員請我們指出動物園裡最喜歡的動物。"},
     {en:"Tina grinned, pointed to the poster, and said, \u201CIt says acts can be individuals, partners, or small groups.\u201D",zh:"Tina 咧嘴一笑，指著海報說：「上面說表演可以是個人、雙人或小組。」"}]},
{w:"breath",pos:"noun",forms:"",zh:"呼吸；一口氣",keys:["breaths","breath"],
 def:"the air that flows into and out of our lungs when we breathe",defZh:"呼吸時進出肺部的空氣",
 ex:[{en:"After running around the playground, I had to stop and take a deep breath.",zh:"在操場跑完之後，我得停下來深呼吸。"},
     {en:"When we got home, I took 12 deep breaths, called Tina, and told her that I was going to do my juggling act.",zh:"回到家後，我深呼吸了十二次，打電話給 Tina，告訴她我要表演拋接。"}]},
{w:"describe",pos:"verb",forms:"describe · described · described",zh:"描述；形容",keys:["described","describe"],
 def:"to say what something or someone is like",defZh:"說出某個東西或某個人是什麼樣子",
 ex:[{en:"In writing class, we had to describe our favorite animal by writing what it looks like, and what it eats.",zh:"寫作課上，我們要描述最喜歡的動物，寫出牠長什麼樣、吃什麼。"},
     {en:"The next day, she described her act and her costume.",zh:"隔天，她描述了她的表演和她的服裝。"}]}
]},
{id:"w13",week:13,book:"Wonders 4.1-2",title:"The Ant and the Grasshopper",pages:"p.152",words:[
{w:"audience",pos:"noun",forms:"",zh:"觀眾",keys:["audience"],
 def:"a group of people that listens to, or watches a show",defZh:"聽或看表演的一群人",
 ex:[{en:"The audience clapped and cheered after the school play was over.",zh:"學校話劇結束後，觀眾鼓掌歡呼。"},
     {en:"Termite turns and sees the audience.",zh:"白蟻轉身看到了觀眾。"}]},
{w:"yipes",pos:"interjection",forms:"",zh:"唉呀（表示驚訝或痛的驚嘆詞）",keys:["yipes"],
 def:"a word that has no real meaning except to express a feeling of pain or surprise",defZh:"沒有實際意思，只用來表達痛或驚訝的感覺",
 ex:[{en:"\u201CYipes! I didn't see you.\u201D",zh:"「唉呀！我沒看到你。」"},
     {en:"When the balloon popped, my classmate jumped and shouted, \u201CYipes!\u201D",zh:"氣球爆炸的時候，我同學嚇得跳起來大喊：「唉呀！」"}]},
{w:"soggy",pos:"adjective",forms:"",zh:"濕透的；濕軟的",keys:["soggy"],
 def:"extremely wet or soft",defZh:"非常濕或軟",
 ex:[{en:"After playing in the rain, my shoes were soggy.",zh:"在雨中玩過後，我的鞋子濕透了。"},
     {en:"We're soggy now because it's the rainy season.",zh:"因為是雨季，我們現在全身濕透了。"}]},
{w:"shrug",pos:"verb",forms:"shrug · shrugged · shrugged",zh:"聳肩",keys:["shrugged","shrugs","shrug"],
 def:"to raise the shoulders to show that you do not know, do not care, or are unsure about something",defZh:"抬起肩膀，表示不知道、不在乎或不確定",
 ex:[{en:"When I didn't know the answer to the question, I shrugged and said, \u201CI don't know.\u201D",zh:"我不知道問題的答案時，聳聳肩說：「我不知道。」"},
     {en:"She shrugs and smiles.",zh:"她聳聳肩，微笑了一下。"}]},
{w:"halt",pos:"verb",forms:"halt · halted · halted",zh:"停止",keys:["halted","halt"],
 def:"to stop",defZh:"停下來",
 ex:[{en:"\u201CCompany, halt!\u201D",zh:"「全體，立定！」"},
     {en:"When the traffic light turned red, the cars halted at the intersection.",zh:"交通燈變紅時，車輛在路口停了下來。"}]},
{w:"energetic",pos:"adjective",forms:"",zh:"精力充沛的",keys:["energetic"],
 def:"having energy while doing something",defZh:"做事情時很有活力",
 ex:[{en:"My dog is very energetic because she loves to play catch.",zh:"我的狗很有活力，因為牠很愛玩接球遊戲。"},
     {en:"Your carefree attitude will disappear with the water, and soon you will regret being lazy and wish you had been more energetic.",zh:"你那無憂無慮的態度會隨著缺水而消失，你很快就會後悔懶惰，希望自己當初能更有活力一點。"}]},
{w:"sickly",pos:"adjective",forms:"",zh:"病懨懨的；體弱多病的",keys:["sickly"],
 def:"looking, feeling or being sick often",defZh:"看起來、感覺或經常生病的樣子",
 ex:[{en:"The plant looked sickly because the leaves were turning yellow and brown.",zh:"這株植物看起來病懨懨的，因為葉子正在變黃變褐。"},
     {en:"Grasshopper, appearing weak and sickly, knocks on Ant's door.",zh:"蚱蜢看起來虛弱又病懨懨的，敲了敲螞蟻的門。"}]},
{w:"neighborhood",pos:"noun",forms:"",zh:"鄰里；社區",keys:["neighborhood"],
 def:"a place in the city where some people live, some people work, and some people play",defZh:"城市裡有人住、有人工作、有人玩樂的一個地方",
 ex:[{en:"\u201CHi there, pal ... I was in the neighborhood.\u201D",zh:"「嗨，朋友……我剛好在附近。」"},
     {en:"On Saturdays, I love playing with my friends at the park in my neighborhood.",zh:"每個星期六，我都喜歡跟朋友在我家附近的公園玩。"}]},
{w:"pause",pos:"noun",forms:"",zh:"暫停；短暫休息",keys:["pause"],
 def:"a stop or rest for a short time",defZh:"短暫的停止或休息",
 ex:[{en:"During story time, the teacher would pause to ask us questions about the book.",zh:"講故事時間，老師會暫停下來問我們關於這本書的問題。"},
     {en:"(After a pause) \u201CWe ants worked hard to collect this water, but we cannot let you suffer.\u201D",zh:"（停頓一下之後）「我們螞蟻辛苦收集了這些水，但我們不能讓你受苦。」"}]},
{w:"deed",pos:"noun",forms:"",zh:"行為；善舉",keys:["deed"],
 def:"something that is done",defZh:"已經做過的事情",
 ex:[{en:"Helping my friend pick up her books was a kind deed.",zh:"幫朋友撿起她的書是一個善舉。"},
     {en:"Although Ant has done a good deed, tired, cranky Grasshopper must still search for water.",zh:"雖然螞蟻做了一件好事，但又累又暴躁的蚱蜢還是得繼續找水。"}]}
]},
{id:"w14",week:14,book:"Wonders 4.3-4",title:"Judy's Appalachia",pages:"p.38-41",words:[
{w:"boycott",pos:"verb",forms:"boycott · boycotted · boycotted",zh:"抵制",keys:["boycotting","boycotted","boycott"],
 def:"to stop buying or using a product",defZh:"停止購買或使用某項產品",
 ex:[{en:"Customers are boycotting the supermarket.",zh:"顧客正在抵制這家超市。"},
     {en:"Judy knew it would be impossible to boycott the mining companies.",zh:"Judy知道要抵制這些採礦公司是不可能的。"}]},
{w:"encouragement",pos:"noun",forms:"",zh:"鼓勵",keys:["encouragement"],
 def:"support that inspires hope and confidence",defZh:"能激發希望與信心的支持",
 ex:[{en:"The encouragement we needed to win the game came from our fans.",zh:"我們贏得比賽所需要的鼓勵，來自我們的粉絲。"},
     {en:"Her success has provided encouragement to other activists.",zh:"她的成功給了其他社運人士鼓勵。"}]},
{w:"fulfill",pos:"verb",forms:"fulfill · fulfilled · fulfilled",zh:"實現；完成",keys:["fulfilled","fulfill"],
 def:"to carry out or finish",defZh:"完成或達成",
 ex:[{en:"Jules got to fulfill his dream of performing in the school talent show.",zh:"Jules終於實現了在學校才藝表演中演出的夢想。"},
     {en:"Sadly, Judy could not fulfill all of her goals.",zh:"很遺憾，Judy無法完成她所有的目標。"}]},
{w:"injustice",pos:"noun",forms:"",zh:"不公；不公正",keys:["injustice"],
 def:"unfairness; a lack of justice",defZh:"不公平；缺乏正義",
 ex:[{en:"The children felt that it was an injustice that they were not allowed on the roller coaster because they were too short.",zh:"孩子們覺得因為身高不夠而不能坐雲霄飛車，是一件不公平的事。"},
     {en:"She felt qualified to talk to groups about the injustice of whole towns being forced to move and mountains and forests destroyed, all because of strip mining.",zh:"她覺得自己有資格向大家談論這種不公：因為露天採礦，整個城鎮被迫搬遷，山林也被破壞。"}]},
{w:"mistreat",pos:"verb",forms:"mistreat · mistreated · mistreated",zh:"虐待；苛待",keys:["mistreated","mistreat"],
 def:"treat badly or do harm",defZh:"對待不好或造成傷害",
 ex:[{en:"Tom felt that the dog's former owner had harmed and mistreated her.",zh:"Tom覺得這隻狗以前的主人曾傷害並虐待過牠。"},
     {en:"The land she loved was being mistreated.",zh:"她所熱愛的土地正遭到虐待般的破壞。"}]},
{w:"protest",pos:"verb",forms:"protest · protested · protested",zh:"抗議",keys:["protested","protest"],
 def:"to object to something",defZh:"對某件事表示反對",
 ex:[{en:"The children decided to protest the destruction of the forest.",zh:"孩子們決定要抗議森林遭到破壞。"},
     {en:"Judy decided it was important to protest against strip mining.",zh:"Judy認為抗議露天採礦是很重要的事。"}]},
{w:"qualified",pos:"adjective",forms:"",zh:"有資格的；有能力的",keys:["qualified"],
 def:"a person has the needed abilities to do something",defZh:"一個人具備做某件事所需要的能力",
 ex:[{en:"Doctor Smith is more qualified than the nurse to tell what treatment the boy needs.",zh:"Smith醫生比護士更有資格判斷這個男孩需要什麼治療。"},
     {en:"She felt qualified to talk to groups about the injustice of whole towns being forced to move and mountains and forests destroyed, all because of strip mining.",zh:"她覺得自己有資格向大家談論這種不公：因為露天採礦，整個城鎮被迫搬遷，山林也被破壞。"}]},
{w:"register",pos:"verb",forms:"register · registered · registered",zh:"登記；註冊",keys:["registered","register"],
 def:"to place a name on a list",defZh:"把名字列在名單上",
 ex:[{en:"The woman gave her address so that she could be registered to vote.",zh:"這位女士留下她的地址，以便登記投票。"},
     {en:"She registered to take part in protests against mining companies.",zh:"她登記參加反對採礦公司的抗議活動。"}]},
{w:"diagnose",pos:"verb",forms:"diagnose · diagnosed · diagnosed",zh:"診斷",keys:["diagnosed","diagnose"],
 def:"to find the reason for an illness or other problem",defZh:"找出疾病或其他問題的原因",
 ex:[{en:"The mechanic was unable to diagnose the problem with my car.",zh:"技師沒辦法診斷出我車子的問題。"},
     {en:"She was diagnosed with cancer and died in January 2011.",zh:"她被診斷出罹患癌症，並於2011年1月過世。"}]},
{w:"miner",pos:"noun",forms:"",zh:"礦工",keys:["miners","miner"],
 def:"a person who works in a mine",defZh:"在礦場工作的人",
 ex:[{en:"My dad is a miner.",zh:"我爸爸是一名礦工。"},
     {en:"The coal miners could not afford to leave their jobs.",zh:"這些煤礦工人沒有能力放棄他們的工作。"}]}
]},
{id:"w15",week:15,book:"Wonders 4.3-4",title:"Judy's Appalachia",pages:"p.38-41",words:[
{w:"handful",pos:"noun",forms:"",zh:"一把（的量）",keys:["handful"],
 def:"as much or as many as your hand can grab",defZh:"你的手能抓住的量",
 ex:[{en:"I picked up a handful of colorful leaves to make a picture for art class.",zh:"我撿了一把五顏六色的葉子，準備做美術課的畫作。"},
     {en:"He held up a handful of dead fish and asked, \u201CWhat's wrong with these fish?\u201D",zh:"他舉起一把死魚，問道：「這些魚怎麼了？」"}]},
{w:"opposed",pos:"adjective",forms:"",zh:"反對的",keys:["opposed"],
 def:"against something",defZh:"反對某件事的",
 ex:[{en:"Many coal miners were not opposed to mountaintop removal mining.",zh:"許多煤礦工人並不反對山頂移除式採礦。"},
     {en:"Lisa was opposed to eating broccoli, but her sister loved it.",zh:"Lisa反對吃花椰菜，但她妹妹很喜歡吃。"}]},
{w:"holler",pos:"noun",forms:"",zh:"（阿帕拉契山區用語）山間小谷地",keys:["holler"],
 def:"a small valley surrounded by mountains",defZh:"被山環繞的小山谷",
 ex:[{en:"Marfork was home to a leafy green valley, or holler, surrounded by the Appalachian Mountains on every side.",zh:"Marfork坐落在一個綠意盎然的山谷（holler）裡，四周被阿帕拉契山脈環繞。"},
     {en:"My grandma lives in a beautiful holler surrounded by mountains that are covered in snow every winter.",zh:"我奶奶住在一個美麗的山谷裡，四周的山每年冬天都被雪覆蓋。"}]},
{w:"dynamite",pos:"noun",forms:"",zh:"炸藥",keys:["dynamite"],
 def:"a material that explodes when it's set off",defZh:"引爆後會爆炸的材料",
 ex:[{en:"Miners use dynamite to break apart large rocks and find gold deep underneath the earth.",zh:"礦工用炸藥炸開大石塊，尋找埋藏在地底深處的黃金。"},
     {en:"Using dynamite, the company blew off the tops of mountains to get at the large amounts of coal underneath.",zh:"這家公司用炸藥炸掉山頂，以取得底下大量的煤礦。"}]},
{w:"sludge",pos:"noun",forms:"",zh:"污泥；廠廢渣",keys:["sludge"],
 def:"thick mud, or factory waste",defZh:"濃稠的泥漿，或工廠廢棄物",
 ex:[{en:"After the rainstorm, the water in the ditch was full of thick sludge.",zh:"暴雨過後，水溝裡的水滿是濃稠的污泥。"},
     {en:"In the area where Judy lived, coal sludge flowed into the rivers and streams.",zh:"在Judy居住的地區，煤渣污泥流入了河川與小溪。"}]},
{w:"executive director",pos:"noun",forms:"",zh:"執行董事；執行長",keys:["executive director"],
 def:"the person in charge of a business or an organization",defZh:"負責一家企業或機構的人",
 ex:[{en:"My mom is the executive director of a company that makes and sells computer chips.",zh:"我媽媽是一家製造並銷售電腦晶片公司的執行董事。"},
     {en:"Eventually, she became its executive director.",zh:"最後，她成為了該機構的執行董事。"}]},
{w:"eventually",pos:"adverb",forms:"",zh:"最終；終於",keys:["eventually"],
 def:"in the end, finally, after a while",defZh:"最後，經過一段時間之後",
 ex:[{en:"After practicing every day, I eventually learned how to ride my bike without training wheels.",zh:"每天練習之後，我終於學會了不用輔助輪騎腳踏車。"},
     {en:"\u201CEventually, she became its executive director.\u201D",zh:"「最終，她成為了該機構的執行董事。」"}]},
{w:"insult",pos:"noun",forms:"",zh:"侮辱",keys:["insults","insult"],
 def:"a rude word or action",defZh:"粗魯的言語或行為",
 ex:[{en:"When Mike called Tim a mean name, it was an insult that hurt his feelings.",zh:"Mike用難聽的名字罵Tim，這是一種傷害他感情的侮辱。"},
     {en:"At the protests, Judy faced a lot of anger and insults.",zh:"在抗議活動中，Judy面對了許多憤怒與侮辱。"}]},
{w:"cancer",pos:"noun",forms:"",zh:"癌症",keys:["cancer"],
 def:"a disease that happens when bad cells stop the good cells from doing their job",defZh:"一種因壞細胞阻礙好細胞正常運作而產生的疾病",
 ex:[{en:"Some people with cancer lose all their hair because of the strong medicine they need to take.",zh:"有些癌症病人因為必須服用的強效藥物，而掉光所有頭髮。"},
     {en:"She was diagnosed with cancer and died in January 2011.",zh:"她被診斷出罹患癌症，並於2011年1月過世。"}]},
{w:"activist",pos:"noun",forms:"",zh:"社運人士；行動主義者",keys:["activist"],
 def:"a person who fights for some kind of social change",defZh:"為某種社會改變而努力的人",
 ex:[{en:"In 2003, Judy was awarded the Goldman Environmental Prize for her efforts as an activist.",zh:"2003年，Judy因身為社運人士的努力，獲頒高曼環境獎。"},
     {en:"An activist is a person who tries hard to make the world a better place.",zh:"社運人士是努力讓世界變得更好的人。"}]}
]},
{id:"w16",week:16,book:"Wonders 4.3-4",title:"Remembering Hurricane Katrina",pages:"p.12-14",words:[
{w:"assign",pos:"verb",forms:"assign · assigned · assigned",zh:"分派；指派",keys:["assigned","assign"],
 def:"to give out as a task",defZh:"把任務分派出去",
 ex:[{en:"The teacher assigned the student extra homework because he was late.",zh:"老師因為那個學生遲到，指派了額外的功課給他。"},
     {en:"Then everyone of us was assigned a specific task.",zh:"接著我們每個人都被分派了一項特定的任務。"}]},
{w:"generosity",pos:"noun",forms:"",zh:"慷慨；大方",keys:["generosity"],
 def:"willingness and happiness to share",defZh:"樂於並且樂意分享",
 ex:[{en:"The man showed his generosity by putting money in the can for charity.",zh:"這位男士把錢投進慈善捐款箱，展現了他的慷慨。"},
     {en:"Grateful parents thanked us for our generosity and complimented our group leaders on how thoughtful and mature we all were.",zh:"感激的家長們感謝我們的慷慨，並稱讚我們的小組長們既體貼又成熟。"}]},
{w:"mature",pos:"adjective",forms:"",zh:"成熟的",keys:["mature"],
 def:"having the qualities of being an adult",defZh:"具備成年人特質的",
 ex:[{en:"Tom's father said that he was mature enough to take the train by himself.",zh:"Tom的爸爸說他已經夠成熟，可以自己搭火車了。"},
     {en:"Grateful parents thanked us for our generosity and complimented our group leaders on how thoughtful and mature we all were.",zh:"感激的家長們感謝我們的慷慨，並稱讚我們的小組長們既體貼又成熟。"}]},
{w:"gingerly",pos:"adverb",forms:"",zh:"小心翼翼地",keys:["gingerly"],
 def:"in a careful way",defZh:"以謹慎的方式",
 ex:[{en:"The girl stepped gingerly into the waves.",zh:"這個女孩小心翼翼地走進海浪裡。"},
     {en:"I gingerly eased my car into the suddenly busy traffic.",zh:"我小心翼翼地把車開進突然變擁擠的車流裡。"}]},
{w:"organization",pos:"noun",forms:"",zh:"組織；機構",keys:["organizations","organization"],
 def:"a group of people who join together for a purpose",defZh:"一群人為了某個目的而組成的團體",
 ex:[{en:"Students signed up for information about recycling organizations.",zh:"學生們報名索取有關資源回收機構的資訊。"},
     {en:"We agreed to spread the word to our schools and other organizations.",zh:"我們同意把消息傳達給我們的學校和其他機構。"}]},
{w:"resident",pos:"noun",forms:"",zh:"居民",keys:["residents","resident"],
 def:"a person who lives in a particular place",defZh:"住在某個特定地方的人",
 ex:[{en:"Mrs. Seals enjoyed talking with the residents of the nursing home.",zh:"Seals太太很喜歡和安養院的居民聊天。"},
     {en:"Hurricane Katrina destroyed their homes and possessions, and they lost everything they owned, so now they are temporary residents of the Astrodome.",zh:"卡崔娜颶風摧毀了他們的家園和財物，讓他們一無所有，現在他們暫時成為太空巨蛋的居民。"}]},
{w:"scatter",pos:"verb",forms:"scatter · scattered · scattered",zh:"散開；分散",keys:["scattered","scatter"],
 def:"to spread or to be thrown about",defZh:"散布開來或被四處拋灑",
 ex:[{en:"The sheep were scattered across the meadow.",zh:"羊群散布在草地上。"},
     {en:"The sky became a darker shade of gray, and raindrops were soon scattered across my windshield.",zh:"天空變成更深的灰色，雨滴很快就灑滿了我的擋風玻璃。"}]},
{w:"selective",pos:"adjective",forms:"",zh:"挑剔的；有選擇性的",keys:["selective"],
 def:"very careful with making choices",defZh:"在做選擇時非常小心謹慎",
 ex:[{en:"Tina was selective about choosing only the freshest fruits and vegetables.",zh:"Tina挑選蔬果時非常挑剔，只選最新鮮的。"},
     {en:"People tried to speak to her, but she was being selective about whom she wanted to interview.",zh:"有人想跟她說話，但她對想採訪的對象很挑剔。"}]},
{w:"torrential",pos:"adjective",forms:"",zh:"猛烈的；傾盆的",keys:["torrential"],
 def:"a lot of liquid or rain falling in a short time",defZh:"短時間內有大量液體或雨水落下",
 ex:[{en:"Torrential rains caused a series of landslides in the mountains.",zh:"傾盆大雨在山區引發了一連串的土石流。"},
     {en:"A torrential downpour of rain began beating against my windshield.",zh:"一陣傾盆大雨開始猛烈拍打著我的擋風玻璃。"}]},
{w:"ferocious",pos:"adjective",forms:"",zh:"兇猛的",keys:["ferocious"],
 def:"strong and uses a lot of force, or cruel",defZh:"強壯且使用很大力氣，或是殘忍的",
 ex:[{en:"The man was attacked by a pack of ferocious, stray dogs.",zh:"這名男子被一群兇猛的流浪狗攻擊。"},
     {en:"The ferocious storm caused untold amounts of damage.",zh:"這場猛烈的暴風造成了難以估計的損害。"}]}
]},
{id:"w17",week:17,book:"Wonders 4.3-4",title:"Remembering Hurricane Katrina",pages:"p.12-14",words:[
{w:"glance",pos:"verb",forms:"glance · glanced · glanced",zh:"瞥；匆匆一看",keys:["glancing","glanced","glance"],
 def:"to take a quick look at something or someone",defZh:"快速看一下某個東西或某個人",
 ex:[{en:"I glanced at the clock to see if it was time for lunch yet.",zh:"我瞥了一眼時鐘，看看是不是到午餐時間了。"},
     {en:"Glancing at the boxes of clothes in the back of the backseat, I smiled to myself.",zh:"瞥了一眼後座那些裝衣服的箱子，我對自己笑了笑。"}]},
{w:"downpour",pos:"noun",forms:"",zh:"傾盆大雨",keys:["downpour"],
 def:"a heavy rain",defZh:"很大的雨",
 ex:[{en:"We got soaked in the sudden downpour, so we had to run inside to stay dry.",zh:"我們被突如其來的傾盆大雨淋濕了，只好跑進屋裡躲雨。"},
     {en:"A torrential downpour of rain began beating against my windshield as lightning flickered across the sky.",zh:"一陣傾盆大雨開始猛烈拍打著我的擋風玻璃，天空中閃電不斷。"}]},
{w:"Gulf Coast",pos:"noun",forms:"",zh:"墨西哥灣沿岸",keys:["Gulf Coast"],
 def:"the coastline along the Southern United States where they meet the Gulf of Mexico",defZh:"美國南部與墨西哥灣相接的海岸線",
 ex:[{en:"My family went on vacation to the Gulf Coast, where we played on the sandy beaches.",zh:"我家人去墨西哥灣沿岸度假，我們在沙灘上玩耍。"},
     {en:"Hurricane Katrina slammed into the Gulf Coast of the United States.",zh:"卡崔娜颶風重創了美國的墨西哥灣沿岸。"}]},
{w:"Astrodome",pos:"noun",forms:"",zh:"太空巨蛋（休士頓的體育館）",keys:["Astrodome"],
 def:"a place in Houston, Texas where large crowds go to watch live sports games",defZh:"德州休士頓的一個地方，許多人聚集在那裡觀看現場體育比賽",
 ex:[{en:"The Astrodome is a big stadium in Texas where people used to watch baseball games.",zh:"太空巨蛋是德州一座很大的體育館，人們曾在那裡看棒球比賽。"},
     {en:"A reporter stood inside the Houston Astrodome surrounded by thousands of people.",zh:"一名記者站在休士頓太空巨蛋裡，周圍被成千上萬的人群包圍。"}]},
{w:"tropical",pos:"adjective",forms:"",zh:"熱帶的",keys:["tropical"],
 def:"about the middle of the world that has warm or hot weather throughout the year",defZh:"指世界中間地帶，全年氣候溫暖或炎熱",
 ex:[{en:"Colorful frogs live in tropical rainforests, where it is warm and rainy.",zh:"色彩繽紛的青蛙住在熱帶雨林裡，那裡溫暖多雨。"},
     {en:"The storm had formed in hot and humid tropical weather and then traveled north.",zh:"這場風暴在炎熱潮濕的熱帶氣候中形成，接著往北移動。"}]},
{w:"volunteer",pos:"noun",forms:"",zh:"志工；志願者",keys:["volunteer"],
 def:"a person who does a job without being paid for it",defZh:"不支薪工作的人",
 ex:[{en:"My mom is a volunteer at the school library.",zh:"我媽媽是學校圖書館的志工。"},
     {en:"The next day, my friends joined me at our volunteer club \u2013 and together we devised a plan.",zh:"隔天，我的朋友們加入了我們的志工社，我們一起想出了一個計畫。"}]},
{w:"anxious",pos:"adjective",forms:"",zh:"焦慮的；擔心的",keys:["anxious"],
 def:"afraid or nervous about what may happen",defZh:"對可能發生的事感到害怕或緊張",
 ex:[{en:"I usually feel anxious before assessments.",zh:"我在考試前通常會感到焦慮。"},
     {en:"Anxious to get started, we made lists of what we needed to do.",zh:"我們急切地想開始，於是列出了需要做的事情清單。"}]},
{w:"overflowing",pos:"adjective",forms:"",zh:"滿溢的",keys:["overflowing"],
 def:"very full, spilling from one space into another",defZh:"非常滿，從一個空間溢出到另一個空間",
 ex:[{en:"The overflowing toy box had so many toys that they spilled onto the floor.",zh:"這個滿到溢出來的玩具箱裝了太多玩具，都掉到地上了。"},
     {en:"Three days later, after a Herculean effort on our part, the donation bins were overflowing with new toys.",zh:"三天後，經過我們超乎尋常的努力，捐贈箱裡的新玩具已經滿到溢出來了。"}]},
{w:"grateful",pos:"adjective",forms:"",zh:"感激的",keys:["grateful"],
 def:"feeling thankful for the good things in your life",defZh:"對生命中美好的事物感到感謝",
 ex:[{en:"I felt grateful when my friend shared her markers with me in art class.",zh:"美術課時，朋友把她的彩色筆分享給我，我感到很感激。"},
     {en:"Grateful parents thanked us for our generosity and complimented our group leaders on how thoughtful and mature we all were.",zh:"感激的家長們感謝我們的慷慨，並稱讚我們的小組長們既體貼又成熟。"}]},
{w:"donation",pos:"noun",forms:"",zh:"捐贈；捐款",keys:["donations","donation"],
 def:"a gift someone gives to a cause they believe in",defZh:"某人為了自己相信的理念而給予的禮物",
 ex:[{en:"Our class collected a donation of canned food to help people in need.",zh:"我們班收集了罐頭食品捐給有需要的人。"},
     {en:"\u201CDo you have the donations?\u201D",zh:"「你有那些捐贈物資嗎？」"}]}
]},
{id:"w3",week:3,book:"Wonders 4.1-2",title:"Dollars and Sense",pages:"p.64-67",words:[
{w:"compassionate",pos:"adjective",forms:"",zh:"有同情心的；富有同情心的",keys:["compassionate"],
 def:"feeling or showing care for others",defZh:"對他人感到或表現出關懷",
 ex:[{en:"I could tell he is a compassionate and caring person by the way he hugs his sister.",zh:"從他擁抱妹妹的方式，我看得出他是一個有同情心又體貼的人。"},
     {en:"A compassionate company knows that making money is not the only way to measure success.",zh:"一家有同情心的公司知道，賺錢並不是衡量成功的唯一方式。"}]},
{w:"enterprise",pos:"noun",forms:"",zh:"事業；企業",keys:["enterprise"],
 def:"something difficult or important that a person plans or tries to do",defZh:"一個人計畫或嘗試去做的困難或重要的事",
 ex:[{en:"Starting a white water rafting business was an exciting new enterprise for Tom.",zh:"開一家泛舟公司對Tom來說是一項令人興奮的新事業。"},
     {en:"In 1990, the company launched a new enterprise: charity.",zh:"1990年，這家公司展開了一項新事業：慈善。"}]},
{w:"exceptional",pos:"adjective",forms:"",zh:"傑出的；特別優秀的",keys:["exceptional"],
 def:"talented or great at something",defZh:"在某方面有才華或表現優異",
 ex:[{en:"Monica is an exceptional and talented flute player.",zh:"Monica是一位傑出又有才華的長笛演奏者。"},
     {en:"The restaurant in Hollywood, Florida, worked with some exceptional students from two Florida high schools.",zh:"位於佛羅里達州好萊塢的這家餐廳，與兩所佛州高中的幾位傑出學生合作。"}]},
{w:"fund",pos:"noun",forms:"",zh:"資金",keys:["funds","fund"],
 def:"money that is ready to use",defZh:"隨時可以使用的錢",
 ex:[{en:"Nicole's class held a bake sale to raise funds to buy books for the library.",zh:"Nicole的班級舉辦烘焙義賣，來為圖書館籌募買書的資金。"},
     {en:"One way the company raises funds for charity is by selling a line of T-shirts.",zh:"這家公司為慈善籌款的方法之一，是銷售一系列T恤。"}]},
{w:"innovative",pos:"adjective",forms:"",zh:"創新的",keys:["innovative"],
 def:"new or done in a new way",defZh:"新的，或以新的方式完成的",
 ex:[{en:"Sam enjoyed trying out the new innovative racing wheelchair.",zh:"Sam很喜歡試用這款創新的競速輪椅。"},
     {en:"Mycoskie immediately set up his innovative one-for-one program.",zh:"Mycoskie立刻建立了他那項創新的「買一捐一」計畫。"}]},
{w:"process",pos:"noun",forms:"",zh:"過程",keys:["process"],
 def:"the steps of making or doing something",defZh:"製作或完成某事的步驟",
 ex:[{en:"An important step in the process of making a pie is to roll out the crust.",zh:"做派的過程中，一個重要的步驟是把派皮擀開。"},
     {en:"The process starts with rock stars designing the art that goes on the shirts.",zh:"這個過程從搖滾明星設計要印在衣服上的圖案開始。"}]},
{w:"routine",pos:"noun",forms:"",zh:"例行公事；固定習慣",keys:["routine"],
 def:"a fixed way or method of doing something",defZh:"做某件事的固定方式或方法",
 ex:[{en:"Brittany loved the daily routine of walking her dog.",zh:"Brittany很喜歡每天遛狗的例行活動。"},
     {en:"Blake Mycoskie wanted a break from his usual routine.",zh:"Blake Mycoskie想要從平常的例行公事中休息一下。"}]},
{w:"undertaking",pos:"noun",forms:"",zh:"任務；事業",keys:["undertaking"],
 def:"something someone decides to do or start",defZh:"某人決定去做或開始的事",
 ex:[{en:"Cleaning up Tim's messy bedroom was going to be a big undertaking.",zh:"打掃Tim凌亂的房間將會是一項大工程。"},
     {en:"For this new undertaking, Mycoskie started the business using his own money.",zh:"為了這項新事業，Mycoskie用自己的錢創立了這家公司。"}]},
{w:"success",pos:"noun",forms:"",zh:"成功",keys:["success"],
 def:"the result of getting what you wanted",defZh:"得到你想要的東西的結果",
 ex:[{en:"The basketball player's success is partly because he is very tall.",zh:"這位籃球員的成功，部分是因為他身材很高。"},
     {en:"A compassionate company knows that making money is not the only way to measure success.",zh:"一家有同情心的公司知道，賺錢並不是衡量成功的唯一方式。"}]},
{w:"foundation",pos:"noun",forms:"",zh:"基金會",keys:["foundation"],
 def:"a group that helps people in need or collects money to do good things",defZh:"一個幫助有需要的人，或募集金錢做好事的團體",
 ex:[{en:"His foundation helps people in poor countries grow food.",zh:"他的基金會幫助貧窮國家的人種植糧食。"},
     {en:"The foundation grants wishes to children with serious medical problems.",zh:"這個基金會幫罹患重病的孩子實現願望。"}]}
]},
{id:"w4",week:4,book:"Wonders 4.1-2",title:"Dollars and Sense",pages:"p.64-67",words:[
{w:"measure",pos:"verb",forms:"measure · measured · measured",zh:"測量",keys:["measured","measure"],
 def:"to find out the size, length, or weight of something",defZh:"找出某樣東西的大小、長度或重量",
 ex:[{en:"In math class, we learned how to measure the length of our desks with a ruler.",zh:"在數學課上，我們學會用尺測量桌子的長度。"},
     {en:"A compassionate company knows that making money is not the only way to measure success.",zh:"一家有同情心的公司知道，賺錢並不是衡量成功的唯一方式。"}]},
{w:"inventive",pos:"adjective",forms:"",zh:"有創意的",keys:["inventive"],
 def:"to be creative, or good at thinking up new ideas",defZh:"有創造力，或擅長想出新點子",
 ex:[{en:"My friend was very inventive and used cardboard boxes to build a spaceship for our game.",zh:"我朋友很有創意，用紙箱幫我們的遊戲搭了一艘太空船。"},
     {en:"For this new inventive undertaking, Mycoskie started the business using his own money.",zh:"為了這項創新的事業，Mycoskie用自己的錢創立了這家公司。"}]},
{w:"model",pos:"verb",forms:"model · modeled · modeled",zh:"依照…設計；仿照",keys:["modeled","model"],
 def:"to follow a pattern or an example",defZh:"依循某種模式或範例",
 ex:[{en:"Many amusement park rides are modeled on famous movies and cartoon characters.",zh:"許多遊樂園的遊樂設施都是仿照知名電影和卡通角色設計的。"},
     {en:"The slip-on shoes are modeled on shoes that are traditionally worn by Argentine workers.",zh:"這款便鞋是仿照阿根廷工人傳統穿的鞋子設計的。"}]},
{w:"traditionally",pos:"adverb",forms:"",zh:"傳統上",keys:["traditionally"],
 def:"something that has been done a certain way by a family, or a group of people for a long time",defZh:"一個家庭或一群人長期以來以某種方式做的事",
 ex:[{en:"Traditionally, people give red envelopes with money inside during Chinese New Year holidays.",zh:"傳統上，人們在農曆新年期間會送裝有錢的紅包。"},
     {en:"The slip-on shoes are modeled on shoes that are traditionally worn by Argentine workers.",zh:"這款便鞋是仿照阿根廷工人傳統穿的鞋子設計的。"}]},
{w:"donate",pos:"verb",forms:"donate · donated · donated",zh:"捐贈",keys:["donated","donate"],
 def:"the action of giving something \u2013 like goods, time or money \u2013 to help people that are suffering",defZh:"給予東西（例如物品、時間或金錢）以幫助受苦的人的行為",
 ex:[{en:"I donated all my old toys to one of the orphanages in Taichung city.",zh:"我把所有舊玩具捐給了台中市的一間孤兒院。"},
     {en:"By 2016, TOMS had donated over 60 million pairs.",zh:"到2016年為止，TOMS已經捐出了超過六千萬雙鞋。"}]},
{w:"expand",pos:"verb",forms:"expand · expanded · expanded",zh:"擴大；膨脹",keys:["expanded","expand"],
 def:"the action of making, or getting bigger",defZh:"使某物變大，或變大的動作",
 ex:[{en:"When you blow air into a balloon, it will expand and get bigger.",zh:"當你把空氣吹進氣球裡，它就會膨脹變大。"},
     {en:"The company has expanded to sell eyeglasses.",zh:"這家公司已經擴大業務，開始銷售眼鏡。"}]},
{w:"program",pos:"noun",forms:"",zh:"計畫；方案",keys:["program"],
 def:"a plan of action to reach a certain goal or goals",defZh:"為達成某個目標而制定的行動計畫",
 ex:[{en:"Our class has a reading program where students can earn prizes for the number of books they read.",zh:"我們班有一個閱讀計畫，學生可以依照讀書的數量獲得獎品。"},
     {en:"In a similar program, one pair of eyeglasses is donated for every pair that is sold.",zh:"在一個類似的計畫中，每賣出一副眼鏡，就會捐出一副眼鏡。"}]},
{w:"bottom line",pos:"phrase",forms:"",zh:"最重要的重點；底線",keys:["bottom line"],
 def:"the most important part of something",defZh:"某件事情中最重要的部分",
 ex:[{en:"Good business is not always about the bottom line.",zh:"好的生意不一定只看最終的獲利底線。"},
     {en:"The bottom line is that doing homework helps you understand what you learned in class.",zh:"重點是，做功課能幫助你理解課堂上學到的東西。"}]},
{w:"motto",pos:"noun",forms:"",zh:"座右銘；標語",keys:["motto"],
 def:"a word, phrase or sentence that is used to describe the purpose or meaning of a group or business",defZh:"用來描述一個團體或企業的目的或意義的字詞、片語或句子",
 ex:[{en:"Its motto is, 'Love All, Serve All'.",zh:"它的座右銘是：「愛所有人，服務所有人」。"},
     {en:"Our class motto is, \u201CAlways try your best and never give up\u201D.",zh:"我們班的座右銘是：「永遠盡力而為，永不放棄」。"}]},
{w:"necessity",pos:"noun",forms:"",zh:"必需品；必要之事",keys:["necessity"],
 def:"something that is necessary or needed",defZh:"必要或需要的東西",
 ex:[{en:"Bringing a pencil to class every day is a necessity because we use it to write.",zh:"每天帶鉛筆來上課是必要的，因為我們要用它來寫字。"},
     {en:"If you own a business, making a profit is a necessity.",zh:"如果你經營一家企業，獲利是必要的事。"}]}
]},
{id:"w5",week:5,book:"Wonders 4.1-2",title:"A World of Change",pages:"p.12-15",words:[
{w:"alter",pos:"verb",forms:"alter · altered · altered",zh:"改變",keys:["altered","alter"],
 def:"to make different or change",defZh:"使不同或改變",
 ex:[{en:"The ocean waves slowly alter the shoreline by carving away the rocks.",zh:"海浪透過侵蝕岩石，慢慢改變了海岸線。"},
     {en:"These activities alter the surface of the earth.",zh:"這些活動改變了地球的表面。"}]},
{w:"collapse",pos:"verb",forms:"collapse · collapsed · collapsed",zh:"倒塌；崩塌",keys:["collapsed","collapse"],
 def:"to fall down or cave in",defZh:"倒下或塌陷",
 ex:[{en:"Flood waters caused the bridge to collapse.",zh:"洪水導致這座橋倒塌。"},
     {en:"They may even completely collapse overtime.",zh:"隨著時間過去，它們甚至可能完全倒塌。"}]},
{w:"crisis",pos:"noun",forms:"",zh:"危機",keys:["crisis"],
 def:"a difficult or dangerous situation",defZh:"困難或危險的處境",
 ex:[{en:"Rescue workers help people during an emergency or a crisis, such as a flood.",zh:"救難人員在緊急狀況或危機（例如洪水）中幫助民眾。"},
     {en:"They have potential to cause a crisis in a community.",zh:"它們有可能在社區裡造成危機。"}]},
{w:"destruction",pos:"noun",forms:"",zh:"破壞；毀滅",keys:["destruction"],
 def:"great damage or ruin",defZh:"巨大的損害或毀壞",
 ex:[{en:"The tornado destroyed buildings and caused a lot of destruction.",zh:"龍捲風摧毀了建築物，造成了嚴重的破壞。"},
     {en:"They are often called natural disasters because of the destruction they cause.",zh:"因為它們造成的破壞，這些常被稱為自然災害。"}]},
{w:"hazard",pos:"noun",forms:"",zh:"危害；隱患",keys:["hazard"],
 def:"something that can cause harm or injury",defZh:"可能造成傷害或受傷的東西",
 ex:[{en:"They can be seen as a hazard to people driving on the street.",zh:"它們可能被視為對開車經過街道的人的一種危害。"},
     {en:"The water was a hazard to the communities.",zh:"這些水對社區來說是一種危害。"}]},
{w:"severe",pos:"adjective",forms:"",zh:"嚴重的；猛烈的",keys:["severe"],
 def:"very harsh or serious",defZh:"非常嚴酷或嚴重",
 ex:[{en:"Severe weather can include very strong winds and heavy rain.",zh:"惡劣的天氣可能包含非常強的風和大雨。"},
     {en:"Others can be quite large and cause severe damage.",zh:"有些規模可能相當大，造成嚴重的損害。"}]},
{w:"substantial",pos:"adjective",forms:"",zh:"相當大的；可觀的",keys:["substantial"],
 def:"great amount or size",defZh:"很大的數量或規模",
 ex:[{en:"We got a substantial amount of snow last night.",zh:"昨晚下了相當大量的雪。"},
     {en:"Deposition by wind can create a substantial landform, such as a sand dune.",zh:"風的堆積作用可以形成相當大的地貌，例如沙丘。"}]},
{w:"unpredictable",pos:"adjective",forms:"",zh:"難以預測的",keys:["unpredictable"],
 def:"not able to tell beforehand",defZh:"無法事先得知",
 ex:[{en:"The unpredictable weather turned suddenly from sun to rain.",zh:"難以預測的天氣突然從晴天變成下雨。"},
     {en:"Still, some disasters are unpredictable and strike without warning.",zh:"儘管如此，有些災害難以預測，會毫無預警地發生。"}]},
{w:"weathering",pos:"noun",forms:"",zh:"風化（作用）",keys:["weathering"],
 def:"the breakdown of rocks due to rain, wind and sun",defZh:"岩石因雨水、風和陽光而分解",
 ex:[{en:"The rain causes weathering of the rocks in the mountain.",zh:"雨水造成了山中岩石的風化。"},
     {en:"Weathering occurs when rain, snow, sun, and wind break down rocks into smaller pieces.",zh:"當雨、雪、陽光和風把岩石分解成更小的碎片時，就會發生風化作用。"}]},
{w:"erosion",pos:"noun",forms:"",zh:"侵蝕（作用）",keys:["erosion"],
 def:"the movement of broken-down rocks caused by weathering",defZh:"風化後的碎石因外力而移動",
 ex:[{en:"The winds cause erosion of the rocks in the desert.",zh:"風造成了沙漠中岩石的侵蝕。"},
     {en:"Erosion occurs when weathered pieces of rock are carried away by water.",zh:"當風化後的碎石被水沖走時，就會發生侵蝕作用。"}]}
]},
{id:"w6",week:6,book:"Wonders 4.1-2",title:"A World of Change",pages:"p.12-15",words:[
{w:"constant",pos:"adjective",forms:"",zh:"持續不變的；不斷的",keys:["constant"],
 def:"something that always stays the same",defZh:"一直保持一樣的事物",
 ex:[{en:"The sound of the clock ticking was a constant noise in the quiet room.",zh:"時鐘滴答的聲音是這個安靜房間裡持續不斷的噪音。"},
     {en:"Actually, our planet is in a constant state of change.",zh:"事實上，我們的星球一直處於不斷變化的狀態。"}]},
{w:"deposition",pos:"noun",forms:"",zh:"沉積（作用）",keys:["deposition"],
 def:"the act of moving pieces of the Earth to other places",defZh:"把地球的碎片搬移到其他地方的行為",
 ex:[{en:"After rivers erode rock and soil, they drop all this material downstream. This process is called deposition.",zh:"河流侵蝕岩石和土壤之後，會把這些物質沉積在下游，這個過程叫做沉積作用。"},
     {en:"Weathering, erosion, and deposition are three natural processes that change the surface of the world.",zh:"風化、侵蝕和沉積是三種改變世界表面的自然作用。"}]},
{w:"landform",pos:"noun",forms:"",zh:"地貌",keys:["landforms","landform"],
 def:"something like a mountain, hill, or valley that formed naturally on the surface of the Earth",defZh:"像山、丘陵或山谷這樣，自然形成在地球表面的東西",
 ex:[{en:"A mountain is a landform that is much higher than the land around it.",zh:"山是一種比周圍土地高出許多的地貌。"},
     {en:"This causes landforms on Earth to get smaller.",zh:"這使得地球上的地貌變得更小。"}]},
{w:"Grand Canyon",pos:"noun",forms:"",zh:"大峽谷",keys:["Grand Canyon"],
 def:"a famous, large, deep river valley in Arizona, America",defZh:"位於美國亞利桑那州、著名又深又大的河谷",
 ex:[{en:"I visited the Grand Canyon with my family last summer.",zh:"去年夏天我和家人一起去了大峽谷。"},
     {en:"The Grand Canyon is an example of the effect of erosion.",zh:"大峽谷是侵蝕作用效果的一個例子。"}]},
{w:"sand dune",pos:"noun",forms:"",zh:"沙丘",keys:["sand dune"],
 def:"something like a hill that is made of sand and piled up high by the wind",defZh:"像小山一樣，由沙子被風堆積而成的東西",
 ex:[{en:"At the beach, we climbed to the top of a big sand dune, and rolled back down.",zh:"在海邊，我們爬到一座大沙丘的頂端，再滾了下來。"},
     {en:"Deposition by wind can create a substantial landform, such as a sand dune.",zh:"風的堆積作用可以形成相當大的地貌，例如沙丘。"}]},
{w:"occur",pos:"verb",forms:"occur · occurred · occurred",zh:"發生",keys:["occurred","occur"],
 def:"to happen, or take place",defZh:"發生，或進行",
 ex:[{en:"Rainbows usually occur after a rainstorm when the sun comes out and shines through the raindrops.",zh:"彩虹通常在暴風雨後、太陽出來透過雨滴照射時出現。"},
     {en:"Unfortunately, people cannot protect the land when fast natural processes occur.",zh:"不幸的是，當快速的自然作用發生時，人們無法保護這片土地。"}]},
{w:"pressure",pos:"noun",forms:"",zh:"壓力",keys:["pressure"],
 def:"something that presses down with a lot of power",defZh:"用很大力量往下壓的東西",
 ex:[{en:"She kicked at the door with her foot, and the pressure was enough to open it.",zh:"她用腳踢門，那股力量足以把門踢開。"},
     {en:"When pressure builds under Earth's surface, hot melted rock called magma is forced upwards.",zh:"當壓力在地表下累積時，稱為岩漿的熾熱融化岩石會被迫向上噴發。"}]},
{w:"predict",pos:"verb",forms:"predict · predicted · predicted",zh:"預測",keys:["predicted","predict"],
 def:"to say what you think is going to happen in the future",defZh:"說出你認為未來會發生的事",
 ex:[{en:"Our teacher asked us to predict what might happen next in the story before she turned the page.",zh:"老師翻頁之前，要我們預測故事接下來可能會發生什麼事。"},
     {en:"Instead, scientists try to predict when these events will occur so that they can warn people.",zh:"相反地，科學家嘗試預測這些事件何時會發生，才能警告民眾。"}]},
{w:"emergency",pos:"noun",forms:"",zh:"緊急狀況",keys:["emergency"],
 def:"something serious that happens suddenly and needs quick action to deal with it",defZh:"突然發生、需要快速處理的嚴重事件",
 ex:[{en:"If there's an emergency like an earthquake, we need to stay calm, and listen to our teacher.",zh:"如果發生像地震這樣的緊急狀況，我們需要保持冷靜，聽老師的指示。"},
     {en:"It is important for communities to have an emergency plan in place so that they can be evacuated quickly.",zh:"社區有一套緊急應變計畫很重要，這樣才能迅速疏散。"}]},
{w:"constantly",pos:"adverb",forms:"",zh:"不斷地；持續地",keys:["constantly"],
 def:"all the time; repeatedly",defZh:"一直；反覆地",
 ex:[{en:"My little brother is so curious about everything, constantly asking questions.",zh:"我弟弟對每件事都很好奇，不斷地問問題。"},
     {en:"The surface of Earth constantly changes through natural processes.",zh:"地球的表面透過自然作用不斷地在改變。"}]}
]},
{id:"w10",week:10,book:"Wonders 4.1-2",title:"Animal Adaptations",pages:"p.126-129",words:[
{w:"camouflaged",pos:"adjective",forms:"",zh:"偽裝的",keys:["camouflaged"],
 def:"hidden by looking like its surroundings",defZh:"因為看起來像周遭環境而被隱藏",
 ex:[{en:"It is hard to see the camouflaged insect because it blends in with the leaf.",zh:"很難看到這隻偽裝的昆蟲，因為牠跟葉子融為一體。"},
     {en:"In this way, they are camouflaged from predators.",zh:"透過這種方式，牠們偽裝起來躲避掠食者。"}]},
{w:"dribble",pos:"verb",forms:"dribble · dribbled · dribbled",zh:"滴落",keys:["dribbles","dribbled","dribble"],
 def:"to flow or let flow in small drops",defZh:"以小水滴的方式流動，或讓其流動",
 ex:[{en:"Water dribbles from the leaky faucet all night.",zh:"水龍頭整晚都在漏水滴落。"},
     {en:"When the melting snow dribbles into the streams, they know that it's time to return up north.",zh:"當融化的雪滴進小溪時，牠們就知道該回到北方了。"}]},
{w:"extraordinary",pos:"adjective",forms:"",zh:"非凡的；不尋常的",keys:["extraordinary"],
 def:"very unusual or special",defZh:"非常不尋常或特別",
 ex:[{en:"The owl has an extraordinary ability to stare for a long time without blinking.",zh:"貓頭鷹有一種不尋常的能力，可以長時間盯著看而不眨眼。"},
     {en:"Imagine living in a place where the average annual temperature is an extraordinary 10 to 20 F.",zh:"想像住在一個年平均氣溫只有華氏10到20度這種極端溫度的地方。"}]},
{w:"poisonous",pos:"adjective",forms:"",zh:"有毒的",keys:["poisonous"],
 def:"harms or kills when something eats, breathes or touches it",defZh:"當某物吃下、吸入或碰觸它時會造成傷害或死亡",
 ex:[{en:"Some wild mushrooms can make you sick because they are poisonous.",zh:"有些野生蘑菇有毒，吃了會讓你生病。"},
     {en:"These include physical traits such as the skunk\u2019s spray animals with bright colors and markings that warn predators that they are poisonous.",zh:"這些包括身體特徵，例如臭鼬的噴霧，以及身上有鮮豔顏色和花紋、用來警告掠食者自己有毒的動物。"}]},
{w:"pounce",pos:"verb",forms:"pounce · pounced · pounced",zh:"撲；猛撲",keys:["pounced","pounce"],
 def:"to jump suddenly onto something and grab it",defZh:"突然跳到某樣東西上並抓住它",
 ex:[{en:"The bobcat likes to pounce on fish in the river.",zh:"這隻山貓喜歡撲向河裡的魚。"},
     {en:"The normally motionless alligator may pounce on them without warning.",zh:"平常靜止不動的短吻鱷可能會毫無預警地撲向牠們。"}]},
{w:"predator",pos:"noun",forms:"",zh:"掠食者",keys:["predator"],
 def:"an animal that lives by hunting other animals for food",defZh:"靠獵捕其他動物為食維生的動物",
 ex:[{en:"A leopard is a fierce predator that can catch most animals that it hunts.",zh:"花豹是一種兇猛的掠食者，能捕捉牠所獵捕的大多數動物。"},
     {en:"They can blast a predator with a horrible-smelling spray produced by the glands under their tails.",zh:"牠們可以用尾巴下方腺體產生的惡臭噴霧攻擊掠食者。"}]},
{w:"prey",pos:"noun",forms:"",zh:"獵物",keys:["prey"],
 def:"an animal that is hunted by another animal",defZh:"被其他動物獵捕的動物",
 ex:[{en:"The Venus flytrap plant traps its prey inside its sticky leaves.",zh:"捕蠅草會把獵物困在牠黏黏的葉子裡。"},
     {en:"However, the animals that visit alligator holes become easy prey.",zh:"然而，造訪短吻鱷洞穴的動物會變成容易捕捉的獵物。"}]},
{w:"vibration",pos:"noun",forms:"",zh:"震動",keys:["vibrations","vibration"],
 def:"fast motions back and forth or up and down",defZh:"快速地前後來回或上下的運動",
 ex:[{en:"Eric plucked his guitar strings, causing vibrations as the strings moved quickly back and forth.",zh:"Eric撥動吉他弦，弦快速地前後移動，產生了震動。"},
     {en:"Some animals can sense the smallest vibrations.",zh:"有些動物能感應到最微小的震動。"}]},
{w:"survive",pos:"verb",forms:"survive · survived · survived",zh:"存活；倖存",keys:["survived","survive"],
 def:"to stay alive",defZh:"保持活著",
 ex:[{en:"Jerry fell out of the tall tree, but he landed on the soft grass and survived.",zh:"Jerry從高高的樹上摔下來，但他落在柔軟的草地上，活了下來。"},
     {en:"Special ways that animals have to survive are called adaptations.",zh:"動物用來生存的特殊方法叫做「適應」。"}]},
{w:"adaptation",pos:"noun",forms:"",zh:"適應（特徵）",keys:["adaptations","adaptation"],
 def:"a change that helps to fit different situations",defZh:"一種能幫助適應不同情況的改變",
 ex:[{en:"The giraffe's long neck is a special adaptation.",zh:"長頸鹿的長脖子是一種特殊的適應特徵。"},
     {en:"Some insects use adaptations to avoid predators.",zh:"有些昆蟲利用適應特徵來躲避掠食者。"}]}
]},
{id:"w11",week:11,book:"Wonders 4.1-2",title:"Animal Adaptations",pages:"p.126-129",words:[
{w:"opposite",pos:"adjective",forms:"",zh:"相反的",keys:["opposite"],
 def:"being totally different from another thing like night and day",defZh:"跟另一樣東西完全不同，就像黑夜和白天",
 ex:[{en:"Black is the opposite of white.",zh:"黑色是白色的相反色。"},
     {en:"If you knew anything about skunks, you would run in the opposite direction!",zh:"如果你了解臭鼬，你就會往相反的方向跑！"}]},
{w:"behavioral",pos:"adjective",forms:"",zh:"行為上的",keys:["behavioral"],
 def:"about how a person or thing should behave in certain situations",defZh:"關於一個人或東西在特定情況下應該有的行為",
 ex:[{en:"The dog got a treat for showing good behavioral habits, like sitting and staying.",zh:"這隻狗因為表現出良好的行為習慣，像是坐下和不亂動，得到了獎勵。"},
     {en:"An adaptation can also be a behavioral trait.",zh:"適應也可以是一種行為特徵。"}]},
{w:"annual",pos:"adjective",forms:"",zh:"一年一度的",keys:["annual"],
 def:"something that happens once a year",defZh:"一年發生一次的事",
 ex:[{en:"Our class' annual Christmas party will be held on Tuesday, December 24th this year.",zh:"我們班一年一度的耶誕派對，今年將在12月24日星期二舉行。"},
     {en:"Imagine living in a place where the average annual temperature is an extraordinary 10 degrees to 20 degrees Fahrenheit.",zh:"想像住在一個年平均氣溫只有華氏10到20度這種極端溫度的地方。"}]},
{w:"compact",pos:"adjective",forms:"",zh:"緊密的；小巧的",keys:["compact"],
 def:"packed, or arranged in such a way that it saves space",defZh:"打包或排列的方式能節省空間",
 ex:[{en:"My lunchbox is small and compact, so it fits easily in my backpack.",zh:"我的便當盒又小又輕巧，可以輕鬆放進我的背包裡。"},
     {en:"They also have compact bodies.",zh:"牠們的身體也很小巧緊實。"}]},
{w:"digest",pos:"verb",forms:"digest · digested · digested",zh:"消化",keys:["digested","digest"],
 def:"to break down food and drink into smaller parts so that the body can use them",defZh:"把食物和飲料分解成更小的部分，讓身體可以利用",
 ex:[{en:"You can't do exercise right after eating a big lunch because your body needs time to digest the food.",zh:"吃完一頓豐盛的午餐後不能馬上運動，因為身體需要時間消化食物。"},
     {en:"The stomach's four chambers are designed to digest lichen.",zh:"這個胃有四個腔室，專門用來消化地衣。"}]},
{w:"tundra",pos:"noun",forms:"",zh:"苔原",keys:["tundra"],
 def:"a place that is large, flat, cold and treeless where it's hard for plants and animals to survive",defZh:"一個廣大、平坦、寒冷又沒有樹木的地方，動植物很難在那裡生存",
 ex:[{en:"The tundra is a cold and snowy place where only a few plants and animals can live.",zh:"苔原是一個寒冷多雪的地方，只有少數動植物能在那裡生存。"},
     {en:"That's why they travel from the tundra to a large forest area, where food is easier to find.",zh:"這就是為什麼牠們會從苔原遷徙到一大片森林地區，那裡比較容易找到食物。"}]},
{w:"phasmid",pos:"noun",forms:"",zh:"竹節蟲",keys:["phasmid"],
 def:"an insect that looks like a stick or a leaf",defZh:"一種看起來像樹枝或葉子的昆蟲",
 ex:[{en:"A phasmid is an insect that looks like a stick or leaf, which helps it hide from predators.",zh:"竹節蟲是一種看起來像樹枝或葉子的昆蟲，這能幫助牠躲避掠食者。"},
     {en:"Can you spot the insect? It is a phasmid.",zh:"你能找到那隻昆蟲嗎？牠是一隻竹節蟲。"}]},
{w:"brutal",pos:"adjective",forms:"",zh:"殘酷的；極其嚴酷的",keys:["brutal"],
 def:"extremely mean or cruel",defZh:"非常刻薄或殘忍",
 ex:[{en:"The hot sun was brutal during our hike, so we made sure to drink lots of water and wear sunscreen.",zh:"健行時炙熱的太陽非常毒辣，所以我們一定要多喝水並擦防曬乳。"},
     {en:"In Florida's vast Everglades ecosystem, the dry season is brutal for many plants and animals.",zh:"在佛羅里達廣大的大沼澤地生態系統中，乾季對許多動植物來說極為嚴酷。"}]},
{w:"marsh",pos:"noun",forms:"",zh:"沼澤",keys:["marshes","marsh"],
 def:"a type of wetland with soil rich in minerals",defZh:"一種土壤富含礦物質的濕地",
 ex:[{en:"We saw frogs in the tall grass when we walked by the marsh near the lake.",zh:"我們經過湖邊的沼澤時，在高高的草叢裡看到了青蛙。"},
     {en:"Alligators have found a way to survive these dry conditions in the freshwater marshes.",zh:"短吻鱷已經找到方法，在淡水沼澤這種乾燥的環境中生存下來。"}]},
{w:"motionless",pos:"adjective",forms:"",zh:"靜止不動的",keys:["motionless"],
 def:"completely still, not moving at all",defZh:"完全靜止，一動也不動",
 ex:[{en:"The cat sat motionless by the window, watching the birds outside.",zh:"這隻貓靜止不動地坐在窗邊，看著外面的鳥。"},

    if(part.length)out.push(part);

}

  try{const r=localStorage.getItem(SKEY);if(r)S=Object.assign(S,JSON.parse(r));}
  catch(e){MEMORY_ONLY=true;}
}
function saveLocalCache(){
  try{localStorage.setItem(SKEY,JSON.stringify(S));}catch(e){MEMORY_ONLY=true;}
}
function withTimeout(p,ms){return Promise.race([p,new Promise(r=>setTimeout(()=>r(null),ms))]);}
async function cloudInit(){
  try{
    if(!window.claude||!window.claude.use){CLOUD_STATE="local";return;}
    const [db,user]=await withTimeout(Promise.all([window.claude.use("db"),window.claude.use("user")]),2500)||[];
    if(!db||!user){CLOUD_STATE="local";return;}
    const uid=await user.id();
    if(!uid){CLOUD_STATE="local";return;}
    const ref=db.doc("data/users/"+uid+"/progress");
    const snap=await ref.get();
    if(snap.exists){
      const body=snap.data()||{};
      let remote=null;try{remote=JSON.parse(body.json||"null");}catch(e){}
      if(remote&&typeof remote==="object"&&(remote._ts||0)>=(S._ts||0)){S=Object.assign({prog:{},book:[],miss:{}},remote);saveLocalCache();}
    }
    CLOUD={ref};CLOUD_STATE="ok";
    if(!snap.exists||(S._ts||0)>0)cloudPush();
  }catch(e){CLOUD=null;CLOUD_STATE="local";}
}
let pushTimer=null,pushing=false,pushAgain=false;
function cloudPush(){
  if(!CLOUD)return;
  clearTimeout(pushTimer);
  pushTimer=setTimeout(async()=>{
    if(pushing){pushAgain=true;return;}
    pushing=true;
    try{await CLOUD.ref.set({json:JSON.stringify(S),updatedAt:Date.now()});}catch(e){}
    pushing=false;
    if(pushAgain){pushAgain=false;cloudPush();}
  },600);
}
function save(){
  S._ts=Date.now();
  saveLocalCache();
  cloudPush();
}

function P(id){
  if(!S.prog[id])S.prog[id]={seen:{},stage:{},tier:{0:false,1:false,2:false},mixedDone:false,mixedQueue:null,mixedTotal:0,best:0};
  const p=S.prog[id];
  p.seen=p.seen||{};p.stage=p.stage||{};
  Object.keys(p.stage).forEach(k=>{
    if(!Array.isArray(p.stage[k])){
      const n=Number(p.stage[k])||0,arr=[];
      for(let i=0;i<6;i++)arr.push(i<n);
      p.stage[k]=arr;
    }
  });
  p.tier=p.tier||{0:false,1:false,2:false};
  if(p.mixedDone===undefined)p.mixedDone=false;
  if(p.mixedQueue===undefined)p.mixedQueue=null;
  if(p.mixedTotal===undefined)p.mixedTotal=0;
  p.best=p.best||0;
  if(!p.recite)p.recite={steps:{},test:false};
  if(!p.rv)p.rv={stage:{},mixQ:null,mixTotal:0,mixedDone:false};
  p.rv.stage=p.rv.stage||{};
  if(!p.mg)p.mg={steps:{},testDone:false,migrated:false};
  if(!p.dc)p.dc={steps:{}};
  p.dc.steps=p.dc.steps||{};
  p.mg.steps=p.mg.steps||{};
  p.recite.steps=p.recite.steps||{};
  return p;
}

/* ==================== 進度計算 ====================
   單字卡 30% + 複習(每字六關*70% + 混合複習全對*30%) 45% + 測驗(三級) 25%
   本課完全通關 = 單字卡看完 + 每字六關全過 + 混合複習全對 + 最終測驗全對
*/
function lessonProg(L0){
  const p=P(L0.id),n=L0.words.length;
  const c=Object.keys(p.seen).length/n;
  let starWords=0;
  for(let i=0;i<n;i++){const arr=p.stage[i]||[];if(arr.filter(Boolean).length>=6)starWords++;}
  const stageRatio=starWords/n;
  let st=.7*stageRatio+.3*(p.mixedDone?1:0);
  if(typeof RECITE!=="undefined"&&RECITE[L0.id]){
    let sum=0;for(let i=0;i<n;i++)sum+=Math.min(p.mg.steps[i]||0,MG_TOTAL);
    st=.7*(sum/(n*MG_TOTAL))+.3*(p.mg.testDone?1:0);
  }
  const tierCount=[0,1,2].filter(t=>p.tier&&p.tier[t]).length;
  const t=tierCount/3;
  let all=.3*Math.min(1,c)+.45*Math.min(1,st)+.25*t;
  let done=c>=1&&st>=1&&p.tier&&p.tier[2];
  let r=null;
  if(L0.week>=10){
    let sum=0;for(let i=0;i<n;i++)sum+=Math.min(p.dc.steps[i]||0,DC_TOTAL);
    r=sum/(n*DC_TOTAL);all=.8*all+.2*r;done=done&&r>=1;
  }
  return {c:Math.min(1,c),st:Math.min(1,st),t,r,all,done};
}

/* ---------- 段考 ＋ 學期總模考 ---------- */
function termWords(ti){
  let out=[];TERMS[ti].forEach(w=>{const l=LESSONS.find(x=>x.week===w);if(l)out=out.concat(l.words.map(x=>({...x,lid:l.id})));});
  return out;
}
function termReady(ti){return TERMS[ti].every(w=>{const l=LESSONS.find(x=>x.week===w);return l&&lessonProg(l).done;});}
function termDone(ti){const w=termWords(ti);const p=P("term"+ti);return w.length>0&&p.best>=w.length;}
function allWords(){let out=[];LESSONS.forEach(l=>out=out.concat(l.words.map(x=>({...x,lid:l.id}))));return out;}
function finalReady(){return SEMESTER_WEEKS.every(w=>{const l=LESSONS.find(x=>x.week===w);return l&&lessonProg(l).done;});}
function finalDone(){const w=allWords();const p=P("final");return w.length>0&&p.best>=w.length;}

function badgeState(){
  const lb=[],mb=[];
  SEMESTER_WEEKS.forEach(w=>{const l=LESSONS.find(x=>x.week===w);
    lb.push({w,exists:!!l,got:l?lessonProg(l).done:false});});
  TERMS.forEach((g,i)=>mb.push({i,label:"段考"+(i+1)+"（W"+g[0]+"-"+g[g.length-1]+"）",got:termDone(i)}));
  const finalGot=finalDone();
  const vb=verbDone();
  const champ=lb.every(b=>b.got)&&mb.every(b=>b.got)&&finalGot&&vb;
  return {lb,mb,finalGot,vb,champ,
    count:lb.filter(b=>b.got).length+mb.filter(b=>b.got).length+(finalGot?1:0)+(vb?1:0)+(champ?1:0)};
}
const TOTAL_BADGES=SEMESTER_WEEKS.length+TERMS.length+1+1+1; // 課程 + 段考 + 總模考 + 動詞三態 + 冠軍
function seasonPct(){
  let sum=0;LESSONS.forEach(l=>sum+=lessonProg(l).all);
  TERMS.forEach((_,i)=>{if(termDone(i))sum+=1;});
  if(finalDone())sum+=1;
  sum+=verbProg().all;
  return sum/(SEMESTER_WEEKS.length+TERMS.length+1+1);
}

/* ==================== 文字工具（單字卡逐字查詢用） ==================== */
function hitSet(keys){const s=new Set();(keys||[]).forEach(k=>k.split(/\s+/).forEach(p=>s.add(p.toLowerCase())));return s;}
function tokenize(text,keys){
  const hs=hitSet(keys);
  return text.replace(/[A-Za-z](?:[A-Za-z'\u2019-]*[A-Za-z])?/g,m=>
    '<span class="tk'+(hs.has(m.toLowerCase())?" hit":"")+'" data-w="'+m+'">'+m+"</span>");
}
function look(tok){
  let t=tok.toLowerCase().replace(/\u2019/g,"'");
  if(GLOSS[t])return GLOSS[t];
  for(const l of LESSONS)for(const w of l.words)
    if(w.w.toLowerCase()===t)return {pos:w.pos,zh:w.zh};
  const tries=[t.replace(/s$/,""),t.replace(/es$/,""),t.replace(/ed$/,""),t.replace(/ing$/,""),t.replace(/'.*$/,"")];
  for(const x of tries)if(x&&GLOSS[x])return GLOSS[x];
  return null;
}

/* ---------- 找出例句中對應的變化形（拼寫題用，例如 grinned / pointed） ---------- */
function findMatch(text,keys){
  const arr=(keys||[]).slice().sort((a,b)=>b.length-a.length);
  for(const k of arr){
    const esc=k.replace(/[-\/\\^$*+?.()|[\]{}]/g,"\\$&");
    const re=new RegExp(k.includes(" ")?("\\b"+esc):("\\b"+esc+"\\w*"),"i");
    const m=text.match(re);
    if(m)return m[0];
  }
  return null;
}
function clozeAnswer(text,keys,fallback){
  const hit=findMatch(text,keys)||fallback;
  if(!hit)return {html:text,answer:fallback||""};
  const re=new RegExp(hit.replace(/[-\/\\^$*+?.()|[\]{}]/g,"\\$&"),"i");
  return {html:text.replace(re,'<span class="gap">'+"_".repeat(Math.max(6,hit.length))+"</span>"),answer:hit};
}
function maskHint(ans){return ans[0]+ans.slice(1).replace(/[A-Za-z]/g,"_");}
