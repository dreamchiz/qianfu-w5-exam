    if(i<l.words.length-1)go({...V,i:i+1});else{toast("單字卡全部看完了 🎉");go({...V,tab:"stage"});}};
}

/* ==================== 題目產生器（共用：複習六關 / 混合複習 / 三級測驗 / 段考 / 總模考 / 錯題本） ==================== */
const TYPE_LABEL={
  e2c:"英翻中（選擇）",
  listen:"聽力（拼字默寫）",
  def_mc:"definition（翻譯選擇）",
  def_fill:"definition（填空 · 中翻英默寫）",
  c2e:"中翻英（填空 · 默寫）",
  sentence_fill:"造句（填空 · 中翻英默寫）"
};
const ALL_TYPES=["e2c","def_mc","c2e","def_fill","sentence_fill","listen"];
function buildQ(d,type,pool,sIdx){
  const others=shuffle(pool.filter(x=>x.w!==d.w)).slice(0,3);
  const mix=()=>shuffle(others.concat([d]));
  const label=TYPE_LABEL[type];
  if(type==="e2c")
    return {label,body:'<p class="qtext big">'+d.w+"</p>",opts:mix().map(o=>({t:o.zh,ok:o.w===d.w})),ans:d.zh,type};
  if(type==="listen")
    return {label,body:'<p class="qtext">🔊 聽聽看，拼出這個字</p>',
      input:true,ans:d.w,type};
  if(type==="def_mc")
    return {label,body:'<p class="qtext">'+d.def+"</p>",opts:mix().map(o=>({t:o.defZh,ok:o.w===d.w})),ans:d.defZh,type};
  if(type==="def_fill")
    return {label,body:'<p class="qtext">'+d.defZh+"</p>",input:true,ans:d.w,type};
  if(type==="c2e")
    return {label,body:'<p class="qtext big">'+d.zh+"</p>",input:true,ans:d.w,type};
  if(type==="sentence_fill"){
    const idx=sIdx!==undefined?sIdx:(Math.random()<.5?0:1);
    const s=d.ex[idx];
    const {html,answer}=clozeAnswer(s.en,d.keys,d.w);
    return {label,body:'<p class="qtext">'+html+'</p>'+
      '<p class="zhtr" style="margin-top:10px;text-align:left;color:var(--soft)">'+s.zh+"</p>",
      input:true,ans:answer,type};
  }
}
function renderQ(q,d,onDone,extra){
  const html=q.input?
    '<div class="spellbox"><input id="sp" autocomplete="off" autocapitalize="off" spellcheck="false" '+
      'placeholder="例如：'+maskHint(String(q.ans))+'">'+(q.type==="listen"?'<button class="btn slim" id="spsay">🔊</button>':"")+'</div>'+
      '<div class="row"><button class="btn gold" id="spgo">送出答案</button></div>'
    :'<div class="opts">'+q.opts.map((o,k)=>'<button class="opt" data-k="'+k+'">'+o.t+"</button>").join("")+"</div>";
  $("#qbox").innerHTML='<div class="paper"><p class="qtype">'+q.label+"</p>"+q.body+"</div>"+html+(extra||"")+'<div id="vd"></div>';
  if(q.type==="listen"){say(d.w);const r=$("#replay");if(r)r.onclick=()=>say(d.w);}
  if(q.input){
    if($("#spsay"))$("#spsay").onclick=()=>say(String(q.ans));
    $("#spgo").onclick=()=>judge((($("#sp").value||"").trim().toLowerCase())===String(q.ans).toLowerCase(),null);
    $("#sp").addEventListener("keydown",e=>{if(e.key==="Enter")$("#spgo").click();});
    setTimeout(()=>{const el=$("#sp");if(el)el.focus();},50);
  }else{
    $("#qbox").querySelectorAll(".opt").forEach(b=>b.onclick=()=>judge(q.opts[+b.dataset.k].ok,b));
  }
  let locked=false;
  function judge(ok,btn){
    if(locked)return;locked=true;
    $("#qbox").querySelectorAll(".opt").forEach((b,k)=>{b.disabled=true;
      if(q.opts[k].ok)b.classList.add("right");else if(b===btn)b.classList.add("wrong");else b.classList.add("fade");});
    const sp=$("#sp");if(sp){sp.disabled=true;sp.style.borderColor=ok?"var(--mint)":"var(--coral)";}
    say(d.w);
    $("#vd").innerHTML='<div class="verdict '+(ok?"ok":"no")+'"><strong>'+
      (ok?"答對了！":"正確答案："+q.ans)+"</strong>"+d.w+" · "+d.zh+" · "+d.def+"</div>"+
      '<div class="row"><button class="btn gold" id="nx">繼續</button></div>';
    $("#nx").onclick=()=>onDone(ok);$("#nx").focus();
  }
}
function addMiss(d){
  const k=d.w.toLowerCase();
  if(!S.miss[k])S.miss[k]={w:d.w,zh:d.zh,pos:d.pos,def:d.def,keys:d.keys,ex:d.ex,defZh:d.defZh,streak:0,n:0};
  S.miss[k].n++;S.miss[k].streak=0;save();
}

/* ==================== 複習：每字六關 + 全課混合複習（錯題優先重考，直到全對） ==================== */
const STAGE_TYPE=["e2c","listen","def_mc","def_fill","c2e","sentence_fill"];
const STAGE_NAME=["英翻中","聽力","definition 翻譯選擇","definition 填空","中翻英默寫","造句填空"];

function paneStage(){
  if(RECITE[V.lid])return paneMerged();
  const l=L(V.lid),p=P(l.id);
  const mixedLabel=p.mixedDone?"🔀 本課單字混合複習（已全對 ✓，可再次練習）"
    :(p.mixedQueue&&p.mixedQueue.length?"🔀 繼續混合複習（優先練錯題，剩 "+p.mixedQueue.length+" 題）"
    :"🔀 本課單字混合複習");
  $("#pane").innerHTML=
    '<div class="row"><button class="btn gold" id="mixed">'+mixedLabel+"</button></div>"+
    '<p class="muted" style="margin:14px 0 10px">每個字六關：'+STAGE_NAME.join(" → ")+
    "。六關全過就亮一顆星；混合複習把全部單字打散一起練，答錯的題目會優先重考，直到全對為止。</p>"+
    l.words.map((d,i)=>{const arr=p.stage[i]||[],passed=arr.filter(Boolean).length;
      return '<button class="wrow '+(passed>=6?"done":"")+'" data-i="'+i+'"><b>'+d.w+"</b> <i>"+d.zh+"</i>"+
        (passed>=6?' <span class="star">⭐</span>':"")+
        '<span class="dots">'+[0,1,2,3,4,5].map(k=>'<s class="'+(arr[k]?"on":"")+'"></s>').join("")+"</span></button>";}).join("");
  $("#pane").querySelectorAll("[data-i]").forEach(b=>b.onclick=()=>runStage(+b.dataset.i));
  $("#mixed").onclick=()=>runMixed(l);
}
function runStage(wi){
  const l=L(V.lid),p=P(l.id),d=l.words[wi];
  p.stage[wi]=p.stage[wi]||[false,false,false,false,false,false];
  let s=p.stage[wi].findIndex(x=>!x);if(s===-1)s=0;
  step();
  function step(){
    if(s>=6){
      $("#pane").innerHTML='<div class="paper result" style="margin-top:16px"><div class="badgebig">⭐</div>'+
        '<div style="font-size:22px;font-weight:800">'+d.w+" 六關全過</div>"+
        '<p class="muted" style="color:var(--soft);margin-top:6px">'+d.zh+"</p></div>"+
        '<div class="row"><button class="btn gold" id="bk">回到複習列表</button></div>';
      $("#bk").onclick=()=>go({...V});
      const allDone=l.words.every((_,i)=>(p.stage[i]||[]).filter(Boolean).length>=6);
      if(allDone)toast("六關都完成了，可以去混合複習或測驗了 🎉");
      return;
    }
    const type=STAGE_TYPE[s];
    const sIdx=type==="sentence_fill"?(Math.random()<.5?0:1):undefined;
    $("#pane").innerHTML='<div class="qhead"><span>複習 · 第 '+(s+1)+" 關 / 6</span><span>"+STAGE_NAME[s]+"</span></div>"+
      '<div style="display:flex;gap:5px;margin-bottom:12px">'+[0,1,2,3,4,5].map(k=>
        '<div class="bar mint" style="flex:1"><i style="width:'+(k<s?100:0)+'%"></i></div>').join("")+"</div>"+
      '<div id="qbox"></div>';
    renderQ(buildQ(d,type,l.words,sIdx),d,ok=>{
      if(ok){p.stage[wi][s]=true;s++;save();}else{addMiss(d);toast("這一關再試一次");}
      step();
    });
  }
}

/* 混合複習：全部單字 × 六種題型 = 一份待清空的佇列，答對就從佇列移除，
   答錯就排回佇列尾端優先再考，直到佇列清空（全對）才算完成，並會持續存檔可中途離開再繼續 */
function buildMixedQueue(l){
  const list=[];
  l.words.forEach((d,wi)=>STAGE_TYPE.forEach(type=>
    list.push(type==="sentence_fill"?{wi,type,sIdx:Math.random()<.5?0:1}:{wi,type})));
  return shuffle(list);
}
function runMixed(l){
  const p=P(l.id);
  if(!p.mixedDone){
    if(!p.mixedQueue||!p.mixedQueue.length){p.mixedQueue=buildMixedQueue(l);p.mixedTotal=p.mixedQueue.length;save();}
    step();
  }else{
    freePractice();
  }
  function step(){
    if(!p.mixedQueue.length){
      p.mixedDone=true;p.mixedQueue=[];save();
      $("#pane").innerHTML='<div class="paper result" style="margin-top:16px"><div class="badgebig">🔀</div>'+
        '<div style="font-size:21px;font-weight:800">混合複習全部答對！</div>'+
        '<p class="muted" style="color:var(--soft);margin-top:6px">全課單字綜合複習已經完全掌握。</p></div>'+
        '<div class="row"><button class="btn gold" id="bk">回到複習列表</button></div>';
      $("#bk").onclick=()=>go({...V});
      toast("混合複習全對，完成！🎉");
      return;
    }
    const item=p.mixedQueue[0],d=l.words[item.wi],remain=p.mixedQueue.length,cleared=p.mixedTotal-remain;
    $("#pane").innerHTML='<div class="qhead"><span>混合複習 · 還剩 '+remain+' 題</span><span>已過 '+cleared+" / "+p.mixedTotal+"</span></div>"+
      '<div class="bar" style="margin-bottom:12px"><i style="width:'+(cleared/p.mixedTotal*100)+'%"></i></div><div id="qbox"></div>';
    renderQ(buildQ(d,item.type,l.words,item.sIdx),d,ok=>{
      p.mixedQueue.shift();
      if(!ok){p.mixedQueue.push(item);addMiss(d);toast("答錯了，這題排回去優先再考");}
      save();step();
    });
  }
  function freePractice(){
    const queue=buildMixedQueue(l),total=queue.length;let i=0,score=0;
    fstep();
    function fstep(){
      if(i>=queue.length)return ffinish();
      const item=queue[i],d=l.words[item.wi];
      $("#pane").innerHTML='<div class="qhead"><span>混合複習（複習用）· 第 '+(i+1)+" / "+total+' 題</span><span>答對 <b>'+score+"</b></span></div>"+
        '<div class="bar" style="margin-bottom:12px"><i style="width:'+(i/total*100)+'%"></i></div><div id="qbox"></div>';
      renderQ(buildQ(d,item.type,l.words,item.sIdx),d,ok=>{if(ok)score++;else addMiss(d);i++;fstep();});
    }
    function ffinish(){
      $("#pane").innerHTML='<div class="paper result" style="margin-top:16px"><div class="badgebig">🔀</div>'+
        '<div class="score">'+score+"<span>/"+total+"</span></div>"+
        '<p style="color:var(--soft);font-size:14px;margin-top:8px">已經完全掌握過混合複習了，這是額外練習，不影響進度。</p></div>'+
        '<div class="row"><button class="btn gold" id="bk">回到複習列表</button></div>';
      $("#bk").onclick=()=>go({...V});
    }
  }
}

/* ==================== 測驗：三級關卡，錯題重考直到全對 ==================== */
const TIER_NAME=["基本測驗","中級測驗","最終測驗"];
const TIER_DESC=[
  "中翻英默寫 ＋ 英翻中選擇 · 20 題",
  "中翻英默寫 ＋ definition 翻譯選擇 ＋ definition 填空 · 30 題",
  "中翻英默寫、英翻中選擇、definition 選擇與填空、兩句造句填空全部混合 · 60 題，全對才算完全通關"
];
function tierQuestions(l,t){
  const list=[];
  if(t===0)l.words.forEach(d=>{list.push({d,type:"c2e"});list.push({d,type:"e2c"});});
  else if(t===1)l.words.forEach(d=>{list.push({d,type:"c2e"});list.push({d,type:"def_mc"});list.push({d,type:"def_fill"});});
  else l.words.forEach(d=>{
    list.push({d,type:"c2e"});list.push({d,type:"e2c"});
    list.push({d,type:"def_mc"});list.push({d,type:"def_fill"});
    list.push({d,type:"sentence_fill",sIdx:0});list.push({d,type:"sentence_fill",sIdx:1});
  });
  return shuffle(list);
}
function paneTest(){
  const l=L(V.lid),p=P(l.id);
  let html='<p class="muted" style="margin:14px 0 10px">三關由易到難，每一關都要全部答對才能過關；答錯的題目會重新排進本場考試，直到全對為止。最終測驗全對，本課才算完全通關。</p>';
  for(let t=0;t<3;t++){
    const locked=t>0&&!p.tier[t-1],done=p.tier[t];
    html+='<button class="wrow '+(done?"done":"")+'"'+(locked?" disabled":"")+
      ' style="'+(locked?"opacity:.45;cursor:default":"")+'" data-t="'+t+'"><b>'+TIER_NAME[t]+"</b> <i>"+TIER_DESC[t]+"</i>"+
      (done?' <span class="star">🏅</span>':locked?' <span>🔒</span>':"")+"</button>";
  }
  $("#pane").innerHTML=html;
  $("#pane").querySelectorAll("[data-t]:not([disabled])").forEach(b=>b.onclick=()=>runTier(+b.dataset.t));
}
function runTier(t){
  const l=L(V.lid),p=P(l.id);
  let queue=tierQuestions(l,t);
  const total=queue.length,seenFirst=new Set(),wrongWords=new Set();
  let firstCorrect=0;
  step();
  function step(){
    if(queue.length===0)return finish();
    const q=queue.shift();
    const key=q.d.w+"|"+q.type+"|"+(q.sIdx||0),firstTime=!seenFirst.has(key);seenFirst.add(key);
    $("#pane").innerHTML='<div class="qhead"><span>'+TIER_NAME[t]+" · 剩餘 "+(queue.length+1)+' 題</span><span>已答對 <b>'+firstCorrect+"</b></span></div><div id=\"qbox\"></div>";
    renderQ(buildQ(q.d,q.type,l.words,q.sIdx),q.d,ok=>{
      if(ok){if(firstTime)firstCorrect++;}
      else{queue.push(q);addMiss(q.d);wrongWords.add(q.d.w);toast("答錯了，這題會再考一次");}
      step();
    });
  }
  function finish(){
    p.tier[t]=true;save();
    const first=Math.round(firstCorrect/total*100);
    $("#pane").innerHTML='<div class="paper result" style="margin-top:16px"><div class="badgebig">🏅</div>'+
      '<div style="font-size:21px;font-weight:800">'+TIER_NAME[t]+" 全部通過！</div>"+
      '<p style="color:var(--soft);font-size:14px;margin-top:8px">'+total+" 題全部答對了（第一次就答對 "+first+"%）。</p>"+
      (wrongWords.size?'<p style="color:var(--soft);font-size:13px;margin-top:6px">這幾個字重考過，已收進錯題本：'+[...wrongWords].join("、")+"</p>":"")+
      "</div>"+'<div class="row"><button class="btn gold" id="bk">回到測驗列表</button></div>';
    $("#bk").onclick=()=>go({...V});
    toast(TIER_NAME[t]+" 通過 🎉");
  }
}

/* ==================== 段考／學期總模考（跨課大範圍測驗，單次計分，滿分才通過） ==================== */
function renderTerm(ti){
  const words=termWords(ti);
  setTop("段考 "+(ti+1)+" · W"+TERMS[ti][0]+"-"+TERMS[ti][TERMS[ti].length-1],true);
  app.innerHTML='<div id="pane"></div>';
  runBigTest(words,"term"+ti,"段考 "+(ti+1));
}
function renderFinalMock(){
  const words=allWords();
  setTop("學期總模考",true);
  app.innerHTML='<div id="pane"></div>';
  runBigTest(words,"final","學期總模考");
}
function runBigTest(words,progKey,title){
  const prog=P(progKey),need=words.length,host=$("#pane");
  const qs=shuffle(words).map(d=>({d,type:shuffle(ALL_TYPES)[0]}));
  let i=0,score=0,combo=0,wrong=[];
  host.innerHTML='<div class="paper result" style="margin-top:16px"><div class="badgebig">🏆</div>'+
    '<div style="font-size:21px;font-weight:800">'+title+"</div>"+
    '<p style="color:var(--soft);font-size:14px;margin:8px 0 0">共 '+qs.length+" 題，目前最佳 "+prog.best+" / "+need+
    "。<br><b>必須滿分才算通過。</b></p></div>"+'<div class="row"><button class="btn gold" id="start">開始作答</button></div>';
  $("#start").onclick=()=>{i=0;score=0;combo=0;wrong=[];step();};
  function step(){
    if(i>=qs.length)return done();
    const q=qs[i],d=q.d;
    host.innerHTML='<div class="qhead"><span>第 '+(i+1)+" / "+qs.length+' 題</span><span>答對 <b>'+score+"</b></span></div>"+
      '<div class="bar" style="margin-bottom:12px"><i style="width:'+(i/qs.length*100)+'%"></i></div><div id="qbox"></div>';
    renderQ(buildQ(d,q.type,words),d,ok=>{
      if(ok){score++;combo++;}else{combo=0;wrong.push(d);addMiss(d);}
      i++;step();
    },combo>=3?'<div class="combo">🔥 連續答對 '+combo+" 題</div>":"");
  }
  function done(){
    if(score>prog.best){prog.best=score;save();}
    const full=score>=need;
    host.innerHTML='<div class="paper result" style="margin-top:16px">'+(full?'<div class="badgebig">🏆</div>':"")+
      '<div class="score">'+score+"<span>/"+qs.length+"</span></div>"+
      '<p style="color:var(--soft);font-size:14px;margin:10px 0 0">'+
      (full?"滿分通過！榮譽已入手。":score/qs.length>=.8?"很接近了，錯的字已放進錯題本。":"再多練習幾次，錯的字已放進錯題本。")+"</p>"+
      (wrong.length?'<div style="text-align:left;border-top:1px solid var(--line);margin-top:16px;padding-top:14px"><h3 style="color:var(--soft)">要再練的字</h3>'+
        wrong.map(d=>'<div style="font-size:15px;margin-bottom:6px"><b>'+d.w+"</b> <span style='color:var(--soft)'>"+d.zh+"</span></div>").join("")+"</div>":"")+
      "</div>"+'<div class="row"><button class="btn gold" id="rt">再測一次</button><button class="btn" id="bkm">回地圖</button></div>';
    $("#rt").onclick=()=>runBigTest(words,progKey,title);$("#bkm").onclick=()=>go({n:"map"});
  }
}

/* ==================== 錯題本 ==================== */
function renderMiss(){
  setTop("錯題本",false);
  const mt=V.mt||"v",gw=gActiveWrong().length;
  const mtabs='<div class="tabs2"><button data-mt="v" aria-pressed="'+(mt==="v")+'">單字（'+Object.keys(S.miss).length+'）</button>'+
    '<button data-mt="g" aria-pressed="'+(mt==="g")+'">文法（'+gw+"）</button></div>";
  if(mt==="g"){
    app.innerHTML="<h2>錯題本</h2>"+mtabs+gMissHtml();
    app.querySelectorAll("[data-mt]").forEach(b=>b.onclick=()=>go({n:"miss",mt:b.dataset.mt}));
    if($("#gdall"))$("#gdall").onclick=()=>gDrill(gActiveWrong(),()=>go({n:"miss",mt:"g"}));
    return;
  }
  const list=Object.values(S.miss);
  app.innerHTML="<h2>錯題本</h2>"+mtabs+
    '<p class="muted">複習、混合複習、測驗、段考、總模考答錯的字都會留在這裡，連續答對兩次才會移除。</p>'+
    (list.length?'<div class="row"><button class="btn gold" id="go">開始反覆練習（'+list.length+" 字）</button></div>"+
      "<div style='margin-top:14px'>"+list.map(m=>'<div class="item"><div class="top"><b>'+m.w+"</b>"+
      "<i>"+m.pos+'</i><em>'+m.zh+"</em></div>"+
      '<p>錯過 '+m.n+" 次 ｜ 目前連續答對 "+m.streak+" / 2</p></div>").join("")+"</div>"
    :'<div class="empty" style="margin-top:16px">目前沒有錯題 👏<br>答錯的字會自動收進這裡</div>');
  app.querySelectorAll("[data-mt]").forEach(b=>b.onclick=()=>go({n:"miss",mt:b.dataset.mt}));
  if(list.length)$("#go").onclick=()=>drill(shuffle(list));
}
function drill(queue){
  setTop("錯題練習",false);
  let i=0;
  step();
  function step(){
    if(i>=queue.length){
      app.innerHTML='<div class="paper result" style="margin-top:20px"><div class="badgebig">🔁</div>'+
        '<div style="font-size:20px;font-weight:800">這一輪練完了</div>'+
        '<p style="color:var(--soft);font-size:14px;margin-top:8px">連續答對兩次的字已經移除。</p></div>'+
        '<div class="row"><button class="btn gold" id="bk">回到錯題本</button></div>';
      $("#bk").onclick=()=>go({n:"miss"});return;
    }

    const pool=LESSONS.flatMap(l=>l.words);
    app.innerHTML='<div class="qhead"><span>第 '+(i+1)+" / "+queue.length+" 字</span><span>連續答對 "+m.streak+"/2</span></div>"+
      '<div id="qbox"></div>';
    renderQ(buildQ(m,shuffle(ALL_TYPES)[0],pool),m,ok=>{
      const k=m.w.toLowerCase();

        else S.miss[k].streak=0;
        save();
      }
      i++;step();
    });
  }
}

/* ==================== 動詞三態總複習（獨立於課程，橫跨全學期） ==================== */
function verbPool(){
  return LESSONS.flatMap(l=>l.words)
    .filter(w=>w.pos==="verb"&&w.forms&&w.forms.includes("·"))
    .map(w=>{
      const parts=w.forms.split("·").map(s=>s.trim());
      return {w:parts[0],zh:w.zh,def:w.def,defZh:w.defZh,base:parts[0],past:parts[1]||parts[0]};
    });
}
function VP(){
  const id="verbforms";
  if(!S.prog[id])S.prog[id]={seen:{},queue:null,queueTotal:0,mixedDone:false,testBest:0};
  const p=S.prog[id];
  p.seen=p.seen||{};
  if(p.queue===undefined)p.queue=null;
  if(p.queueTotal===undefined)p.queueTotal=0;
  if(p.mixedDone===undefined)p.mixedDone=false;
  p.testBest=p.testBest||0;
  return p;
}
function verbProg(){
  const pool=verbPool(),n=pool.length,p=VP();
  const c=n?Object.keys(p.seen).length/n:0;
  const st=p.mixedDone?1:0;
  const t=(n&&p.testBest>=n)?1:0;
  const all=.3*Math.min(1,c)+.4*st+.3*t;
  return {c:Math.min(1,c),st,t,all,done:c>=1&&st>=1&&t>=1,n};
}
function verbDone(){return verbProg().done;}
function verbQ(d){
  return {label:"中翻英默寫（過去式）",
    body:'<p class="qtext">'+d.zh+" → <b>"+d.base+"</b> 的過去式？</p>",
    input:true,ans:d.past,type:"verbform"};
}
function renderVerbs(){
  if(!V.vtab)V.vtab="study";

  setTop("動詞三態總複習",true);

function paneVerbReview(){
  const pool=verbPool(),p=VP();
  if(!p.mixedDone){
    if(!p.queue||!p.queue.length){p.queue=shuffle(pool.map((_,i)=>({i})));p.queueTotal=p.queue.length;save();}
    step();
  }else{
    freePractice();
  }
  function step(){
    if(!p.queue.length){
      p.mixedDone=true;p.queue=[];save();
      $("#pane").innerHTML='<div class="paper result" style="margin-top:16px"><div class="badgebig">🔤</div>'+
        '<div style="font-size:21px;font-weight:800">動詞三態複習全部答對！</div>'+

      $("#bk").onclick=()=>go({...V});
      toast("動詞三態複習完成 🎉");
      return;
    }
    const item=p.queue[0],d=pool[item.i],remain=p.queue.length,cleared=p.queueTotal-remain;
    $("#pane").innerHTML='<div class="qhead"><span>複習 · 還剩 '+remain+' 題</span><span>已過 '+cleared+" / "+p.queueTotal+"</span></div>"+
      '<div class="bar" style="margin-bottom:12px"><i style="width:'+(cleared/p.queueTotal*100)+'%"></i></div><div id="qbox"></div>';
    renderQ(verbQ(d),d,ok=>{
      p.queue.shift();
      if(!ok){p.queue.push(item);toast("答錯了，這題排回去優先再考");}
      save();step();
    });
  }
  function freePractice(){
    const queue=shuffle(pool.map((_,i)=>({i}))),total=queue.length;let i=0,score=0;
    fstep();
    function fstep(){
      if(i>=queue.length)return ffinish();
      const item=queue[i],d=pool[item.i];
      $("#pane").innerHTML='<div class="qhead"><span>複習（複習用）· 第 '+(i+1)+" / "+total+' 題</span><span>答對 <b>'+score+"</b></span></div>"+
        '<div class="bar" style="margin-bottom:12px"><i style="width:'+(i/total*100)+'%"></i></div><div id="qbox"></div>';
      renderQ(verbQ(d),d,ok=>{if(ok)score++;i++;fstep();});
    }
    function ffinish(){
      $("#pane").innerHTML='<div class="paper result" style="margin-top:16px"><div class="badgebig">🔤</div>'+
        '<div class="score">'+score+"<span>/"+total+"</span></div>"+
        '<p style="color:var(--soft);font-size:14px;margin-top:8px">已經完全掌握過動詞三態複習了，這是額外練習，不影響進度。</p></div>'+
        '<div class="row"><button class="btn gold" id="bk">回到列表</button></div>';
      $("#bk").onclick=()=>go({...V});
    }
  }
}
function paneVerbTest(){
  const pool=verbPool(),p=VP();
  $("#pane").innerHTML='<p class="muted" style="margin:14px 0 10px">全部 '+pool.length+' 個動詞的過去式默寫測驗，答錯的題目會重新排進考試，直到全對為止。</p>'+
    '<div class="row"><button class="btn gold" id="go">'+(p.testBest>=pool.length?"✓ 已通過，再測一次":"開始測驗")+"</button></div>";
  $("#go").onclick=()=>runVerbTest(pool,p);
}
function runVerbTest(pool,p){
  let queue=shuffle(pool.map((_,i)=>({i})));
  const total=queue.length,seenFirst=new Set();let firstCorrect=0;
  step();
  function step(){
    if(!queue.length)return finish();
    const item=queue.shift(),d=pool[item.i];
    const firstTime=!seenFirst.has(item.i);seenFirst.add(item.i);
    $("#pane").innerHTML='<div class="qhead"><span>動詞三態測驗 · 剩餘 '+(queue.length+1)+' 題</span><span>已答對 <b>'+firstCorrect+"</b></span></div><div id=\"qbox\"></div>";
    renderQ(verbQ(d),d,ok=>{
      if(ok){if(firstTime)firstCorrect++;}
      else{queue.push(item);toast("答錯了，這題會再考一次");}
      step();
    });
  }
  function finish(){
    p.testBest=total;save();
    const first=Math.round(firstCorrect/total*100);
    $("#pane").innerHTML='<div class="paper result" style="margin-top:16px"><div class="badgebig">🏅</div>'+
      '<div style="font-size:21px;font-weight:800">動詞三態測驗全部通過！</div>'+
      '<p style="color:var(--soft);font-size:14px;margin-top:8px">'+total+" 題全部答對了（第一次就答對 "+first+"%）。</p></div>"+
      '<div class="row"><button class="btn gold" id="bk">回到列表</button></div>';
    $("#bk").onclick=()=>go({...V});
    toast("動詞三態測驗通過 🎉");
  }
}

const RC_TEXTS=["def","ex0","ex1"];
const RC_KINDS=["card","mean","order","hint","full"];
function rcSteps(){const s=[{k:"kw"}];RC_TEXTS.forEach(t=>RC_KINDS.forEach(k=>s.push({k,t})));return s;}
const RC_TOTAL=rcSteps().length;
const RC_KIND_NAME={kw:"關鍵字",card:"看懂",mean:"意思",order:"意群排序",hint:"看提示默寫",full:"看中文默寫"};
function rcText(d,t){return t==="def"?d.def:d.ex[+t.slice(2)].en;}
function rcZh(d,t){return t==="def"?d.defZh:d.ex[+t.slice(2)].zh;}
function rcChunks(l,d,t){const r=RECITE[l.id][d.w];return t==="def"?r.def:r.ex[+t.slice(2)];}
function rcLabel(t){return t==="def"?"DEFINITION":"SENTENCE "+(+t.slice(2)+1);}
function rcTok(s){return String(s).toLowerCase().replace(/[\u2018\u2019]/g,"'").replace(/[^a-z0-9'\-]+/g," ")
  .split(" ").map(x=>x.replace(/^['\-]+|['\-]+$/g,"")).filter(Boolean);}
function rcSame(a,b){const x=rcTok(a),y=rcTok(b);return x.length===y.length&&x.every((w,i)=>w===y[i]);}
function rcMask(s){let i=0;return s.replace(/[A-Za-z0-9](?:[A-Za-z0-9'\u2019-]*[A-Za-z0-9])?/g,m=>{
  const k=i++;if(k%2===0||m.length<2)return m;return m[0]+"_".repeat(m.length-1);});}
function rcDiff(expText,gotText){
  const e=rcTok(expText),g=rcTok(gotText),n=e.length,m=g.length;
  const dp=Array.from({length:n+1},()=>new Array(m+1).fill(0));
  for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)dp[i][j]=e[i]===g[j]?dp[i+1][j+1]+1:Math.max(dp[i+1][j],dp[i][j+1]);
  const okE=new Array(n).fill(false),okG=new Array(m).fill(false);let i=0,j=0;
  while(i<n&&j<m){if(e[i]===g[j]){okE[i]=okG[j]=true;i++;j++;}else if(dp[i+1][j]>=dp[i][j+1])i++;else j++;}
  return {miss:e.filter((_,k)=>!okE[k]),extra:g.filter((_,k)=>!okG[k])};
}
function rcFeedback(expText,gotText){
  const {miss,extra}=rcDiff(expText,gotText);
  return '<div style="margin-top:6px">正確：'+expText+"</div>"+
    (miss.length?'<div style="margin-top:6px">漏掉或寫錯：<span class="rcmiss">'+miss.join("、")+"</span></div>":"")+
    (extra.length?'<div style="margin-top:4px">多寫或拼錯：<span class="rcmiss">'+extra.join("、")+"</span></div>":"");
}
function rcMC(headHtml,promptHtml,opts,ci,explain,cb){

function runRecite(wi){
  const l=L(V.lid),p=P(l.id),rc=p.recite,d=l.words[wi],steps=rcSteps();
  let s=rc.steps[wi]||0;if(s>=RC_TOTAL)s=0;
  next();
  function advance(){s++;rc.steps[wi]=Math.max(rc.steps[wi]||0,s);save();next();}
  function head(){const st=steps[s];
    return '<div class="qhead"><span>'+d.w+" · 第 "+(s+1)+" 步 / "+RC_TOTAL+"</span><span>"+
      (st.t?rcLabel(st.t)+" · ":"")+RC_KIND_NAME[st.k]+"</span></div>"+
      '<div class="bar mint" style="margin-bottom:12px"><i style="width:'+(s/RC_TOTAL*100)+'%"></i></div>';}
  function next(){
    if(s>=RC_TOTAL){
      $("#pane").innerHTML='<div class="paper result" style="margin-top:16px"><div class="badgebig">⭐</div>'+
        '<div style="font-size:22px;font-weight:800">'+d.w+" 背誦完成</div>"+
        '<p style="color:var(--soft);margin-top:6px">definition 和兩句例句都會寫了。</p></div>'+
        '<div class="row"><button class="btn gold" id="bk">回到背誦列表</button></div>';
      $("#bk").onclick=()=>go({...V});
      if(l.words.every((_,i)=>(rc.steps[i]||0)>=RC_TOTAL))toast("全部字都背完了，可以去背誦測驗 🎉");
      return;
    }
    const st=steps[s];
    ({kw:doKw,card:doCard,mean:doMean,order:doOrder,hint:doWrite,full:doWrite})[st.k](st);
  }
  function doKw(){
    const all=Object.values(RECITE[l.id]).flatMap(r=>r.kw);
    let queue=shuffle(RECITE[l.id][d.w].kw.slice());
    ask();
    function ask(){
      if(!queue.length)return advance();
      const [en,zh]=queue[0];
      const others=shuffle(all.filter(k=>k[1]!==zh).map(k=>k[1]).filter((v,i,a)=>a.indexOf(v)===i)).slice(0,3);
      const opts=shuffle(others.concat([zh]));
      say(en);
      rcMC(head()+'<p class="muted" style="margin:-4px 0 8px;font-size:13px">還剩 '+queue.length+" 個關鍵字</p>",
        '<p class="qtype">這個字是什麼意思？</p><p class="qtext big">'+en+"</p>",
        opts,opts.indexOf(zh),en+" = "+zh,ok=>{const x=queue.shift();if(!ok)queue.push(x);ask();});

      '<div style="font-size:11px;color:#A2988C;letter-spacing:.1em;margin-bottom:4px">'+rcLabel(st.t)+" · 一塊一塊看懂</div>"+
      ch.map(c=>'<div class="rcrow"><div class="en">'+tokenize(c[0],d.keys)+'</div><div class="zhtr">'+c[1]+"</div></div>").join("")+
      '<div class="blk"><div class="lab">完整</div><div class="en">'+tokenize(txt,d.keys)+'</div><div class="zhtr">'+rcZh(d,st.t)+"</div>"+
      '<button class="spk" id="sy">🔊 唸整句</button></div></div>'+
      '<p class="muted" style="font-size:13px;margin-top:10px">不懂的字直接點，會出現中文。念出聲跟著唸兩次再按下一步。</p>'+
      '<div class="row"><button class="btn gold" id="ok">我懂了，下一步</button></div>';
    $("#sy").onclick=e=>{e.stopPropagation();say(txt);};
    say(txt);
    $("#ok").onclick=advance;
  }
  function doMean(st){
    const txt=rcText(d,st.t),zh=rcZh(d,st.t),isDef=st.t==="def";
    const pool=l.words.flatMap(w=>isDef?[w.defZh]:w.ex.map(e=>e.zh)).filter(z=>z!==zh).filter((v,i,a)=>a.indexOf(v)===i);
    const opts=shuffle(shuffle(pool).slice(0,3).concat([zh]));

        '<div class="chips ans" id="ca">'+(ans.length?ans.map((i,k)=>'<button class="chip" data-a="'+k+'">'+ch[i]+"</button>").join(""):'<span class="ph">依序點下面的意群</span>')+"</div>"+

    }

      $("#pane").querySelectorAll(".chip").forEach(b=>b.disabled=true);
      say(rcText(d,st.t));
      $("#vd").innerHTML='<div class="verdict '+(ok?"ok":"no")+'"><strong>'+(ok?"順序正確！":"順序不對")+"</strong>"+

  function doWrite(st){

    rcWrite(head(),prompt,txt,st.k==="hint",ok=>{if(ok)advance();else doWrite(st);});
  }
}

function runReciteTest(){
  const l=L(V.lid),p=P(l.id),rc=p.recite;
  let queue=[];
  l.words.forEach((d,wi)=>["def","ex0","ex1","d2w"].forEach(m=>queue.push({wi,m})));
  queue=shuffle(queue);
  const total=queue.length,wrongSet=new Set();let firstOk=0;const seen=new Set();
  step();
  function head(){const done=total-queue.length;
    return '<div class="qhead"><span>背誦測驗 · 還剩 '+queue.length+" 題</span><span>已過 "+done+" / "+total+"</span></div>"+
      '<div class="bar" style="margin-bottom:12px"><i style="width:'+(done/total*100)+'%"></i></div>';}
  function step(){
    if(!queue.length){
      rc.test=true;save();
      $("#pane").innerHTML='<div class="paper result" style="margin-top:16px"><div class="badgebig">🏅</div>'+
        '<div style="font-size:21px;font-weight:800">背誦測驗全部通過！</div>'+
        '<p style="color:var(--soft);font-size:14px;margin-top:8px">'+total+" 題全對（第一次就答對 "+Math.round(firstOk/total*100)+"%）。</p>"+
        (wrongSet.size?'<p style="color:var(--soft);font-size:13px;margin-top:6px">重考過的字：'+[...wrongSet].join("、")+"</p>":"")+"</div>"+
        '<div class="row"><button class="btn gold" id="bk">回到背誦列表</button></div>';
      $("#bk").onclick=()=>go({...V});
      toast("背誦測驗通過 🎉");return;
    }
    const it=queue[0],d=l.words[it.wi],key=it.wi+it.m,first=!seen.has(key);seen.add(key);
    const done=ok=>{const x=queue.shift();if(ok){if(first)firstOk++;}else{queue.push(x);wrongSet.add(d.w);}step();};
    if(it.m==="d2w"){
      rcWrite(head(),'<p class="qtype">看 definition，寫出單字</p><p class="qtext">'+d.def+"</p>",d.w,false,done);
    }else if(it.m==="def"){
      rcWrite(head(),'<p class="qtype">寫出這個字的 definition</p><p class="qtext big">'+d.w+"</p>",d.def,false,done);
    }else{
      const e=d.ex[+it.m.slice(2)];
      rcWrite(head(),'<p class="qtype">看中文，寫出整句英文例句</p><p class="qtext">'+e.zh+"</p>",e.en,false,done);
    }
  }
}

/* ==================== 新版複習（有背誦資料的課：目標字＋definition/例句裡的生字） ====================
   每個字 6 關：生字英翻中 → 聽英文選中文 → 看中文選發音 → 生字中翻英默寫 → 句子翻譯選擇 → 多格填空
   每關題目全部答對才過（答錯排到後面重考）。全部字過關後做混合複習（全課所有生字與句子打散）。
*/
const RV_STAGES=["e2c","listen","c2audio","c2e","trans","cloze"];
const RV_NAME={e2c:"生字英翻中",listen:"聽英文選中文",c2audio:"看中文選發音",c2e:"生字中翻英默寫",trans:"句子翻譯選擇",cloze:"多格填空"};
const RV_STOP=new Set("the a an of to in is are and or for with that it on by at as be was has had we you i my our his her its this not all can will one they what how every when into over from who where your their them than then some any".split(" "));
function rvItems(l,wi){const d=l.words[wi],r=RECITE[l.id][d.w];
  return [{en:d.w,zh:d.zh,target:true}].concat(r.kw.map(([en,zh])=>({en,zh,target:false})));}
function rvAllItems(l){return l.words.flatMap((_,wi)=>rvItems(l,wi));}
function rvPick(pool,exclude,n){return shuffle(pool.filter(x=>!exclude.includes(x)).filter((v,i,a)=>a.indexOf(v)===i)).slice(0,n);}
function rvBlanks(l,wi,t){
  const d=l.words[wi],r=RECITE[l.id][d.w],txt=rcText(d,t);
  const toks=[...txt.matchAll(/[A-Za-z0-9](?:[A-Za-z0-9'\u2019-]*[A-Za-z0-9])?/g)].map(m=>({w:m[0],i:m.index,lw:m[0].toLowerCase().replace(/\u2019/g,"'")}));
  const tg=hitSet(d.keys),kw=new Set(r.kw.flatMap(k=>rcTok(k[0])));
  let pick=[];
  toks.forEach((x,k)=>{if(tg.has(x.lw))pick.push(k);});
  toks.forEach((x,k)=>{if(kw.has(x.lw)&&!pick.includes(k))pick.push(k);});
  if(pick.length<2){
    toks.map((x,k)=>({x,k})).filter(o=>!pick.includes(o.k)&&o.x.w.length>=4&&!RV_STOP.has(o.x.lw)&&!/^\d+$/.test(o.x.w))
      .sort((a,b)=>b.x.w.length-a.x.w.length).slice(0,2-pick.length).forEach(o=>pick.push(o.k));
  }
  pick=pick.slice(0,4).sort((a,b)=>a-b);
  return {txt,toks,pick};
}
function rvBook(it){
  if(it.target)return;
  if(!S.book.some(b=>b.w.toLowerCase()===it.en.toLowerCase())){S.book.push({w:it.en,zh:it.zh,pos:""});save();}
}
function rvAsk(l,q,head,cb){
  const d=l.words[q.wi];
  const miss=()=>{if(q.k==="item"){const it=rvItems(l,q.wi)[q.ii];if(it.target)addMiss(d);else rvBook(it);}else addMiss(d);};
  const done=ok=>{if(!ok)miss();cb(ok);};
  if(q.k==="item"){
    const it=rvItems(l,q.wi)[q.ii],all=rvAllItems(l);
    const sameZh=all.filter(x=>x.zh===it.zh).map(x=>x.en),sameEn=all.filter(x=>x.en===it.en).map(x=>x.zh);
    if(q.type==="e2c"||q.type==="listen"){
      const opts=shuffle(rvPick(all.map(x=>x.zh),sameEn,3).concat([it.zh]));
      const prompt=q.type==="e2c"
        ?'<p class="qtype">英翻中：選出正確的中文</p><p class="qtext big">'+it.en+'</p><button class="spk" id="rs">🔊</button>'
        :'<p class="qtype">聽英文，選出正確的中文</p><p class="qtext big">🔊</p><button class="spk" id="rs">再聽一次</button>';
      rcMC(head,prompt,opts,opts.indexOf(it.zh),it.en+" = "+it.zh,done);
      $("#rs").onclick=()=>say(it.en);say(it.en);
      return;
    }
    if(q.type==="c2audio"){
      const opts=shuffle(rvPick(all.map(x=>x.en),sameZh,3).concat([it.en]));
      let sel=-1,locked=false;
      $("#pane").innerHTML=head+'<div class="paper"><p class="qtype">看中文，選出正確的發音（點選項會播放）</p><p class="qtext big">'+it.zh+"</p></div>"+
        '<div class="opts">'+opts.map((o,k)=>'<button class="opt" data-k="'+k+'">🔊 發音 '+"ABCD"[k]+"</button>").join("")+"</div>"+
        '<div class="row"><button class="btn gold" id="rgo" disabled>確定選這個</button></div><div id="vd"></div>';
      const bs=[...$("#pane").querySelectorAll(".opt")];
      bs.forEach(b=>b.onclick=()=>{if(locked)return;sel=+b.dataset.k;say(opts[sel]);
        bs.forEach(x=>x.classList.toggle("sel",x===b));$("#rgo").disabled=false;});
      $("#rgo").onclick=()=>{
        if(locked||sel<0)return;locked=true;const ok=opts[sel]===it.en;
        bs.forEach((x,k)=>{x.disabled=true;x.classList.remove("sel");x.textContent="發音 "+"ABCD"[k]+"："+opts[k];
          if(opts[k]===it.en)x.classList.add("right");else if(k===sel)x.classList.add("wrong");else x.classList.add("fade");});
        $("#rgo").disabled=true;
        $("#vd").innerHTML='<div class="verdict '+(ok?"ok":"no")+'"><strong>'+(ok?"答對了！":"再想想")+"</strong>"+it.zh+" = "+it.en+"</div>"+
          '<div class="row"><button class="btn gold" id="nx">繼續</button></div>';
        $("#nx").onclick=()=>done(ok);
      };
      return;
    }
    if(q.type==="c2e"){
      $("#pane").innerHTML=head+'<div class="paper"><p class="qtype">中翻英：寫出英文</p><p class="qtext big">'+it.zh+"</p></div>"+
        '<div class="spellbox"><input id="sp" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="例如：'+maskHint(it.en)+'"></div>'+
        '<div class="row"><button class="btn gold" id="spgo">送出答案</button></div><div id="vd"></div>';
      let locked=false;
      const go=()=>{if(locked)return;const v=$("#sp").value||"";if(!v.trim()){toast("先寫寫看");return;}locked=true;
        const ok=rcSame(it.en,v);$("#sp").disabled=true;$("#sp").style.borderColor=ok?"var(--mint)":"var(--coral)";say(it.en);
        $("#vd").innerHTML='<div class="verdict '+(ok?"ok":"no")+'"><strong>'+(ok?"答對了！":"正確答案："+it.en)+"</strong>"+it.zh+" = "+it.en+"</div>"+
          '<div class="row"><button class="btn gold" id="nx">繼續</button></div>';
        $("#nx").onclick=()=>done(ok);};
      $("#spgo").onclick=go;$("#sp").addEventListener("keydown",e=>{if(e.key==="Enter")go();});
      setTimeout(()=>{const e=$("#sp");if(e)e.focus();},50);
      return;
    }
  }
  /* ----- 句子題 ----- */
  const isDef=q.t==="def",txt=rcText(d,q.t),zh=rcZh(d,q.t);
  const kind=l.words.flatMap(w=>isDef?[{en:w.def,zh:w.defZh}]:w.ex.map(e=>({en:e.en,zh:e.zh})));
  if(q.type==="trans"){
    const toZh=Math.random()<.5;
    if(toZh){
      const opts=shuffle(rvPick(kind.map(x=>x.zh),[zh],3).concat([zh]));
      rcMC(head,'<p class="qtype">'+(isDef?"definition":"例句")+'翻譯：選出正確的中文</p><p class="qtext">'+txt+'</p><button class="spk" id="rs">🔊</button>',
        opts,opts.indexOf(zh),"正確翻譯："+zh,done);
      $("#rs").onclick=()=>say(txt);
    }else{
      const opts=shuffle(rvPick(kind.map(x=>x.en),kind.filter(x=>x.zh===zh).map(x=>x.en),3).concat([txt]));
      rcMC(head,'<p class="qtype">'+(isDef?"definition":"例句")+'翻譯：選出正確的英文</p><p class="qtext">'+zh+"</p>",
        opts,opts.indexOf(txt),"正確英文："+txt,done);
    }
    return;
  }
  if(q.type==="cloze"){
    const {toks,pick}=rvBlanks(l,q.wi,q.t);
    let html="",pos=0;
    toks.forEach((x,k)=>{html+=txt.slice(pos,x.i);pos=x.i+x.w.length;
      const b=pick.indexOf(k);
      html+=b<0?x.w:'<input class="bl" data-b="'+b+'" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="'+x.w[0]+'" style="width:calc('+(x.w.length+1)+'ch + 14px)">';});
    html+=txt.slice(pos);
    $("#pane").innerHTML=head+'<div class="paper"><p class="qtype">'+(isDef?"definition":"例句")+"多格填空（共 "+pick.length+' 格）</p><p class="qtext" style="line-height:2.1">'+html+"</p>"+
      '<p class="zhtr" style="margin-top:8px">'+zh+"</p></div>"+
      '<div class="row"><button class="btn gold" id="rgo">送出答案</button></div><div id="vd"></div>';
    const ins=[...$("#pane").querySelectorAll(".bl")];
    setTimeout(()=>{if(ins[0])ins[0].focus();},50);
    ins.forEach((el,k)=>el.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();if(ins[k+1])ins[k+1].focus();else $("#rgo").click();}}));
    let locked=false;
    $("#rgo").onclick=()=>{
      if(locked)return;
      if(ins.some(el=>!el.value.trim())){toast("每一格都要填");return;}
      locked=true;const wrong=[];
      ins.forEach(el=>{const x=toks[pick[+el.dataset.b]];const ok=rcSame(x.w,el.value);el.disabled=true;
        el.classList.add(ok?"ok":"bad");if(!ok)wrong.push(el.value.trim()+" → "+x.w);});
      const ok=!wrong.length;say(txt);
      $("#vd").innerHTML='<div class="verdict '+(ok?"ok":"no")+'"><strong>'+(ok?"全部正確！":"有 "+wrong.length+" 格寫錯")+"</strong>"+
        (ok?"":'<div class="rcmiss" style="margin-top:4px">'+wrong.join("、")+"</div>")+'<div style="margin-top:6px">'+txt+"</div></div>"+
        '<div class="row"><button class="btn gold" id="nx">繼續</button></div>';
      $("#nx").onclick=()=>done(ok);
    };
  }
}
function rvStageQs(l,wi,s){
  const type=RV_STAGES[s];
  if(type==="trans"||type==="cloze")return RC_TEXTS.map(t=>({k:"text",wi,t,type}));
  return rvItems(l,wi).map((_,ii)=>({k:"item",wi,ii,type}));
}
function rvMixQueue(l){
  const out=[],wt=["e2c","listen","c2audio","c2e"];
  l.words.forEach((_,wi)=>{
    rvItems(l,wi).forEach((_,ii)=>out.push({k:"item",wi,ii,type:wt[Math.random()*4|0]}));
    RC_TEXTS.forEach(t=>{out.push({k:"text",wi,t,type:"trans"});out.push({k:"text",wi,t,type:"cloze"});});
  });
  return shuffle(out);
}
function paneStage2(){
  const l=L(V.lid),p=P(l.id),rv=p.rv;
  const allStar=l.words.every((_,i)=>(rv.stage[i]||[]).filter(Boolean).length>=6);
  const mixLabel=rv.mixedDone?"🔀 混合複習（已全對 ✓，可再練一輪）"
    :(rv.mixQ&&rv.mixQ.length?"🔀 繼續混合複習（剩 "+rv.mixQ.length+" 題）":"🔀 混合複習（全課生字＋句子打散）");
  $("#pane").innerHTML=
    '<p class="muted" style="margin:14px 0 6px">每個字 6 關，除了這個字本身，也考 definition 和例句裡的生字：<br>'+
      RV_STAGES.map(t=>RV_NAME[t]).join(" → ")+"</p>"+
    '<p class="muted" style="font-size:12px;margin:0 0 12px">每關全部答對才過。答錯的生字會自動加入生字本。</p>'+
    l.words.map((d,i)=>{const a=rv.stage[i]||[],n=a.filter(Boolean).length,cnt=rvItems(l,i).length;
      return '<button class="wrow '+(n>=6?"done":"")+'" data-i="'+i+'"><b>'+d.w+"</b> <i>＋"+(cnt-1)+" 個生字</i>"+
        (n>=6?' <span class="star">⭐</span>':"")+
        '<span class="dots">'+[0,1,2,3,4,5].map(k=>'<s class="'+(a[k]?"on":"")+'"></s>').join("")+"</span></button>";}).join("")+
    '<div class="row"><button class="btn gold" id="mixed"'+(allStar||rv.mixedDone?"":" disabled")+">"+
      (allStar||rv.mixedDone?mixLabel:"🔒 混合複習（全部字過關後開放）")+"</button></div>";
  $("#pane").querySelectorAll("[data-i]").forEach(b=>b.onclick=()=>runStage2(+b.dataset.i));
  if(allStar||rv.mixedDone)$("#mixed").onclick=()=>runMixed2(l);
}
function runStage2(wi){
  const l=L(V.lid),p=P(l.id),rv=p.rv,d=l.words[wi];
  rv.stage[wi]=rv.stage[wi]||[false,false,false,false,false,false];
  let s=rv.stage[wi].findIndex(x=>!x);if(s<0)s=0;
  let queue=shuffle(rvStageQs(l,wi,s));
  step();
  function head(){
    return '<div class="qhead"><span>複習 · 第 '+(s+1)+" 關 / 6 · 還剩 "+queue.length+" 題</span><span>"+RV_NAME[RV_STAGES[s]]+"</span></div>"+
      '<div style="display:flex;gap:5px;margin-bottom:12px">'+[0,1,2,3,4,5].map(k=>
        '<div class="bar mint" style="flex:1"><i style="width:'+(k<s?100:0)+'%"></i></div>').join("")+"</div>";
  }
  function step(){
    if(!queue.length){
      rv.stage[wi][s]=true;save();s++;
      if(s>=6){
        $("#pane").innerHTML='<div class="paper result" style="margin-top:16px"><div class="badgebig">⭐</div>'+
          '<div style="font-size:22px;font-weight:800">'+d.w+" 六關全過</div>"+
          '<p style="color:var(--soft);margin-top:6px">這個字和句子裡的生字都複習完了。</p></div>'+
          '<div class="row"><button class="btn gold" id="bk">回到複習列表</button></div>';
        $("#bk").onclick=()=>go({...V});
        if(l.words.every((_,i)=>(rv.stage[i]||[]).filter(Boolean).length>=6))toast("全部字過關，可以做混合複習了 🎉");
        return;
      }
      toast("第 "+s+" 關完成！");
      queue=shuffle(rvStageQs(l,wi,s));
    }
    rvAsk(l,queue[0],head(),ok=>{const x=queue.shift();if(!ok)queue.push(x);step();});
  }
}
function runMixed2(l){
  const p=P(l.id),rv=p.rv,persist=!rv.mixedDone;
  let queue;
  if(persist){if(!rv.mixQ||!rv.mixQ.length){rv.mixQ=rvMixQueue(l);rv.mixTotal=rv.mixQ.length;save();}queue=rv.mixQ;}
  else queue=rvMixQueue(l);
  const total=persist?rv.mixTotal:queue.length;
  step();
  function step(){
    if(!queue.length){
      if(persist){rv.mixedDone=true;rv.mixQ=[];save();}
      $("#pane").innerHTML='<div class="paper result" style="margin-top:16px"><div class="badgebig">🔀</div>'+
        '<div style="font-size:21px;font-weight:800">混合複習全部答對！</div>'+
        '<p style="color:var(--soft);margin-top:6px">'+(persist?"全課生字和句子都掌握了。":"這是額外練習，不影響進度。")+"</p></div>"+
        '<div class="row"><button class="btn gold" id="bk">回到複習列表</button></div>';
      $("#bk").onclick=()=>go({...V});return;
    }
    const cleared=total-queue.length;
    const head='<div class="qhead"><span>混合複習 · 還剩 '+queue.length+' 題</span><span>已過 '+cleared+" / "+total+"</span></div>"+
      '<div class="bar" style="margin-bottom:12px"><i style="width:'+(cleared/total*100)+'%"></i></div>';
    rvAsk(l,queue[0],head,ok=>{const x=queue.shift();if(!ok)queue.push(x);if(persist)save();step();});
  }
}

/* ==================== 複習背誦（整合版） ====================
   每個字 10 步：
   1　生字：目標字＋definition／例句裡的生字，每個字考一題（題型輪替：英翻中、聽英文選中文、看中文選發音、中翻英默寫）
   2-10　definition、例句 1、例句 2 各三步：看懂（意群卡）→ 多格填空 → 看中文默寫整句
   全部字完成後：綜合測驗（每字 1 題生字＋definition 默寫＋隨機一句例句默寫），錯題重考到全對。
*/
function mgSteps(){const s=[{k:"vocab"}];RC_TEXTS.forEach(t=>["card","cloze","full"].forEach(k=>s.push({k,t})));return s;}
const MG_TOTAL=mgSteps().length;
const MG_NAME={vocab:"生字",card:"看懂",cloze:"多格填空",full:"默寫整句"};
const MG_WTYPES=["e2c","listen","c2audio","c2e"];
function mgMigrate(l){
  const p=P(l.id);if(p.mg.migrated)return;
  l.words.forEach((_,i)=>{const a=(p.rv.stage[i]||[]).filter(Boolean).length,r=p.recite.steps[i]||0;
    if(a>=6&&r>=RC_TOTAL)p.mg.steps[i]=MG_TOTAL;});
  if(p.rv.mixedDone&&p.recite.test)p.mg.testDone=true;
  p.mg.migrated=true;save();
}
function mgCard(l,d,t,head,cb){
  const ch=rcChunks(l,d,t),txt=rcText(d,t);
  $("#pane").innerHTML=head+'<div class="fc">'+
    '<div style="font-size:11px;color:#A2988C;letter-spacing:.1em;margin-bottom:4px">'+rcLabel(t)+" · 一塊一塊看懂</div>"+
    ch.map(c=>'<div class="rcrow"><div class="en">'+tokenize(c[0],d.keys)+'</div><div class="zhtr">'+c[1]+"</div></div>").join("")+
    '<div class="blk"><div class="lab">完整</div><div class="en">'+tokenize(txt,d.keys)+'</div><div class="zhtr">'+rcZh(d,t)+"</div>"+
    '<button class="spk" id="sy">🔊 唸整句</button></div></div>'+
    '<p class="muted" style="font-size:13px;margin-top:10px">不懂的字直接點。跟著唸兩次，接下來要填空和默寫。</p>'+
    '<div class="row"><button class="btn gold" id="ok">我懂了，下一步</button></div>';
  $("#sy").onclick=e=>{e.stopPropagation();say(txt);};
  say(txt);
  $("#ok").onclick=cb;
}
function mgFull(d,t,head,cb){
  const txt=rcText(d,t),zh=rcZh(d,t);
  const prompt=t==="def"
    ?'<p class="qtype">寫出這個字的 definition</p><p class="qtext big">'+d.w+'</p><p class="zhtr" style="margin-top:8px">'+zh+"</p>"
    :'<p class="qtype">看中文，寫出整句英文例句</p><p class="qtext">'+zh+"</p>";
  rcWrite(head,prompt,txt,false,cb);
}
function paneMerged(){
  const l=L(V.lid),p=P(l.id);mgMigrate(l);const mg=p.mg;
  const allDone=l.words.every((_,i)=>(mg.steps[i]||0)>=MG_TOTAL);
  $("#pane").innerHTML=
    '<p class="muted" style="margin:14px 0 6px">每個字 '+MG_TOTAL+' 步：先考這個字和句子裡的生字，再把 definition、兩句例句各走一輪「看懂 → 填空 → 默寫」。</p>'+
    '<p class="muted" style="font-size:12px;margin:0 0 12px">默寫要打整句，建議用平板或電腦鍵盤。大小寫和標點不計分。答錯的生字自動加入生字本。</p>'+
    l.words.map((d,i)=>{const n=Math.min(mg.steps[i]||0,MG_TOTAL);
      return '<button class="wrow '+(n>=MG_TOTAL?"done":"")+'" data-i="'+i+'"><b>'+d.w+"</b> <i>"+d.zh+"</i>"+
        (n>=MG_TOTAL?' <span class="star">⭐</span>':"")+
        '<span style="margin-left:auto;font-size:13px;color:var(--soft)">'+n+" / "+MG_TOTAL+"</span></button>";}).join("")+
    '<div class="row"><button class="btn gold" id="mgtest"'+(allDone?"":" disabled")+">"+
      (mg.testDone?"✓ 綜合測驗已通過，再測一次":allDone?"開始綜合測驗":"🔒 綜合測驗（全部字完成後開放）")+"</button></div>";
  $("#pane").querySelectorAll("[data-i]").forEach(b=>b.onclick=()=>runMerged(+b.dataset.i));
  if(allDone)$("#mgtest").onclick=()=>runMergedTest(l);
}
function runMerged(wi){
  const l=L(V.lid),p=P(l.id),mg=p.mg,d=l.words[wi],steps=mgSteps();
  let s=mg.steps[wi]||0;if(s>=MG_TOTAL)s=0;
  next();
  function head(extra){const st=steps[s];
    return '<div class="qhead"><span>複習背誦 · 第 '+(s+1)+" 步 / "+MG_TOTAL+(extra||"")+"</span><span>"+
      (st.t?rcLabel(st.t)+" · ":"")+MG_NAME[st.k]+"</span></div>"+
      '<div class="bar mint" style="margin-bottom:12px"><i style="width:'+(s/MG_TOTAL*100)+'%"></i></div>';}
  function advance(){s++;mg.steps[wi]=Math.max(mg.steps[wi]||0,s);save();next();}
  function next(){
    if(s>=MG_TOTAL){
      $("#pane").innerHTML='<div class="paper result" style="margin-top:16px"><div class="badgebig">⭐</div>'+
        '<div style="font-size:22px;font-weight:800">'+d.w+" 完成</div>"+
        '<p style="color:var(--soft);margin-top:6px">生字、definition 和兩句例句都練完了。</p></div>'+
        '<div class="row"><button class="btn gold" id="bk">回到列表</button></div>';
      $("#bk").onclick=()=>go({...V});
      if(l.words.every((_,i)=>(mg.steps[i]||0)>=MG_TOTAL))toast("全部字完成，可以做綜合測驗了 🎉");
      return;
    }
    const st=steps[s];
    if(st.k==="vocab"){
      const off=Math.random()*4|0;
      let queue=shuffle(rvItems(l,wi).map((_,ii)=>({k:"item",wi,ii,type:MG_WTYPES[(ii+off)%4]})));
      const ask=()=>{if(!queue.length)return advance();
        rvAsk(l,queue[0],head(" · 還剩 "+queue.length+" 題"),ok=>{const x=queue.shift();if(!ok)queue.push(x);ask();});};
      ask();return;
    }
    if(st.k==="card")return mgCard(l,d,st.t,head(),advance);
    if(st.k==="cloze")return rvAsk(l,{k:"text",wi,t:st.t,type:"cloze"},head(),ok=>{if(ok)advance();else next();});
    if(st.k==="full")return mgFull(d,st.t,head(),ok=>{if(ok)advance();else next();});
  }
}
function runMergedTest(l){
  const p=P(l.id),mg=p.mg;
  let queue=[];
  l.words.forEach((d,wi)=>{
    const items=rvItems(l,wi);
    queue.push({k:"vocab",wi,ii:Math.random()*items.length|0,type:MG_WTYPES[Math.random()*4|0]});
    queue.push({k:"full",wi,t:"def"});
    queue.push({k:"full",wi,t:"ex"+(Math.random()*2|0)});
  });
  queue=shuffle(queue);
  const total=queue.length,seen=new Set(),wrongSet=new Set();let firstOk=0;
  step();
  function step(){
    if(!queue.length){
      mg.testDone=true;save();
      $("#pane").innerHTML='<div class="paper result" style="margin-top:16px"><div class="badgebig">🏅</div>'+
        '<div style="font-size:21px;font-weight:800">綜合測驗全部通過！</div>'+
        '<p style="color:var(--soft);font-size:14px;margin-top:8px">'+total+" 題全對（第一次就答對 "+Math.round(firstOk/total*100)+"%）。</p>"+
        (wrongSet.size?'<p style="color:var(--soft);font-size:13px;margin-top:6px">重考過的字：'+[...wrongSet].join("、")+"</p>":"")+"</div>"+
        '<div class="row"><button class="btn gold" id="bk">回到列表</button></div>';
      $("#bk").onclick=()=>go({...V});toast("綜合測驗通過 🎉");return;
    }
    const q=queue[0],d=l.words[q.wi],key=JSON.stringify(q),first=!seen.has(key);seen.add(key);
    const done=total-queue.length;
    const head='<div class="qhead"><span>綜合測驗 · 還剩 '+queue.length+" 題</span><span>已過 "+done+" / "+total+"</span></div>"+
      '<div class="bar" style="margin-bottom:12px"><i style="width:'+(done/total*100)+'%"></i></div>';
    const cb=ok=>{const x=queue.shift();if(ok){if(first)firstOk++;}else{queue.push(x);wrongSet.add(d.w);}step();};
    if(q.k==="vocab")rvAsk(l,{k:"item",wi:q.wi,ii:q.ii,type:q.type},head,cb);
    else mgFull(d,q.t,head,cb);
  }
}

/* ==================== 默寫（Week 10 以後）：給中文，寫出 definition 與例句 ====================
   每個字 6 步，分兩輪：
   第一輪「排序」：definition、例句 1、例句 2 的所有字打散成字卡，依中文排回正確順序
   第二輪「底線」：每個字只給一條底線（不給字母），全部默寫出來
*/
const DC_STEPS=[["def","order"],["ex0","order"],["ex1","order"],["def","blank"],["ex0","blank"],["ex1","blank"]];
const DC_TOTAL=DC_STEPS.length;
function dcText(d,t){return t==="def"?d.def:d.ex[+t.slice(2)].en;}
function dcZh(d,t){return t==="def"?d.defZh:d.ex[+t.slice(2)].zh;}
function dcLabel(t){return t==="def"?"definition":"例句 "+(+t.slice(2)+1);}
function dcPrompt(d,t,mode){
  return '<p class="qtype">'+dcLabel(t)+(mode==="order"?" · 把字卡排成正確的句子":" · 每條底線寫一個字")+"</p>"+
    '<p class="qtext big" style="font-size:24px">'+d.w+"</p>"+
    '<p class="qtext" style="font-size:17px;margin-top:8px">'+dcZh(d,t)+"</p>";
}
function paneDict(){
  const l=L(V.lid),p=P(l.id),dc=p.dc;
  $("#pane").innerHTML=
    '<p class="muted" style="margin:14px 0 6px">看中文，寫出 definition 和兩句例句。每個字兩輪：<br>'+
    '① 排序：句子的字全部打散成字卡，排回正確順序<br>② 底線：每個字一條底線，全部默寫出來</p>'+
    '<p class="muted" style="font-size:12px;margin:0 0 12px">大小寫和標點不計分。默寫建議用平板或電腦鍵盤，打完一個字按空白鍵會跳下一格。</p>'+
    l.words.map((d,i)=>{const n=Math.min(dc.steps[i]||0,DC_TOTAL);
      return '<button class="wrow '+(n>=DC_TOTAL?"done":"")+'" data-i="'+i+'"><b>'+d.w+"</b> <i>"+d.zh+"</i>"+
        (n>=DC_TOTAL?' <span class="star">⭐</span>':"")+
        '<span style="margin-left:auto;font-size:13px;color:var(--soft)">'+n+" / "+DC_TOTAL+"</span></button>";}).join("");
  $("#pane").querySelectorAll("[data-i]").forEach(b=>b.onclick=()=>runDict(+b.dataset.i));
}
function runDict(wi){
  const l=L(V.lid),p=P(l.id),dc=p.dc,d=l.words[wi];
  let s=dc.steps[wi]||0;if(s>=DC_TOTAL)s=0;
  next();
  function head(){const [t,m]=DC_STEPS[s];
    return '<div class="qhead"><span>默寫 · 第 '+(s+1)+" 步 / "+DC_TOTAL+"</span><span>"+(m==="order"?"第一輪 排序":"第二輪 底線")+"</span></div>"+
      '<div class="bar mint" style="margin-bottom:12px"><i style="width:'+(s/DC_TOTAL*100)+'%"></i></div>';}
  function advance(){s++;dc.steps[wi]=Math.max(dc.steps[wi]||0,s);save();next();}
  function next(){
    if(s>=DC_TOTAL){
      $("#pane").innerHTML='<div class="paper result" style="margin-top:16px"><div class="badgebig">⭐</div>'+
        '<div style="font-size:22px;font-weight:800">'+d.w+" 默寫完成</div>"+
        '<p style="color:var(--soft);margin-top:6px">definition 和兩句例句都能默寫了。</p></div>'+
        '<div class="row"><button class="btn gold" id="bk">回到默寫列表</button></div>';
      $("#bk").onclick=()=>go({...V});
      if(l.words.every((_,i)=>(dc.steps[i]||0)>=DC_TOTAL))toast("本課默寫全部完成 🎉");
      return;
    }
    const [t,m]=DC_STEPS[s];
    (m==="order"?dcOrder:dcBlank)(d,t,head(),ok=>{if(ok)advance();else next();});
  }
}
function dcOrder(d,t,headHtml,cb){
  const txt=dcText(d,t),toks=txt.split(/\s+/).filter(Boolean);
  let pool=toks.map((_,i)=>i);
  if(toks.length>1){pool=shuffle(pool);let g=0;while(pool.every((v,i)=>v===i)&&g++<20)pool=shuffle(pool);}
  let ans=[],locked=false;
  draw();
  function draw(){
    $("#pane").innerHTML=headHtml+'<div class="paper">'+dcPrompt(d,t,"order")+"</div>"+
      '<div class="chips ans">'+(ans.length?ans.map((i,k)=>'<button class="chip" data-a="'+k+'">'+toks[i]+"</button>").join(""):'<span class="ph">依序點下面的字卡（點上面的字卡可以退回）</span>')+"</div>"+
      '<div class="chips">'+pool.map((i,k)=>'<button class="chip" data-p="'+k+'">'+toks[i]+"</button>").join("")+"</div>"+
      '<p class="muted" style="font-size:12px;margin-top:8px;text-align:right">'+ans.length+" / "+toks.length+" 個字</p>"+
      '<div id="vd"></div>';
    if(locked)return;
    $("#pane").querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>{ans.push(pool.splice(+b.dataset.p,1)[0]);
      if(!pool.length)check();else draw();});
    $("#pane").querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>{pool.push(ans.splice(+b.dataset.a,1)[0]);draw();});
  }
  function check(){
    locked=true;draw();
    const ok=ans.map(i=>toks[i]).join(" ")===toks.join(" ");
    $("#pane").querySelectorAll(".chip").forEach(b=>b.disabled=true);
    say(txt);
    $("#vd").innerHTML='<div class="verdict '+(ok?"ok":"no")+'"><strong>'+(ok?"順序正確！":"順序不對")+"</strong>"+
      (ok?txt:"正確句子："+txt)+"</div>"+
      '<div class="row"><button class="btn gold" id="nx">'+(ok?"繼續":"再排一次")+"</button></div>";
    $("#nx").onclick=()=>cb(ok);
  }
}
function dcBlank(d,t,headHtml,cb){
  const txt=dcText(d,t);
  const toks=[...txt.matchAll(/[A-Za-z0-9](?:[A-Za-z0-9'’-]*[A-Za-z0-9])?/g)].map(m=>({w:m[0],i:m.index}));
  let html="",pos=0;
  toks.forEach((x,k)=>{html+=txt.slice(pos,x.i);pos=x.i+x.w.length;
    html+='<input class="bl dc" data-b="'+k+'" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" style="width:calc('+(x.w.length+1)+'ch + 10px)">';});
  html+=txt.slice(pos);
  $("#pane").innerHTML=headHtml+'<div class="paper">'+dcPrompt(d,t,"blank")+
    '<p class="qtext" style="font-size:17px;line-height:2.3;text-align:left;margin-top:12px">'+html+"</p></div>"+
    '<div class="row"><button class="btn gold" id="rgo">送出答案</button></div><div id="vd"></div>';
  const ins=[...$("#pane").querySelectorAll(".bl")];
  setTimeout(()=>{if(ins[0])ins[0].focus();},50);
  ins.forEach((el,k)=>{
    el.addEventListener("keydown",e=>{
      if(e.key==="Enter"){e.preventDefault();if(ins[k+1])ins[k+1].focus();else $("#rgo").click();}
      else if(e.key==="Backspace"&&!el.value&&k>0){e.preventDefault();ins[k-1].focus();}
    });
    el.addEventListener("input",()=>{
      if(/\s/.test(el.value)){el.value=el.value.replace(/\s+/g,"");if(ins[k+1])ins[k+1].focus();}
    });
  });
  let locked=false;
  $("#rgo").onclick=()=>{
    if(locked)return;
    if(ins.some(el=>!el.value.trim())){toast("每一格都要寫");return;}
    locked=true;const wrong=[];
    ins.forEach(el=>{const x=toks[+el.dataset.b];const ok=rcSame(x.w,el.value);el.disabled=true;
      el.classList.add(ok?"ok":"bad");if(!ok)wrong.push(el.value.trim()+" → "+x.w);});
    const ok=!wrong.length;say(txt);
    $("#vd").innerHTML='<div class="verdict '+(ok?"ok":"no")+'"><strong>'+(ok?"全部正確！":"有 "+wrong.length+" 個字寫錯")+"</strong>"+
      (ok?"":'<div class="rcmiss" style="margin-top:4px">'+wrong.join("、")+"</div>")+'<div style="margin-top:6px">'+txt+"</div></div>"+
      '<div class="row"><button class="btn gold" id="nx">'+(ok?"繼續":"再寫一次")+"</button></div>";
    $("#nx").onclick=()=>cb(ok);
  };
}

 {id:"ps1",name:"第三人稱單數：動詞怎麼加 s",
  formula:'<b>大部分</b> → +s　<i>read → reads</i><br><b>-ss / -sh / -ch / -x / -o</b> 結尾 → +es　<i>kiss → kisses, go → goes</i><br><b>子音 + y</b> → 去 y 加 ies　<i>study → studies</i><br><b>母音 + y</b> → 只加 s　<i>play → plays</i>',
  why:"-ss、-sh、-ch、-x 結尾直接加 s 唸不出來（kiss-s？），所以中間多一個 e，變成多一個音節 /ɪz/。y 前面是子音（fly 的 l）就把 y 變 i 再加 es；y 前面是母音（play 的 a）就直接加 s。",
  ex:[["He writes a letter.","他寫一封信。"],["She watches TV.","她看電視。"],["A bird flies.","一隻鳥在飛。"],["He stays at home.","他待在家。"]],

        {s:[["He","S","他＝第三人稱單數"],["watch+es","V","-ch 結尾 → +es"],["TV.","O",""]],note:"主詞換成 He，watch 是 -ch 結尾，要加 es。"},
        {s:[["The bird","S","單數"],["fl(y→i)es","V","子音+y → ies"]],note:"fly 的 y 前面是子音 l：去 y 加 ies。"}]},
 {id:"ps2",name:"主詞決定動詞",
  formula:'<b>He / She / It / 一個人或東西</b> + 動詞<b>-s</b><br><b>I / You / We / They / 兩個以上</b> + 動詞<b>原形</b><br>have → <b>has</b>（只有第三人稱單數）',
  why:"英文用動詞尾巴的 -s 提醒你「主詞是一個別人」。所以先找主詞：主詞是一個人／一樣東西（不是 I、you），動詞就要加 s；主詞是很多個（people、the children），動詞就不加。",

  trap:["people、children 看起來沒有 s，但它們是「很多人」→ 動詞用原形","The bus（一台公車）→ leaves，不是 leave","have 的第三人稱單數是 has，不是 haves"],

        {s:[["The children","S","很多孩子＝複數"],["wake up","V","原形"],["at 8.","T","時間"]],note:"children 是 child 的複數 → 動詞用原形。"},
        {s:[["Emily","S","一個人"],["has","V","have → has"],["breakfast.","O",""]],note:"have 遇到第三人稱單數變成 has。"}]},
 {id:"ps3",name:"Do / Does 問句與簡答",
  formula:'<b>Do</b> + I/you/we/they + <b>原形</b>…?<br><b>Does</b> + he/she/it/單數 + <b>原形</b>…?<br>簡答：Yes, he <b>does</b>. ／ No, they <b>don\'t</b>.',

  ex:[["Do you have a large family? Yes, I do.","你家人很多嗎？是的。"],["Does your friend play a sport? Yes, she does.","你朋友有做運動嗎？有。"],["Does Mrs. Smith still work? No, she doesn't.","Smith 太太還在工作嗎？沒有。"],["What time does your English class start?","你的英文課幾點開始？"]],

        {s:[["Yes,","T",""],["she","S","代名詞"],["does.","A","問 Does 答 does"]],note:"簡答：主詞＋does。"}]},

rules:[
 {id:"adv1",name:"形容詞變副詞：加 -ly",
  formula:'<b>大部分</b> → +ly　<i>quick → quickly</i><br><b>-le</b> 結尾 → 去 e 加 y　<i>terrible → terribly</i><br><b>子音 + y</b> → 去 y 加 ily　<i>happy → happily</i><br><b>-l</b> 結尾 → 直接 +ly　<i>careful → carefully</i>（兩個 l）',
  why:"形容詞描述「東西」（a quick runner 快的跑者），副詞描述「動作」（run quickly 跑得快）。英文大多在形容詞後面加 -ly，把它變成描述動作的字。",
  ex:[["He drives carefully.","他開車很小心。"],["She sang happily.","她開心地唱歌。"],["You have to think quickly.","你必須很快思考。"],["The dog was lying lazily in front of the fire.","狗懶洋洋地躺在火爐前。"]],
  trap:["careful → carefully（l 不要少寫）","happy → happily（y 變 i）","terrible → terribly（去 e 加 y，不是 terriblely）"],
  demo:[{s:[["a","O",""],["quick","S","形容詞：描述 runner"],["runner","O","名詞"]],note:"形容詞放在名詞前面，描述「人或東西」。"},
        {s:[["He","S",""],["runs","V","動作"],["quick+ly","A","副詞：描述 runs"]],note:"要描述動作「怎麼跑」→ 用副詞 quickly。"}]},
 {id:"adv2",name:"不規則副詞與形容詞 / 副詞的選擇",
  formula:'<b>good → well</b><br>fast → fast　hard → hard　early → early　late → late（長得一樣）<br>描述<b>名詞</b>或放在 <b>be 動詞後</b> → 形容詞；描述<b>動作</b> → 副詞',
  why:"判斷的方法：問「它在形容誰？」形容人或東西（或接在 is / am / are 後面）用形容詞；形容「做得怎樣」用副詞。所以 The weather is good（形容天氣），但 Julie did very well（形容「做」得好）。",
  ex:[["Julie did very well on the exam.","Julie 考試考得很好。"],["It is important to be honest.","誠實很重要。"],["We had a wonderful holiday.","我們度過了很棒的假期。"],["The weather is so good.","天氣非常好。"]],
  trap:["be 動詞後面接形容詞：to be honest（不是 honestly）","名詞前面用形容詞：a wonderful holiday、a great time","good 是形容詞，副詞是 well"],

        {s:[["Julie","S",""],["did","V","動作"],["very well","A","副詞：做得好"]],note:"描述「做得怎樣」→ 副詞 well。"},
        {s:[["It is important to","O",""],["be","V","be 動詞"],["honest","S","形容詞"]],note:"be 動詞後面接形容詞。"}]},
 {id:"adv3",name:"hard / hardly、late / lately",
  formula:'<b>hard</b> = 努力地　<b>hardly</b> = 幾乎不<br><b>late</b> = 遲、晚　<b>lately</b> = 最近',
  why:"這兩組加了 -ly 之後意思完全變了，不能當成同一個字。",
  ex:[["She tried hard in order to succeed.","她為了成功努力嘗試。"],["They hardly go anywhere without their car.","他們沒有車幾乎哪裡都不去。"],["He arrived late for the meeting.","他開會遲到了。"],["I've read a lot of books lately.","我最近讀了很多書。"]],

 {id:"adv4",name:"副詞的五大類",
  formula:'<b>Manner 方式</b>：怎麼做？carefully, by car<br><b>Place 地點</b>：在哪裡？here, inside, in the street<br><b>Time 時間</b>：什麼時候？yesterday, today, last year<br><b>Frequency 頻率</b>：多常？always, often, never<br><b>Degree 程度</b>：有多…？very, quite, extremely',

        {s:[["Your bag is","V",""],["here","O","Where? 地點"]],note:"問 Where → 地點副詞。"},
        {s:[["I went","V",""],["yesterday","T","When? 時間"]],note:"問 When → 時間副詞。"},
        {s:[["They","S",""],["sometimes","N","How often? 頻率"],["go fishing","V",""]],note:"問 How often → 頻率副詞。"},
        {s:[["She is","V",""],["extremely","N","How much? 程度"],["polite","S",""]],note:"問有多…→ 程度副詞。"}]},

rules:[
 {id:"pp1",name:"過去分詞（p.p.）",
  formula:'<b>規則動詞</b>：+ed　<i>play → played, dance → danced</i><br>　子音+y → ied　<i>try → tried</i>；短母音+子音 → 重複字尾 +ed　<i>stop → stopped</i><br><b>不規則動詞</b>：要背　<i>do → done, take → taken, write → written</i>',
  why:"現在完成式＝ have / has + 過去分詞。過去分詞就是動詞三態的「第三態」，規則動詞和過去式一樣加 -ed；不規則的要一個一個背（單字網站的「動詞三態」就是在練這個）。",
  ex:[["I have done my homework.","我寫完作業了。"],["She has written five emails.","她寫了五封電子郵件。"],["They have built a new house.","他們蓋了一間新房子。"],["He has thrown the ball.","他把球丟出去了。"]],
  trap:["swim → swum（不是 swam）","stop → stopped（p 要重複）","write → written（兩個 t）","hide → hidden","sing → sung、win → won、think → thought"],
  demo:[{s:[["play","V","原形"],["played","A","過去式"],["played","O","過去分詞 p.p."]],note:"規則動詞：過去式和過去分詞一樣，都加 -ed。"},
        {s:[["take","V","原形"],["took","A","過去式"],["taken","O","過去分詞 p.p."]],note:"不規則動詞：第三態要特別背。"}]},
 {id:"pp2",name:"have / has + p.p.：肯定、否定、問句",
  formula:'肯定：I/you/we/they <b>have</b> + p.p.　he/she/it <b>has</b> + p.p.<br>否定：<b>haven\'t / hasn\'t</b> + p.p.<br>問句：<b>Have / Has</b> + 主詞 + p.p.…?<br>簡答：Yes, I <b>have</b>. ／ No, she <b>hasn\'t</b>.',
  why:"have / has 在這裡是「助動詞」：要否定就在它後面加 not，要問問題就把它搬到最前面，後面的過去分詞都不用動。主詞是第三人稱單數用 has，其他用 have。",
  ex:[["Jill has called three times this morning.","Jill 今天早上打了三次電話。"],["I haven't watched a parade since I was twelve.","我從十二歲之後就沒看過遊行了。"],["Have you eaten dinner yet?","你吃晚餐了嗎？"],["Have you seen the fireworks? Yes, I have.","你看過煙火了嗎？看過了。"]],
  trap:["He have ✗ → He has","問句：Have you eaten…? 不是 Did you eaten","簡答用 have / has，不是 do / does"],
  demo:[{s:[["She","S",""],["has","A","助動詞 has"],["eaten","V","p.p."],["dinner.","O",""]],note:"肯定句：主詞 + has + 過去分詞。"},
        {s:[["She","S",""],["hasn't","N","has + not"],["eaten","V","p.p. 不變"],["dinner.","O",""]],note:"否定句：has 後面加 not。"},
        {s:[["Has","A","搬到最前面"],["she","S",""],["eaten","V","p.p."],["dinner?","O",""]],note:"問句：Has 搬到主詞前面。"}]},
 {id:"pp3",name:"時間詞：already / yet / just / ever / never / for / since / so far",
  formula:'<b>already</b> 已經（肯定句）　<b>yet</b> 還沒／了沒（否定、問句，放句尾）<br><b>just</b> 剛剛　<b>ever</b> 曾經（問句）　<b>never</b> 從來沒有<br><b>for</b> + 一段時間（for five years）　<b>since</b> + 起點（since 2008）<br><b>so far</b> 到目前為止　<b>recently</b> 最近　<b>this week / this morning</b>',

  ex:[["I'm not hungry. I've already eaten lunch.","我不餓，我已經吃過午餐了。"],["The bus hasn't left yet.","公車還沒開。"],["James has worked in this company for five years.","James 在這家公司工作五年了。"],["I haven't talked to Jane since Monday.","我從星期一就沒跟 Jane 說話了。"],["She has written five emails so far.","她到目前為止寫了五封電子郵件。"]],

        {s:[["Gerald","S",""],["has been","V",""],["a tour guide","O",""],["for five years.","T","一段時間"]],note:"for + 一段時間。"},

 {id:"pp4",name:"have been (to) vs. have gone (to)",
  formula:'<b>have been (to)</b>：去過，<b>已經回來了</b><br><b>have gone (to)</b>：去了，<b>還在那裡／還沒回來</b>',
  why:"been 是「去過又回來」，所以可以說去過幾次（twice、many times）。gone 是「人已經離開，現在不在這裡」，所以你找不到他。",
  ex:[["The girls aren't home. They have gone out for lunch.","女孩們不在家，她們出去吃午餐了。"],["Sally and Adam have been to the supermarket.","Sally 和 Adam 去過超市（已經回來了）。"],["We have been to the carnival twice.","我們去過嘉年華兩次。"],["I think he has gone to the music festival.","我想他去音樂節了（現在不在）。"]],
  trap:["說「去過幾次」一定用 been：has been to the festival many times","人不在、找不到 → gone：have gone away for the weekend"],
  demo:[{s:[["Robert","S",""],["has gone","V","去了，還沒回來"],["to the festival.","O",""]],note:"現在找不到 Robert → gone。"},
        {s:[["We","S",""],["have been","V","去過，回來了"],["to the carnival","O",""],["twice.","T","兩次"]],note:"去過又回來，還可以數次數 → been。"}]},
 {id:"pp5",name:"什麼時候用現在完成式",
  formula:'① 從過去開始、<b>現在還在繼續</b>　<i>Jon has lived in Manchester since 2008.</i><br>② <b>經驗</b>　<i>He has tried skydiving.</i><br>③ 剛做完、<b>結果現在看得到</b>　<i>He has just finished his project.</i><br>④ 過去發生但<b>沒說是什麼時候</b>　<i>She\'s bought a new mobile phone.</i><br>⑤ 時間還沒結束：today, this week　<i>I have taken two tests this week.</i>',

  ex:[["She has lived in Paris since 2001.","她從 2001 年就住在巴黎（現在還住）。"],["They have just cut the birthday cake.","他們剛切完生日蛋糕。"],["I have sold ten tickets so far this morning.","今天早上到目前為止我賣了十張票。"],["Anna has lost her wallet.","Anna 弄丟了錢包（現在還沒找到）。"]],
  trap:["has just cut＝剛切完（不是正在切）","this morning 還沒過完 → 可能還會再多"],
  demo:[{s:[["She","S",""],["has lived","V","過去 → 現在"],["in Paris","O",""],["since 2001.","T","起點"]],note:"從 2001 年開始住，到現在都還住。"},
        {s:[["Anna","S",""],["has lost","V","結果還在"],["her wallet.","O",""]],note:"弄丟了，到現在都還沒找回來。"}]}
],

GU.push({id:"u4",week:"Week 16",title:"too 和 enough",en:"too – enough",page:"講義 p.46–49",icon:"⚖️",
rules:[
 {id:"te1",name:"too + 形容詞（太…）",
  formula:'<b>too</b> + 形容詞<br><b>too</b> + 形容詞 + <b>to</b> + 原形動詞<br><b>too</b> + 形容詞 + <b>for</b> 人 + <b>to</b> + 原形動詞',
  why:"too 是「太…了」，意思是負面的：比需要的還多，所以「做不到」。This coffee is too hot to drink＝咖啡太燙，喝不下去。句子沒有 not，但意思是「不能」。",
  ex:[["This coffee is too hot to drink.","這杯咖啡太燙了，不能喝。"],["This dress is too short for me to wear.","這件洋裝太短了，我不能穿。"],["I can't buy this watch. It's too expensive.","我不能買這支錶，它太貴了。"],["I'm too tired to finish this report tonight.","我太累了，今晚寫不完這份報告。"]],
  trap:["too 放在形容詞前面：too hot（不是 hot too）","too … to … 本身就是「太…而不能」，後面不要再加 not","too many / too much + 名詞：太多"],
  demo:[{s:[["This coffee","S",""],["is","V",""],["too","N","太"],["hot","O","形容詞"],["to drink.","T","→ 喝不了"]],note:"too + 形容詞 + to + 原形：太燙而不能喝。"},
        {s:[["This dress","S",""],["is","V",""],["too short","N","太短"],["for me","O","對我來說"],["to wear.","T","→ 不能穿"]],note:"中間可以加 for + 人。"}]},
 {id:"te2",name:"形容詞 + enough（夠…）",
  formula:'形容詞 + <b>enough</b> + <b>to</b> + 原形動詞<br>形容詞 + <b>enough</b> + <b>for</b> 人 + <b>to</b> + 原形動詞',
  why:"enough 是「夠」，意思是正面的：剛好達到需要的程度，所以「做得到」。注意 enough 要放在形容詞的「後面」：tall enough、fast enough。",
  ex:[["I'm tall enough to play basketball.","我夠高，可以打籃球。"],["He is fast enough to win the race.","他跑得夠快，可以贏得比賽。"],["The tea is sweet enough for me to drink.","這茶夠甜，我可以喝。"],["My alarm clock isn't loud enough for me to hear.","我的鬧鐘不夠大聲，我聽不到。"]],
  trap:["enough 在形容詞後面：old enough（不是 enough old）","not … enough＝不夠…（所以做不到）"],
  demo:[{s:[["I","S",""],["am","V",""],["tall","O","形容詞"],["enough","A","在後面：夠"],["to play basketball.","T","→ 可以打"]],note:"形容詞 + enough：先說形容詞，再說 enough。"},
        {s:[["My alarm clock","S",""],["isn't","N","不"],["loud","O",""],["enough","A","夠"],["for me to hear.","T",""]],note:"not … enough＝不夠，所以我聽不到。"}]},
 {id:"te3",name:"enough + 名詞",
  formula:'<b>enough</b> + 名詞<br>(not) <b>enough</b> + 名詞 + <b>to</b> + 原形動詞<br>(not) <b>enough</b> + 名詞 + <b>for</b> 人／東西',
  why:"enough 遇到形容詞放後面，遇到名詞就放前面：enough sugar、enough time、enough money。",
  ex:[["Is there enough sugar in my tea?","我的茶裡糖夠嗎？"],["There isn't enough flour.","麵粉不夠。"],["We haven't got enough flour to bake a cake.","我們的麵粉不夠烤蛋糕。"],["There isn't enough flour for the cake.","麵粉不夠做蛋糕。"]],

/* ==================== 文法 Grammar 模組 ==================== */
const GITEM={};
GU.forEach(u=>u.items.forEach(it=>{it.u=u.id;GITEM[it.id]=it;}));
const GRULE={};
GU.forEach(u=>u.rules.forEach(r=>{r.u=u.id;GRULE[r.id]=r;}));
const GPAPER=[["g1-B3","講義"],["g1-C3","講義"],["g1-C4","講義"]];
const GTEST_N=25,GBIG_N=50;

function G(){
  if(!S.gram)S.gram={};
  const g=S.gram;
  g.u=g.u||{};g.wrong=g.wrong||{};g.hist=g.hist||[];
  g.big=g.big||{best:0,passed:false,lastWrong:[]};
  if(!g.seeded){
    GPAPER.forEach(([id,from])=>{if(!g.wrong[id])g.wrong[id]={n:1,streak:0,fixed:false,at:Date.now(),from};});
    g.seeded=1;
  }
  return g;
}
function GUp(uid){
  const g=G();
  if(!g.u[uid])g.u[uid]={};
  const p=g.u[uid];
  p.read=p.read||{};p.sec=p.sec||{};p.rule=p.rule||{};
  p.testBest=p.testBest||0;p.testPassed=!!p.testPassed;p.lastWrong=p.lastWrong||[];
  return p;
}
const GUN=id=>GU.find(u=>u.id===id);
function gUnitItems(uid){return GUN(uid).items;}
function gActiveWrong(uid){
  const w=G().wrong;
  return Object.keys(w).filter(id=>!w[id].fixed&&GITEM[id]&&(!uid||GITEM[id].u===uid));
}
function gAddWrong(id,from){
  const w=G().wrong;
  if(!w[id]||w[id].fixed)w[id]={n:(w[id]?w[id].n:0)+1,streak:0,fixed:false,at:Date.now(),from};
  else{w[id].n++;w[id].streak=0;}
}
function gUnitProg(uid){
  const u=GUN(uid),p=GUp(uid);
  const secKeys=Object.keys(u.secs);
  const r=u.rules.filter(x=>p.read[x.id]).length/u.rules.length;
  const s=secKeys.filter(k=>p.sec[k]&&p.sec[k].done).length/secKeys.length;
  const m=u.rules.filter(x=>p.rule[x.id]&&p.rule[x.id].mastered).length/u.rules.length;
  const t=p.testPassed?1:p.testBest/100*0.8;
  return {r,s,m,t,all:(r+s+m+t)/4,done:p.testPassed&&r===1&&s===1&&m===1};
}
function gramPct(){
  const a=GU.reduce((x,u)=>x+gUnitProg(u.id).all,0)/GU.length;
  return a*0.9+(G().big.passed?0.1:0);
}

/* ---------- 答案比對：大小寫、標點、縮寫都不影響 ---------- */
function gNorm(s){
  s=String(s).toLowerCase().replace(/[‘’`]/g,"'").replace(/<[^>]+>/g," ");
  s=s.replace(/\bcan't\b/g,"can not").replace(/\bcannot\b/g,"can not").replace(/\bwon't\b/g,"will not")
     .replace(/n't\b/g," not").replace(/'re\b/g," are").replace(/'ve\b/g," have").replace(/'m\b/g," am")
     .replace(/'ll\b/g," will").replace(/\b(he|she|it|there|that|what|who|where|here)'s\b/g,"$1 _s");
  s=s.replace(/\b(he|she|it|there|that|what|who|where|here) (is|has)\b/g,"$1 _s");
  s=s.replace(/[^a-z0-9_' ]+/g," ").replace(/\s+/g," ").trim();
  return s;
}
function gMatch(got,ans,pre){
  const g=gNorm(got),alts=String(ans).split("||");
  return alts.some(a=>{const n=gNorm(a);return n===g||(pre&&gNorm(pre+" "+got)===n);});
}
const gFirst=a=>String(a).split("||")[0];

/* ---------- 完整句子（作答後顯示、朗讀用） ---------- */
function gFull(it){
  if(it.f)return gFirst(it.f);
  if(it.t==="slot"){let k=0;return it.q.replace(/\{\}/g,()=>gFirst(it.a[k++])).replace(/\s*\((?:[a-z]+\/)*[a-z ]+\)/gi,"");}
  if(it.t==="mc")return it.q.indexOf("___")>-1&&!it.noq?it.q.replace("___",it.a):it.a;
  return gFirst(it.a);
}
function gSpeak(html){
  return html.replace(/<br\s*\/?>/g," ").replace(/<[^>]+>/g,"").replace(/(^|\s)[A-Za-z]{1,6}:\s/g," ")
    .replace(/[…✓✗]/g," ").replace(/\s+/g," ").trim();
}
function gTk(html){
  return html.split(/(<[^>]+>)/).map(p=>p.charAt(0)==="<"?p:tokenize(p,[])).join("");
}

    const opts=shuffle(it.o);

    box.innerHTML=head+body+'<div id="gvd"></div>';
    box.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{

      finish(ok,got);
    });
    return;
  }
  if(it.t==="slot"){
    let k=0;
    const html=it.q.replace(/\{\}/g,()=>'<input class="bl gin" data-i="'+(k++)+'" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" style="width:9ch;min-width:9ch">');
    body='<div class="paper">'+img+'<div class="qtype">'+ins+'</div><p class="qtext" style="font-size:18px;line-height:2.3;text-align:left">'+html+"</p></div>"+
      '<div class="row"><button class="btn gold" id="ggo">'+(test?"下一題":"送出答案")+"</button></div>";
    box.innerHTML=head+body+'<div id="gvd"></div>';
    const ins2=[...box.querySelectorAll(".gin")];
    ins2.forEach((el,j)=>{
      el.addEventListener("input",()=>{el.style.width=Math.max(9,el.value.length+2)+"ch";});
      el.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();if(ins2[j+1])ins2[j+1].focus();else $("#ggo").click();}});
    });

    $("#ggo").onclick=()=>{

      const vals=ins2.map(el=>el.value.trim());
      const oks=vals.map((v,j)=>gMatch(v,it.a[j]));
      ins2.forEach((el,j)=>{el.disabled=true;if(!test)el.classList.add(oks[j]?"ok":"bad");});
      $("#ggo").disabled=true;
      finish(oks.every(Boolean),vals.join(" / "));
    };
    return;
  }
  if(it.t==="write"){
    body='<div class="paper">'+img+'<div class="qtype">'+ins+'</div><p class="qtext" style="font-size:18px;text-align:left">'+it.q+"</p></div>"+
      '<textarea class="rc-ta" id="gta" autocomplete="off" autocapitalize="sentences" spellcheck="false" placeholder="寫出完整的句子…"></textarea>'+
      '<div class="row"><button class="btn gold" id="ggo">'+(test?"下一題":"送出答案")+"</button></div>";
    box.innerHTML=head+body+'<div id="gvd"></div>';
    setTimeout(()=>{const t=$("#gta");if(t)t.focus();},60);
    $("#ggo").onclick=()=>{
      const v=($("#gta").value||"").trim();if(!v){toast("先寫寫看");return;}
      const ok=gMatch(v,it.a,it.pre);
      $("#gta").disabled=true;$("#ggo").disabled=true;
      if(!test)$("#gta").style.borderColor=ok?"var(--mint)":"var(--coral)";
      finish(ok,v);
    };
    return;

  if(it.t==="order"){
    const toks=it.q.split(" / ").map(s=>s.trim());
    let pool=toks.map((_,i)=>i);pool=shuffle(pool);
    let ans=[],locked=false;
    const draw=()=>{
      box.innerHTML=head+'<div class="paper">'+'<div class="qtype">'+(it.s==="X"?"延伸題 · ":"")+"把字卡排成正確的句子</div>"+
        '<div class="chips ans" style="padding:0;box-shadow:none;min-height:56px">'+(ans.length?ans.map((i,k)=>'<button class="chip" data-a="'+k+'">'+toks[i]+"</button>").join(""):'<span class="ph">依序點下面的字卡（點上面的字卡可以退回）</span>')+"</div></div>"+
        '<div class="chips">'+pool.map((i,k)=>'<button class="chip" data-p="'+k+'">'+toks[i]+"</button>").join("")+"</div>"+
        '<div id="gvd"></div>';
      if(locked){box.querySelectorAll(".chip").forEach(b=>b.disabled=true);return;}
      box.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>{ans.push(pool.splice(+b.dataset.p,1)[0]);
        if(!pool.length){locked=true;draw();const got=ans.map(i=>toks[i]).join(" ");finish(gMatch(got,it.a),got);}else draw();});
      box.querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>{pool.push(ans.splice(+b.dataset.a,1)[0]);draw();});
    };
    draw();
    return;
  }
  function finish(ok,got){
    if(test){o.onDone(ok,got);return;}
    const full=gFull(it),rule=GRULE[it.r];
    const w=G().wrong[it.id];
    $("#gvd").innerHTML='<div class="verdict '+(ok?"ok":"no")+'"><strong>'+(ok?"答對了！":"再想想")+"</strong>"+
      (ok?"":'<div style="margin-top:4px">你的答案：<span class="rcmiss">'+got+"</span></div>")+"</div>"+
      '<div class="paper" style="margin-top:10px"><div class="blk" style="margin-top:0;padding-top:0;border:none">'+
      '<div class="lab">正確句子</div><div class="en">'+gTk(full)+'</div>'+
      '<button class="spk" id="gsay" style="margin-top:6px">🔊 聽一次</button>'+
      (it.zh?'<div class="zhtr">'+it.zh+"</div>":"")+"</div>"+
      (it.w?'<div class="blk"><div class="lab">為什麼</div><div style="font-size:15px;line-height:1.6">💡 '+it.w+"</div></div>":"")+
      (it.p&&w&&w.from==="講義"?'<div class="blk"><div class="lab">講義上的錯</div><div style="font-size:14px;color:var(--coral)">📌 '+(it.p.length<12?"你在講義上寫了「"+it.p+"」":it.p)+"</div></div>":"")+
      (rule?'<div class="blk"><button class="spk" id="grule">📖 看觀念：'+rule.name+"</button></div>":"")+"</div>"+
      '<div class="row"><button class="btn gold" id="gnx">'+(ok?"繼續":"知道了，繼續")+"</button></div>";
    $("#gsay").onclick=()=>say(gSpeak(full));
    if(rule)$("#grule").onclick=e=>{e.stopPropagation();gShowRule(rule);};
    say(gSpeak(full));
    $("#gnx").onclick=()=>o.onDone(ok,got);
    $("#gnx").scrollIntoView({block:"nearest",behavior:"smooth"});
  }
}

const GROLE={S:"主詞",V:"動詞",A:"助動詞／重點",N:"否定／頻率",O:"其他",T:"時間／補充"};
function gDemo(box,demo){
  let di=0,bi=0;
  const draw=()=>{
    let h="";
    demo.forEach((d,i)=>{
      if(i>di)return;
      const n=i<di?d.s.length:bi;
      h+='<div class="gdemo"><div class="gsent">'+d.s.map((b,k)=>k<n?'<span class="sb r'+b[1]+(i===di&&k===n-1?" now":"")+'"><b>'+b[0]+"</b>"+(b[2]?"<i>"+b[2]+"</i>":"")+"</span>":"").join("")+"</div>"+
        ((i<di||n===d.s.length)?'<div class="gnote">'+d.note+' <button class="spk" data-say="'+i+'">🔊</button></div>':"")+"</div>";
    });
    const end=di===demo.length-1&&bi===demo[di].s.length;
    box.innerHTML=h+'<div class="row" style="margin-top:8px"><button class="btn slim" id="gdr" aria-label="重來">↺</button>'+
      '<button class="btn" id="gda">全部顯示</button><button class="btn gold" id="gdn"'+(end?" disabled":"")+">下一步 ▶</button></div>";
    box.querySelectorAll("[data-say]").forEach(b=>b.onclick=()=>say(demo[+b.dataset.say].s.map(x=>x[0].replace(/\+|\(|\)|→/g,"")).join(" ")));
    box.querySelector("#gdn").onclick=()=>{
      if(bi<demo[di].s.length)bi++;else if(di<demo.length-1){di++;bi=1;}
      draw();
    };
    box.querySelector("#gdr").onclick=()=>{di=0;bi=0;draw();};
    box.querySelector("#gda").onclick=()=>{di=demo.length-1;bi=demo[di].s.length;draw();};
  };
  draw();
}

/* ---------- 練習佇列：答錯放回後面，直到全對 ---------- */
function gRun(list,o){
  /* o: {title, from, onEnd(firstOk,total), wrongBook:true} */
  const queue=list.slice(),first={},total=list.length;
  let done=0;
  V.run=true;
  step();
  function step(){
    if(!queue.length){V.run=false;const fo=Object.values(first).filter(Boolean).length;o.onEnd(fo,total);return;}
    const it=queue.shift();
    const head='<div class="qhead"><span>'+o.title+'</span><span>完成 <b>'+done+"</b> / "+total+"</span></div>"+
      '<div class="bar mint" style="margin:-4px 0 12px"><i style="width:'+Math.round(done/total*100)+'%"></i></div>';
    gAsk(app,it,{mode:"practice",head,onDone:ok=>{
      if(!(it.id in first)){first[it.id]=ok;if(!ok&&o.from)gAddWrong(it.id,o.from);}
      if(o.onEach)o.onEach(it,ok);
      if(ok)done++;else queue.splice(Math.min(queue.length,2),0,it);
      save();step();
    }});
  }
}
