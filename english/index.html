/* ---------- 測驗（單元 / 大考） ---------- */
function gPickTest(pool,n,mustIds){
  const w=G().wrong,used=new Set(),out=[];
  mustIds.forEach(id=>{if(GITEM[id]&&!used.has(id)&&out.length<n){used.add(id);out.push(GITEM[id]);}});
  /* 依觀念平均抽，題型多樣 */
  const byRule={};
  shuffle(pool).forEach(it=>{if(used.has(it.id))return;(byRule[it.r]=byRule[it.r]||[]).push(it);});
  const keys=shuffle(Object.keys(byRule));
  let k=0,guard=0;
  while(out.length<n&&guard++<5000){
    const arr=byRule[keys[k%keys.length]];k++;
    if(arr&&arr.length){const it=arr.shift();used.add(it.id);out.push(it);}
    if(keys.every(x=>!byRule[x].length))break;
  }
  return shuffle(out);
}
function gUnitTest(u){
  const p=GUp(u.id);
  const list=gPickTest(u.items,GTEST_N,p.lastWrong);
  gRunTest(list,4,u.title+" 單元測驗",res=>{
    p.testBest=Math.max(p.testBest,res.score);
    if(res.score===100)p.testPassed=true;
    p.lastWrong=res.wrong;
    G().hist.push({d:Date.now(),u:u.id,kind:"單元測驗",score:res.score,sec:res.sec,wrong:res.wrong,ans:res.ans});
    save();
  },()=>go({n:"gunit",u:u.id,tab:"test"}));
}
function gBigTest(){
  const g=G();
  if(gActiveWrong().length){toast("先把文法錯題都訂正完");go({n:"miss",mt:"g"});return;}
  const pool=GU.flatMap(u=>u.items);
  const list=gPickTest(pool,GBIG_N,g.big.lastWrong);
  gRunTest(list,2,"文法大考",res=>{
    g.big.best=Math.max(g.big.best,res.score);
    if(res.score===100)g.big.passed=true;
    g.big.lastWrong=res.wrong;
    g.hist.push({d:Date.now(),u:"big",kind:"文法大考",score:res.score,sec:res.sec,wrong:res.wrong,ans:res.ans});
    save();
  },()=>go({n:"gram"}));
}
function gRunTest(list,per,title,record,back){
  let i=0;const ans={},res=[];const t0=Date.now();
  V.run=true;
  step();
  function step(){
    if(i>=list.length){finish();return;}
    const it=list[i];
    const head='<div class="qhead"><span>'+title+'</span><span>第 <b>'+(i+1)+"</b> / "+list.length+" 題</span></div>"+
      '<div class="bar sky" style="margin:-4px 0 12px"><i style="width:'+Math.round(i/list.length*100)+'%"></i></div>';
    gAsk(app,it,{mode:"test",head,onDone:(ok,got)=>{res.push(ok);ans[it.id]=got;
      if(it.t==="mc"||it.t==="order")setTimeout(()=>{i++;step();},350);else{i++;step();}}});
  }
  function finish(){
    V.run=false;
    const wrong=list.filter((it,k)=>!res[k]).map(it=>it.id);
    const score=(list.length-wrong.length)*per;
    wrong.forEach(id=>gAddWrong(id,title.indexOf("大考")>-1?"大考":"測驗"));
    const sec=Math.round((Date.now()-t0)/1000);
    record({score,wrong,sec,ans:wrong.reduce((o,id)=>(o[id]=ans[id],o),{})});
    app.innerHTML='<div class="paper result" style="margin-top:20px"><div class="badgebig">'+(score===100?"🏆":score>=90?"🥈":"💪")+"</div>"+
      '<div class="score">'+score+"<span> / 100</span></div>"+
      '<p style="color:var(--soft);font-size:14px;margin-top:8px">'+title+" · "+new Date().toLocaleDateString("zh-TW")+" · 用時 "+Math.floor(sec/60)+" 分 "+(sec%60)+" 秒<br>"+
      (score===100?"滿分通過！🎉":"錯 "+wrong.length+" 題，已收進錯題本。訂正完才能再考，下次會先考這些題目。")+"</p></div>"+
      (wrong.length?'<h3 style="margin-top:18px">錯題與正確答案</h3>'+wrong.map(id=>{const it=GITEM[id];
        return '<div class="item"><div style="font-size:14px;color:var(--soft)">你的答案：<span class="rcmiss">'+(ans[id]||"")+"</span></div>"+
          '<div class="en" style="margin-top:4px">'+gTk(gFull(it))+"</div>"+(it.w?"<p>💡 "+it.w+"</p>":"")+"</div>";}).join(""):"")+
      '<div class="row"><button class="btn gold" id="gbk">'+(wrong.length?"去訂正錯題":"完成")+"</button></div>";
    $("#gbk").onclick=wrong.length?()=>gDrill(gActiveWrong(),back):back;
  }
}

/* ---------- 錯題練習：連續答對 2 次才訂正 ---------- */
function gDrill(ids,back){
  const w=G().wrong;
  let queue=shuffle(ids.filter(id=>w[id]&&!w[id].fixed));
  const total=queue.length;
  V.run=true;
  step();
  function step(){
    if(!queue.length){
      V.run=false;
      app.innerHTML='<div class="paper result" style="margin-top:20px"><div class="badgebig">🔁</div>'+
        '<div style="font-size:20px;font-weight:800">這一輪錯題訂正完了</div><p style="color:var(--soft);font-size:14px;margin-top:8px">'+total+" 題都已經連續答對 2 次。</p></div>"+
        '<div class="row"><button class="btn gold" id="gbk">回去</button></div>';
      $("#gbk").onclick=back;return;
    }
    const id=queue.shift(),it=GITEM[id],rec=w[id];
    const fixedN=total-queue.length-1;
    const head='<div class="qhead"><span>錯題訂正 · 已訂正 '+fixedN+" / "+total+'</span><span>連續答對 <b>'+rec.streak+"</b> / 2</span></div>";
    gAsk(app,it,{mode:"practice",head,onDone:ok=>{
      if(ok){rec.streak++;if(rec.streak>=2){rec.fixed=true;rec.fixedAt=Date.now();toast("訂正完成 ✓");}else queue.splice(Math.min(queue.length,2),0,id);}
      else{rec.streak=0;rec.n++;queue.splice(Math.min(queue.length,2),0,id);}
      save();step();
    }});
  }
}

/* ---------- 錯題本（文法） ---------- */
function gMissHtml(){
  const w=G().wrong,act=gActiveWrong(),fixed=Object.keys(w).filter(id=>w[id].fixed&&GITEM[id]);
  let h='<p class="muted">講義上的錯、課本練習第一次答錯、測驗答錯的文法題都在這裡。連續答對 2 次才算訂正。</p>';
  if(!act.length)h+='<div class="empty" style="margin-top:16px">目前沒有文法錯題 👏</div>';
  else{
    h+='<div class="row"><button class="btn gold" id="gdall">開始訂正（'+act.length+" 題）</button></div>";
    GU.forEach(u=>{
      const l=act.filter(id=>GITEM[id].u===u.id);if(!l.length)return;
      h+='<h3 style="margin-top:18px">'+u.icon+" "+u.title+"（"+l.length+"）</h3>"+l.map(id=>{const it=GITEM[id],r=w[id];
        return '<div class="item"><div class="top"><b style="font-size:15px">'+GRULE[it.r].name+'</b><em style="font-size:12px;color:var(--soft)">'+(r.from||"")+"</em></div>"+
          '<p>'+it.q.replace(/\{\}/g,"____").replace(/<br>/g," ")+"</p><p>錯過 "+r.n+" 次 ｜ 連續答對 "+r.streak+" / 2</p></div>";}).join("");
    });
  }
  if(fixed.length)h+='<h3 style="margin-top:20px;color:rgba(255,255,255,.6)">已訂正（'+fixed.length+"）</h3>"+
    '<p class="muted">'+fixed.map(id=>GRULE[GITEM[id].r].name).filter((x,i,a)=>a.indexOf(x)===i).join("、")+"</p>";
  return h;
}

/* ---------- 成績紀錄 ---------- */
function gHistRow(x){
  const d=new Date(x.d);
  return '<div class="item"><div class="top"><b>'+x.score+' 分</b><i>'+(x.u==="big"?"文法大考":GUN(x.u).title+" · "+x.kind)+"</i>"+
    '<em style="font-size:13px;color:var(--soft)">'+(d.getMonth()+1)+"/"+d.getDate()+" "+String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0")+"</em></div>"+
    "<p>用時 "+Math.floor((x.sec||0)/60)+" 分 "+((x.sec||0)%60)+" 秒"+(x.wrong.length?" ｜ 錯 "+x.wrong.length+" 題："+x.wrong.map(id=>GITEM[id]?GRULE[GITEM[id].r].name:id).filter((v,i,a)=>a.indexOf(v)===i).join("、"):" ｜ 全對")+"</p></div>";
}
function renderGHist(){
  setTop("文法成績紀錄",true);
  const h=G().hist;
  app.innerHTML="<h2>文法成績紀錄</h2>"+(h.length?
    '<p class="muted">每一次測驗的分數、用時、錯在哪個觀念都在這裡。</p>'+h.slice().reverse().map(gHistRow).join("")
    :'<div class="empty">還沒有考過試<br>先完成單元的觀念和練習，再去考單元測驗</div>');
}

/* Week 10 / 11 資料修正（第 5～10 個字原本放錯週）：逐字進度跟著單字搬到正確的週，整課層級的進度重設 */
function fixW1011(){
  if(S.fixW1011)return;
  const a=S.prog.w10,b=S.prog.w11;
  if(a||b){
    const A=P("w10"),B=P("w11");
    ["seen","stage"].forEach(k=>{for(let i=4;i<10;i++){const x=A[k][i],y=B[k][i];
      if(y===undefined)delete A[k][i];else A[k][i]=y;
      if(x===undefined)delete B[k][i];else B[k][i]=x;}});
    [A,B].forEach(p=>{p.tier={0:false,1:false,2:false};p.mixedDone=false;p.mixedQueue=null;p.mixedTotal=0;p.best=0;});
  }
  S.fixW1011=true;save();
}

  loadLocalCache();

  await cloudInit();
  fixW1011();
  G();save();
  go({n:"home"});
}
boot();
