<script>
// 意帆 自然 第4章 題庫（題目 ID 永久不變；新增題目請加在 bank4.py 最後）
window.TYPES4=[{"id": "4T1", "main": 1, "name": "維管束的組成與功能", "ask": "「木質部／韌皮部／形成層各負責什麼？」「肥料由哪裡運送？」", "key": "木質部：水分、礦物質（肥料），由下往上，也能支持植物體。韌皮部：光合作用產生的養分，可上可下。形成層：細胞分裂使莖加粗。", "trap": "肥料（礦物質）溶在水中，走木質部，不是韌皮部；木質部細胞壁厚，有支持功能。"}, {"id": "4T2", "main": 1, "name": "單子葉散生、雙子葉環狀", "ask": "「莖的維管束散生，是哪一種植物？」「哪一種植物沒有形成層？」", "key": "單子葉（水稻、玉米、小麥）：散生、沒有形成層、莖不會逐年加粗。雙子葉（向日葵、南瓜、榕樹、杜鵑、蒲公英）：環狀、有形成層。", "trap": "玉米、水稻沒有形成層；看到散生就是單子葉。"}, {"id": "4T3", "main": 1, "name": "莖與葉的構造位置判讀", "ask": "「由外而內的排列順序？」「新的韌皮部是哪一個？」「葉脈上半部是什麼？」", "key": "莖由外而內：表皮→韌皮部（老在外、新在內）→形成層→木質部（新在外、老在內）→髓。葉脈：木質部在上、韌皮部在下。", "trap": "新的組織都緊貼形成層；判讀橫切圖要先找出形成層這條線。"}, {"id": "4T4", "main": 1, "name": "樹皮與環狀剝皮", "ask": "「樹皮是哪一構造之外的部分？」「松鼠環狀剝皮後植物為何死亡？」", "key": "樹皮＝形成層之外（包含韌皮部）。環狀剝皮 → 韌皮部斷 → 養分送不到根 → 根壞死 → 無法吸水 → 枝葉枯黃全株死亡。", "trap": "樹皮的界線是形成層，不是韌皮部；植物死亡的原因是「向根運送養分的管道中斷」。"}, {"id": "4T5", "main": 1, "name": "木材與年輪", "ask": "「年輪形成的原因？」「顏色深淺的環紋是哪個季節長的？」「大樹中空為何還能活？」", "key": "木材＝形成層向內累積的木質部。春夏細胞長得快、大、顏色淺；秋冬長得慢、小、顏色深。四季分明的溫帶年輪明顯。樹幹中心老木質部是已失去運輸功能的死細胞，運水靠靠近形成層的新木質部。", "trap": "年輪是「木質部」細胞大小不同造成的，和韌皮部無關；中心部位是輸送水分的死細胞。"}, {"id": "4T6", "main": 1, "name": "養分與水分的運輸比較", "ask": "「葉子的養分如何送到根？」「冬天沒有葉子，養分從哪裡來？」", "key": "養分：光合作用產生，韌皮部，雙向（提供→需求）。水分與礦物質：根吸收，木質部，單向由下往上。", "trap": "落葉樹冬天用的是根、莖先前儲存的養分；植物不能從根吸收養分（葡萄糖）。"}, {"id": "4T7", "main": 1, "name": "水分的吸收與上升動力", "ask": "「根毛的功能？」「水分上升的主要動力？」「蒸散作用的主要目的？」", "key": "根毛：表皮細胞突出，增加吸收水分和礦物質的表面積；水以擴散作用進入。上升動力：毛細管＋蒸散作用的拉力（主要）。蒸散讓根能不斷吸到水。", "trap": "葉片不能吸收水分（吸水是根的工作）；根毛不能吸收葡萄糖。"}, {"id": "4T8", "main": 1, "name": "氣孔與蒸散作用", "ask": "「什麼情況氣孔會關閉？」「移植花木為何要剪掉部分枝葉？」", "key": "氣孔由成對保衛細胞控制開閉。白天、水分充足時開；夜晚或缺水時關。氣孔是水蒸氣、氧氣、二氧化碳進出的門戶。剪葉可減少蒸散、避免缺水。", "trap": "缺水時氣孔「關閉」；氯化亞鈷試紙越快變粉紅，表示那一面蒸散越旺盛。"}, {"id": "4T9", "main": 1, "name": "植物運輸實驗推論", "ask": "「芹菜葉柄橫切看到的紅點是什麼？」「這個實驗支持哪一個結論？」", "key": "紅墨水走木質部 → 橫切看到紅點（維管束）、縱切看到紅色長條。有葉的芹菜水位下降較多 → 水分散失與葉片有關。風大、陽光強，蒸散較快。", "trap": "實驗只能支持「實驗有測到」的結論，例如水位只能說明蒸散，不能說明光合作用。"}, {"id": "4T10", "main": 1, "name": "運輸的意義與心臟構造", "ask": "「單細胞生物靠什麼交換物質？」「哪一個腔室肌肉最厚？」「主動脈連接哪裡？」", "key": "單細胞生物靠擴散作用；多細胞生物擴散太慢，需要運輸系統。心臟四腔：心房在上、心室在下。主動脈─左心室、肺動脈─右心室、大靜脈─右心房、肺靜脈─左心房。左心室肌肉最厚。", "trap": "動脈接心室、靜脈接心房；「左右」是以本人身體為準，看圖時和自己左右相反。"}, {"id": "4T11", "main": 1, "name": "心搏、血流方向與脈搏", "ask": "「心臟舒張時血液怎麼流？」「瓣膜的功能？」「每 10 秒脈搏 18 次，每分鐘幾次？」", "key": "收縮：心室→動脈（心房心室間瓣膜關閉）。舒張：靜脈→心房→心室（心室動脈間瓣膜關閉）。脈搏＝動脈隨心搏擴張，次數等於心跳。心搏是血液流動的動力。", "trap": "脈搏要量動脈；運動後心跳和脈搏都增加，但兩者次數仍相同。"}, {"id": "4T12", "main": 1, "name": "血管比較與魚尾鰭觀察", "ask": "「管壁最厚、最有彈性的是？」「如何分辨小動脈和小靜脈？」", "key": "動脈：離開心臟、管壁最厚、彈性最好、血壓最高、流速最快、無瓣膜。微血管：一層細胞、物質交換、流速最慢。靜脈：流回心臟、有瓣膜、血壓最低。看血流方向分辨：流向微血管的是小動脈。", "trap": "靜脈才有瓣膜；抽血抽的是靜脈；分辨小動脈和小靜脈最可靠的是血流方向，不是粗細。"}, {"id": "4T13", "main": 1, "name": "血液組成與血球功能", "ask": "「哪一種血球有細胞核？」「白血球數量過多代表什麼？」「激素靠什麼運送？」", "key": "血漿：主要是水，運送養分、廢物、CO₂、抗體、激素。紅血球：雙凹圓盤、無核、最多、血紅素攜帶氧。白血球：最大、有核、最少、可變形穿出微血管吞噬病原體。血小板：最小、不規則、無核、幫助凝血。", "trap": "成熟紅血球沒有細胞核；白血球過多常表示細菌感染；激素由血漿運送。"}];
window.BANK4=[{"id": "sci-4-q001", "u": "4", "t": "4T1", "lv": "b", "s": 1, "k": "orig", "src": "講義 p.89 隨堂1", "q": "植物體內有負責運輸的細胞，排列成束，稱為維管束。有關維管束的敘述，下列何者<u>錯誤</u>？", "o": ["木質部的細胞很薄，缺乏支持功能", "維管束細胞較細長", "木質部負責運輸水分及礦物質", "韌皮部負責運輸養分"], "a": 0, "e": "木質部除了運輸水分和礦物質，還能支持植物體，所以「缺乏支持功能」是錯的。維管束由細長、管狀的細胞組成。"}, {"id": "sci-4-q002", "u": "4", "t": "4T2", "lv": "b", "s": 2, "k": "orig", "src": "講義 p.90 隨堂2", "q": "右圖是某植物莖的橫切面。若某植物的莖維管束排列是散生狀的，圖中哪一個構造是它的橫切面所缺少的？", "o": ["乙", "甲", "丙", "丁"], "a": 0, "e": "先在圖上找出位置：乙是夾在韌皮部和木質部中間的形成層。散生狀是單子葉植物（如水稻、玉米），沒有形成層。", "fig": "c4:wedge:甲=phl,乙=cam,丙=xyl,丁=pith"}, {"id": "sci-4-q003", "u": "4", "t": "4T4", "lv": "b", "s": 1, "k": "orig", "src": "講義 p.91 隨堂3", "q": "臺灣的赤腹松鼠危害甚鉅，許多樹木被松鼠吃掉一大圈樹皮而死亡，原因為何？", "o": ["向根運送養分的管道中斷", "向葉子運送水分的管道中斷", "向根運送水分的管道中斷", "向葉子運送養分的管道中斷"], "a": 0, "e": "樹皮包含韌皮部。韌皮部被環狀破壞，葉子製造的養分送不到根，根壞死後無法吸水，全株死亡。"}, {"id": "sci-4-q004", "u": "4", "t": "4T5", "lv": "b", "s": 2, "k": "orig", "src": "講義 p.92 隨堂4", "q": "小倩家鋪了原木地板，看到原木條紋如右圖（甲為深色細紋，乙為淺色寬帶）。下列敘述何者正確？", "o": ["甲的細胞為秋冬季節長出的", "此木材為形成層向外生成的韌皮部", "甲的細胞比乙的細胞大", "甲的功能是將葉製造的養分運輸至根部"], "a": 0, "e": "木材是形成層向內累積的木質部。深色細紋（甲）是秋冬長的，細胞小、長得慢；淺色（乙）是春夏長的，細胞大。木質部運輸的是水分，不是養分。", "fig": "c4:board"}, {"id": "sci-4-q005", "u": "4", "t": "4T1", "lv": "b", "s": 1, "k": "orig", "src": "講義 p.92 試題1", "q": "高等植物體內物質的運輸，主要由下列何者負責？", "o": ["輸導組織", "葉肉組織", "表皮組織", "循環組織"], "a": 0, "e": "維管束又稱輸導組織，負責運輸物質。「循環組織」不是植物的構造。"}, {"id": "sci-4-q006", "u": "4", "t": "4T1", "lv": "b", "s": 1, "k": "orig", "src": "講義 p.92 試題2", "q": "農夫在菜園裡灑了一些肥料，肥料大多如何從根部送到植物體各處？", "o": ["由木質部來運送", "由韌皮部來運送", "由形成層來運送", "以上皆可"], "a": 0, "e": "肥料是礦物質，溶在水中，和水一起由木質部由下往上運送。韌皮部運送的是光合作用產生的養分；形成層負責分裂，不負責運輸。", "h": "肥料是礦物質，會溶在水裡。水是走哪一條管道？", "w": 1, "c": "記憶不牢"}, {"id": "sci-4-q007", "u": "4", "t": "4T2", "lv": "b", "s": 2, "k": "orig", "src": "講義 p.92 試題3", "q": "右圖為植物莖的橫切面，維管束散布在整個切面上。下列哪一種植物的莖具有類似的維管束排列方式？", "o": ["水稻", "蒲公英", "天竺葵", "大理花"], "a": 0, "e": "維管束散生 → 單子葉植物。水稻是單子葉；蒲公英、天竺葵、大理花都是雙子葉，維管束排成環狀。", "h": "散生是單子葉還是雙子葉？四個選項中，哪一個是禾本科（像稻米、玉米）？", "w": 1, "c": "觀念不懂", "fig": "c4:scatter"}, {"id": "sci-4-q008", "u": "4", "t": "4T2", "lv": "b", "s": 2, "k": "orig", "src": "講義 p.92 試題4", "q": "關於形成層的敘述，下列何者<u>錯誤</u>？", "o": ["玉米的莖具有形成層", "向外分裂產生新的韌皮部", "向內分裂產生新的木質部", "可使莖加粗"], "a": 0, "e": "玉米是單子葉植物，維管束散生，沒有形成層。"}, {"id": "sci-4-q009", "u": "4", "t": "4T3", "lv": "b", "s": 2, "k": "orig", "src": "講義 p.92 試題5", "q": "右圖為某植物葉片的橫切面示意圖，葉脈的上半部甲與下半部乙，其構造及功能何者正確？", "o": ["甲：木質部，輸送水分；乙：韌皮部，輸送養分", "甲：韌皮部，輸送養分；乙：木質部，輸送水分", "甲：木質部，輸送養分；乙：韌皮部，輸送水分", "甲：韌皮部，輸送水分；乙：木質部，輸送養分"], "a": 0, "e": "葉的維管束：木質部在上側、韌皮部在下側。木質部輸送水分，韌皮部輸送養分。", "fig": "c4:leafvein"}, {"id": "sci-4-q010", "u": "4", "t": "4T3", "lv": "b", "s": 3, "k": "orig", "src": "講義 p.92 試題6", "q": "榕樹、松樹等植物的形成層會不斷分裂產生新的木質部和韌皮部，使莖逐年加粗。（甲）新的木質部細胞（乙）老的木質部細胞（丙）新的韌皮部細胞（丁）老的韌皮部細胞（戊）形成層。由外而內的排列順序為何？", "o": ["丁丙戊甲乙", "甲乙戊丙丁", "乙甲戊丙丁", "丙丁戊乙甲"], "a": 0, "e": "以形成層（戊）為中心：向外長韌皮部，新的貼著形成層、老的被推到外面 → 丁、丙；向內長木質部，新的貼著形成層、老的在中心 → 甲、乙。"}, {"id": "sci-4-q011", "u": "4", "t": "4T3", "lv": "b", "s": 2, "k": "orig", "src": "講義 p.93 試題7", "q": "右圖由內而外依序為髓、甲、乙、丙、丁，形成層位在乙和丙之間。新的韌皮部是哪一個？", "o": ["丙", "甲", "乙", "丁"], "a": 0, "e": "韌皮部在形成層外側（丙、丁）。新的韌皮部緊貼形成層 → 丙；丁是被推到外面的老韌皮部。甲、乙是木質部。", "fig": "c4:bar"}, {"id": "sci-4-q012", "u": "4", "t": "4T4", "lv": "b", "s": 1, "k": "orig", "src": "講義 p.93 試題8", "q": "樹皮是指哪一構造之外的部分？", "o": ["形成層", "木質部", "韌皮部", "根部"], "a": 0, "e": "定義：莖部的形成層之外，包含韌皮部向外的部分，稱為樹皮。界線是形成層，所以韌皮部也屬於樹皮。", "h": "樹皮包不包含韌皮部？如果包含，界線就要再往裡面一層。", "w": 1, "c": "記憶不牢"}, {"id": "sci-4-q013", "u": "4", "t": "4T4", "lv": "b", "s": 3, "k": "orig", "src": "講義 p.93 試題9", "q": "右圖為大樹樹幹的橫切面（ㄅ在最外側）。若被松鼠環狀剝皮而漸漸枯死，圖中哪些部分可能被剝除了？", "o": ["ㄅㄆ", "僅ㄅ", "ㄆㄇ", "ㄅㄆㄇㄈ"], "a": 0, "e": "讀圖：ㄅ表皮、ㄆ韌皮部、ㄇ形成層、ㄈ木質部。樹會枯死，代表運輸養分的韌皮部斷了，所以被剝掉的是樹皮：ㄅ和ㄆ。只剝ㄅ不會死；木質部還在，所以不是全部。", "h": "樹會死，是哪一條管道斷了？那條管道在圖上是哪一層？從外面剝到那一層要剝掉幾層？", "w": 1, "c": "觀念不懂（讀圖）", "fig": "c4:wedge:ㄅ=epi,ㄆ=phl,ㄇ=cam,ㄈ=xyl"}, {"id": "sci-4-q014", "u": "4", "t": "4T5", "lv": "b", "s": 1, "k": "orig", "src": "講義 p.93 試題10", "q": "下列植物中，何者會形成年輪？", "o": ["榕樹", "水稻", "小麥", "玉米"], "a": 0, "e": "年輪由形成層每年產生的木質部形成。榕樹是有形成層的雙子葉木本植物；水稻、小麥、玉米是單子葉，沒有形成層。"}, {"id": "sci-4-q015", "u": "4", "t": "4T5", "lv": "b", "s": 1, "k": "orig", "src": "講義 p.93 試題11", "q": "木材主要是維管束的什麼細胞堆積而成的？", "o": ["木質部", "形成層", "韌皮部", "表皮細胞"], "a": 0, "e": "木材是形成層向內生長，逐年累積的木質部。"}, {"id": "sci-4-q016", "u": "4", "t": "4T5", "lv": "b", "s": 2, "k": "orig", "src": "講義 p.93 試題12", "q": "樹木會出現年輪的原因為何？", "o": ["木質部的細胞生長速度不同", "讓人類易於估算樹齡", "韌皮部和木質部的顏色不同", "韌皮部和木質部的細胞生長速度不同"], "a": 0, "e": "氣候差異使新生的「木質部」細胞大小不同：春夏長得快、大、淺；秋冬長得慢、小、深。年輪只和木質部有關。估算樹齡是年輪的用途，不是成因。", "h": "年輪在木材上，木材是由哪一種細胞組成？只和那一種細胞有關。", "w": 1, "c": "觀念不懂"}, {"id": "sci-4-q017", "u": "4", "t": "4T5", "lv": "b", "s": 1, "k": "orig", "src": "講義 p.93 試題13", "q": "哪一地帶的植物會有明顯的年輪？", "o": ["四季分明的溫帶", "終年炎熱的熱帶雨林", "全年溫差很小的赤道地區", "終年溫暖潮溼的海島低地"], "a": 0, "e": "四季分明的溫帶，春夏和秋冬的木質部細胞差異大，年輪明顯。"}, {"id": "sci-4-q018", "u": "4", "t": "4T5", "lv": "b", "s": 2, "k": "orig", "src": "講義 p.93 試題14", "q": "在臺灣中南部的低海拔森林中，樹木的樹幹沒有明顯的年輪，可能原因為何？", "o": ["生長環境四季不分明，全年氣候類似", "陽光太少，光合作用很低", "冬天溫度低於攝氏零度", "雨水充沛，樹木生長太快來不及長出年輪"], "a": 0, "e": "年輪來自季節差異。臺灣中南部低海拔接近熱帶，全年溫暖，細胞大小差異小，年輪不明顯。"}, {"id": "sci-4-q019", "u": "4", "t": "4T5", "lv": "b", "s": 2, "k": "orig", "src": "講義 p.93 試題15", "q": "右圖箭頭指向樹幹橫切面的中心部位，這部分主要是由哪一種細胞組成？", "o": ["輸送水分的死細胞", "輸送養分的死細胞", "形成層的死細胞", "表皮的死細胞"], "a": 0, "e": "樹幹中心是最早形成的木質部。木質部輸送水分，這些老細胞已經死亡、失去運輸功能。形成層在靠近樹皮的位置，不在中心。", "h": "樹幹中心是木材的一部分。木材是哪一種組織？它原本輸送什麼？", "w": 1, "c": "觀念不懂（讀圖）", "fig": "c4:trunk"}, {"id": "sci-4-q020", "u": "4", "t": "4T5", "lv": "b", "s": 2, "k": "orig", "src": "講義 p.93 試題16", "q": "為什麼溪頭的神木莖早已中空，卻仍可繼續生存下去？", "o": ["神木仍可產生運輸水分的新細胞", "神木的年齡過大，不需靠水分過活", "神木可靠形成層輸送水分", "神木的樹皮擔負起輸送水分的功能"], "a": 0, "e": "負責輸水的是靠近形成層的新生木質部，形成層每年還會產生新的木質部細胞。中空的是早已失去功能的老木質部。"}, {"id": "sci-4-q021", "u": "4", "t": "4T3", "lv": "b", "s": 2, "k": "orig", "src": "講義 p.94 隨堂1", "q": "右圖為植物莖的橫切面（甲在最外側、丁在最中心）。葉行光合作用所需的水，是由何處運送至葉？", "o": ["丙", "甲", "乙", "丁"], "a": 0, "e": "讀圖：甲表皮、乙形成層（細細的一條線）、丙木質部（大型、顏色深的細胞）、丁髓。水由木質部運送 → 丙。", "h": "先找出形成層那一條線，木質部在它的內側還是外側？", "w": 1, "c": "題意誤讀（讀圖）", "ug": 1, "fig": "c4:wedge:甲=epi,乙=cam,丙=xyl,丁=pith"}, {"id": "sci-4-q022", "u": "4", "t": "4T3", "lv": "b", "s": 3, "k": "orig", "src": "講義 p.96 隨堂2", "q": "小萱觀察兩種多年生植物莖和葉的橫切面（如右圖）。莖：甲為形成層內側的木材、乙為形成層、丙為形成層外側；葉：丁為上表皮、戊為葉脈、己為下表皮。下列敘述何者正確？", "o": ["根部吸收的水分大多由己部位散失", "甲可將水分由莖輸往根部", "乙向外分裂產生丙，丙部位可產生年輪", "丁進行光合作用所產生的養分，可經由戊運往莖和根部"], "a": 0, "e": "己是下表皮，陸生植物的氣孔大多在下表皮，水分大多由此蒸散。甲是木質部，水分只能由下往上；年輪在木質部（甲），不在丙；丁是表皮細胞，沒有葉綠體，不行光合作用。", "h": "四個選項都要檢查：水能往下走嗎？年輪長在哪裡？表皮細胞有葉綠體嗎？", "w": 1, "c": "觀念不懂", "ug": 1, "fig": "c4:stemleaf"}, {"id": "sci-4-q023", "u": "4", "t": "4T9", "lv": "b", "s": 1, "k": "orig", "src": "講義 p.98 隨堂3", "q": "兩枝芹菜插在裝等量水的量筒中，甲有葉片、乙沒有葉片。一段時間後，甲量筒的水位下降較多。造成差異的主要原因為何？", "o": ["葉片會增快蒸散作用的速率", "葉片會增快光合作用的速率", "水量多寡會影響蒸散作用的速率", "光照的強弱會影響蒸散作用的速率"], "a": 0, "e": "兩組只差「有沒有葉片」。有葉的水少得多 → 葉片使蒸散作用變快（氣孔在葉上）。", "fig": "c4:celery"}, {"id": "sci-4-q024", "u": "4", "t": "4T6", "lv": "b", "s": 1, "k": "orig", "src": "講義 p.98 試題1", "q": "植物的葉行光合作用所產生的養分，如何運送到根部？", "o": ["經由韌皮部", "由木質部", "經由擴散作用", "經由細胞一個一個慢慢傳遞"], "a": 0, "e": "光合作用產生的養分由韌皮部運輸，可由上往下送到根儲存。"}, {"id": "sci-4-q025", "u": "4", "t": "4T6", "lv": "b", "s": 2, "k": "orig", "src": "講義 p.98 試題2", "q": "落葉樹冬天的時候葉子會完全掉光，這個時候植物的葡萄糖養分從何處而來？", "o": ["根、莖在夏天儲存的養分", "莖表皮細胞的光合作用", "根部吸收的養分", "植物本身的呼吸作用"], "a": 0, "e": "夏天葉子製造的養分，經韌皮部送到根、莖儲存，冬天沒有葉子時就用這些存糧。莖表皮細胞沒有葉綠體；根不能吸收葡萄糖；呼吸作用是消耗養分。", "h": "沒有葉子就不能行光合作用。養分只能是以前做好、存起來的。", "w": 1, "c": "觀念不懂", "ug": 1}, {"id": "sci-4-q026", "u": "4", "t": "4T6", "lv": "b", "s": 2, "k": "orig", "src": "講義 p.98 試題3", "q": "關於養分及水分的運輸，下列何者<u>錯誤</u>？", "o": ["水分可經由氣孔進入植物再往下運輸", "甘蔗葉製造的養分可輸送至莖儲存", "春天時儲存於根、莖的養分可向上運送供發芽時利用", "根可吸收水分往上運輸到葉"], "a": 0, "e": "水分由根吸收，經木質部由下往上運輸；氣孔是水蒸氣散失的門戶，水不會由氣孔進入再往下運。"}, {"id": "sci-4-q027", "u": "4", "t": "4T6", "lv": "b", "s": 1, "k": "orig", "src": "講義 p.99 試題4", "q": "農人施肥於土壤中，肥料中的礦物質將藉何種構造運送到植物的各個細胞？", "o": ["木質部", "韌皮部", "形成層", "樹皮"], "a": 0, "e": "礦物質溶在水中，由木質部運送。"}, {"id": "sci-4-q028", "u": "4", "t": "4T7", "lv": "b", "s": 1, "k": "orig", "src": "講義 p.99 試題5", "q": "有關植物根毛的敘述，下列何者<u>錯誤</u>？", "o": ["葡萄糖可由此吸收", "表皮細胞突出形成", "可增加吸收的表面積", "水分由此吸收"], "a": 0, "e": "根毛吸收的是水分和礦物質。葡萄糖是葉片光合作用製造的，不是從土壤吸收。"}, {"id": "sci-4-q029", "u": "4", "t": "4T8", "lv": "b", "s": 1, "k": "orig", "src": "講義 p.99 試題6", "q": "移植花木時，常先修剪掉部分枝葉以提高存活率，主要原因為何？", "o": ["減少水分蒸散", "減少光合作用的進行", "減少植物本身的重量", "促進植物開花"], "a": 0, "e": "移植時根受傷、吸水能力下降。剪掉部分枝葉可減少蒸散，避免植物缺水枯死。"}, {"id": "sci-4-q030", "u": "4", "t": "4T7", "lv": "b", "s": 2, "k": "orig", "src": "講義 p.99 試題7", "q": "下列哪一項敘述與植物體內水分的輸送<u>無關</u>？", "o": ["維管束的排列位置", "水分子之間有拉力", "水分從氣孔散失", "輸水細胞間形成細管"], "a": 0, "e": "水分上升靠：木質部連成細管（毛細管）、水分子之間的拉力、蒸散作用從氣孔散失產生的拉力。維管束是散生或環狀，和水能不能往上送無關。"}, {"id": "sci-4-q031", "u": "4", "t": "4T8", "lv": "b", "s": 2, "k": "orig", "src": "講義 p.99 試題8", "q": "小英用顯微鏡觀察某植物葉子的下表皮（甲為一對保衛細胞、乙為中間的孔、丙為周圍的表皮細胞）。下列敘述何者<u>錯誤</u>？", "o": ["乾燥缺水時乙開放", "乙為氣體進出植物體的門戶", "甲能調節乙的開閉", "丙有保護的功能"], "a": 0, "e": "乙是氣孔。缺水時氣孔會關閉，以減少水分散失。", "fig": "c4:stoma"}, {"id": "sci-4-q032", "u": "4", "t": "4T8", "lv": "b", "s": 2, "k": "orig", "src": "講義 p.99 試題9", "q": "下列何種環境較容易促使植物的氣孔關閉？（甲）白天（乙）黑夜（丙）潮溼（丁）乾燥", "o": ["乙丁", "甲丙", "甲丁", "乙丙"], "a": 0, "e": "氣孔在夜晚、或植物缺水（乾燥）時關閉。"}, {"id": "sci-4-q033", "u": "4", "t": "4T7", "lv": "b", "s": 2, "k": "orig", "src": "講義 p.99 試題10", "q": "一般綠色的葉片<u>不能</u>進行何種作用？", "o": ["吸收水分", "光合作用", "呼吸作用", "蒸散作用"], "a": 0, "e": "植物吸收水分是根（根毛）的工作。綠色葉片可以行光合作用；所有活細胞都在行呼吸作用；葉片的氣孔進行蒸散作用。", "h": "葉片的每個活細胞都要能量，都會做哪一種作用？植物吸水是靠哪個器官？", "w": 1, "c": "觀念不懂", "ug": 1}, {"id": "sci-4-q034", "u": "4", "t": "4T7", "lv": "b", "s": 2, "k": "orig", "src": "講義 p.99 試題11（文字改得更清楚）", "q": "葉片蒸散作用對植物的主要功能是哪一項？", "o": ["提供根部吸收的水分和礦物質往上運輸的動力", "獲得充足的氧氣", "獲得充足的二氧化碳", "獲得充足的陽光"], "a": 0, "e": "蒸散作用是水分向上運輸的主要動力：水從氣孔散失，產生拉力把木質部中的水往上拉，根才能不斷吸到水和礦物質。二氧化碳是氣孔打開時進來的，不是蒸散作用的目的。", "h": "課本說蒸散作用是什麼的「主要動力」？", "w": 1, "c": "記憶不牢", "ug": 1}, {"id": "sci-4-q035", "u": "4", "t": "4T8", "lv": "b", "s": 2, "k": "orig", "src": "講義 p.99 試題12", "q": "利用藍色氯化亞鈷試紙檢測某植物，試紙變為粉紅色所需的時間：上表皮 3 分鐘，下表皮 10 分鐘。哪一面的蒸散作用較旺盛？", "o": ["上表皮", "下表皮", "都一樣", "無法判斷"], "a": 0, "e": "氯化亞鈷試紙遇水由藍變粉紅。越快變色 → 散失的水越多 → 蒸散越旺盛。這株植物是上表皮。"}, {"id": "sci-4-q036", "u": "4", "t": "4T9", "lv": "b", "s": 3, "k": "orig", "src": "講義 p.99 試題13", "q": "取葉片數量相同的鴨跖草枝條：甲在莖表皮塗凡士林、乙在葉的下表皮塗凡士林、丙在葉的上表皮塗凡士林、丁不處理，放入等量水的量筒，置於陽光下 4 小時（凡士林是透明油膏，可堵住氣孔）。下列分析何者<u>錯誤</u>？", "o": ["4 小時後以甲量筒的水位最高", "比較甲與丁，可判斷莖表皮與蒸散作用的關聯", "比較乙與丙，可判斷葉的上、下表皮氣孔分布的多寡", "比較乙與丁，可判斷葉的下表皮對蒸散作用的影響"], "a": 0, "e": "莖表皮氣孔很少，甲和丁差不多，水都少很多。葉下表皮氣孔最多，乙堵住下表皮，蒸散最少，所以水位最高的是乙，不是甲。", "fig": "c4:vaseline"}, {"id": "sci-4-q037", "u": "4", "t": "4T9", "lv": "b", "s": 1, "k": "orig", "src": "講義 p.100 試題14", "q": "在水耕芹菜的生長盆中滴加紅墨水，一段時間後取一葉柄橫切，可見其內部有許多紅色小點排成一圈。這些小點是什麼構造？", "o": ["維管束", "氣孔", "葉綠體", "年輪"], "a": 0, "e": "紅墨水隨水分進入木質部，所以橫切面上的紅點是維管束。"}, {"id": "sci-4-q038", "u": "4", "t": "4T9", "lv": "b", "s": 2, "k": "orig", "src": "講義 p.100 試題15", "q": "切取植物插在盛水的細玻璃管中，由水柱升降測量吸水量。甲：放在日光下；乙：葉全部除去；丙：放在陰暗處。蒸散作用由快而慢的順序為何？", "o": ["甲丙乙", "甲乙丙", "丙甲乙", "乙甲丙"], "a": 0, "e": "日光下氣孔打開，蒸散最快（甲）；陰暗處較慢（丙）；沒有葉片幾乎不蒸散（乙）。"}, {"id": "sci-4-q039", "u": "4", "t": "4T9", "lv": "b", "s": 2, "k": "orig", "src": "講義 p.100 試題16", "q": "將一枝長 25 公分的芹菜葉柄插入紅墨水中 15 分鐘後，分別橫切及縱切葉柄。觀察到的紅色分布，何者正確？", "o": ["橫切面：綠色中有紅點排成一圈；縱切面：幾條紅色長條", "橫切面：整片紅色；縱切面：整片紅色", "橫切面：只有邊緣是紅色；縱切面：整片紅色", "橫切面：紅點散在各處；縱切面：整片紅色"], "a": 0, "e": "紅墨水只走維管束的木質部。芹菜葉柄的維管束排成一圈 → 橫切面看到一圈紅點；維管束是上下相連的長管 → 縱切面看到紅色長條。"}, {"id": "sci-4-q040", "u": "4", "t": "4T9", "lv": "b", "s": 2, "k": "orig", "src": "講義 p.100 試題17", "q": "小嵐取兩枝粗細相近的芹菜，其中一枝摘除所有葉片。帶葉片的插入甲量筒、沒有葉片的插入乙量筒，加水到 10 mL，放在通風處，每 10 分鐘記錄液面（如右表）：30 分鐘後甲由 10.0 mL 降為 6.5 mL，乙由 10.0 mL 降為 9.5 mL。實驗結果可支持下列哪一敘述？", "o": ["植物體內水分的散失與葉片有關", "植物的生長需要通風", "植物行光合作用需要光", "植物行呼吸作用時需要水分"], "a": 0, "e": "兩組只差葉片有無：甲 30 分鐘少了 3.5 mL，乙只少 0.5 mL，說明水分散失與葉片有關。實驗沒有比較通風、光或呼吸作用，不能下這些結論。", "h": "這兩支量筒只差在哪一個條件？實驗只能證明和「那個條件」有關的結論。", "w": 1, "c": "題意誤讀", "ug": 1, "fig": "c4:t17"}, {"id": "sci-4-q041", "u": "4", "t": "4T9", "lv": "b", "s": 2, "k": "orig", "src": "講義 p.100 試題18", "q": "小明進行「植物體內水分的運輸」實驗時，甲量筒的芹菜有許多葉子、乙量筒的芹菜葉子都已摘除，結果兩組水位下降量差異很少。該怎麼做可以讓結果更明顯？", "o": ["兩組都用電風扇吹", "找一個雨天重做一次", "改成在暗室中進行實驗", "把芹菜的葉柄切得更短"], "a": 0, "e": "風會加快蒸散作用，有葉的甲散失更多水，差異就變明顯。雨天溼度高、暗室氣孔關閉，蒸散都會變慢，差異更小。", "h": "什麼條件會讓蒸散作用變快？雨天和暗室是變快還是變慢？", "w": 1, "c": "觀念不懂", "ug": 1}, {"id": "sci-4-q042", "u": "4", "t": "4T10", "lv": "b", "s": 1, "k": "orig", "src": "講義 p.101 隨堂1", "q": "為什麼多細胞生物大都有特殊的構造來運輸物質？", "o": ["因細胞的擴散作用太緩慢", "因細胞產生的廢物太多", "因細胞需要的養分太多", "因細胞質流動太慢"], "a": 0, "e": "多細胞生物體積大，只靠擴散作用把物質送到每個細胞太慢，所以特化出運輸系統（植物的維管束、動物的循環系統）。"}, {"id": "sci-4-q043", "u": "4", "t": "4T13", "lv": "b", "s": 1, "k": "orig", "src": "講義 p.104 隨堂2", "q": "急性盲腸炎時，右圖中哪一種血球會大量增加？（甲為雙凹圓盤狀、數量最多；乙為體積最大、有細胞核；丙為很小的碎片）", "o": ["乙", "甲", "丙", "都不會增加"], "a": 0, "e": "發炎、細菌感染時，白血球會增加來吞噬病原體。白血球體積最大、有細胞核 → 乙。", "fig": "c4:smear"}, {"id": "sci-4-q044", "u": "4", "t": "4T11", "lv": "b", "s": 2, "k": "orig", "src": "講義 p.106 隨堂3", "q": "運動前每分鐘心跳次數＝甲，脈搏次數＝乙；運動後每分鐘心跳次數＝丙，脈搏次數＝丁。下列何者正確？", "o": ["丁＞乙", "甲＜乙", "甲＞乙", "乙＞丙"], "a": 0, "e": "脈搏隨心跳產生，同一時間心跳＝脈搏（甲＝乙、丙＝丁）。運動後心跳加快，所以丁＞乙。"}, {"id": "sci-4-q045", "u": "4", "t": "4T10", "lv": "b", "s": 1, "k": "orig", "src": "講義 p.106 試題1", "q": "生活在水中的變形蟲、草履蟲等單細胞生物，藉由何種方式與外界進行物質的交換？", "o": ["擴散作用", "循環作用", "分泌作用", "蒸散作用"], "a": 0, "e": "單細胞生物體積小，直接靠擴散作用和外界交換物質。"}, {"id": "sci-4-q046", "u": "4", "t": "4T11", "lv": "b", "s": 2, "k": "orig", "src": "講義 p.106 試題2", "q": "人體心臟中的心房和心室之間具有瓣膜，主要的功能為何？", "o": ["心室收縮時防止血液逆流回心房", "心房收縮時防止血液逆流至血管", "心室舒張時防止血液自動脈逆流回心房", "心房舒張時防止血液自靜脈逆流回心房"], "a": 0, "e": "心室收縮把血液壓進動脈時，心房與心室間的瓣膜關閉，防止血液逆流回心房。"}, {"id": "sci-4-q047", "u": "4", "t": "4T11", "lv": "b", "s": 1, "k": "orig", "src": "講義 p.106 試題3", "q": "心血管系統最主要的動力來源為何？", "o": ["心臟的收縮與舒張", "胸腔的擴大收縮", "四肢肌肉的收縮", "動脈的搏動"], "a": 0, "e": "心搏（心臟規律的收縮與舒張）是血液在血管中流動的動力來源。動脈搏動是心搏造成的結果。"}, {"id": "sci-4-q048", "u": "4", "t": "4T10", "lv": "b", "s": 1, "k": "orig", "src": "講義 p.106 試題4", "q": "在心臟的四個腔室中，肌肉最厚實有力的是哪一個？", "o": ["左心室", "左心房", "右心房", "右心室"], "a": 0, "e": "左心室要把血液經主動脈送到全身，路程最遠，肌肉最厚。"}, {"id": "sci-4-q049", "u": "4", "t": "4T10", "lv": "b", "s": 2, "k": "orig", "src": "講義 p.106 試題5", "q": "右圖為人體心臟的結構圖（圖以本人身體的左右為準，甲在看圖者的右下方），哪一個結構和主動脈連接在一起？", "o": ["甲", "乙", "丙", "丁"], "a": 0, "e": "主動脈與左心室相連。圖中甲是左心室（在本人左側，看圖時在右下）。", "fig": "c4:heartq"}, {"id": "sci-4-q050", "u": "4", "t": "4T12", "lv": "b", "s": 1, "k": "orig", "src": "講義 p.107 試題6", "q": "右圖為人類體內各式的血管（甲較粗、管壁厚；乙是網狀的細小血管；丙內有瓣膜），何者管壁的厚度最厚且最富彈性？", "o": ["甲", "乙", "丙", "因人而異"], "a": 0, "e": "管壁最厚、彈性最好的是動脈（甲）。乙是微血管（一層細胞）；丙有瓣膜，是靜脈。", "fig": "c4:vess"}, {"id": "sci-4-q051", "u": "4", "t": "4T12", "lv": "b", "s": 2, "k": "orig", "src": "講義 p.107 試題7", "q": "有關動脈與靜脈的比較，下列何者<u>錯誤</u>？", "o": ["動脈將血液送回心臟；靜脈將血液送離心臟", "動脈管壁較厚；靜脈管壁較薄", "動脈血液流速較快；靜脈血液流速較慢", "最粗的動脈與心室相連；最粗的靜脈與心房相連"], "a": 0, "e": "動脈是血液離開心臟的血管，靜脈是血液流回心臟的血管，(A) 方向寫反了。"}, {"id": "sci-4-q052", "u": "4", "t": "4T11", "lv": "b", "s": 1, "k": "orig", "src": "講義 p.107 試題8", "q": "當心臟舒張時，血液如何流動？", "o": ["從靜脈流回心臟", "從心臟流向動脈", "從心臟流向靜脈", "從動脈流回心臟"], "a": 0, "e": "舒張：靜脈 → 心房 → 心室。收縮：心室 → 動脈。"}, {"id": "sci-4-q053", "u": "4", "t": "4T13", "lv": "b", "s": 1, "k": "orig", "src": "講義 p.107 試題9", "q": "紅血球中的哪一構造能與氧氣結合，將氧氣運輸至全身供細胞利用？", "o": ["血紅素", "細胞核", "酵素", "液胞"], "a": 0, "e": "紅血球內含血紅素（呈紅色），可與氧氣結合。成熟紅血球沒有細胞核。"}, {"id": "sci-4-q054", "u": "4", "t": "4T13", "lv": "b", "s": 2, "k": "orig", "src": "講義 p.107 試題10", "q": "小愛發燒，右腳大拇趾紅腫疼痛，鼠蹊部腫脹。血液檢查：紅血球 500 萬（正常 450～550 萬）、白血球 12000（正常 5000～10000）、血小板 35 萬（正常 15～45 萬）、血壓 120／80（正常 110～140／70～90）。小愛最有可能是下列何種情形？", "o": ["腳趾可能有傷口而受到細菌感染", "血液不易凝固，遇到輕微外傷就血流不止", "貧血", "高血壓"], "a": 0, "e": "只有白血球超過正常範圍。白血球增加常表示身體正在對抗細菌感染。血小板、紅血球、血壓都正常。"}, {"id": "sci-4-q055", "u": "4", "t": "4T13", "lv": "b", "s": 1, "k": "orig", "src": "講義 p.107 試題11", "q": "下列何者含有明顯的細胞核？", "o": ["白血球", "成熟的紅血球", "血小板", "血漿"], "a": 0, "e": "三種血球中只有白血球有細胞核。血漿是液體，不是細胞。"}, {"id": "sci-4-q056", "u": "4", "t": "4T13", "lv": "b", "s": 2, "k": "orig", "src": "講義 p.108 試題12", "q": "有關血液的敘述，下列何者正確？", "o": ["有些白血球能穿出微血管壁", "血漿的成分中只有水這一種物質", "血小板可產生抗體", "白血球的形狀較紅血球大，且數量也較多"], "a": 0, "e": "白血球可以變形穿過微血管壁去吞噬病原體。血漿除了水，還有養分、廢物、二氧化碳、抗體、激素；血小板幫助凝血；白血球數量最少。"}, {"id": "sci-4-q057", "u": "4", "t": "4T12", "lv": "b", "s": 2, "k": "orig", "src": "講義 p.108 試題13", "q": "在複式顯微鏡下觀察魚尾部的血管，最容易用什麼方法區別出何者是小動脈、何者是小靜脈？", "o": ["血液流動的方向", "血管粗細不同", "血管顏色不同", "血管中的血球大小"], "a": 0, "e": "先找到最細的微血管：血液流進微血管之前的是小動脈，流出之後的是小靜脈。"}, {"id": "sci-4-q058", "u": "4", "t": "4T13", "lv": "b", "s": 1, "k": "orig", "src": "講義 p.108 試題14", "q": "我們體內所分泌的激素（荷爾蒙），主要藉由身體的哪一構造負責運送？", "o": ["血漿", "神經系統", "紅血球", "專責運送的導管"], "a": 0, "e": "激素溶在血漿中，隨血液運送到全身。"}, {"id": "sci-4-q059", "u": "4", "t": "4T11", "lv": "b", "s": 1, "k": "orig", "src": "講義 p.108 試題15", "q": "到中醫診所看病，中醫師把脈是按哪一種血管？", "o": ["動脈", "靜脈", "微血管", "淋巴管"], "a": 0, "e": "脈搏是動脈管壁隨心搏擴張、復原的現象，在靠近體表的較大動脈（如手腕）可以摸到。"}, {"id": "sci-4-q060", "u": "4", "t": "4T11", "lv": "b", "s": 1, "k": "orig", "src": "講義 p.108 試題16", "q": "心跳加快對動物本身的意義是下列何者？", "o": ["可使細胞得到充分的養分", "可減少體內養分的供應", "可降低廢物的形成", "可延長每一細胞的壽命"], "a": 0, "e": "心跳加快，血液流動變快，可以更快把氧氣和養分送給細胞，並帶走二氧化碳與廢物。"}, {"id": "sci-4-q061", "u": "4", "t": "4T11", "lv": "b", "s": 2, "k": "orig", "src": "講義 p.108 試題17", "q": "某人跑了一百公尺，馬上測量脈搏，發現每 10 秒鐘有 18 次。他的心跳每分鐘約幾次？", "o": ["108", "18", "72", "180"], "a": 0, "e": "脈搏次數＝心跳次數。1 分鐘＝60 秒＝6 個 10 秒：18 × 6 ＝ 108 次。"}, {"id": "sci-4-q062", "u": "4", "t": "4T11", "lv": "b", "s": 2, "k": "orig", "src": "講義 p.108 試題18", "q": "柚子每分鐘心跳約 72 下，若心臟每次送出的血液量約 50 毫升，心臟每分鐘約輸出多少血量？", "o": ["3.6 公升", "3.6 毫升", "0.36 毫升", "3600 公升"], "a": 0, "e": "72 × 50 ＝ 3600 毫升 ＝ 3.6 公升（1 公升＝1000 毫升）。"}, {"id": "sci-4-q063", "u": "4", "t": "4T1", "lv": "b", "s": 1, "k": "var", "src": "錯題類題", "q": "下列何者是由木質部運輸的？", "o": ["土壤中的礦物質", "葉片製造的葡萄糖", "儲存在根中的澱粉", "供新芽生長的養分"], "a": 0, "e": "木質部運輸水分和礦物質。葡萄糖、澱粉等養分由韌皮部運輸。", "of": "sci-4-q006"}, {"id": "sci-4-q064", "u": "4", "t": "4T1", "lv": "b", "s": 2, "k": "var", "src": "錯題類題", "q": "有蚜蟲把口器插入植物莖中吸食甜甜的汁液，牠吸食的是哪一個構造？", "o": ["韌皮部", "木質部", "形成層", "髓"], "a": 0, "e": "甜的汁液含有光合作用產生的醣，是韌皮部在運輸的。木質部的汁液主要是水和礦物質。", "of": "sci-4-q006"}, {"id": "sci-4-q065", "u": "4", "t": "4T2", "lv": "b", "s": 1, "k": "var", "src": "錯題類題", "q": "下列哪一種植物的莖，維管束是散生排列？", "o": ["玉米", "向日葵", "南瓜", "榕樹"], "a": 0, "e": "玉米是單子葉植物，維管束散生。向日葵、南瓜、榕樹是雙子葉，維管束排成環狀。", "of": "sci-4-q007"}, {"id": "sci-4-q066", "u": "4", "t": "4T2", "lv": "b", "s": 2, "k": "var", "src": "錯題類題", "q": "某植物莖的橫切面上，維管束整齊地排成一圈。這種植物最可能具有下列哪一項特徵？", "o": ["有形成層，莖可以逐年加粗", "沒有形成層", "是水稻或小麥", "維管束中沒有韌皮部"], "a": 0, "e": "環狀排列 → 雙子葉植物 → 有形成層，莖可以逐年加粗。水稻、小麥是散生的單子葉。", "of": "sci-4-q007"}, {"id": "sci-4-q067", "u": "4", "t": "4T4", "lv": "b", "s": 1, "k": "var", "src": "錯題類題", "q": "下列哪一個構造屬於樹皮的一部分？", "o": ["韌皮部", "形成層", "木質部", "髓"], "a": 0, "e": "樹皮是形成層之外的部分，包含韌皮部和表皮。", "of": "sci-4-q012"}, {"id": "sci-4-q068", "u": "4", "t": "4T4", "lv": "b", "s": 2, "k": "var", "src": "錯題類題", "q": "將一段樹幹從形成層的位置剝開，外面那一圈稱為樹皮，裡面剩下的主要是什麼？", "o": ["木材（木質部）", "韌皮部", "表皮", "葉肉"], "a": 0, "e": "以形成層為界：外面是樹皮（含韌皮部），裡面是木材（木質部）和髓。", "of": "sci-4-q012"}, {"id": "sci-4-q069", "u": "4", "t": "4T4", "lv": "b", "s": 2, "k": "var", "src": "錯題類題", "q": "右圖為樹幹橫切面（ㄅ在最外側）。若只剝掉最外層的ㄅ，而ㄆ完整保留，這棵樹會怎樣？", "o": ["不會因此死亡，因為運輸養分的韌皮部還在", "會死亡，因為水分無法運輸", "會死亡，因為形成層被破壞", "會長出年輪"], "a": 0, "e": "ㄆ是韌皮部。韌皮部完好，葉的養分仍能送到根，根就不會壞死。", "of": "sci-4-q013", "fig": "c4:wedge:ㄅ=epi,ㄆ=phl,ㄇ=cam,ㄈ=xyl"}, {"id": "sci-4-q070", "u": "4", "t": "4T4", "lv": "b", "s": 3, "k": "var", "src": "錯題類題", "q": "右圖為樹幹橫切面。為了讓樹木漸漸枯死，至少要環狀剝除到哪一層？", "o": ["乙", "甲", "丙", "丁"], "a": 0, "e": "讀圖：甲表皮、乙韌皮部、丙形成層、丁木質部。只要韌皮部（乙）被環狀切斷，養分就送不到根，樹會漸漸枯死。", "of": "sci-4-q013", "fig": "c4:wedge:甲=epi,乙=phl,丙=cam,丁=xyl"}, {"id": "sci-4-q071", "u": "4", "t": "4T5", "lv": "b", "s": 2, "k": "var", "src": "錯題類題", "q": "年輪中顏色較淺的環紋，形成的原因是什麼？", "o": ["春夏溫暖多雨，木質部細胞長得快、體積大", "秋冬寒冷，木質部細胞長得慢、體積小", "韌皮部細胞變多", "形成層停止分裂"], "a": 0, "e": "春夏氣候溫暖、雨量多，新生的木質部細胞長得快、體積大、顏色淺。", "of": "sci-4-q016"}, {"id": "sci-4-q072", "u": "4", "t": "4T5", "lv": "b", "s": 2, "k": "var", "src": "錯題類題", "q": "下列關於年輪的敘述，何者正確？", "o": ["是新生木質部細胞大小不同造成的深淺環紋", "是韌皮部和木質部顏色不同造成的", "單子葉植物也有明顯年輪", "熱帶雨林的樹木年輪最明顯"], "a": 0, "e": "年輪只和木質部有關。單子葉沒有形成層，沒有年輪；熱帶全年氣候相似，年輪不明顯。", "of": "sci-4-q016"}, {"id": "sci-4-q073", "u": "4", "t": "4T5", "lv": "b", "s": 2, "k": "var", "src": "錯題類題", "q": "大樹樹幹中，負責輸送水分的主要是哪一部分？", "o": ["靠近形成層的新生木質部", "樹幹中心的老木質部", "樹皮", "髓"], "a": 0, "e": "靠近樹幹中心、較早形成的木質部多已失去運輸功能；輸水靠的是靠近形成層的新生木質部。", "of": "sci-4-q019"}, {"id": "sci-4-q074", "u": "4", "t": "4T5", "lv": "b", "s": 3, "k": "var", "src": "錯題類題", "q": "有些大樹樹幹中央已經腐朽消失，卻仍能存活。從這個現象可以推論什麼？", "o": ["樹幹中央的細胞早已失去運輸功能", "樹幹中央是韌皮部", "大樹不需要水分", "形成層位於樹幹中央"], "a": 0, "e": "中央是早期形成的木質部，早已死亡、失去運輸功能，消失了也不影響水分運輸。形成層在靠近樹皮的地方。", "of": "sci-4-q019"}, {"id": "sci-4-q075", "u": "4", "t": "4T3", "lv": "b", "s": 2, "k": "var", "src": "錯題類題", "q": "右圖為莖的橫切面（甲在最外側、丁在最中心），植物葉片製造的養分由哪一部分往下運送？", "o": ["乙", "甲", "丙", "丁"], "a": 0, "e": "讀圖：甲表皮、乙韌皮部、丙形成層、丁木質部。養分由韌皮部運輸 → 乙。", "of": "sci-4-q021", "fig": "c4:wedge:甲=epi,乙=phl,丙=cam,丁=xyl"}, {"id": "sci-4-q076", "u": "4", "t": "4T3", "lv": "b", "s": 2, "k": "var", "src": "錯題類題", "q": "在雙子葉植物的莖中，木質部位於形成層的哪一側？", "o": ["內側（靠近中心）", "外側（靠近表皮）", "與形成層混在一起", "沒有固定位置"], "a": 0, "e": "莖的維管束：木質部在內側、韌皮部在外側，形成層夾在中間。", "of": "sci-4-q021"}, {"id": "sci-4-q077", "u": "4", "t": "4T3", "lv": "b", "s": 2, "k": "var", "src": "錯題類題", "q": "陸生植物葉片的氣孔大多分布在哪裡？", "o": ["下表皮", "上表皮", "葉脈", "葉肉"], "a": 0, "e": "陸生植物的氣孔大多分布在下表皮，所以水分大多從下表皮蒸散。", "of": "sci-4-q022"}, {"id": "sci-4-q078", "u": "4", "t": "4T3", "lv": "b", "s": 3, "k": "var", "src": "錯題類題", "q": "多年生木本植物的莖中，可以看到年輪的是哪一部分？", "o": ["形成層內側的木質部", "形成層外側的韌皮部", "表皮", "形成層本身"], "a": 0, "e": "年輪是形成層每年向內產生的木質部，因細胞大小不同形成的環紋。", "of": "sci-4-q022"}, {"id": "sci-4-q079", "u": "4", "t": "4T6", "lv": "b", "s": 2, "k": "var", "src": "錯題類題", "q": "春天時，落葉樹的新芽還沒有長出葉子，新芽生長所需的養分從哪裡來？如何運送？", "o": ["根、莖儲存的養分，由韌皮部往上送", "土壤中的養分，由木質部往上送", "新芽自己行光合作用", "空氣中的二氧化碳直接變成養分"], "a": 0, "e": "養分的運輸是「提供的地方 → 需求的地方」：根、莖儲存的養分經韌皮部由下往上，送到需要的新芽。", "of": "sci-4-q025"}, {"id": "sci-4-q080", "u": "4", "t": "4T6", "lv": "b", "s": 2, "k": "var", "src": "錯題類題", "q": "下列哪一個例子，養分在韌皮部中是「由下往上」運輸？", "o": ["地瓜發芽時，塊根儲存的養分送往新芽", "甘蔗葉製造的糖送到莖儲存", "葉片製造的養分送到根", "葉片製造的養分送到地下的馬鈴薯塊莖"], "a": 0, "e": "塊根在下、新芽在上，養分由下往上。其他選項都是從葉片往下送。", "of": "sci-4-q025"}, {"id": "sci-4-q081", "u": "4", "t": "4T7", "lv": "b", "s": 1, "k": "var", "src": "錯題類題", "q": "植物吸收水分的主要部位是哪裡？", "o": ["根毛", "氣孔", "葉肉", "莖的表皮"], "a": 0, "e": "根部表皮細胞突出形成根毛，增加吸收水分和礦物質的表面積。", "of": "sci-4-q033"}, {"id": "sci-4-q082", "u": "4", "t": "4T7", "lv": "b", "s": 2, "k": "var", "src": "錯題類題", "q": "下列哪一種作用是植物體內所有活細胞都會進行的？", "o": ["呼吸作用", "光合作用", "吸收水分", "蒸散作用"], "a": 0, "e": "所有活細胞都要能量，都會行呼吸作用。光合作用只有含葉綠體的細胞能做；吸水靠根；蒸散主要經由葉片氣孔。", "of": "sci-4-q033"}, {"id": "sci-4-q083", "u": "4", "t": "4T7", "lv": "b", "s": 2, "k": "var", "src": "錯題類題", "q": "植物體內水分向上運輸的主要動力是什麼？", "o": ["蒸散作用產生的拉力", "韌皮部的推力", "形成層的分裂", "光合作用產生的氧氣"], "a": 0, "e": "水從氣孔蒸散時產生拉力，把木質部中連成一條細管的水往上拉，根部的水也跟著上升。", "of": "sci-4-q034"}, {"id": "sci-4-q084", "u": "4", "t": "4T7", "lv": "b", "s": 3, "k": "var", "src": "錯題類題", "q": "某植物的氣孔全部被堵住，在其他條件不變下，根部吸收水分的速率最可能如何？", "o": ["變慢，因為缺少蒸散作用的拉力", "變快，因為水分不會散失", "不變，因為吸水只靠擴散", "變快，因為光合作用增加"], "a": 0, "e": "氣孔被堵住，蒸散作用幾乎停止，沒有向上的拉力，根部吸水也會變慢。", "of": "sci-4-q034"}, {"id": "sci-4-q085", "u": "4", "t": "4T9", "lv": "b", "s": 2, "k": "var", "src": "錯題類題", "q": "兩支量筒各插一枝帶葉片數相同的芹菜，甲放在電風扇前，乙放在無風處，其他條件相同。結果甲的水位下降較多。這個實驗可支持何種結論？", "o": ["風會加快植物的蒸散作用", "葉片越多蒸散越快", "光線會影響蒸散作用", "植物行光合作用需要水"], "a": 0, "e": "兩組只差「有沒有風」，所以只能得到和風有關的結論。", "of": "sci-4-q040"}, {"id": "sci-4-q086", "u": "4", "t": "4T9", "lv": "b", "s": 3, "k": "var", "src": "錯題類題", "q": "若要以芹菜實驗探討「陽光是否影響蒸散作用」，下列設計何者最合理？", "o": ["兩枝都帶葉片，一枝放陽光下、一枝放陰暗處，其他條件相同", "一枝帶葉放陽光下，一枝去葉放陰暗處", "兩枝都去葉，放在陽光下", "一枝放水、一枝放紅墨水"], "a": 0, "e": "探討陽光的影響，兩組只能差「陽光」這一個變因，葉片有無要相同。", "of": "sci-4-q040"}, {"id": "sci-4-q087", "u": "4", "t": "4T9", "lv": "b", "s": 2, "k": "var", "src": "錯題類題", "q": "下列哪一種環境，植物的蒸散作用最旺盛？", "o": ["陽光充足、乾燥又有風", "陰暗、潮溼、無風", "夜晚、潮溼", "下雨天"], "a": 0, "e": "陽光充足時氣孔打開，乾燥和有風會讓水蒸氣更快散去，蒸散最旺盛。", "of": "sci-4-q041"}, {"id": "sci-4-q088", "u": "4", "t": "4T9", "lv": "b", "s": 2, "k": "var", "src": "錯題類題", "q": "做芹菜實驗時，若希望「有葉」和「無葉」兩組的差距更明顯，下列做法何者<u>不適合</u>？", "o": ["把兩組放進暗室", "讓實驗時間延長", "放在陽光充足處", "用電風扇吹兩組"], "a": 0, "e": "暗室中氣孔關閉，蒸散變慢，兩組差距會變得更小。延長時間、陽光、風都能讓差距更明顯。", "of": "sci-4-q041"}, {"id": "sci-4-q089", "u": "4", "t": "4T1", "lv": "a", "s": 2, "k": "adapt", "src": "改編自台中市大甲國中114學年補考題庫", "q": "關於維管束的敘述，下列何者正確？", "o": ["形成層可以使植物的莖逐年加粗", "木質部可以運送光合作用產生的養分", "韌皮部可以運送水分", "土壤中的礦物質會由韌皮部運送至葉部"], "a": 0, "e": "形成層分裂產生新的木質部和韌皮部，使莖加粗。木質部運水和礦物質；韌皮部運養分。"}, {"id": "sci-4-q090", "u": "4", "t": "4T1", "lv": "a", "s": 2, "k": "adapt", "src": "改編自屏東縣大同高中113學年補考題庫", "q": "植物根部吸收的水分與礦物質，分別由哪一種構造運輸？", "o": ["水分：木質部；礦物質：木質部", "水分：木質部；礦物質：韌皮部", "水分：韌皮部；礦物質：木質部", "水分：韌皮部；礦物質：韌皮部"], "a": 0, "e": "礦物質溶在水中，兩者都由木質部運輸。"}, {"id": "sci-4-q091", "u": "4", "t": "4T1", "lv": "b", "s": 1, "k": "key", "src": "講義 p.89 焦點1", "q": "下列何者是維管束的功能？（甲）運輸物質（乙）支持植物體（丙）行光合作用（丁）吸收水分", "o": ["甲乙", "甲丙", "乙丁", "丙丁"], "a": 0, "e": "維管束的功能：負責運輸物質、支持植物體。"}, {"id": "sci-4-q092", "u": "4", "t": "4T1", "lv": "a", "s": 2, "k": "ext", "src": "延伸題", "q": "竹筷子橫切面上可以看到許多小孔，橘瓣上有白色的橘絡，四季豆有一條「絲」。這些都是植物的哪一種構造？", "o": ["維管束", "氣孔", "形成層", "年輪"], "a": 0, "e": "講義焦點 1：葉的紋路、竹筷的孔隙、橘絡、四季豆的絲，都是維管束。"}, {"id": "sci-4-q093", "u": "4", "t": "4T1", "lv": "a", "s": 3, "k": "ext", "src": "延伸題", "q": "某植物的韌皮部被病蟲破壞，但木質部完好。短時間內最先受到影響的是什麼？", "o": ["葉片製造的養分無法送到根", "根無法吸收水分", "葉片無法得到水分", "氣孔無法開閉"], "a": 0, "e": "韌皮部負責運送養分，被破壞後養分送不到根。木質部完好，水分運輸短時間內仍正常。"}, {"id": "sci-4-q094", "u": "4", "t": "4T1", "lv": "a", "s": 2, "k": "ext", "src": "延伸題", "q": "下列關於木質部與韌皮部運輸方向的敘述，何者正確？", "o": ["木質部只能由下往上；韌皮部可上可下", "木質部可上可下；韌皮部只能由上往下", "兩者都只能由下往上", "兩者都可上可下"], "a": 0, "e": "木質部主要靠蒸散作用，方向由下往上；韌皮部依「提供 → 需求」，可由上往下或由下往上。"}, {"id": "sci-4-q095", "u": "4", "t": "4T1", "lv": "a", "s": 3, "k": "ext", "src": "延伸題", "q": "把白色康乃馨的莖插入藍色墨水，一段時間後花瓣變藍。下列敘述何者正確？", "o": ["墨水經莖的木質部向上運送到花", "墨水經韌皮部由上往下運送", "墨水由花瓣表面直接吸收", "墨水經形成層運送"], "a": 0, "e": "講義探究提問：染料經由莖進入植物體，經維管束（木質部）運送到花朵。"}, {"id": "sci-4-q096", "u": "4", "t": "4T2", "lv": "b", "s": 1, "k": "key", "src": "講義 p.90 焦點2", "q": "水稻和玉米莖的維管束排列方式稱為什麼？", "o": ["散生狀", "環狀", "網狀", "放射狀"], "a": 0, "e": "水稻、玉米是單子葉植物，維管束散生。"}, {"id": "sci-4-q097", "u": "4", "t": "4T2", "lv": "a", "s": 2, "k": "adapt", "src": "改編自屏東縣大同高中113學年補考題庫", "q": "甲植物的莖剝除形成層外圍的構造後，根部失去養分而死亡。下列推論何者最合理？", "o": ["甲植物有形成層，是雙子葉植物", "甲植物是單子葉植物", "甲植物沒有韌皮部", "甲植物的莖是散生排列"], "a": 0, "e": "能「剝除形成層外圍」，表示這株植物有形成層 → 雙子葉，維管束環狀。"}, {"id": "sci-4-q098", "u": "4", "t": "4T2", "lv": "a", "s": 2, "k": "ext", "src": "延伸題", "q": "下列哪一組植物的莖都有形成層？", "o": ["榕樹、杜鵑、向日葵", "水稻、玉米、小麥", "玉米、榕樹、水稻", "小麥、向日葵、玉米"], "a": 0, "e": "講義補充：雙子葉植物有形成層，例如榕樹、杜鵑、向日葵。"}, {"id": "sci-4-q099", "u": "4", "t": "4T2", "lv": "a", "s": 3, "k": "ext", "src": "延伸題", "q": "竹子長高以後，莖的粗細幾乎不再增加，但榕樹的樹幹會越長越粗。最主要的原因是什麼？", "o": ["竹子沒有形成層，榕樹有", "竹子沒有維管束", "榕樹的韌皮部比較多", "竹子不行光合作用"], "a": 0, "e": "竹子和稻、玉米一樣是單子葉，維管束散生、沒有形成層，莖不會逐年加粗。"}, {"id": "sci-4-q100", "u": "4", "t": "4T2", "lv": "a", "s": 2, "k": "ext", "src": "延伸題", "q": "關於單子葉與雙子葉植物莖的比較，下列何者正確？", "o": ["兩者的維管束中都有木質部和韌皮部", "只有雙子葉植物有維管束", "單子葉植物的維管束排成環狀", "單子葉植物有形成層"], "a": 0, "e": "兩者都有維管束（含木質部、韌皮部）。差別在排列方式與有無形成層。"}, {"id": "sci-4-q101", "u": "4", "t": "4T2", "lv": "a", "s": 3, "k": "ext", "src": "延伸題", "q": "將南瓜的莖和玉米的莖橫切，滴上紅墨水觀察。下列描述何者正確？", "o": ["南瓜的紅點排成一圈，玉米的紅點散在各處", "兩者紅點都排成一圈", "南瓜紅點散生，玉米紅點排成一圈", "兩者都沒有紅點"], "a": 0, "e": "南瓜是雙子葉，維管束環狀；玉米是單子葉，維管束散生。"}, {"id": "sci-4-q102", "u": "4", "t": "4T3", "lv": "b", "s": 1, "k": "key", "src": "講義 p.90 焦點2", "q": "植物葉片中，木質部與韌皮部的位置分別在哪裡？", "o": ["木質部在上側，韌皮部在下側", "木質部在下側，韌皮部在上側", "兩者都在上側", "兩者都在下側"], "a": 0, "e": "葉：木質部上側、韌皮部下側。莖：木質部內側、韌皮部外側。"}, {"id": "sci-4-q103", "u": "4", "t": "4T3", "lv": "a", "s": 2, "k": "adapt", "src": "改編自屏東縣大同高中113學年補考題庫", "q": "介殼蟲把口器插入莖部吸食汁液，研究人員想分析這些汁液的成分，應選取莖橫切面中的哪一部位？", "o": ["形成層外側的韌皮部", "形成層內側的木質部", "最中心的髓", "最外層的表皮"], "a": 0, "e": "介殼蟲吸食的是含有養分的汁液，來自韌皮部，位於形成層外側。"}, {"id": "sci-4-q104", "u": "4", "t": "4T3", "lv": "a", "s": 3, "k": "ext", "src": "延伸題", "q": "在雙子葉植物的莖中，最老的木質部和最老的韌皮部分別位在哪裡？", "o": ["最老的木質部在最內側；最老的韌皮部在最外側", "兩者都緊貼形成層", "最老的木質部在最外側；最老的韌皮部在最內側", "兩者都在最內側"], "a": 0, "e": "新的細胞都由形成層產生，舊的被往外或往內推：木質部越老越靠中心，韌皮部越老越靠外面。"}, {"id": "sci-4-q105", "u": "4", "t": "4T3", "lv": "a", "s": 2, "k": "ext", "src": "延伸題", "q": "形成層向內和向外分裂，分別產生什麼？", "o": ["向內：木質部；向外：韌皮部", "向內：韌皮部；向外：木質部", "向內：髓；向外：表皮", "兩邊都產生木質部"], "a": 0, "e": "講義表格：形成層向內形成新的木質部，向外形成新的韌皮部。"}, {"id": "sci-4-q106", "u": "4", "t": "4T3", "lv": "a", "s": 3, "k": "ext", "src": "延伸題", "q": "右圖莖的橫切面中（ㄅ在最外側），哪一層的細胞能不斷分裂，使莖逐年加粗？", "o": ["ㄇ", "ㄅ", "ㄆ", "ㄈ"], "a": 0, "e": "讀圖：ㄅ表皮、ㄆ韌皮部、ㄇ形成層、ㄈ木質部。能分裂使莖加粗的是形成層。", "fig": "c4:wedge:ㄅ=epi,ㄆ=phl,ㄇ=cam,ㄈ=xyl"}, {"id": "sci-4-q107", "u": "4", "t": "4T4", "lv": "b", "s": 1, "k": "key", "src": "講義 p.91 焦點3", "q": "樹皮主要的功能是什麼？", "o": ["保護植物體", "行光合作用", "吸收水分", "產生年輪"], "a": 0, "e": "講義：樹皮的功能是保護植物體。"}, {"id": "sci-4-q108", "u": "4", "t": "4T4", "lv": "a", "s": 2, "k": "ext", "src": "延伸題", "q": "樹木遭到環狀剝皮後，各事件發生的先後順序為何？（甲）根部無法吸收水分（乙）韌皮部被破壞（丙）根部缺乏養分而壞死（丁）枝葉枯黃全株死亡", "o": ["乙丙甲丁", "乙甲丙丁", "甲乙丙丁", "丙乙甲丁"], "a": 0, "e": "韌皮部被破壞 → 養分送不到根，根壞死 → 根無法吸水 → 枝葉枯黃全株死亡。"}, {"id": "sci-4-q109", "u": "4", "t": "4T4", "lv": "a", "s": 3, "k": "ext", "src": "延伸題", "q": "樹被環狀剝皮後，為什麼不是立刻死亡，而是「漸漸」枯死？", "o": ["木質部還在運水，要等根缺養分壞死、無法吸水後才枯死", "韌皮部會馬上長回來", "樹皮被剝掉後光合作用變快", "水分改由韌皮部運送"], "a": 0, "e": "環狀剝皮只破壞韌皮部，木質部仍能運水，所以葉子還能活一陣子。等根缺乏養分壞死、無法吸水，才全株枯死。"}, {"id": "sci-4-q110", "u": "4", "t": "4T4", "lv": "a", "s": 2, "k": "ext", "src": "延伸題", "q": "某棵樹被環狀剝皮後，在傷口的「上方」常會出現腫大的現象。最合理的原因是什麼？", "o": ["葉片製造的養分往下運送時被阻擋，堆積在傷口上方", "水分堆積在傷口上方", "根部的養分往上運送時被阻擋", "形成層全部死亡"], "a": 0, "e": "養分由葉片經韌皮部往下運，在剝皮處被切斷，就堆積在傷口上方，使該處腫大。"}, {"id": "sci-4-q111", "u": "4", "t": "4T4", "lv": "a", "s": 2, "k": "ext", "src": "延伸題", "q": "若只在樹幹的一側剝掉一小塊樹皮，而不是剝一整圈，樹木通常不會死亡。原因為何？", "o": ["其他部位的韌皮部仍能把養分送到根", "木質部可以改運養分", "樹皮會在一天內長回來", "根可以自己製造養分"], "a": 0, "e": "環狀剝皮才會把所有往根的養分通道切斷；只剝一部分，其餘的韌皮部仍能運送養分。"}, {"id": "sci-4-q112", "u": "4", "t": "4T5", "lv": "a", "s": 2, "k": "ext", "src": "延伸題", "q": "在木材的橫切面上，一個深色環紋加上一個淺色環紋，大約代表多久的生長？", "o": ["一年", "一個月", "一季", "十年"], "a": 0, "e": "春夏長出淺色、秋冬長出深色，合起來是一年的生長。"}, {"id": "sci-4-q113", "u": "4", "t": "4T5", "lv": "a", "s": 3, "k": "ext", "src": "延伸題", "q": "某棵樹的年輪中，有幾圈特別窄。最可能的原因是什麼？", "o": ["那幾年氣候不佳（例如乾旱），木質部長得少", "那幾年雨量特別多", "那幾年形成層向外分裂比較多", "那幾年樹皮比較厚"], "a": 0, "e": "氣溫低、雨量少，木質部細胞長得慢、長得少，那一年的年輪就比較窄。"}, {"id": "sci-4-q114", "u": "4", "t": "4T5", "lv": "a", "s": 2, "k": "ext", "src": "延伸題", "q": "下列哪一個地區的樹木最不容易看到明顯的年輪？", "o": ["終年多雨、四季如夏的熱帶雨林", "四季分明的溫帶", "有明顯冬季的地區", "乾季和雨季分明的地區"], "a": 0, "e": "講義探究提問：四季明顯的溫帶或乾雨季分明的地區年輪明顯；熱帶雨林全年氣候相似，年輪不明顯。"}, {"id": "sci-4-q115", "u": "4", "t": "4T5", "lv": "b", "s": 1, "k": "key", "src": "講義 p.91 焦點4", "q": "年輪中顏色較深的環紋，是在什麼季節長出來的？", "o": ["秋冬", "春夏", "只有春天", "只有夏天"], "a": 0, "e": "秋冬氣溫低、雨量少，木質部細胞長得慢、體積小、顏色深。"}, {"id": "sci-4-q116", "u": "4", "t": "4T6", "lv": "a", "s": 2, "k": "adapt", "src": "改編自台中市大甲國中114學年補考題庫", "q": "關於植物葉片行光合作用時所產生養分的運輸，下列何者<u>錯誤</u>？", "o": ["運輸方向只能由上往下", "是經由韌皮部來運輸", "可將多的養分運輸至莖或根儲存", "運輸的原則是由提供的地方送至需求的地方"], "a": 0, "e": "養分在韌皮部中可雙向運輸，例如送往莖頂的新芽就是由下往上。"}, {"id": "sci-4-q117", "u": "4", "t": "4T6", "lv": "a", "s": 2, "k": "adapt", "src": "改編自屏東縣大同高中113學年補考題庫", "q": "關於莖內物質運輸方向的敘述，下列何者<u>錯誤</u>？", "o": ["養分只能由上往下運輸", "水分由下往上運輸", "養分可由葉送往根儲存", "根、莖儲存的養分可向上送到新芽"], "a": 0, "e": "養分在韌皮部是雙向運輸；水分在木質部才是單向由下往上。"}, {"id": "sci-4-q118", "u": "4", "t": "4T6", "lv": "b", "s": 1, "k": "key", "src": "講義 p.94 焦點1", "q": "植物體內水分與礦物質的來源是什麼？", "o": ["根部吸收", "光合作用產生", "呼吸作用產生", "氣孔吸收"], "a": 0, "e": "講義表格：水分與礦物質由根部吸收，經木質部運輸。"}, {"id": "sci-4-q119", "u": "4", "t": "4T6", "lv": "a", "s": 3, "k": "ext", "src": "延伸題", "q": "甘蔗的莖很甜，地瓜的根儲存了很多澱粉。這兩個例子說明了什麼？", "o": ["葉片製造的養分可經韌皮部送到莖或根儲存", "莖和根都能行光合作用", "養分是由根從土壤中吸收", "養分由木質部往下運送"], "a": 0, "e": "甘蔗、地瓜的養分都是葉片光合作用製造的，經韌皮部運到莖或根儲存。"}, {"id": "sci-4-q120", "u": "4", "t": "4T6", "lv": "a", "s": 2, "k": "ext", "src": "延伸題", "q": "根部吸收的水，大部分最後去了哪裡？", "o": ["在葉片變成水蒸氣，由氣孔散失", "全部被細胞利用", "全部儲存在根部", "經韌皮部送回根部"], "a": 0, "e": "講義：只有少部分的水供細胞利用，大部分的水變成水蒸氣由氣孔散失。"}, {"id": "sci-4-q121", "u": "4", "t": "4T7", "lv": "b", "s": 1, "k": "key", "src": "講義 p.94 焦點2", "q": "根毛是由根部的哪一種細胞向外突起形成的？", "o": ["表皮細胞", "木質部細胞", "形成層細胞", "葉肉細胞"], "a": 0, "e": "根部的表皮細胞向外突起形成根毛。"}, {"id": "sci-4-q122", "u": "4", "t": "4T7", "lv": "a", "s": 2, "k": "ext", "src": "延伸題", "q": "水分由土壤進入根毛，是利用哪一種作用？", "o": ["擴散作用", "蒸散作用", "光合作用", "呼吸作用"], "a": 0, "e": "講義：水分由土壤（水較多）擴散進入根毛（水較少）。"}, {"id": "sci-4-q123", "u": "4", "t": "4T7", "lv": "a", "s": 2, "k": "adapt", "src": "改編自台中市大甲國中114學年補考題庫", "q": "下列「生物─防止水分散失的構造」配對，何者<u>錯誤</u>？", "o": ["植物─根毛", "人體─皮膚", "昆蟲─外骨骼", "蛇─鱗片"], "a": 0, "e": "根毛的功能是吸收水分和礦物質，不是防止水分散失。植物防止水分散失靠角質層。"}, {"id": "sci-4-q124", "u": "4", "t": "4T7", "lv": "a", "s": 3, "k": "ext", "src": "延伸題", "q": "鮮花剪下後放一段時間才插進水裡，花朵很快就垂頭喪氣。最主要的原因是什麼？", "o": ["切口處的木質部跑進空氣，水柱被打斷，水分無法往上運", "花朵的韌皮部被破壞", "花朵缺少陽光", "花朵的氣孔全部打開"], "a": 0, "e": "講義小提示：木質部像充滿水的吸管，管道中跑進空氣，就妨礙水分運輸。在水中再剪一次莖可以改善。"}, {"id": "sci-4-q125", "u": "4", "t": "4T7", "lv": "a", "s": 2, "k": "ext", "src": "延伸題", "q": "下列何者是根毛的主要功能？", "o": ["增加吸收水分和礦物質的表面積", "製造葡萄糖", "讓水蒸氣散失", "支持植物體"], "a": 0, "e": "根毛突出可以增加吸收水分和礦物質的表面積。"}, {"id": "sci-4-q126", "u": "4", "t": "4T7", "lv": "a", "s": 3, "k": "ext", "src": "延伸題", "q": "下列哪一項<u>不是</u>植物木質部中水分能夠上升的原因？", "o": ["韌皮部把水往上推", "蒸散作用產生拉力", "木質部連成一條充滿水的細管", "水分子之間有拉力"], "a": 0, "e": "水分上升靠毛細管、水分子間的拉力、蒸散作用的拉力。韌皮部運送的是養分。"}, {"id": "sci-4-q127", "u": "4", "t": "4T8", "lv": "a", "s": 2, "k": "adapt", "src": "改編自台中市三光國中114學年補行評量題庫", "q": "有關氣孔的敘述，下列何者<u>錯誤</u>？", "o": ["陸生植物的氣孔大多位於葉片的上表皮", "氣孔為水分蒸散的門戶", "氣孔為氣體出入植物的通道", "氣孔由一對保衛細胞控制開閉"], "a": 0, "e": "陸生植物的氣孔大多位於葉片的下表皮。"}, {"id": "sci-4-q128", "u": "4", "t": "4T8", "lv": "a", "s": 2, "k": "adapt", "src": "改編自屏東縣大同高中113學年補考題庫", "q": "白天蒸散作用旺盛時，植物體內水分的運輸方向與氣孔的狀態為何？", "o": ["水分由下往上；氣孔打開", "水分由上往下；氣孔打開", "水分由下往上；氣孔關閉", "水分由上往下；氣孔關閉"], "a": 0, "e": "蒸散旺盛時氣孔打開，水蒸氣散失，把木質部的水由下往上拉。"}, {"id": "sci-4-q129", "u": "4", "t": "4T8", "lv": "b", "s": 1, "k": "key", "src": "講義 p.95 氣孔", "q": "氣孔是哪些物質進出植物的主要門戶？", "o": ["水蒸氣、氧氣、二氧化碳", "葡萄糖、水", "礦物質、水", "澱粉、氧氣"], "a": 0, "e": "氣孔是水分散失、氧氣和二氧化碳進出植物的主要門戶。"}, {"id": "sci-4-q130", "u": "4", "t": "4T8", "lv": "a", "s": 3, "k": "ext", "src": "延伸題", "q": "炎熱的中午，植物缺水時氣孔關閉。這對植物有什麼好處和壞處？", "o": ["好處：減少水分散失；壞處：二氧化碳不易進入，光合作用變慢", "好處：光合作用變快；壞處：水分散失增加", "好處：吸收更多水；壞處：氧氣無法排出", "沒有任何影響"], "a": 0, "e": "氣孔關閉可以保住水分，但光合作用需要的二氧化碳也進不來，光合作用變慢。"}, {"id": "sci-4-q131", "u": "4", "t": "4T8", "lv": "a", "s": 2, "k": "ext", "src": "延伸題", "q": "藍色氯化亞鈷試紙貼在葉片上，變成粉紅色代表什麼？", "o": ["有水分（水蒸氣）由葉片散失", "有氧氣產生", "有澱粉", "有二氧化碳進入"], "a": 0, "e": "氯化亞鈷試紙遇水由藍色變粉紅色，可用來檢測蒸散作用散失的水分。"}, {"id": "sci-4-q132", "u": "4", "t": "4T9", "lv": "a", "s": 2, "k": "ext", "src": "延伸題", "q": "芹菜實驗中，要在水中切取葉柄再迅速放入量筒，主要目的是什麼？", "o": ["避免空氣進入木質部，影響水分運輸", "讓葉柄長得更快", "讓葉片行光合作用", "洗掉葉柄上的灰塵"], "a": 0, "e": "在水中切可以避免空氣跑進木質部而阻斷水柱。"}, {"id": "sci-4-q133", "u": "4", "t": "4T9", "lv": "a", "s": 2, "k": "ext", "src": "延伸題", "q": "芹菜實驗結果：甲（有葉）30 分鐘水量由 10.0 mL 降為 7.9 mL；乙（無葉）由 10.0 mL 降為 9.5 mL。甲比乙多散失多少水？", "o": ["1.6 mL", "2.1 mL", "0.5 mL", "2.6 mL"], "a": 0, "e": "甲減少 10.0 − 7.9 ＝ 2.1 mL；乙減少 10.0 − 9.5 ＝ 0.5 mL；相差 2.1 − 0.5 ＝ 1.6 mL。"}, {"id": "sci-4-q134", "u": "4", "t": "4T9", "lv": "a", "s": 3, "k": "ext", "src": "延伸題", "q": "在芹菜實驗中，「葉片的有無」是什麼變因？「量筒的水量變化」又是什麼變因？", "o": ["操縱變因；應變變因", "應變變因；操縱變因", "控制變因；操縱變因", "操縱變因；控制變因"], "a": 0, "e": "實驗中故意改變的是操縱變因（葉片有無），因此改變而測量的結果是應變變因（水量變化）。"}, {"id": "sci-4-q135", "u": "4", "t": "4T9", "lv": "a", "s": 2, "k": "ext", "src": "延伸題", "q": "芹菜葉柄插入紅墨水後，以放大鏡觀察葉片，會看到什麼？", "o": ["葉脈的地方出現紅色或深色紋路", "葉片整片變白", "葉片表面出現紅色水滴", "葉片沒有任何變化"], "a": 0, "e": "紅墨水經木質部運到葉脈，所以葉脈的紋路會變色。"}, {"id": "sci-4-q136", "u": "4", "t": "4T9", "lv": "a", "s": 3, "k": "ext", "src": "延伸題", "q": "把兩枝相同的帶葉芹菜分別放在 10°C 和 30°C 的恆溫箱中，其他條件相同，測量水量變化。這個實驗的操縱變因是什麼？", "o": ["溫度", "葉片數量", "芹菜長度", "水量"], "a": 0, "e": "講義探究提問：比較不同溫度對蒸散的影響，溫度是操縱變因，其他條件都要相同。"}, {"id": "sci-4-q137", "u": "4", "t": "4T10", "lv": "b", "s": 1, "k": "key", "src": "講義 p.101 焦點2", "q": "心臟位於胸腔的哪個位置？主要由什麼組成？", "o": ["中央偏左；肌肉", "中央偏右；骨骼", "中央偏左；骨骼", "右下方；脂肪"], "a": 0, "e": "心臟位於胸腔中央偏左，由肌肉構成。"}, {"id": "sci-4-q138", "u": "4", "t": "4T10", "lv": "b", "s": 2, "k": "key", "src": "講義 p.101 焦點2", "q": "下列血管與心臟腔室的連接，何者正確？", "o": ["肺靜脈─左心房", "主動脈─右心室", "上、下大靜脈─左心房", "肺動脈─左心室"], "a": 0, "e": "主動脈─左心室；肺動脈─右心室；大靜脈─右心房；肺靜脈─左心房。"}, {"id": "sci-4-q139", "u": "4", "t": "4T10", "lv": "a", "s": 2, "k": "adapt", "src": "改編自台中市大甲國中114學年補考題庫", "q": "人體心臟中，哪兩處之間有瓣膜，可防止血液逆流？", "o": ["心房與心室之間、心室與動脈之間", "心房與心房之間", "心室與心室之間", "心房與靜脈之間"], "a": 0, "e": "講義：瓣膜位於心房與心室之間、心室與動脈之間。"}, {"id": "sci-4-q140", "u": "4", "t": "4T10", "lv": "a", "s": 2, "k": "ext", "src": "延伸題", "q": "與心室相連的血管都叫做什麼？與心房相連的血管都叫做什麼？", "o": ["動脈；靜脈", "靜脈；動脈", "微血管；動脈", "都叫動脈"], "a": 0, "e": "動脈與心室相連（血液離開心臟），靜脈與心房相連（血液流回心臟）。"}, {"id": "sci-4-q141", "u": "4", "t": "4T10", "lv": "a", "s": 3, "k": "ext", "src": "延伸題", "q": "看別人的心臟圖時，圖上標示的「左心室」通常畫在觀看者的哪一側？", "o": ["右側", "左側", "正中央", "上方"], "a": 0, "e": "心臟圖以本人身體為準，面對面看時左右相反，所以左心室畫在觀看者的右側。"}, {"id": "sci-4-q142", "u": "4", "t": "4T11", "lv": "a", "s": 2, "k": "ext", "src": "延伸題", "q": "心臟收縮時，下列敘述何者正確？", "o": ["血液由心室流入動脈，心房與心室間的瓣膜關閉", "心房與心室間的瓣膜打開，血液流入心室", "心室與動脈間的瓣膜關閉", "血液由動脈流回心室"], "a": 0, "e": "收縮：心室 → 動脈，心房與心室間的瓣膜關閉，防止血液逆流回心房。"}, {"id": "sci-4-q143", "u": "4", "t": "4T11", "lv": "a", "s": 2, "k": "adapt", "src": "改編自台中市三光國中114學年補行評量題庫", "q": "孟哲用健康管理 App 記錄睡眠時的心搏數，下列哪一個數值最合理？", "o": ["每分鐘 72 次", "每分鐘 7 次", "每分鐘 9 次", "每分鐘 300 次"], "a": 0, "e": "延伸學習：正常人在休息狀態下，心跳平均每分鐘約 72 下。"}, {"id": "sci-4-q144", "u": "4", "t": "4T11", "lv": "a", "s": 3, "k": "ext", "src": "延伸題", "q": "某人量脈搏 15 秒共跳 20 次，他的心跳每分鐘約幾次？", "o": ["80", "20", "60", "120"], "a": 0, "e": "1 分鐘 ＝ 4 個 15 秒：20 × 4 ＝ 80 次。脈搏次數等於心跳次數。"}, {"id": "sci-4-q145", "u": "4", "t": "4T11", "lv": "a", "s": 2, "k": "ext", "src": "延伸題", "q": "用聽診器聽心音，每次心跳可以聽到兩個心音。心音是怎麼產生的？", "o": ["瓣膜關閉後，血液衝擊瓣膜與心壁所產生", "血液流過微血管的聲音", "肺部吸氣的聲音", "動脈管壁破裂的聲音"], "a": 0, "e": "講義：心音是心搏時瓣膜關閉後，血液衝擊瓣膜與心壁肌肉產生的聲音。"}, {"id": "sci-4-q146", "u": "4", "t": "4T11", "lv": "a", "s": 3, "k": "ext", "src": "延伸題", "q": "某人每分鐘心跳 80 下，每次心臟送出約 70 毫升血液，每分鐘心臟輸出的血量約為多少？", "o": ["5.6 公升", "5.6 毫升", "56 公升", "0.56 公升"], "a": 0, "e": "80 × 70 ＝ 5600 毫升 ＝ 5.6 公升。"}, {"id": "sci-4-q147", "u": "4", "t": "4T11", "lv": "a", "s": 2, "k": "ext", "src": "延伸題", "q": "測量脈搏時，通常用食指和中指輕按手腕靠近大拇指的一側，按的是哪一種血管？", "o": ["動脈", "靜脈", "微血管", "淋巴管"], "a": 0, "e": "脈搏是動脈管壁隨心搏擴張、復原的現象，手腕靠近大拇指一側有靠近體表的較大動脈。"}, {"id": "sci-4-q148", "u": "4", "t": "4T12", "lv": "a", "s": 2, "k": "adapt", "src": "改編自台中市大甲國中114學年補考題庫", "q": "關於血管的比較，下列何者正確？", "o": ["管壁厚薄：動脈＞靜脈＞微血管", "彈性：靜脈＞動脈＞微血管", "血壓：靜脈＞動脈＞微血管", "流速：微血管＞動脈＞靜脈"], "a": 0, "e": "管壁：動脈最厚、靜脈次之、微血管最薄（一層細胞）。彈性和血壓都是動脈最高；流速微血管最慢。"}, {"id": "sci-4-q149", "u": "4", "t": "4T12", "lv": "a", "s": 1, "k": "adapt", "src": "改編自台中市大甲國中114學年補考題庫", "q": "到醫院抽血或捐血時，通常是從哪一種血管抽取血液？", "o": ["靜脈", "動脈", "微血管", "心臟"], "a": 0, "e": "講義探究提問：抽血通常從靜脈抽取。"}, {"id": "sci-4-q150", "u": "4", "t": "4T12", "lv": "b", "s": 2, "k": "key", "src": "講義 p.102 血管", "q": "血液與組織細胞之間交換物質的場所是哪一種血管？", "o": ["微血管", "動脈", "靜脈", "主動脈"], "a": 0, "e": "微血管管壁只有一層細胞，是血液與組織細胞交換物質的場所。"}, {"id": "sci-4-q151", "u": "4", "t": "4T12", "lv": "a", "s": 2, "k": "ext", "src": "延伸題", "q": "下列哪一種血管內有瓣膜，可以防止血液逆流？", "o": ["靜脈", "動脈", "微血管", "三種都有"], "a": 0, "e": "講義表格：只有靜脈有瓣膜。靜脈血壓最低，需要瓣膜防止血液倒流。"}, {"id": "sci-4-q152", "u": "4", "t": "4T12", "lv": "a", "s": 3, "k": "ext", "src": "延伸題", "q": "觀察魚的尾鰭時，選擇尾鰭的主要原因是什麼？", "o": ["尾鰭薄而平，光線容易穿透，看得到血液流動", "尾鰭的血管最粗", "尾鰭沒有血管", "尾鰭的血液流得最快"], "a": 0, "e": "講義活動觀察結果：魚尾鰭較薄且平，容易使光線穿透而觀察到血流。"}, {"id": "sci-4-q153", "u": "4", "t": "4T12", "lv": "a", "s": 3, "k": "ext", "src": "延伸題", "q": "在魚尾鰭的觀察中，血液由甲血管流入最細的血管，再匯入丙血管。下列敘述何者正確？", "o": ["甲是小動脈，丙是小靜脈", "甲是小靜脈，丙是小動脈", "甲、丙都是微血管", "無法判斷"], "a": 0, "e": "流進微血管之前的是小動脈，流出微血管之後的是小靜脈。"}, {"id": "sci-4-q154", "u": "4", "t": "4T13", "lv": "a", "s": 2, "k": "adapt", "src": "改編自台中市大甲國中114學年補考題庫", "q": "關於血球的比較，下列何者正確？", "o": ["體積：白血球＞紅血球＞血小板", "數量：血小板＞白血球＞紅血球", "體積：紅血球＞白血球＞血小板", "數量：白血球＞紅血球＞血小板"], "a": 0, "e": "體積：白血球最大、紅血球中等、血小板最小。數量：紅血球最多、血小板中等、白血球最少。"}, {"id": "sci-4-q155", "u": "4", "t": "4T13", "lv": "a", "s": 2, "k": "ext", "src": "延伸題", "q": "血液放在試管中靜置後會分層。最上層淡黃色的液體和最下層的紅色部分分別是什麼？", "o": ["血漿；紅血球", "紅血球；血漿", "白血球；血小板", "血小板；白血球"], "a": 0, "e": "講義圖示：上層淡黃色是血漿，下層是紅血球，中間薄薄一層是白血球和血小板。"}, {"id": "sci-4-q156", "u": "4", "t": "4T13", "lv": "a", "s": 2, "k": "ext", "src": "延伸題", "q": "受傷流血一段時間後，傷口會自然止血，主要和哪一種血液成分有關？", "o": ["血小板", "紅血球", "白血球", "血漿中的水"], "a": 0, "e": "血小板幫助血液凝固，防止失血過多。"}, {"id": "sci-4-q157", "u": "4", "t": "4T13", "lv": "a", "s": 3, "k": "ext", "src": "延伸題", "q": "某人的血液檢查：紅血球明顯低於正常值，其他項目正常。他最可能出現什麼情形？", "o": ["容易疲倦、頭暈（貧血），身體得到的氧氣較少", "傷口血流不止", "容易細菌感染", "血壓很高"], "a": 0, "e": "紅血球負責攜帶氧氣，數量不足時細胞得到的氧氣少，容易疲倦、頭暈。"}, {"id": "sci-4-q158", "u": "4", "t": "4T13", "lv": "a", "s": 2, "k": "ext", "src": "延伸題", "q": "下列物質中，哪一個<u>不是</u>由血漿運送的？", "o": ["氧氣", "養分", "激素", "二氧化碳和廢物"], "a": 0, "e": "血漿運送養分、廢物、二氧化碳、抗體、激素。氧氣主要由紅血球中的血紅素攜帶。"}, {"id": "sci-4-q159", "u": "4", "t": "4T5", "lv": "a", "s": 3, "k": "ext", "src": "延伸題", "q": "某段木材的橫切面上，從中心往外數共有 12 個深色環紋。若這棵樹生長在四季分明的地區，下列推論何者最合理？", "o": ["這段樹幹大約生長了 12 年", "這段樹幹生長了 24 年", "這段樹幹生長了 6 年", "深色環紋是韌皮部，無法推算"], "a": 0, "e": "四季分明的地區，每年長出一淺一深的環紋，12 個深色環紋約代表 12 年。"}, {"id": "sci-4-q160", "u": "4", "t": "4T5", "lv": "a", "s": 3, "k": "ext", "src": "延伸題", "q": "下列關於木材的敘述，何者正確？", "o": ["木材越靠中心，細胞形成的時間越早", "木材是形成層向外產生的", "木材中所有細胞都還在運輸水分", "木材主要由韌皮部細胞組成"], "a": 0, "e": "形成層每年向內產生新的木質部，舊的被推向中心，所以越靠中心越早形成；中心的老細胞多已失去運輸功能。"}, {"id": "sci-4-q161", "u": "4", "t": "4T6", "lv": "a", "s": 3, "k": "ext", "src": "延伸題", "q": "甲：把葉片照光後的養分去向用放射性物質標記，發現標記同時出現在根部和莖頂新芽。這個結果說明什麼？", "o": ["韌皮部可以雙向運輸養分", "木質部可以雙向運輸", "養分只能往下送", "新芽的養分來自根毛吸收"], "a": 0, "e": "養分依「提供 → 需求」運送，同時往下送到根、往上送到新芽，說明韌皮部雙向運輸。"}, {"id": "sci-4-q162", "u": "4", "t": "4T8", "lv": "a", "s": 3, "k": "ext", "src": "延伸題", "q": "同一株植物，下列哪一種情況下氣孔最可能打開、蒸散最旺盛？", "o": ["晴朗白天，土壤水分充足", "晴朗白天，土壤非常乾燥", "夜晚，土壤水分充足", "夜晚，土壤非常乾燥"], "a": 0, "e": "氣孔在白天、水分充足時打開；缺水時即使白天也會關閉；夜晚通常關閉。"}, {"id": "sci-4-q163", "u": "4", "t": "4T10", "lv": "a", "s": 3, "k": "ext", "src": "延伸題", "q": "若某人心臟的左心房與左心室之間的瓣膜無法完全關閉，心室收縮時最可能發生什麼事？", "o": ["部分血液逆流回左心房", "血液無法進入左心房", "主動脈的血液逆流回左心室", "右心室的血液流入左心室"], "a": 0, "e": "心房與心室間的瓣膜負責在心室收縮時防止血液逆流回心房；關不緊時，部分血液就會逆流回左心房。"}, {"id": "sci-4-q164", "u": "4", "t": "4T12", "lv": "a", "s": 3, "k": "ext", "src": "延伸題", "q": "動脈管壁最厚、彈性最好，這和它的哪一個特性最有關係？", "o": ["動脈直接承受心室收縮送出的高壓血流", "動脈的血液流得最慢", "動脈內有瓣膜", "動脈是物質交換的場所"], "a": 0, "e": "心室收縮時把血液壓入動脈，動脈的血壓最高，需要厚而有彈性的管壁承受壓力（也因此產生脈搏）。"}, {"id": "sci-4-q165", "u": "4", "t": "4T13", "lv": "a", "s": 3, "k": "ext", "src": "延伸題", "q": "白血球比紅血球大，卻能離開血管到組織中吞噬細菌，原因是什麼？", "o": ["白血球可以變形穿過微血管壁", "白血球有血紅素", "微血管壁上有很大的洞", "白血球是由組織細胞產生的"], "a": 0, "e": "講義圖示：白血球可以變形穿過微血管壁，到組織中吞噬病原體。"}, {"id": "sci-4-q166", "u": "4", "t": "4T11", "lv": "a", "s": 3, "k": "ext", "src": "延伸題", "q": "運動時心跳加快，對身體最主要的意義是什麼？", "o": ["加快運送氧氣和養分給肌肉，並帶走二氧化碳與廢物", "讓血液變少", "讓肌肉不需要氧氣", "讓心臟休息"], "a": 0, "e": "講義實驗討論：運動後身體需要更多氧氣與養分，並迅速排出二氧化碳與廢物，所以心搏加快。"}, {"id": "sci-4-q167", "u": "4", "t": "4T6", "lv": "a", "s": 2, "k": "adapt", "src": "改編自桃園市文昌國中109學年七年級第二次段考", "q": "楓樹初春時從樹幹割開缺口收集甜甜的樹液，熬成楓糖漿。下列敘述何者<u>不正確</u>？", "o": ["楓糖漿的主要成分是澱粉", "葉片行光合作用產生葡萄糖", "葡萄糖可經由韌皮部運送", "根、莖可將葡萄糖轉變為澱粉儲存"], "a": 0, "e": "楓糖漿是甜的，主要成分是糖（由儲存的澱粉轉回的醣類），不是澱粉。其他三項都是養分製造、運輸、儲存的正確說法。"}, {"id": "sci-4-q168", "u": "4", "t": "4T1", "lv": "a", "s": 2, "k": "adapt", "src": "改編自桃園市文昌國中109學年七年級第二次段考", "q": "要收集楓樹含糖的樹液，在樹幹上割的缺口至少要深到哪一層？", "o": ["韌皮部", "表皮", "樹幹中心的木質部", "髓"], "a": 0, "e": "甜的樹液含有養分，在韌皮部中運輸。韌皮部在形成層外側，割到韌皮部就能流出含糖樹液。"}, {"id": "sci-4-q169", "u": "4", "t": "4T1", "lv": "a", "s": 1, "k": "adapt", "src": "改編自臺北市中山國中109學年七年級第二次段考", "q": "為了讓水蜜桃長得又大又甜，農夫施加水溶性肥料並澆水。肥料和水分分別由哪一種組織運輸？", "o": ["兩者都由木質部由下往上運輸", "肥料由韌皮部、水分由木質部運輸", "肥料由木質部、水分由韌皮部運輸", "兩者都由韌皮部雙向運輸"], "a": 0, "e": "肥料是礦物質，溶在水中，和水一起由木質部從根往上運輸。"}, {"id": "sci-4-q170", "u": "4", "t": "4T3", "lv": "a", "s": 2, "k": "adapt", "src": "改編自臺北市中山國中109學年七年級第二次段考", "q": "關於黑板樹（雙子葉木本植物）維管束的敘述，下列何者正確？", "o": ["莖的木質部在內側、韌皮部在外側", "木質部單向運輸養分，韌皮部雙向運輸水分", "葉脈的木質部在下側、韌皮部在上側", "木本植物莖中，木質部體積比韌皮部少"], "a": 0, "e": "莖：木內韌外；葉：木上韌下。木質部運水、韌皮部運養分。木本植物的莖大部分是逐年累積的木質部（木材）。"}, {"id": "sci-4-q171", "u": "4", "t": "4T5", "lv": "a", "s": 3, "k": "adapt", "src": "改編自臺北市中山國中109學年七年級第二次段考", "q": "神木樹幹中央已腐朽中空，仍能運輸物質。樹幹橫切面由外而內為：甲（樹皮，含韌皮部）、乙（靠近形成層的木質部）、丙（中心的木質部）。下列何者正確？", "o": ["腐朽的是丙，仍有甲運送養分、乙運送水分", "腐朽的是甲，仍有乙、丙運輸", "腐朽的是乙和丙，改由甲運送水分", "腐朽的是丙，只剩乙運送水分和養分"], "a": 0, "e": "中心老木質部（丙）早已失去運輸功能，腐朽了也不影響。養分靠樹皮中的韌皮部（甲），水分靠靠近形成層的新木質部（乙）。"}, {"id": "sci-4-q172", "u": "4", "t": "4T5", "lv": "a", "s": 2, "k": "adapt", "src": "改編自臺北市中山國中109學年七年級第二次段考", "q": "樹幹橫切面上有深淺交替的環紋，下列敘述何者正確？", "o": ["深色部分的細胞比淺色部分小", "環紋是木質部與韌皮部交替形成的", "深色細胞是在春夏產生的", "環紋部分的功能是運輸養分"], "a": 0, "e": "年輪是木質部細胞大小不同造成的：秋冬細胞小、顏色深；春夏細胞大、顏色淺。木質部運的是水分。"}, {"id": "sci-4-q173", "u": "4", "t": "4T3", "lv": "a", "s": 2, "k": "adapt", "src": "改編自彰化縣大同國中106學年七年級第二次段考", "q": "美人樹的莖有形成層。（甲）新的木質部（乙）老的木質部（丙）新的韌皮部（丁）老的韌皮部，由內而外的排列順序為何？", "o": ["乙甲丙丁", "丁丙甲乙", "甲乙丙丁", "丁丙乙甲"], "a": 0, "e": "由內而外：老木質部（最靠中心）→ 新木質部 → 形成層 → 新韌皮部 → 老韌皮部（最外）。注意題目問的是「由內而外」。"}, {"id": "sci-4-q174", "u": "4", "t": "4T3", "lv": "a", "s": 3, "k": "adapt", "src": "改編自彰化縣大同國中106學年七年級第二次段考", "q": "科學家在葉脈的某一半注射黑色物質，結果莖的韌皮部最先被染黑。注射的位置最可能在哪裡？", "o": ["葉脈的下半部", "葉脈的上半部", "葉肉", "葉的上表皮"], "a": 0, "e": "葉脈：木質部在上、韌皮部在下。韌皮部會把葉的物質往下送到莖，所以注射在葉脈下半部（韌皮部），莖的韌皮部會先染黑。"}, {"id": "sci-4-q175", "u": "4", "t": "4T1", "lv": "a", "s": 2, "k": "adapt", "src": "改編自彰化縣大同國中106學年七年級第二次段考", "q": "在葉脈的上半部（木質部）注射紅色染料，莖中的木質部卻一直沒有變紅。這說明木質部的運輸方向為何？", "o": ["由根往葉，由下往上", "由葉往根，由上往下", "橫向運輸", "上下皆可"], "a": 0, "e": "木質部的水分只能由下往上運，所以葉片中的染料不會往下流到莖的木質部。"}, {"id": "sci-4-q176", "u": "4", "t": "4T2", "lv": "a", "s": 3, "k": "adapt", "src": "改編自彰化縣大同國中106學年七年級第二次段考", "q": "下列哪一種植物的莖，維管束和玉米一樣呈散生排列？", "o": ["檳榔樹", "榕樹", "向日葵", "杜鵑"], "a": 0, "e": "檳榔樹屬於單子葉植物（棕櫚類），維管束散生、沒有形成層，所以樹幹不太會變粗。榕樹、向日葵、杜鵑是雙子葉，環狀排列。"}, {"id": "sci-4-q177", "u": "4", "t": "4T8", "lv": "a", "s": 2, "k": "adapt", "src": "改編自彰化縣大同國中106學年七年級第二次段考", "q": "觀察陸生植物葉的下表皮：a 為一對保衛細胞、b 為中間的氣孔、c 為周圍的表皮細胞。下列何者正確？", "o": ["a 能調節 b 的開閉", "c 是花瓣細胞", "白天有光時 b 一定打開", "水分通常由 b 進入葉片"], "a": 0, "e": "保衛細胞控制氣孔開閉。缺水時白天氣孔也會關閉；水分由根吸收，氣孔是水蒸氣散失的門戶。"}, {"id": "sci-4-q178", "u": "4", "t": "4T4", "lv": "a", "s": 2, "k": "adapt", "src": "改編自彰化縣大同國中106學年七年級第二次段考", "q": "柳杉被環狀剝皮後漸漸死亡。（甲）葉細胞枯死（乙）根細胞死亡（丙）水分運送受阻（丁）養分運送受阻。依發生先後排列為何？", "o": ["丁乙丙甲", "甲乙丙丁", "乙丙甲丁", "丁丙乙甲"], "a": 0, "e": "韌皮部被破壞 → 養分運送受阻（丁）→ 根缺養分死亡（乙）→ 根無法吸水，水分運送受阻（丙）→ 葉細胞枯死（甲）。"}, {"id": "sci-4-q179", "u": "4", "t": "4T6", "lv": "a", "s": 1, "k": "adapt", "src": "改編自彰化縣大同國中106學年七年級第二次段考；改編自臺中市大甲國中113學年補考題庫", "q": "木棉樹冬季落葉，春天在長出新葉以前就先開花。開花所需的養分主要來自哪裡？", "o": ["根、莖之前儲存的養分", "根部從土壤吸收的養分", "只需要水分就夠了", "樹枝自己製造的養分"], "a": 0, "e": "沒有葉子就不能行光合作用；花的養分來自之前儲存在根、莖的養分，經韌皮部往上送到花。"}, {"id": "sci-4-q180", "u": "4", "t": "4T7", "lv": "a", "s": 2, "k": "adapt", "src": "改編自彰化縣大同國中106學年七年級第二次段考", "q": "關於植物根毛的功能，下列何者正確？", "o": ["可吸收溶在水中的肥料", "由木質部細胞突出形成", "可增加吸收葡萄糖的表面積", "可以行光合作用"], "a": 0, "e": "根毛由根部表皮細胞突出形成，吸收水分和溶在水中的礦物質（肥料）；不吸收葡萄糖，也沒有葉綠體。"}, {"id": "sci-4-q181", "u": "4", "t": "4T8", "lv": "a", "s": 3, "k": "adapt", "src": "改編自彰化縣大同國中106學年七年級第二次段考", "q": "關於移植樹木的建議與主要原因，下列哪一組<u>不相符</u>？", "o": ["剪除部分枝葉 → 幫助莖內水分上升到葉", "選在傍晚或夜晚移植 → 減少蒸散", "保留根部周圍的土 → 避免傷害根和根毛", "移植後不立即施高濃度肥料 → 避免根部水分流失"], "a": 0, "e": "剪除枝葉是為了減少蒸散、避免缺水，不是為了幫水分上升。事實上葉片減少，蒸散的拉力也會變小。"}, {"id": "sci-4-q182", "u": "4", "t": "4T5", "lv": "a", "s": 3, "k": "adapt", "src": "改編自彰化縣大同國中106學年七年級第二次段考", "q": "某溫帶地區的樹，年輪中有一條深色紋路是 2024 年秋冬形成的。往外數的下一條深色紋路，最可能在何時形成？", "o": ["2025 年秋冬", "2025 年春夏", "2024 年春夏", "2026 年秋冬"], "a": 0, "e": "形成層每年向外側新增木質部（新的在外）。下一條深色紋路是隔年秋冬形成的，中間夾著 2025 年春夏的淺色紋路。"}, {"id": "sci-4-q183", "u": "4", "t": "4T9", "lv": "a", "s": 2, "k": "adapt", "src": "改編自彰化縣大同國中106學年七年級第二次段考", "q": "甲、乙量筒各插一枝芹菜，乙的葉片全部摘除。液面讀數（0、10、20、30 分鐘）：甲 10、8.9、7.5、6.8 mL；乙 10、9.9、9.8、9.7 mL。結果支持下列哪一敘述？", "o": ["蒸散作用與葉片有關", "蒸散作用需要光", "呼吸作用需要水", "呼吸作用與葉片有關"], "a": 0, "e": "兩組只差葉片有無，甲少了 3.2 mL、乙只少 0.3 mL，說明水分散失（蒸散）與葉片有關。"}, {"id": "sci-4-q184", "u": "4", "t": "4T9", "lv": "a", "s": 2, "k": "adapt", "src": "改編自桃園市文昌國中109學年七年級第二次段考", "q": "把植物插在墨水中，墨水只上升到莖的一半。下列哪一種做法<u>無法</u>加快墨水上升的速度？", "o": ["去除多餘的葉片", "放在通風處", "放在陽光下", "在白天進行"], "a": 0, "e": "風、陽光、白天都會使蒸散加快，水分上升更快。去除葉片會減少蒸散，上升反而變慢。"}, {"id": "sci-4-q185", "u": "4", "t": "4T6", "lv": "a", "s": 2, "k": "adapt", "src": "改編自112年國中教育會考", "q": "維管束植物進行某代謝作用：「甲＋二氧化碳 → 氧氣＋乙＋水」。甲的名稱及在植物體內主要由哪一種構造運送？", "o": ["水，由木質部運送", "水，由韌皮部運送", "葡萄糖，由木質部運送", "葡萄糖，由韌皮部運送"], "a": 0, "e": "這是光合作用：水＋二氧化碳 → 氧氣＋葡萄糖＋水，所以甲是水，由木質部運送。乙是葡萄糖，才由韌皮部運送。"}, {"id": "sci-4-q186", "u": "4", "t": "4T12", "lv": "a", "s": 3, "k": "adapt", "src": "改編自112年國中教育會考", "q": "以複式顯微鏡觀察小魚尾鰭，視野中由左到右依序是小動脈、微血管、小靜脈。若將培養皿緩慢往左移動，視野中的血管會依序消失，順序為何？", "o": ["小靜脈、微血管、小動脈", "小動脈、微血管、小靜脈", "小動脈、小靜脈、微血管", "小靜脈、小動脈、微血管"], "a": 0, "e": "複式顯微鏡的影像和實物上下左右相反：培養皿往左移，影像就往右移，最右邊的小靜脈最先移出視野，接著是微血管，最後是小動脈。"}, {"id": "sci-4-q187", "u": "4", "t": "4T12", "lv": "a", "s": 3, "k": "adapt", "src": "改編自臺北市中山國中109學年七年級第二次段考", "q": "（甲）打點滴（乙）中醫把脈（丙）抽血（丁）量血壓（戊）輸血。與「靜脈」有關的共有幾項？", "o": ["3 項", "4 項", "2 項", "1 項"], "a": 0, "e": "打點滴、抽血、輸血都使用靜脈（甲、丙、戊）。把脈摸的是動脈；量血壓量的也是動脈的壓力。"}, {"id": "sci-4-q188", "u": "4", "t": "4T12", "lv": "a", "s": 2, "k": "adapt", "src": "改編自臺北市民族實驗國中110學年七年級評量", "q": "捐血時從 A 血管抽血，輸血時把血液輸入 B 血管。A、B 依序是哪一種血管？", "o": ["皆為靜脈", "動脈、靜脈", "靜脈、動脈", "皆為動脈"], "a": 0, "e": "靜脈血壓低、靠近體表、管壁較薄，抽血和輸血都使用靜脈。"}, {"id": "sci-4-q189", "u": "4", "t": "4T13", "lv": "a", "s": 2, "k": "adapt", "src": "改編自臺北市中山國中109學年七年級第二次段考", "q": "關於三種血球的敘述，下列何者<u>錯誤</u>？", "o": ["紅血球運送氧氣，白血球運送二氧化碳", "大小：白血球＞紅血球＞血小板", "數目：紅血球＞血小板＞白血球", "成熟的血球中只有白血球有細胞核"], "a": 0, "e": "白血球的功能是吞噬病原體，不是運送二氧化碳；二氧化碳主要溶在血漿中運送。"}, {"id": "sci-4-q190", "u": "4", "t": "4T13", "lv": "a", "s": 2, "k": "adapt", "src": "改編自臺北市中山國中109學年七年級第二次段考", "q": "血液靜置後分為兩層：上層甲為淡黃色液體，下層乙為紅色。下列何者正確？", "o": ["甲的主要成分是水，乙呈紅色是因為紅血球", "甲是血球，乙是血漿", "甲負責運送氧氣", "甲中含有大量紅血球"], "a": 0, "e": "上層淡黃色是血漿（主要成分是水），下層紅色是紅血球（含血紅素）。氧氣主要由紅血球攜帶。"}, {"id": "sci-4-q191", "u": "4", "t": "4T13", "lv": "a", "s": 2, "k": "adapt", "src": "改編自桃園市文昌國中109學年七年級第二次段考", "q": "劉老師的血液檢查：紅血球 350 萬（正常 420～540 萬）、白血球 7000（正常 5000～10000）、血小板 25 萬（正常 15～40 萬）。他最可能的情況為何？", "o": ["紅血球偏低，可能貧血", "白血球偏低，有細菌感染", "血小板偏低，凝血不良", "各項都正常"], "a": 0, "e": "只有紅血球低於正常範圍。紅血球負責攜帶氧氣，太少會貧血，容易疲倦頭暈。"}, {"id": "sci-4-q192", "u": "4", "t": "4T11", "lv": "a", "s": 2, "k": "adapt", "src": "改編自桃園市文昌國中109學年七年級第二次段考", "q": "心跳聲（心音）主要和心臟的哪一種構造有關？這種構造最重要的功能是什麼？", "o": ["瓣膜；控制血液流動的方向", "心房；提高血壓", "心室；產生心跳聲", "主動脈；增加血流速度"], "a": 0, "e": "心音是瓣膜關閉後，血液衝擊瓣膜和心壁產生的聲音。瓣膜最重要的功能是防止血液倒流，也就是控制血流方向。"}, {"id": "sci-4-q193", "u": "4", "t": "4T11", "lv": "a", "s": 2, "k": "adapt", "src": "改編自桃園市文昌國中109學年七年級第二次段考", "q": "關於脈搏產生的原因，下列何者正確？", "o": ["心臟收縮，把血液壓進動脈，使動脈管壁擴張", "心臟舒張，使靜脈的血液回流", "心臟舒張，使血液撞擊動脈", "心臟收縮，使血液撞擊靜脈"], "a": 0, "e": "心臟收縮時血液被擠壓進入動脈，有彈性的動脈管壁擴張再彈回，這個現象就是脈搏。"}, {"id": "sci-4-q194", "u": "4", "t": "4T11", "lv": "a", "s": 3, "k": "adapt", "src": "改編自彰化縣大同國中106學年七年級第二次段考", "q": "關於「探測心音與脈搏」，下列何者正確？", "o": ["心臟收縮時，動脈管壁會擴張", "心音是心肌收縮和舒張時發出的聲音", "聽到「撲、通」兩聲，代表心臟跳了兩次", "動脈和靜脈都可以摸到脈搏"], "a": 0, "e": "心音來自瓣膜關閉後血液的衝擊；每一次心搏有「撲、通」兩個心音；只有動脈有脈搏。"}, {"id": "sci-4-q195", "u": "4", "t": "4T11", "lv": "a", "s": 3, "k": "adapt", "src": "改編自彰化縣大同國中106學年七年級第二次段考", "q": "雅棠起床時：心搏甲次／分、脈搏乙次／分；跑步到保健室後：心搏丙次／分、脈搏丁次／分。下列關係何者正確？", "o": ["甲＝乙，丙＝丁，且丙＞甲", "甲＞乙，丙＞丁", "甲＝丙，乙＝丁", "甲＜乙，丙＜丁"], "a": 0, "e": "每一次心搏都會產生一次脈搏，所以同一時間心搏＝脈搏（甲＝乙、丙＝丁）。跑步後心跳加快，丙＞甲。"}, {"id": "sci-4-q196", "u": "4", "t": "4T12", "lv": "a", "s": 2, "k": "adapt", "src": "改編自臺中市大道國中補行評量題庫", "q": "下列關於動脈與靜脈的比較，何者<u>錯誤</u>？", "o": ["動脈從心房離開，靜脈從心室進入", "動脈的血液流向微血管，靜脈的血液來自微血管", "動脈可以探測到脈搏", "動脈管壁較厚，靜脈管壁較薄"], "a": 0, "e": "動脈與心室相連（血液由心室離開），靜脈與心房相連（血液流回心房），(A) 說反了。"}, {"id": "sci-4-q197", "u": "4", "t": "4T7", "lv": "a", "s": 1, "k": "adapt", "src": "改編自臺中市安和國中113學年補行評量題庫", "q": "關於植物蒸散作用的敘述，下列何者正確？", "o": ["是植物運輸水分最主要的動力", "是製造養分的主要動力", "白天氣孔一定張開", "根吸水和蒸散作用無關"], "a": 0, "e": "蒸散作用產生的拉力是水分向上運輸的主要動力，也讓根能持續吸水。缺水時白天氣孔也會關閉。"}, {"id": "sci-4-q198", "u": "4", "t": "4T2", "lv": "a", "s": 2, "k": "adapt", "src": "改編自臺中市大甲國中113學年補考題庫", "q": "關於向日葵的敘述，下列何者正確？", "o": ["葉內的木質部靠近上表皮", "莖內維管束散生排列", "莖內韌皮部在內側", "不具形成層"], "a": 0, "e": "向日葵是雙子葉植物：莖內維管束環狀、有形成層、韌皮部在外側；葉脈木質部在上側（靠近上表皮）。"}, {"id": "sci-4-q199", "u": "4", "t": "4T8", "lv": "a", "s": 1, "k": "adapt", "src": "改編自臺中市大甲國中113學年補考題庫", "q": "下列關於蒸散作用的敘述，何者<u>不正確</u>？", "o": ["韌皮部負責進行蒸散作用", "摘除葉片會減緩蒸散", "蒸散有助於根部吸收水分", "水分在木質部中由下往上運輸"], "a": 0, "e": "蒸散作用是水蒸氣由葉的氣孔散失，和韌皮部無關。"}, {"id": "sci-4-q200", "u": "4", "t": "4T12", "lv": "a", "s": 2, "k": "adapt", "src": "改編自臺中市大甲國中113學年補考題庫", "q": "關於動脈、靜脈與微血管的比較，下列何者正確？", "o": ["動脈的血液都流離心臟，靜脈的血液都流向心臟", "靜脈的血流速度最慢", "微血管收縮會產生脈搏", "動脈的管壁最薄"], "a": 0, "e": "動脈：離開心臟；靜脈：流回心臟。流速最慢的是微血管；脈搏是動脈擴張產生的；管壁最薄的是微血管。"}, {"id": "sci-4-q201", "u": "4", "t": "4T8", "lv": "a", "s": 2, "k": "adapt", "src": "改編自臺北市中山國中109學年七年級第二次段考", "q": "下列哪一個環境因素增強，會使植物的蒸散作用變慢？", "o": ["空氣溼度", "風力", "陽光強度", "環境溫度"], "a": 0, "e": "空氣越潮溼，葉片的水蒸氣越不容易散出去，蒸散變慢。風、陽光、溫度增強都會使蒸散變快。"}, {"id": "sci-4-q202", "u": "4", "t": "4T13", "lv": "a", "s": 1, "k": "adapt", "src": "改編自臺北市民族實驗國中110學年七年級評量", "q": "下列哪一種物質<u>不是</u>由血漿運送的？", "o": ["胃液", "廢物", "養分", "激素"], "a": 0, "e": "胃液由胃腺分泌，直接注入胃中，不在血液裡。血漿運送養分、廢物、二氧化碳、抗體和激素。"}, {"id": "sci-4-q203", "u": "4", "t": "4T13", "lv": "a", "s": 2, "k": "adapt", "src": "改編自臺北市民族實驗國中110學年七年級評量", "q": "下列關於血液組成的敘述，何者正確？", "o": ["血小板沒有細胞核", "紅血球可以製造氧氣", "血漿呈鮮紅色", "白血球的數量最多"], "a": 0, "e": "血小板和成熟紅血球都沒有細胞核。紅血球只攜帶氧氣，不製造；血漿是淡黃色；數量最多的是紅血球。"}, {"id": "sci-4-q204", "u": "4", "t": "4T7", "lv": "a", "s": 2, "k": "adapt", "src": "改編自臺北市景美國中107學年七年級第二次段考", "q": "高樓大廈用抽水馬達把水「推」上頂樓。高大的樹木能把水送到最高的樹梢，主要靠什麼？", "o": ["葉片蒸散作用產生的拉力", "根部像馬達一樣把水推上去", "韌皮部的擠壓", "形成層的分裂"], "a": 0, "e": "水從葉片氣孔蒸散，產生拉力，把木質部中連成細管的水一路往上拉。"}, {"id": "sci-4-q205", "u": "4", "t": "4T8", "lv": "a", "s": 3, "k": "adapt", "src": "改編自臺北市民族實驗國中110學年七年級評量", "q": "小呆用透明玻璃杯倒罩發芽的綠豆，一段時間後杯壁出現許多小水珠。下列敘述何者<u>錯誤</u>？", "o": ["這些水珠只有在夜晚才會出現", "水珠主要來自綠豆的蒸散作用", "水蒸氣主要由葉的氣孔散出", "用藍色氯化亞鈷試紙接觸水珠會變成粉紅色"], "a": 0, "e": "蒸散作用主要在白天、氣孔打開時進行，不是只有夜晚。水珠是蒸散出來的水蒸氣遇冷凝結。"}, {"id": "sci-4-q206", "u": "4", "t": "4T10", "lv": "a", "s": 1, "k": "adapt", "src": "改編自彰化縣大同國中106學年七年級第二次段考", "q": "下列哪一種生物，只靠擴散作用和細胞質流動就能完成體內物質的運輸？", "o": ["變形蟲", "蚯蚓", "蝗蟲", "芹菜"], "a": 0, "e": "變形蟲是單細胞生物，體積小，靠擴散作用和細胞質流動就夠了。多細胞生物需要運輸系統。"}, {"id": "sci-4-q207", "u": "4", "t": "4T10", "lv": "a", "s": 2, "k": "adapt", "src": "改編自臺北市民族實驗國中110學年七年級評量", "q": "血液由上、下大靜脈流入心臟，最後由肺動脈離開。中間依序經過哪些腔室？", "o": ["右心房 → 右心室", "左心房 → 左心室", "右心室 → 右心房", "左心房 → 右心室"], "a": 0, "e": "大靜脈接右心房，肺動脈接右心室；血液由心房流到心室，再由心室送進動脈。"}];

<script>
// 3-4 題目附圖（SVG／表格），顏色一律使用主題變數
(function () {
  const INK = "var(--ink)", INK2 = "var(--ink2)", RED = "var(--red)", BLUE = "var(--blue)", RULE = "var(--rule)", GREEN = "var(--green)";
  const T = (x, y, s, extra = "") => `<text x="${x}" y="${y}" style="fill:${INK};font-size:14px;font-family:var(--sans)" ${extra}>${s}</text>`;
  const Ts = (x, y, s, color, size = 13, anchor = "start") => `<text x="${x}" y="${y}" text-anchor="${anchor}" style="fill:${color};font-size:${size}px;font-family:var(--sans)">${s}</text>`;
  const line = (x1, y1, x2, y2, c = INK2, w = 1.2, dash = "") => `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" style="stroke:${c};stroke-width:${w};${dash ? "stroke-dasharray:" + dash : ""}"/>`;
  const fpath = (f, x0, x1, sx, sy, ox, oy, step = 0.25) => { let d = ""; for (let x = x0; x <= x1 + 1e-9; x += step) { const y = f(x); d += (d ? "L" : "M") + (ox + x * sx).toFixed(1) + " " + (oy - y * sy).toFixed(1); } return d; };
  const gauss = (m, s, h = 1) => x => h * Math.exp(-Math.pow((x - m) / s, 2));
  const axes = (ox, oy, w, h) => `<path d="M${ox} ${oy - h}V${oy}H${ox + w}" style="fill:none;stroke:${INK};stroke-width:1.5"/><path d="M${ox - 4} ${oy - h + 6}L${ox} ${oy - h}L${ox + 4} ${oy - h + 6}M${ox + w - 6} ${oy - 4}L${ox + w} ${oy}L${ox + w - 6} ${oy + 4}" style="fill:none;stroke:${INK};stroke-width:1.5"/>`;
  const vlabel = (x, y, s) => `<text x="${x}" y="${y}" style="fill:${INK};font-size:13px;font-family:var(--sans);writing-mode:vertical-rl;letter-spacing:2px">${s}</text>`;
  // 平滑曲線：通過各點（cosine 插值）
  const through = (pts, sx, sy, ox, oy) => { let d = ""; for (let i = 0; i < pts.length - 1; i++) { const [x0, y0] = pts[i], [x1, y1] = pts[i + 1]; for (let k = 0; k <= 12; k++) { const t = k / 12, m = (1 - Math.cos(t * Math.PI)) / 2; const x = x0 + (x1 - x0) * t, y = y0 + (y1 - y0) * m; d += (d ? "L" : "M") + (ox + x * sx).toFixed(1) + " " + (oy - y * sy).toFixed(1); } } return d; };
  const interp = (pts, x) => { for (let i = 0; i < pts.length - 1; i++) { const [x0, y0] = pts[i], [x1, y1] = pts[i + 1]; if (x >= x0 && x <= x1) { const t = (x - x0) / (x1 - x0), m = (1 - Math.cos(t * Math.PI)) / 2; return y0 + (y1 - y0) * m; } } return pts[pts.length - 1][1]; };

  // 消化系統示意圖：labels = {部位: 文字}
  function digest(labels) {
    const P = {
      eso: [150, 40], sto: [214, 104], liv: [84, 92], gb: [116, 128], pan: [196, 152], si: [150, 200], li: [86, 212], an: [150, 268]
    };
    const lbl = (key, side) => {
      if (!labels[key]) return "";
      const [x, y] = P[key]; const tx = side === "L" ? 22 : 300;
      return line(x, y, side === "L" ? 58 : 266, y, INK2, 1) + Ts(side === "L" ? 54 : 270, y + 5, labels[key], INK, 14, side === "L" ? "end" : "start");
    };
    return `<svg viewBox="0 0 340 290" role="img" aria-label="消化系統示意圖">
      <path d="M144 6h12v76h-12z" style="fill:#E9A8A0;stroke:#B0655B"/>
      <path d="M156 78c30-14 74-6 76 26c2 30-22 46-56 40c-14-2-20-10-18-20c2-10 10-14 10-22c0-10-12-14-12-24z" style="fill:#EDB3A6;stroke:#B0655B"/>
      <path d="M40 84c20-26 110-30 122-10c6 12-6 26-30 36c-26 10-62 26-82 18c-16-8-18-28-10-44z" style="fill:#B66A4A;stroke:#7E4128"/>
      <ellipse cx="116" cy="128" rx="11" ry="8" style="fill:#7BC46B;stroke:#3E7F35"/>
      <path d="M118 136c4 8 14 10 26 8" style="fill:none;stroke:#3E7F35;stroke-width:2"/>
      <path d="M150 150c20-8 52-10 70-4c4 4 0 10-6 10c-22 2-44 4-62 2c-6 0-8-6-2-8z" style="fill:#F2D16B;stroke:#B89A2E"/>
      <path d="M72 252V170c0-8 6-12 14-12h126c8 0 14 4 14 12v82" style="fill:none;stroke:#A0705A;stroke-width:14;stroke-linecap:round;opacity:.85"/>
      <path d="M150 252v22" style="stroke:#A0705A;stroke-width:12"/>
      <path d="M104 178c20-10 40 10 60 0s40 10 40 22-20 10-40 20-40-10-60 0-20-32 0-42z" style="fill:#F0A9B6;stroke:#B85F72"/>
      <path d="M112 196c12-6 22 6 34 0s22 6 34 0M112 214c12-6 22 6 34 0s22 6 34 0" style="fill:none;stroke:#B85F72"/>
      ${lbl("eso", "R")}${lbl("sto", "R")}${lbl("liv", "L")}${lbl("gb", "L")}${lbl("pan", "R")}${lbl("si", "R")}${lbl("li", "L")}${lbl("an", "R")}
    </svg>`;
  }
  const DIG = {
    p79: { eso: "甲", sto: "乙", pan: "丙", liv: "丁", gb: "戊", si: "己" },
    s10: { eso: "甲", sto: "乙", si: "丙" },
    gb: { gb: "甲", liv: "肝臟", sto: "胃", pan: "胰臟", si: "小腸", li: "大腸" },
    names: { eso: "食道", sto: "胃", liv: "肝臟", gb: "膽囊", pan: "胰臟", si: "小腸", li: "大腸", an: "肛門" }
  };

  const F = {
    digest: arg => digest(DIG[arg] || DIG.names),
    undigest: () => {
      const ox = 56, oy = 200, w = 300, h = 170, seg = w / 4;
      const a = [[0, 100], [0.6, 62], [1, 60], [3, 60], [3.15, 60], [3.9, 0], [4, 0]];
      const b = [[0, 100], [2, 100], [2.7, 66], [3, 64], [3.15, 64], [3.9, 0], [4, 0]];
      const c = [[0, 100], [3.1, 100], [3.9, 0], [4, 0]];
      const pathOf = pts => { let d = ""; for (let x = 0; x <= 4.0001; x += 0.05) { d += (d ? "L" : "M") + (ox + x * seg).toFixed(1) + " " + (oy - interp(pts, x) * h / 100).toFixed(1); } return d; };
      let g = "";
      for (let i = 1; i < 4; i++) g += line(ox + i * seg, oy, ox + i * seg, oy - h, RULE, 1);
      return `<svg viewBox="0 0 380 240">${axes(ox, oy, w + 14, h + 14)}${g}
        <path d="${pathOf(a)}" style="fill:none;stroke:${BLUE};stroke-width:2.4"/>
        <path d="${pathOf(b)}" style="fill:none;stroke:${RED};stroke-width:2.4"/>
        <path d="${pathOf(c)}" style="fill:none;stroke:${INK};stroke-width:2;stroke-dasharray:6 4"/>
        ${Ts(ox + 0.7 * seg, oy - 0.66 * h, "a", BLUE, 15)}${Ts(ox + 2.45 * seg, oy - 0.62 * h, "b", RED, 15)}${Ts(ox + 3.05 * seg, oy - 0.9 * h, "c", INK, 15)}
        ${["甲", "乙", "丙", "丁"].map((s, i) => Ts(ox + (i + 0.5) * seg, oy + 20, s, INK, 14, "middle")).join("")}
        ${Ts(ox - 8, oy + 4, "0", INK2, 12, "end")}${Ts(ox - 8, oy - h + 4, "100", INK2, 12, "end")}
        ${vlabel(14, 70, "未消化分子（%）")}</svg>`;
    },
    enzTable: () => `<table><tr><th>消化液＼養分</th><th>甲</th><th>乙</th><th>丙</th></tr>
      <tr><th>唾液</th><td>○</td><td></td><td></td></tr><tr><th>胃液</th><td></td><td></td><td>○</td></tr>
      <tr><th>胰液</th><td>○</td><td>○</td><td>○</td></tr><tr><th>膽汁</th><td></td><td>○</td><td></td></tr></table>`,
    timeBar: () => {
      const ox = 50, oy = 200, sy = 12, bars = [["口和食道", 0.1], ["胃", 4], ["小腸", 7], ["大腸", 13]];
      let g = ""; for (let v = 0; v <= 13; v++) { g += line(ox, oy - v * sy, ox + 300, oy - v * sy, RULE, .6) + (v % 1 === 0 ? Ts(ox - 6, oy - v * sy + 4, v, INK2, 11, "end") : ""); }
      const cols = [INK2, "#D6B24A", "#6B9BD1", "#5DA867"];
      return `<svg viewBox="0 0 370 240">${g}${axes(ox, oy, 310, 170)}
        ${bars.map(([n, v], i) => `<rect x="${ox + 18 + i * 74}" y="${oy - v * sy}" width="42" height="${Math.max(v * sy, 1.5)}" style="fill:${cols[i]}"/>${Ts(ox + 39 + i * 74, oy + 18, n, INK, 12, "middle")}`).join("")}
        ${vlabel(12, 70, "時間（小時）")}</svg>`;
    },
    label: () => `<table><tr><th colspan="2">營養標示　每 100 公克</th></tr><tr><th>蛋白質</th><td>64 公克</td></tr><tr><th>脂質</th><td>8 公克</td></tr><tr><th>醣類</th><td>18 公克</td></tr><tr><th>鈉</th><td>927 毫克</td></tr></table>`,
    hotEnz: () => {
      const ox = 50, oy = 170, sx = 3.2, f = t => t < 30 ? 0.03 : t <= 75 ? Math.pow((t - 30) / 45, 2.2) : t <= 86 ? Math.cos((t - 75) / 11 * Math.PI / 2) : 0;
      return `<svg viewBox="0 0 380 210">${axes(ox, oy, 310, 140)}

 { id: "N1", main: 1, t: "消化的意義", sub: "攝食 → 消化 → 吸收", types: ["T1"], html: `

 { id: "N3", main: 1, t: "消化系統＝消化道＋消化腺", sub: "食物走的路 vs. 分泌消化液的工廠", types: ["T3"], html: `

  // 點到不屬於這份清單的部位時，說明它是什麼
  const PARTINFO = {

    gb: ["膽囊", "只儲存膽汁，食物不會經過，也不是消化腺"],

  // ---------- 元件 ----------
  window.mountWalk = function (el, cfgKey, animOn) {
    const C = window.WALKS[cfgKey], F = FIG[C.fig] || (window.WALKFIG || {})[C.fig], N = C.steps.length;
    let i = -1, mode = "view", shown = false, score = [], timer = null;
    el.innerHTML = `<div class="lab walk"><h3>${C.title}</h3>
      <div class="chips"><button class="chip" data-m="view" aria-pressed="true">看動畫</button><button class="chip" data-m="recite" aria-pressed="false">自己背</button></div>
      <div class="stage"><svg viewBox="${F.vb}" class="wsvg">${F.svg()}</svg></div>
      <div class="mn">${C.mn.map((m, k) => `<span data-k="${k}">${m}</span>`).join("")}</div>
      <div class="readout wout"></div>
      <div class="row wctl"></div>
      <ol class="wcard"></ol></div>`;
    const svg = el.querySelector(".wsvg"), out = el.querySelector(".wout"), ctl = el.querySelector(".wctl"), card = el.querySelector(".wcard");
    const bolus = svg.querySelector("#wBolus");
    const parts = p => [...svg.querySelectorAll(`.pt[data-p="${p}"]`)];
    const paint = () => {
      const reached = new Set(), labels = new Set();
      C.steps.forEach((s, k) => { if (k <= i) s.p.forEach(p => reached.add(p)); });
      svg.classList.toggle("dim", i >= 0);
      svg.querySelectorAll(".pt").forEach(g => g.classList.remove("hl"));
      svg.querySelectorAll(".ar").forEach(a => a.classList.remove("show"));
      svg.querySelectorAll(".lb").forEach(l => { l.classList.remove("show", "cur"); });
      svg.querySelectorAll(".rev").forEach(r => r.classList.remove("show"));

        if (k > i) return;
        const isCur = k === i, hideName = mode === "recite" && isCur && !shown;
        s.p.forEach(p => {
          if (isCur) parts(p).forEach(g => g.classList.add("hl"));
          const l = svg.querySelector(`.lb[data-p="${p}"]`);
          if (l && !hideName) { l.classList.add("show"); if (isCur) l.classList.add("cur"); }
          if (!hideName) svg.querySelectorAll(`.rev[data-p="${p}"]`).forEach(r => r.classList.add("show"));
        });
        if (!hideName) (s.a || []).forEach(a => { const e = svg.querySelector(`.ar[data-a="${a}"]`); if (e) e.classList.add("show"); });
      });
      // 已走過的部位維持清楚
      svg.querySelectorAll(".pt").forEach(g => { g.style.opacity = i >= 0 && !reached.has(g.dataset.p) ? "" : (i >= 0 ? 1 : ""); });
      if (bolus) {
        const s = C.steps[i], pos = s && C.bolus ? (s.at || (F.pos || {})[s.p[0]]) : null;
        bolus.style.opacity = pos ? 1 : 0;
        if (pos) { if (!animOn()) bolus.style.transition = "none"; bolus.style.transform = `translate(${pos[0]}px,${pos[1]}px)`; }
      }
      el.querySelectorAll(".mn span").forEach((m, k) => m.classList.toggle("on", k <= i && !(mode === "recite" && k === i && !shown)));
      card.innerHTML = C.steps.map((s, k) => k < i || (k === i && (mode === "view" || shown)) ? `<li class="${s.warn ? "warn" : ""}"><b>${s.name}</b>｜${s.note}${mode === "recite" && score[k] != null ? (score[k] ? " ✓" : " ✗") : ""}</li>` : "").join("");
      const s = C.steps[i];
      if (i < 0) { out.className = "readout wout"; out.textContent = mode === "view" ? "按「播放」或「下一步」，動畫走到哪，就背到哪。也可以直接點圖上的部位。" : "自己背：動畫停在一個部位，先說出名稱和重點，再按「看答案」。"; }
      else if (mode === "recite" && !shown) { out.className = "readout wout"; out.innerHTML = `第 ${i + 1}/${N} 個：發亮的是哪裡？說出<b>名稱</b>和<b>重點</b>。`; }
      else { out.className = "readout wout" + (s.warn ? " bad" : " ok"); out.innerHTML = `<b>${i + 1}. ${s.name}</b>：${s.note}`; }
      if (mode === "recite" && i === N - 1 && shown && score[i] != null) { const ok = score.filter(Boolean).length; out.innerHTML += `<br>背完了：答對 <b>${ok}/${N}</b>${ok === N ? "，全部記住了！" : "。答錯的再用「看動畫」看一次。"}`; }
      controls();
    };
    const go = k => { i = Math.max(-1, Math.min(N - 1, k)); shown = false; paint(); };
    const controls = () => {
      if (mode === "view") {
        ctl.innerHTML = `<button class="btn sm" data-c="play">${timer ? "暫停" : "播放"}</button><button class="btn sm ghost" data-c="prev" ${i < 0 ? "disabled" : ""}>上一步</button><button class="btn sm ghost" data-c="next" ${i >= N - 1 ? "disabled" : ""}>下一步</button><button class="btn sm ghost" data-c="all">全部顯示</button><button class="btn sm ghost" data-c="reset">重來</button>`;
      } else {
        ctl.innerHTML = i < 0 ? `<button class="btn sm red" data-c="start">開始背</button>` : !shown ? `<button class="btn sm red" data-c="show">看答案</button>` : score[i] == null ? `<button class="btn sm" data-c="ok">我答對了</button><button class="btn sm ghost" data-c="bad">我答錯了</button>` : `<button class="btn sm ghost" data-c="restart">再背一次</button>`;
      }
      ctl.querySelectorAll("[data-c]").forEach(b => b.onclick = () => act(b.dataset.c));
    };
    const stop = () => { clearInterval(timer); timer = null; };
    const act = c => {
      if (c === "play") { if (timer) { stop(); return paint(); } if (!animOn()) return go(N - 1); if (i >= N - 1) i = -1; timer = setInterval(() => { if (!document.body.contains(el) || i >= N - 1) { stop(); return paint(); } go(i + 1); }, 1800); go(i + 1); }
      if (c === "prev") { stop(); go(i - 1); }
      if (c === "next") { stop(); go(i + 1); }
      if (c === "all") { stop(); go(N - 1); }
      if (c === "reset") { stop(); go(-1); }
      if (c === "start" || c === "restart") { score = []; go(0); }
      if (c === "show") { shown = true; paint(); }
      if (c === "ok" || c === "bad") { score[i] = c === "ok"; if (i < N - 1) { go(i + 1); } else paint(); }
    };
    el.querySelectorAll("[data-m]").forEach(b => b.onclick = () => { stop(); mode = b.dataset.m; score = []; el.querySelectorAll("[data-m]").forEach(x => x.setAttribute("aria-pressed", x === b)); svg.classList.toggle("recite", mode === "recite"); go(-1); });
    const ALIAS = { stomach: ["gastric"], gastric: ["stomach"], si: ["intgl"], intgl: ["si"], mouth: ["saliv"], saliv: ["mouth"], gb: ["liver"], liver: ["gb"], pharynx: ["eso"], eso: ["pharynx"], pancreas: ["si"], li: ["si"], anus: ["li"], dig: ["eat"] };
    const stepOf = p => { let k = C.steps.findIndex(s => s.p.includes(p)); if (k < 0) for (const q of ((C.alias || ALIAS)[p] || [])) { k = C.steps.findIndex(s => s.p.includes(q)); if (k >= 0) break; } return k; };
    const tap = p => { if (mode !== "view") { out.className = "readout wout"; out.textContent = "「自己背」模式要照順序背；想點圖看答案，請切回「看動畫」。"; return; } const k = stepOf(p); if (k >= 0) { stop(); go(k); } else { const info = (C.info || PARTINFO)[p]; stop(); out.className = "readout wout bad"; out.innerHTML = info ? `<b>${info[0]}</b>：${info[1]}` : "這個部位不在這份清單裡。"; } };
    // 點到哪一個部位：先看點到的元素；點到裝飾線條時，用幾何判斷找出底下的部位
    const hitPart = e => {
      const g = e.target.closest && e.target.closest(".pt,.lb");
      if (g && svg.contains(g)) return g.dataset.p;
      const m = svg.getScreenCTM(); if (!m) return null;
      const P = svg.createSVGPoint(); P.x = e.clientX; P.y = e.clientY;
      const groups = [...svg.querySelectorAll(".pt")].reverse();
      for (const grp of groups) for (const el of grp.querySelectorAll("path,circle,ellipse,rect,polygon,line")) {
        if (!el.isPointInFill) continue;
        const q = P.matrixTransform(el.getScreenCTM().inverse());
        try { if (el.isPointInFill(q) || el.isPointInStroke(q)) return grp.dataset.p; } catch (err) {}
      }
      return null;
    };
    svg.addEventListener("click", e => { const p = hitPart(e); if (p) tap(p); });
    svg.querySelectorAll(".pt,.lb").forEach(g => g.style.cursor = "pointer");
    if (!animOn()) go(N - 1); else go(-1);
  };
})();

function buildQuiz(u) {

    prev.wrong.forEach(id => { const q = Q[id]; if (!q) return; const v = bank.find(x => x.id !== id && !has.has(x.id) && (x.of === id || (q.of && (x.of === q.of || x.id === q.of)))); if (v) add(v.id); });

}

function bindQuiz() {
  const u = S.unit, U = S.U[u];

  on("toPractice", () => go("practice", "types"));
  on("toRec", () => go("quiz", "rec"));
  on("toBook", () => go("book"));
  on("qStart", () => { const ids = buildQuiz(u); U.qz = { ids, orders: ids.map(id => orderFor(Q[id])), ans: {}, start: Date.now(), cur: 0 }; save(); render(); });
  view.querySelectorAll("[data-rec]").forEach(b => b.onclick = () => { S.view = +b.dataset.rec; S.sub.quiz = "result"; save(); render(); window.scrollTo(0, 0); });
  view.querySelectorAll("[data-qr]").forEach(b => b.onclick = () => { const x = st(b.dataset.qr); x.rs = x.rs || []; x.rs.push({ r: b.dataset.r, at: Date.now(), src: "測驗" + S.view }); save(); render(); });
  if (!U.qz || S.sub.quiz !== "test") { clearInterval(tick); return; }
  const z = U.qz;
  view.querySelectorAll("[data-j]").forEach(b => b.onclick = () => { z.cur = +b.dataset.j; confirmSubmit = false; save(); render(); });
  view.querySelectorAll("[data-qa]").forEach(b => b.onclick = () => { z.ans[z.cur] = +b.dataset.qa; save(); render(); });
  on("qPrev", () => { z.cur--; save(); render(); window.scrollTo(0, 0); });
  on("qNext", () => { z.cur++; save(); render(); window.scrollTo(0, 0); });
  on("qSub", () => { if (Object.keys(z.ans).length < z.ids.length) { confirmSubmit = true; render(); } else submitQuiz(); });
  on("qSubYes", submitQuiz);
  on("qSubNo", () => { confirmSubmit = false; render(); });
  clearInterval(tick);
  const upd = () => { const c = $("#clock"); if (!c) return clearInterval(tick); const m = Math.floor((Date.now() - z.start) / 6e4); c.textContent = `已用 ${m} 分鐘`; };
  upd(); tick = setInterval(upd, 15000);
}
