window.TYPES34=[{"id": "T1", "main": 1, "name": "消化的意義與過程", "ask": "「將大分子分解成小分子的過程稱為？」「何者屬於消化／吸收？」", "key": "消化＝大分子→小分子；吸收＝小分子進入細胞或血液。順序：攝食→消化→吸收。", "trap": "把「消化」說成合成作用；把消化和呼吸作用搞混。"}, {"id": "T2", "main": 1, "name": "養分與分解產物", "ask": "「澱粉／蛋白質／脂質分解成什麼？」「哪一種養分不需要（或無法）消化？」", "key": "澱粉→葡萄糖；蛋白質→胺基酸；脂質→脂肪酸＋甘油。水、維生素、礦物質本來就小，不用消化；纖維素無法分解。", "trap": "「維生素分解成礦物質」是錯的；分解產物是消化作用，不是呼吸作用。"}, {"id": "T3", "main": 1, "name": "消化道與消化腺辨識", "ask": "「何者不是消化腺／消化道？」「圖中哪些部位有消化腺？」", "key": "消化道：口腔→咽→食道→胃→小腸→大腸→肛門。消化腺：唾腺、胃腺、肝臟、胰臟、腸腺。膽囊只儲存膽汁。", "trap": "膽囊不是消化腺；肝臟、胰臟不是消化道（食物不經過）。"}, {"id": "T4", "main": 1, "name": "消化道各段功能", "ask": "「消化道為何會蠕動？」「哪一個構造的功能類似雞胗？」", "key": "蠕動靠管壁肌肉收縮；口腔咬碎磨細並初步分解澱粉；胃殺菌並初步分解蛋白質；大腸吸收剩餘水分。", "trap": "大腸和小腸都有肌肉、都會蠕動；磨碎食物的是口腔（牙齒）。"}, {"id": "T5", "main": 1, "name": "消化液：來源、注入處、作用", "ask": "「哪些消化液注入小腸？」「哪一種消化液不含酵素卻能乳化脂質？」", "key": "唾液→口腔（澱粉）；胃液→胃（蛋白質）；膽汁、胰液、腸液→小腸。胰液三種都分解；膽汁無酵素，只乳化脂質。", "trap": "胃液、唾液不注入小腸；膽汁由肝臟分泌、不是膽囊。"}, {"id": "T6", "main": 1, "name": "消化路徑推理與圖表", "ask": "「消化過程的先後順序？」「未消化分子%圖中，甲乙丙丁各是哪一段？」", "key": "澱粉從口腔開始、蛋白質從胃開始、脂質從小腸開始；三種都在小腸完成並吸收。讀圖時看曲線在哪一段開始下降。", "trap": "把消化腺（胰臟）當成消化道的一段；忘了食物一進口腔就開始分解澱粉。"}, {"id": "T7", "main": 0, "name": "器官受損情境推論", "ask": "「膽囊結石阻塞，哪一類食物的消化受影響？」「為何胰島素不能口服？」", "key": "先找出受損器官負責哪一種消化液，再推它影響哪一種養分。", "trap": "膽汁阻塞只影響脂質（乳化），不會讓胰液無法進入小腸。"}, {"id": "T8", "main": 1, "name": "吸收：絨毛、小腸與大腸", "ask": "「絨毛的主要功能？」「判斷大腸或小腸，何者不能當線索？」", "key": "小腸有皺褶和絨毛，增加吸收表面積，養分進入微血管；小腸吸收大部分的水，大腸吸收剩餘水分。", "trap": "大腸、小腸都有肌肉；人體吸收最多水分的是小腸，不是大腸。"}, {"id": "T9", "main": 1, "name": "酵素特性應用", "ask": "「三種酵素的主要成分？」「酵素X分解吉利丁後能不能分解洋菜？」", "key": "酵素主要成分是蛋白質；具專一性；反應後不變、可重複使用；只加速反應，不增加產量。", "trap": "澱粉酶的成分不是澱粉；分解作用不是合成作用。"}, {"id": "T10", "main": 1, "name": "酵素活性圖表：溫度與 pH", "ask": "「哪一個時間點取得的酵素活性最大？」「中性環境下哪一種酵素最快？」", "key": "每種酵素有最適溫度與 pH；低溫暫時失活，高溫永久失活（超過一次就回不來）；胃酸性、口腔中性、小腸鹼性。", "trap": "溫度降回來，被高溫破壞的酵素也不會恢復；酵素在胃被破壞後，到小腸也沒有活性。"}, {"id": "T11", "main": 1, "name": "實驗結果推論（碘液、本氏液、半透膜）", "ask": "「根據結果，推測哪一支試管加了蜂蜜？」「溶液X最可能含有什麼？」", "key": "碘液黃褐＝沒有澱粉；藍黑＝有澱粉。本氏液要隔水加熱，變色＝有糖。澱粉不見了＝被酵素分解了。", "trap": "黃褐色是碘液原本的顏色，代表「沒有」澱粉；能穿過膜的是小分子葡萄糖。"}, {"id": "T12", "main": 0, "name": "光合作用綜合（跨節）", "ask": "「容器內氧氣持續增加，此生物最可能是？」「光合作用敘述何者錯誤？」", "key": "光合作用：水＋二氧化碳 →（光、葉綠體）→ 葡萄糖＋氧氣；把光能轉成化學能。有葉綠體的生物才行光合作用。", "trap": "光合作用有能量轉換；讀圖題每個選項都要在圖上找兩點比較。"}];
window.BANK34=[{"id": "sci-3-4-q001", "u": "3-4", "t": "T1", "lv": "b", "s": 1, "k": "orig", "src": "講義 p.75 隨堂1", "q": "將大分子食物分解成小分子養分的過程，稱為哪一種作用？", "o": ["消化作用", "氧化作用", "呼吸作用", "燃燒作用"], "a": 0, "e": "大分子分解成小分子＝消化作用。呼吸作用是細胞分解葡萄糖產生能量，不是消化。"}, {"id": "sci-3-4-q002", "u": "3-4", "t": "T1", "lv": "b", "s": 1, "k": "orig", "src": "講義 p.79 試題1", "q": "關於消化作用，下列敘述何者<u>錯誤</u>？", "o": ["是合成作用", "是分解作用", "是代謝作用的一種", "需要酵素參與"], "a": 0, "e": "消化是把大分子變成小分子，屬於分解作用（也是代謝作用的一部分），需要消化酵素。合成作用是小分子變大分子，方向相反。"}, {"id": "sci-3-4-q003", "u": "3-4", "t": "T1", "lv": "a", "s": 1, "k": "adapt", "src": "改編自臺北市民族國中106學年第二次段考", "q": "為什麼食物中的養分必須先經過消化，才能被細胞利用？", "o": ["大分子無法通過細胞膜，分解成小分子才能進入細胞", "消化可以產生氧氣供細胞使用", "消化能讓養分變得更大、更營養", "細胞只能利用水，其他養分都要排出"], "a": 0, "e": "課本重點：較小的分子才能通過細胞膜進入細胞。消化就是把大分子變小，讓細胞可以吸收利用。"}, {"id": "sci-3-4-q004", "u": "3-4", "t": "T1", "lv": "b", "s": 1, "k": "key", "src": "講義 p.75 焦點1", "q": "人體由食物獲取養分的過程，正確順序為何？", "o": ["攝食→消化→吸收", "消化→攝食→吸收", "吸收→消化→攝食", "攝食→吸收→消化"], "a": 0, "e": "先把食物吃進來（攝食），再分解成小分子（消化），最後小分子進入細胞（吸收）。"}, {"id": "sci-3-4-q005", "u": "3-4", "t": "T1", "lv": "b", "s": 1, "k": "key", "src": "講義 p.75 焦點1", "q": "關於植物和人體獲得養分的方式，下列何者正確？", "o": ["植物行光合作用自己製造葡萄糖，人體從食物中獲得養分", "植物和人體都必須攝食", "人體也能行光合作用製造葡萄糖", "植物不需要任何養分"], "a": 0, "e": "植物藉光合作用自行製造葡萄糖；人體不能，必須由食物獲得大部分所需養分。"}, {"id": "sci-3-4-q006", "u": "3-4", "t": "T1", "lv": "b", "s": 2, "k": "key", "src": "講義 p.75 焦點1", "q": "下列哪一項屬於「吸收」？", "o": ["小腸絨毛把葡萄糖送入微血管", "牙齒把食物咬碎", "胃液分解蛋白質", "把飯送入口中"], "a": 0, "e": "吸收＝小分子養分進入細胞（或血液）。咬碎、分解屬於消化；送入口中是攝食。"}, {"id": "sci-3-4-q007", "u": "3-4", "t": "T1", "lv": "b", "s": 2, "k": "key", "src": "講義 p.75 焦點2", "q": "下列哪一個過程屬於「消化作用」？", "o": ["胃蛋白酶把蛋白質分解成較小的分子", "葡萄糖進入血液", "吃下一口麵包", "大腸吸收水分"], "a": 0, "e": "消化＝把大分子分解成小分子。葡萄糖進入血液、大腸吸收水分都是吸收；吃麵包是攝食。"}, {"id": "sci-3-4-q008", "u": "3-4", "t": "T1", "lv": "a", "s": 3, "k": "ext", "src": "延伸題（對應經典題5）", "q": "「澱粉在小腸變成葡萄糖」與「葡萄糖在細胞內被分解並釋放能量」，分別屬於哪一種作用？", "o": ["消化作用；呼吸作用", "呼吸作用；消化作用", "都是消化作用", "都是光合作用"], "a": 0, "e": "在消化道把大分子變小分子＝消化作用。在細胞內分解葡萄糖、釋放能量＝呼吸作用。兩者常被放在同一題考。"}, {"id": "sci-3-4-q009", "u": "3-4", "t": "T2", "lv": "b", "s": 2, "k": "orig", "src": "講義 p.79 試題9", "q": "有關營養素分解成小分子的觀念，下列何者<u>錯誤</u>？", "o": ["維生素分解成礦物質", "醣類（澱粉）分解成葡萄糖", "蛋白質分解成胺基酸", "脂質分解成脂肪酸及甘油"], "a": 0, "e": "維生素和礦物質是兩種不同的營養素，而且本來就是小分子，不需要消化，維生素也不會變成礦物質。其他三項都是課本表格的內容。", "h": "維生素和礦物質本來就是小分子，還需要被分解嗎？", "w": 1, "c": "觀念不懂"}, {"id": "sci-3-4-q010", "u": "3-4", "t": "T2", "lv": "b", "s": 1, "k": "var", "src": "錯題類題", "q": "下列哪一組「養分 → 消化後的小分子」配對正確？", "o": ["蛋白質 → 胺基酸", "澱粉 → 胺基酸", "脂質 → 葡萄糖", "維生素 → 礦物質"], "a": 0, "e": "澱粉→葡萄糖；蛋白質→胺基酸；脂質→脂肪酸＋甘油。維生素不用消化。", "of": "sci-3-4-q009"}, {"id": "sci-3-4-q011", "u": "3-4", "t": "T2", "lv": "b", "s": 2, "k": "var", "src": "錯題類題", "q": "下列哪一類養分「不需要」經過消化，就能直接被吸收？", "o": ["維生素", "澱粉", "蛋白質", "脂質"], "a": 0, "e": "水、維生素、礦物質都是小分子，可以直接吸收。澱粉、蛋白質、脂質是大分子，要先消化。", "of": "sci-3-4-q009"}, {"id": "sci-3-4-q012", "u": "3-4", "t": "T2", "lv": "b", "s": 1, "k": "orig", "src": "講義 p.80 試題10", "q": "下列哪一種養分在人體中<u>無法</u>被分解？", "o": ["纖維素", "脂肪", "澱粉", "蛋白質"], "a": 0, "e": "人體沒有分解纖維素的酵素，纖維素會隨糞便排出，但可以促進大腸蠕動。"}, {"id": "sci-3-4-q013", "u": "3-4", "t": "T2", "lv": "b", "s": 2, "k": "orig", "src": "講義 p.86 經典題5（109會考）", "q": "澱粉在人體內經過某種生理作用後，產生許多相同的小分子X。這種生理作用和X分別是什麼？", "o": ["消化作用；葡萄糖", "消化作用；胺基酸", "呼吸作用；葡萄糖", "呼吸作用；胺基酸"], "a": 0, "e": "澱粉是許多葡萄糖連成的大分子，把它拆成葡萄糖是消化作用。胺基酸是蛋白質的分解產物；呼吸作用是在細胞內分解葡萄糖產生能量。", "h": "澱粉是由哪一種小分子連成的？把食物拆小的作用叫什麼？", "w": 1, "c": "記憶不牢"}, {"id": "sci-3-4-q014", "u": "3-4", "t": "T2", "lv": "b", "s": 1, "k": "var", "src": "改編自台中市大甲國中114學年補考題庫", "q": "蛋白質在人體內經過某種生理作用後，產生許多小分子Y。這種作用和Y分別是什麼？", "o": ["消化作用；胺基酸", "消化作用；葡萄糖", "呼吸作用；胺基酸", "光合作用；葡萄糖"], "a": 0, "e": "蛋白質由胺基酸組成，消化後產生胺基酸。", "of": "sci-3-4-q013"}, {"id": "sci-3-4-q015", "u": "3-4", "t": "T2", "lv": "b", "s": 2, "k": "var", "src": "錯題類題", "q": "脂質在小腸被完全消化後，產生的小分子是什麼？", "o": ["脂肪酸和甘油", "胺基酸", "葡萄糖", "脂肪小球"], "a": 0, "e": "脂質完全消化後是脂肪酸和甘油。「脂肪小球」是膽汁乳化的結果，只是變小顆，還沒有被分解。", "of": "sci-3-4-q013"}, {"id": "sci-3-4-q016", "u": "3-4", "t": "T2", "lv": "a", "s": 2, "k": "ext", "src": "延伸題", "q": "澱粉、蛋白質、脂質三者之中，哪一種消化後的產物有「兩種」？", "o": ["脂質", "澱粉", "蛋白質", "三者都只有一種"], "a": 0, "e": "脂質→脂肪酸＋甘油（兩種）；澱粉→葡萄糖；蛋白質→胺基酸。"}, {"id": "sci-3-4-q017", "u": "3-4", "t": "T2", "lv": "a", "s": 2, "k": "ext", "src": "延伸題", "q": "營養標示上的「膳食纖維」吃進體內後，最後的去向是什麼？", "o": ["不被分解，隨糞便排出", "被分解成葡萄糖吸收", "被分解成胺基酸吸收", "在胃中被分解"], "a": 0, "e": "人體沒有分解纖維素的酵素，纖維會留在消化道，增加糞便體積後排出。"}, {"id": "sci-3-4-q018", "u": "3-4", "t": "T2", "lv": "a", "s": 3, "k": "ext", "src": "延伸題", "q": "下列物質中，哪些可以<u>不經消化</u>，直接被小腸吸收？（甲）葡萄糖（乙）澱粉（丙）胺基酸（丁）水（戊）蛋白質", "o": ["甲丙丁", "甲乙丙", "乙戊", "甲乙丙丁戊"], "a": 0, "e": "葡萄糖、胺基酸、水都是小分子，可直接吸收。澱粉、蛋白質是大分子，要先消化。"}, {"id": "sci-3-4-q019", "u": "3-4", "t": "T2", "lv": "a", "s": 1, "k": "ext", "src": "延伸題", "q": "米飯中的澱粉被完全消化後，進入血液的是什麼？", "o": ["葡萄糖", "澱粉", "胺基酸", "甘油"], "a": 0, "e": "澱粉完全消化後成為葡萄糖，由小腸絨毛的微血管吸收。"}, {"id": "sci-3-4-q020", "u": "3-4", "t": "T2", "lv": "a", "s": 3, "k": "ext", "src": "延伸題", "q": "下列哪一項「大分子 → 小分子」的對應<u>錯誤</u>？", "o": ["纖維素 → 葡萄糖，由人體小腸分解吸收", "澱粉 → 葡萄糖", "蛋白質 → 胺基酸", "脂質 → 脂肪酸和甘油"], "a": 0, "e": "纖維素雖然也是由葡萄糖組成，但人體沒有分解它的酵素，無法在小腸分解吸收。"}, {"id": "sci-3-4-q021", "u": "3-4", "t": "T3", "lv": "b", "s": 2, "k": "orig", "src": "講義 p.76 隨堂2", "q": "人體的消化系統中，消化液會注入哪些消化道？", "o": ["口腔、胃、小腸", "胃、小腸、大腸", "口腔、食道、胃、小腸", "口腔、食道、胃、小腸、大腸"], "a": 0, "e": "唾液→口腔；胃液→胃；膽汁、胰液、腸液→小腸。食道和大腸沒有消化液注入。"}, {"id": "sci-3-4-q022", "u": "3-4", "t": "T3", "lv": "b", "s": 1, "k": "orig", "src": "講義 p.79 試題2", "q": "食物通過消化道的順序，下列何者<u>錯誤</u>？", "o": ["大腸→小腸", "胃→小腸", "食道→胃", "大腸→肛門"], "a": 0, "e": "順序是口腔→咽→食道→胃→小腸→大腸→肛門，小腸在大腸之前。"}, {"id": "sci-3-4-q023", "u": "3-4", "t": "T3", "lv": "b", "s": 2, "k": "orig", "src": "講義 p.79 試題4", "q": "右圖為人體部分消化系統示意圖，其中哪些是具有消化腺的部位？", "o": ["乙丙丁己", "甲乙戊己", "甲乙丙丁", "乙丙戊己"], "a": 0, "e": "甲食道：沒有消化腺。乙胃：有胃腺。丙胰臟、丁肝臟：本身就是消化腺。戊膽囊：只儲存膽汁。己小腸：有腸腺。", "fig": "digest:p79"}, {"id": "sci-3-4-q024", "u": "3-4", "t": "T3", "lv": "b", "s": 1, "k": "orig", "src": "講義 p.79 試題8", "q": "下列何者<u>不是</u>人體的消化腺？", "o": ["膽囊", "肝臟", "胰臟", "腸腺"], "a": 0, "e": "膽囊只負責儲存肝臟分泌的膽汁，自己不分泌消化液，所以不是消化腺。"}, {"id": "sci-3-4-q025", "u": "3-4", "t": "T3", "lv": "a", "s": 1, "k": "adapt", "src": "改編自屏東縣大同高中113學年補考題庫", "q": "下列何者<u>不屬於</u>消化道？", "o": ["肝臟", "肛門", "食道", "大腸"], "a": 0, "e": "肝臟是消化腺，食物不會經過肝臟。"}, {"id": "sci-3-4-q026", "u": "3-4", "t": "T3", "lv": "a", "s": 2, "k": "adapt", "src": "改編自屏東縣大同高中113學年補考題庫", "q": "食道、胃、小腸、大腸等構造共同組成哪一個層次？", "o": ["器官系統", "器官", "組織", "個體"], "a": 0, "e": "胃、小腸各是一個器官；許多器官一起完成消化的工作，組成消化系統，屬於器官系統。"}, {"id": "sci-3-4-q027", "u": "3-4", "t": "T3", "lv": "a", "s": 2, "k": "adapt", "src": "改編自新竹市培英國中110學年補考題", "q": "消化腺分泌的消化液，如何進入消化道？", "o": ["經由導管注入消化道", "經由血液運送到消化道", "直接穿過皮膚", "經由神經傳送"], "a": 0, "e": "消化液由導管注入消化道（腸腺位於小腸壁，直接注入）。被吸收的小分子養分才是由血液運送。"}, {"id": "sci-3-4-q028", "u": "3-4", "t": "T3", "lv": "b", "s": 2, "k": "key", "src": "講義 p.76 圖示", "q": "右圖中，丁所分泌的消化液是哪一種？", "o": ["膽汁", "胰液", "胃液", "腸液"], "a": 0, "e": "丁是肝臟，分泌膽汁，先儲存在膽囊（戊），再注入小腸。", "fig": "digest:p79"}, {"id": "sci-3-4-q029", "u": "3-4", "t": "T3", "lv": "b", "s": 2, "k": "key", "src": "講義 p.76 圖示", "q": "右圖中，哪一個構造負責儲存膽汁，但本身不分泌消化液？", "o": ["戊", "丁", "丙", "乙"], "a": 0, "e": "戊是膽囊，只儲存膽汁。丁肝臟才是分泌膽汁的器官。", "fig": "digest:p79"}, {"id": "sci-3-4-q030", "u": "3-4", "t": "T3", "lv": "b", "s": 3, "k": "key", "src": "講義 p.76 圖示", "q": "吃下一口麵包，麵包<u>不會</u>經過下列哪一個構造？", "o": ["胰臟", "咽", "胃", "大腸"], "a": 0, "e": "胰臟是消化腺，胰液經導管流入小腸，食物本身不會經過胰臟。"}, {"id": "sci-3-4-q031", "u": "3-4", "t": "T4", "lv": "b", "s": 1, "k": "orig", "src": "講義 p.79 試題3", "q": "為什麼太空人在無重力的情況下，即使倒立仍能吃喝，並把食物送進胃裡？", "o": ["靠食道肌肉收縮", "靠胃肌肉收縮", "靠地球引力", "靠毛細作用"], "a": 0, "e": "食道管壁的肌肉收縮產生蠕動，把食物往胃推，不靠重力。"}, {"id": "sci-3-4-q032", "u": "3-4", "t": "T4", "lv": "b", "s": 1, "k": "orig", "src": "講義 p.79 試題5", "q": "消化道之所以會蠕動，是因為消化道具有哪一種構造？", "o": ["肌肉", "消化腺", "消化液", "絨毛"], "a": 0, "e": "蠕動是管壁的肌肉收縮，讓消化道產生局部的運動，推動食物前進。", "h": "蠕動是一種「收縮」的動作，身體哪一種組織會收縮？", "w": 1, "c": "記憶不牢"}, {"id": "sci-3-4-q033", "u": "3-4", "t": "T4", "lv": "b", "s": 1, "k": "var", "src": "錯題類題", "q": "關於「蠕動」的敘述，下列何者正確？", "o": ["消化道管壁的肌肉收縮，推動食物前進", "只有食道會蠕動", "蠕動靠重力讓食物往下掉", "蠕動是消化液流動造成的"], "a": 0, "e": "消化道的管壁都有肌肉，食道、胃、小腸、大腸都會蠕動。", "of": "sci-3-4-q032"}, {"id": "sci-3-4-q034", "u": "3-4", "t": "T4", "lv": "b", "s": 2, "k": "var", "src": "錯題類題", "q": "下列哪一個過程「不是」靠蠕動完成的？", "o": ["唾液中的酵素分解澱粉", "食物由食道送入胃", "粥狀食物由胃進入小腸", "食物殘渣由小腸推入大腸"], "a": 0, "e": "分解澱粉靠的是酵素（化學作用），不是肌肉運動。其他三項都是蠕動推送食物。", "of": "sci-3-4-q032"}, {"id": "sci-3-4-q035", "u": "3-4", "t": "T4", "lv": "b", "s": 2, "k": "orig", "src": "講義 p.85 素養題11", "q": "雞吞下砂粒儲存在雞胗（砂囊）中，可以幫助磨碎食物，增加食物和酵素接觸的表面積。人體內哪一個構造有類似的消化功能？", "o": ["口腔", "食道", "肝臟", "大腸"], "a": 0, "e": "口腔中的牙齒可以咬碎、磨細食物，增加食物和唾液酵素接觸的表面積，和雞胗的功能相同。", "h": "雞胗的工作是「磨碎」。人體哪裡有牙齒？", "w": 1, "c": "觀念不懂"}, {"id": "sci-3-4-q036", "u": "3-4", "t": "T4", "lv": "b", "s": 2, "k": "var", "src": "錯題類題", "q": "牙齒把食物咬碎、磨細，對消化最主要的幫助是什麼？", "o": ["增加食物和消化液（酵素）接觸的表面積", "直接把澱粉分解成葡萄糖", "殺死食物中的細菌", "吸收養分"], "a": 0, "e": "顆粒越小，表面積越大，酵素作用得越快。把澱粉分解成葡萄糖要靠酵素。", "of": "sci-3-4-q035"}, {"id": "sci-3-4-q037", "u": "3-4", "t": "T4", "lv": "b", "s": 2, "k": "var", "src": "錯題類題", "q": "胃壁肌肉蠕動，把食物和胃液攪拌成粥狀。這和下列哪一個構造的功能最相似？", "o": ["口腔中的舌頭攪拌食物", "肝臟分泌膽汁", "大腸吸收水分", "絨毛吸收養分"], "a": 0, "e": "舌頭攪拌食物、讓食物與唾液混合，和胃把食物與胃液攪拌混合，都是物理性的混合。", "of": "sci-3-4-q035"}, {"id": "sci-3-4-q038", "u": "3-4", "t": "T4", "lv": "b", "s": 2, "k": "orig", "src": "講義 p.77 探究提問", "q": "胃液中含有胃蛋白酶，可以分解蛋白質，為什麼胃壁的肌肉組織不會被胃液分解？", "o": ["胃會分泌黏液保護胃壁", "胃壁是醣類組成的", "胃蛋白酶只在小腸作用", "胃壁沒有蛋白質"], "a": 0, "e": "胃會分泌黏液保護肌肉組織，所以胃蛋白酶不會分解胃壁。"}, {"id": "sci-3-4-q039", "u": "3-4", "t": "T4", "lv": "b", "s": 1, "k": "key", "src": "講義 p.77 咽、食道", "q": "咽的功能是什麼？", "o": ["調控口腔中的食物進入食道，不進入氣管", "分泌唾液", "分解澱粉", "吸收水分"], "a": 0, "e": "咽調控食物進入食道（不進入氣管），本身不分泌消化液。"}, {"id": "sci-3-4-q040", "u": "3-4", "t": "T4", "lv": "a", "s": 2, "k": "adapt", "src": "改編自臺北市民族國中106學年第二次段考", "q": "關於胃液中「鹽酸」的作用，下列何者<u>錯誤</u>？", "o": ["直接把澱粉分解成葡萄糖", "殺菌", "使胃中環境偏酸", "有利胃蛋白酶分解蛋白質"], "a": 0, "e": "鹽酸能殺菌、使胃偏酸，讓胃蛋白酶發揮作用。鹽酸本身不會把澱粉分解成葡萄糖。"}, {"id": "sci-3-4-q041", "u": "3-4", "t": "T4", "lv": "a", "s": 1, "k": "ext", "src": "延伸題", "q": "大腸的主要功能是什麼？", "o": ["吸收剩餘的水分並形成糞便", "分泌膽汁", "分解蛋白質", "吸收大部分的養分"], "a": 0, "e": "大腸吸收食物殘渣中剩餘的水分，並形成糞便。大部分養分在小腸吸收。"}, {"id": "sci-3-4-q042", "u": "3-4", "t": "T4", "lv": "a", "s": 2, "k": "adapt", "src": "改編自臺北市民族國中106學年第二次段考", "q": "闌尾位於消化道的哪裡？", "o": ["大腸起點的盲腸附近（腹部右下方）", "胃的上方", "小腸中段", "肛門旁邊"], "a": 0, "e": "講義圖示：盲腸是大腸的起點，闌尾連在盲腸上，位於腹部右下方。"}, {"id": "sci-3-4-q043", "u": "3-4", "t": "T4", "lv": "a", "s": 1, "k": "ext", "src": "延伸題", "q": "食物在胃中被消化成什麼狀態後，才藉蠕動進入小腸？", "o": ["粥狀", "固體塊狀", "完全的小分子", "氣體"], "a": 0, "e": "食物在胃中被攪拌、初步消化成粥狀，再藉胃壁蠕動進入小腸。"}, {"id": "sci-3-4-q044", "u": "3-4", "t": "T4", "lv": "a", "s": 3, "k": "ext", "src": "延伸題", "q": "下列「器官—功能」配對，何者<u>錯誤</u>？", "o": ["食道—分泌消化液分解食物", "口腔—咬碎食物並初步分解澱粉", "胃—初步分解蛋白質", "大腸—吸收剩餘的水分"], "a": 0, "e": "食道只負責以蠕動把食物送到胃，不分泌消化液。"}, {"id": "sci-3-4-q045", "u": "3-4", "t": "T4", "lv": "a", "s": 3, "k": "ext", "src": "延伸題", "q": "吃東西時說話容易嗆到，主要和哪一個構造的功能有關？", "o": ["咽：負責讓食物進入食道而不進入氣管", "胃：分泌胃酸", "大腸：吸收水分", "肝臟：分泌膽汁"], "a": 0, "e": "咽是食物和空氣的共同通道，負責調控食物進入食道。說話時這個調控容易出錯，食物就可能跑進氣管。"}, {"id": "sci-3-4-q046", "u": "3-4", "t": "T5", "lv": "b", "s": 2, "k": "orig", "src": "講義 p.79 試題7", "q": "（甲）腸液（乙）胃液（丙）膽汁（丁）胰液（戊）唾液，以上哪些會注入小腸？", "o": ["甲丙丁", "甲乙丙", "乙戊", "丙丁"], "a": 0, "e": "注入小腸的是腸液、膽汁、胰液三種。胃液在胃作用，唾液在口腔作用。", "h": "胃液在哪裡工作？唾液呢？剩下的就是小腸的。", "w": 1, "c": "記憶不牢"}, {"id": "sci-3-4-q047", "u": "3-4", "t": "T5", "lv": "b", "s": 1, "k": "var", "src": "錯題類題", "q": "下列哪一種消化液<u>不會</u>注入小腸？", "o": ["胃液", "膽汁", "胰液", "腸液"], "a": 0, "e": "胃液由胃腺分泌，注入胃中。膽汁、胰液、腸液都在小腸作用。", "of": "sci-3-4-q046"}, {"id": "sci-3-4-q048", "u": "3-4", "t": "T5", "lv": "b", "s": 1, "k": "var", "src": "錯題類題", "q": "肝臟分泌的膽汁，最後注入哪裡？", "o": ["小腸", "胃", "大腸", "口腔"], "a": 0, "e": "膽汁由肝臟分泌，先儲存在膽囊，再經導管注入小腸前段。", "of": "sci-3-4-q046"}, {"id": "sci-3-4-q049", "u": "3-4", "t": "T5", "lv": "b", "s": 2, "k": "orig", "src": "講義 p.78 隨堂3", "q": "右表為漢堡中澱粉、脂質、蛋白質與消化液作用的情形，「○」表示該消化液有參與作用。甲、乙、丙依序為何？", "o": ["澱粉、脂質、蛋白質", "澱粉、蛋白質、脂質", "蛋白質、澱粉、脂質", "脂質、澱粉、蛋白質"], "a": 0, "e": "唾液只作用在甲 → 甲是澱粉。膽汁只作用在乙 → 乙是脂質。胃液只作用在丙 → 丙是蛋白質。胰液三種都作用。", "fig": "enzTable"}, {"id": "sci-3-4-q050", "u": "3-4", "t": "T5", "lv": "b", "s": 1, "k": "orig", "src": "講義 p.80 試題17", "q": "哪一個消化腺分泌的消化液不含酵素，但可以把脂肪變成顆粒較小的脂肪球？", "o": ["肝臟", "胃腺", "唾腺", "小腸"], "a": 0, "e": "肝臟分泌膽汁，膽汁不含酵素，可以乳化脂質。"}, {"id": "sci-3-4-q051", "u": "3-4", "t": "T5", "lv": "b", "s": 1, "k": "orig", "src": "講義 p.82 基本題7", "q": "阿威早餐吃了饅頭，下列何者可以消化饅頭中的澱粉？", "o": ["唾液", "膽汁", "胃液", "大腸黏液"], "a": 0, "e": "唾液中的酵素可以初步分解澱粉。膽汁只乳化脂質；胃液分解蛋白質。"}, {"id": "sci-3-4-q052", "u": "3-4", "t": "T5", "lv": "b", "s": 2, "k": "orig", "src": "講義 p.82 基本題11", "q": "人體消化道內某種酵素能將脂質分解，有關此酵素的敘述，下列何者正確？", "o": ["主要在小腸中作用", "也能分解蛋白質", "主要成分是脂質", "由血液運送至消化道"], "a": 0, "e": "分解脂質的酵素在胰液中，於小腸作用。酵素有專一性，不分解蛋白質；成分是蛋白質；由導管注入，不靠血液。"}, {"id": "sci-3-4-q053", "u": "3-4", "t": "T5", "lv": "a", "s": 1, "k": "adapt", "src": "改編自台中市三光國中114學年補行評量題庫", "q": "肝臟會分泌哪一種消化液？", "o": ["膽汁", "唾液", "胃液", "胰液"], "a": 0, "e": "肝臟分泌膽汁，儲存在膽囊。"}, {"id": "sci-3-4-q054", "u": "3-4", "t": "T5", "lv": "a", "s": 1, "k": "adapt", "src": "改編自臺北市民族國中106學年第二次段考", "q": "哪一種消化液能分解醣類、蛋白質和脂質三種養分？", "o": ["胰液", "胃液", "唾液", "膽汁"], "a": 0, "e": "胰液含有分解醣類、蛋白質、脂質的酵素。"}, {"id": "sci-3-4-q055", "u": "3-4", "t": "T5", "lv": "a", "s": 2, "k": "ext", "src": "延伸題", "q": "下列關於膽汁的敘述，何者正確？", "o": ["由肝臟分泌，不含酵素，可以乳化脂質", "由膽囊分泌，含有分解脂質的酵素", "可以分解蛋白質", "注入胃中作用"], "a": 0, "e": "膽汁：肝臟分泌、膽囊儲存、注入小腸；不含酵素，把大油滴變成小油滴（乳化）。"}, {"id": "sci-3-4-q056", "u": "3-4", "t": "T5", "lv": "a", "s": 2, "k": "ext", "src": "延伸題", "q": "小腸前段的膽汁、胰液、腸液，共同的性質是什麼？", "o": ["都是鹼性，可以中和胃酸", "都含有酵素", "都由胰臟分泌", "都是酸性"], "a": 0, "e": "三種都是鹼性的消化液，可以中和從胃來的酸。膽汁不含酵素，所以「都含酵素」錯。"}, {"id": "sci-3-4-q057", "u": "3-4", "t": "T5", "lv": "a", "s": 3, "k": "ext", "src": "延伸題", "q": "關於腸液與胰液的比較，下列何者正確？", "o": ["腸液由腸腺分泌、直接注入小腸；胰液由胰臟分泌、經導管注入小腸", "兩者都只能分解脂質", "腸液要經過導管才能注入小腸", "胰液不含酵素"], "a": 0, "e": "講義表格：腸腺位於小腸壁，直接注入；胰液經導管注入。胰液能分解醣類、蛋白質、脂質；腸液協助分解醣類和蛋白質。"}, {"id": "sci-3-4-q058", "u": "3-4", "t": "T5", "lv": "a", "s": 1, "k": "adapt", "src": "改編自屏東縣大同高中113學年補考題庫", "q": "胃液與胰液主要作用的場所，下列配對何者正確？", "o": ["胃液在胃，胰液在小腸", "兩者都在胃", "兩者都在小腸", "胃液在小腸，胰液在胃"], "a": 0, "e": "胃液由胃腺分泌在胃作用；胰液注入小腸作用。"}, {"id": "sci-3-4-q059", "u": "3-4", "t": "T5", "lv": "a", "s": 3, "k": "ext", "src": "延伸題", "q": "蛋白質先被哪一種消化液初步分解，再由哪些消化液繼續分解完成？", "o": ["胃液；胰液和腸液", "唾液；膽汁", "膽汁；胃液", "胰液；胃液"], "a": 0, "e": "蛋白質在胃由胃液初步分解，到小腸再由胰液和腸液繼續分解成胺基酸。"}, {"id": "sci-3-4-q060", "u": "3-4", "t": "T6", "lv": "b", "s": 1, "k": "orig", "src": "講義 p.79 試題11", "q": "每天吃下的食物中，最先被分解的是哪一類？", "o": ["澱粉", "蛋白質", "脂質", "纖維素"], "a": 0, "e": "食物一進口腔，唾液就開始分解澱粉，所以澱粉最先被分解。"}, {"id": "sci-3-4-q061", "u": "3-4", "t": "T6", "lv": "b", "s": 1, "k": "orig", "src": "講義 p.80 試題12", "q": "吃飯時把飯粒咀嚼得久一點，會感到甜味，這是因為飯中哪一種物質被唾液分解成糖？", "o": ["澱粉", "蛋白質", "脂質", "維生素"], "a": 0, "e": "唾液中的酵素把澱粉初步分解成糖，所以會覺得甜。"}, {"id": "sci-3-4-q062", "u": "3-4", "t": "T6", "lv": "b", "s": 1, "k": "orig", "src": "講義 p.80 試題15", "q": "人體攝取的蛋白質，可在哪兩處進行分解？（甲）口腔（乙）食道（丙）胃（丁）小腸（戊）大腸", "o": ["丙丁", "甲乙", "丁戊", "乙戊"], "a": 0, "e": "蛋白質在胃（胃液）初步分解，在小腸（胰液、腸液）分解完成。"}, {"id": "sci-3-4-q063", "u": "3-4", "t": "T6", "lv": "b", "s": 3, "k": "orig", "src": "講義 p.80 試題19", "q": "（甲）絨毛吸收養分（乙）分解澱粉（丙）儲藏脂質（丁）食物呈酸性。以上是食物消化過程中的情形，正確順序為何？", "o": ["乙→丁→甲→丙", "甲→乙→丙→丁", "丙→丁→乙→甲", "丁→乙→丙→甲"], "a": 0, "e": "跟著食物走一遍：口腔先分解澱粉（乙）→ 胃中食物呈酸性（丁）→ 小腸絨毛吸收養分（甲）→ 吸收後才能把脂質儲藏在體內（丙）。", "h": "食物一進嘴巴就開始分解什麼？養分要先被吸收，身體才能把它儲藏起來。", "w": 1, "c": "觀念不懂"}, {"id": "sci-3-4-q064", "u": "3-4", "t": "T6", "lv": "b", "s": 2, "k": "var", "src": "錯題類題", "q": "（甲）胃液分解蛋白質（乙）膽汁乳化脂質（丙）牙齒咬碎食物（丁）大腸吸收水分。依食物經過的先後順序排列為何？", "o": ["丙→甲→乙→丁", "甲→丙→乙→丁", "丙→乙→甲→丁", "乙→甲→丙→丁"], "a": 0, "e": "口腔（丙）→ 胃（甲）→ 小腸（乙）→ 大腸（丁）。", "of": "sci-3-4-q063"}, {"id": "sci-3-4-q065", "u": "3-4", "t": "T6", "lv": "b", "s": 2, "k": "var", "src": "錯題類題", "q": "吃一口漢堡（麵包、肉、起司），其中澱粉、蛋白質、脂質「開始被分解」的地點依序為何？", "o": ["口腔、胃、小腸", "胃、口腔、小腸", "口腔、小腸、胃", "都在小腸"], "a": 0, "e": "澱粉從口腔開始，蛋白質從胃開始，脂質到小腸才開始被分解。", "of": "sci-3-4-q063"}, {"id": "sci-3-4-q066", "u": "3-4", "t": "T6", "lv": "b", "s": 3, "k": "orig", "src": "講義 p.80 試題20", "q": "右圖為人類消化 a 澱粉、b 蛋白質、c 脂質的過程，甲～丁表示消化道的不同部位。下列敘述何者<u>錯誤</u>？", "o": ["丙是胰臟", "甲是口腔", "乙是食道", "丁是小腸"], "a": 0, "e": "讀圖：a 在甲段就開始下降 → 甲是口腔。乙段三條線都不動 → 乙是食道。b 在丙段開始下降 → 丙是胃。三條線都在丁段降到 0 → 丁是小腸。胰臟是消化腺，不是食物經過的消化道。", "h": "先找 a（澱粉）在哪一段開始下降，那就是口腔。再想：胰臟是食物會經過的地方嗎？", "w": 1, "c": "題意誤讀（讀圖）", "fig": "undigest"}, {"id": "sci-3-4-q067", "u": "3-4", "t": "T6", "lv": "b", "s": 2, "k": "var", "src": "錯題類題", "q": "同上圖，哪一段消化道中，三種養分都會被分解？", "o": ["丁", "甲", "乙", "丙"], "a": 0, "e": "a、b、c 三條線在丁段都下降到 0，丁是小腸，三種養分都在小腸被分解完成。", "of": "sci-3-4-q066", "fig": "undigest"}, {"id": "sci-3-4-q068", "u": "3-4", "t": "T6", "lv": "b", "s": 2, "k": "var", "src": "錯題類題", "q": "同上圖，曲線 b 在丙段開始下降，代表什麼？", "o": ["蛋白質在胃開始被分解", "澱粉在胃開始被分解", "脂質在口腔被分解", "蛋白質到小腸才開始被分解"], "a": 0, "e": "b 是蛋白質，丙是胃，所以蛋白質在胃開始被分解。", "of": "sci-3-4-q066", "fig": "undigest"}, {"id": "sci-3-4-q069", "u": "3-4", "t": "T6", "lv": "b", "s": 2, "k": "orig", "src": "講義 p.85 素養題10", "q": "小真吃了一碗豬腳麵線。右圖為消化系統示意圖，下列關於食物消化過程的敘述何者正確？", "o": ["豬腳的養分到達丙處才被消化為小分子並吸收", "若食物不乾淨，會使甲處水分吸收減少而拉肚子", "麵線到達乙處才開始消化分解", "食物中的脂肪主要在乙處消化吸收"], "a": 0, "e": "甲是食道、乙是胃、丙是小腸。豬腳的蛋白質、脂質在小腸被消化成小分子並吸收。食道不吸收水分；麵線的澱粉在口腔就開始分解；脂肪在小腸消化。", "h": "先認出甲、乙、丙是哪個器官。麵線（澱粉）在哪裡就開始分解了？", "w": 1, "c": "觀念不懂", "fig": "digest:s10"}, {"id": "sci-3-4-q070", "u": "3-4", "t": "T6", "lv": "b", "s": 2, "k": "var", "src": "錯題類題", "q": "吃一碗白飯，澱粉被「完全」分解成葡萄糖的主要部位在哪裡？", "o": ["小腸", "口腔", "胃", "大腸"], "a": 0, "e": "口腔只是初步分解，澱粉在小腸被胰液、腸液分解完成。", "of": "sci-3-4-q069"}, {"id": "sci-3-4-q071", "u": "3-4", "t": "T6", "lv": "b", "s": 1, "k": "var", "src": "錯題類題", "q": "奶油麵包中的奶油（脂質），開始被消化的地點在哪裡？", "o": ["小腸", "口腔", "胃", "食道"], "a": 0, "e": "脂質到小腸才有膽汁乳化、胰液分解。", "of": "sci-3-4-q069"}, {"id": "sci-3-4-q072", "u": "3-4", "t": "T6", "lv": "b", "s": 2, "k": "orig", "src": "講義 p.85 素養題13", "q": "右圖是某食物在人體不同消化器官中停留的時間。根據此圖判斷，此食物在接觸膽汁之前，最可能已在消化道中多少小時？", "o": ["4", "11", "13", "24"], "a": 0, "e": "膽汁在小腸前段才注入。接觸膽汁之前，食物經過口和食道（幾乎 0 小時）和胃（約 4 小時），合計約 4 小時。", "fig": "timeBar"}, {"id": "sci-3-4-q073", "u": "3-4", "t": "T6", "lv": "b", "s": 2, "k": "orig", "src": "講義 p.82 基本題10", "q": "右表為某食品營養標示的簡表，此食品中含量最多的營養成分，會在下列哪一個器官中被消化？", "o": ["小腸", "肝臟", "膽囊", "大腸"], "a": 0, "e": "含量最多的是蛋白質（64 公克）。蛋白質在胃和小腸被消化，選項中只有小腸。肝臟、膽囊不是消化道。", "fig": "label"}, {"id": "sci-3-4-q074", "u": "3-4", "t": "T6", "lv": "a", "s": 1, "k": "adapt", "src": "改編自臺北市民族國中106學年第二次段考", "q": "一般來說，下列哪一種食物最先被人體消化？", "o": ["米飯", "奶油", "雞蛋", "豬肉"], "a": 0, "e": "米飯主要是澱粉，從口腔就開始被分解。蛋、肉的蛋白質從胃開始；奶油的脂質到小腸才開始。"}, {"id": "sci-3-4-q075", "u": "3-4", "t": "T6", "lv": "a", "s": 2, "k": "adapt", "src": "改編自臺北市民族國中106學年第二次段考", "q": "早餐吃火腿蛋三明治配牛奶，下列敘述何者正確？", "o": ["麵包的澱粉在口腔就開始被分解", "牛奶的蛋白質在口腔被分解", "火腿的脂質在胃中被膽汁乳化", "所有養分都在大腸被吸收"], "a": 0, "e": "唾液在口腔分解澱粉。蛋白質從胃開始；膽汁在小腸乳化脂質；養分主要在小腸吸收。"}, {"id": "sci-3-4-q076", "u": "3-4", "t": "T6", "lv": "a", "s": 3, "k": "ext", "src": "延伸題", "q": "一塊蛋糕含澱粉、蛋白質、脂質。蛋糕經過胃之後、進入小腸之前，三種養分的狀態何者最合理？", "o": ["澱粉和蛋白質已部分分解，脂質幾乎還沒分解", "三種都已完全分解", "只有脂質被分解", "三種都還沒開始分解"], "a": 0, "e": "澱粉在口腔、蛋白質在胃已初步分解；脂質要到小腸才開始。"}, {"id": "sci-3-4-q077", "u": "3-4", "t": "T7", "lv": "b", "s": 2, "k": "orig", "src": "講義 p.80 試題18", "q": "如右圖，小胖因甲器官結石，以致完全阻塞無法排出汁液，哪一類食物的消化可能會受影響？", "o": ["脂質", "維生素", "醣類", "蛋白質"], "a": 0, "e": "甲是膽囊。膽汁無法排出，脂質不能乳化成小油滴，脂質的消化會受影響。", "h": "甲儲存的是哪一種消化液？那種消化液負責哪一種養分？", "w": 1, "c": "觀念不懂", "sus": 1, "fig": "digest:gb"}, {"id": "sci-3-4-q078", "u": "3-4", "t": "T7", "lv": "b", "s": 2, "k": "var", "src": "改編自台中市大甲國中114學年補考題庫", "q": "治療糖尿病的胰島素是一種蛋白質，不適合用口服方式補充。胰島素經過哪一個消化器官後會先失去活性？", "o": ["胃", "口腔", "小腸", "大腸"], "a": 0, "e": "胰島素是蛋白質，會在胃被胃液分解，所以要用注射的。", "of": "sci-3-4-q077"}, {"id": "sci-3-4-q079", "u": "3-4", "t": "T7", "lv": "b", "s": 2, "k": "var", "src": "錯題類題", "q": "若胰臟的導管阻塞，胰液無法進入小腸，下列何者受影響最大？", "o": ["三大養分在小腸的消化都會變差", "只有澱粉在口腔的消化變差", "胃中蛋白質的消化完全停止", "大腸無法吸收水分"], "a": 0, "e": "胰液含有分解醣類、蛋白質、脂質的酵素，在小腸作用。胰液進不去，小腸的消化都受影響。", "of": "sci-3-4-q077"}, {"id": "sci-3-4-q080", "u": "3-4", "t": "T7", "lv": "b", "s": 2, "k": "orig", "src": "講義 p.87 經典題10（106會考）", "q": "右圖為人體部分消化器官示意圖。若老王體內的甲處發生阻塞，下列關於他的消化及養分吸收功能，何者最可能發生？", "o": ["消化脂質的功能下降", "胰液無法排至小腸內", "胃液無法分解蛋白質", "吸收葡萄糖的功能下降"], "a": 0, "e": "甲是膽囊，儲存肝臟分泌的膽汁，再經導管注入小腸。甲阻塞時膽汁無法進入小腸，脂質無法乳化，消化脂質的功能下降。", "fig": "digest:gb"}, {"id": "sci-3-4-q081", "u": "3-4", "t": "T7", "lv": "a", "s": 2, "k": "adapt", "src": "改編自臺北市民族國中106學年第二次段考", "q": "某病人的肝臟功能欠佳，膽汁分泌不足，飲食上應避免哪一類食物？", "o": ["高脂肪食物", "高纖維食物", "高醣類食物", "白開水"], "a": 0, "e": "膽汁負責乳化脂質，分泌不足時脂質不易消化，應少吃油膩食物。"}, {"id": "sci-3-4-q082", "u": "3-4", "t": "T7", "lv": "a", "s": 2, "k": "adapt", "src": "改編自臺北市民族國中106學年第二次段考", "q": "醫生若想減少病人吸收養分，最可能建議縮短消化道的哪一段？", "o": ["小腸", "食道", "大腸", "口腔"], "a": 0, "e": "小腸是消化和吸收養分的主要器官，縮短小腸就會減少養分吸收。"}, {"id": "sci-3-4-q083", "u": "3-4", "t": "T7", "lv": "a", "s": 3, "k": "ext", "src": "延伸題", "q": "胃被切除一部分的病人，下列哪一項消化最直接受到影響？", "o": ["蛋白質的初步分解", "澱粉的初步分解", "脂質的乳化", "剩餘水分的吸收"], "a": 0, "e": "胃液負責初步分解蛋白質。澱粉在口腔、脂質乳化在小腸、剩餘水分在大腸，都不在胃。"}, {"id": "sci-3-4-q084", "u": "3-4", "t": "T7", "lv": "a", "s": 2, "k": "ext", "src": "延伸題", "q": "拉肚子時糞便很稀，最可能是哪一段的功能沒有充分發揮？", "o": ["大腸吸收水分", "胃分解蛋白質", "口腔分解澱粉", "膽汁乳化脂質"], "a": 0, "e": "糞便的水分在大腸被吸收。食物停留大腸時間太短，水分沒被吸收，糞便就很稀。"}, {"id": "sci-3-4-q085", "u": "3-4", "t": "T7", "lv": "a", "s": 3, "k": "ext", "src": "延伸題", "q": "膽囊被切除的人，肝臟仍會分泌膽汁，但無法儲存。他的飲食最適合怎麼調整？", "o": ["少量多餐，避免一次吃大量油膩食物", "完全不能吃任何食物", "只喝水", "多吃油炸食物"], "a": 0, "e": "膽汁無法儲存、一次的量有限，一次吃大量油脂會消化不良，所以要少油、少量多餐。"}, {"id": "sci-3-4-q086", "u": "3-4", "t": "T8", "lv": "b", "s": 2, "k": "orig", "src": "講義 p.79 試題6", "q": "老師給小明一段腸子的活體標本，請他判斷是大腸還是小腸。下列哪一項<u>較難</u>作為判別的線索？", "o": ["腸壁有無肌肉", "腸子管徑的大小", "有無絨毛", "腸道中殘留分泌物的分析"], "a": 0, "e": "大腸和小腸都要蠕動，管壁都有肌肉，所以看有沒有肌肉分不出來。管徑大小、有無絨毛（只有小腸有）、殘留的消化液都能區分。", "h": "大腸和小腸都會蠕動嗎？蠕動要靠什麼？", "w": 1, "c": "觀念不懂"}, {"id": "sci-3-4-q087", "u": "3-4", "t": "T8", "lv": "b", "s": 2, "k": "var", "src": "錯題類題", "q": "下列哪一項是小腸「有」、大腸「沒有」的特徵？", "o": ["內壁有絨毛", "管壁有肌肉", "會蠕動", "屬於消化道"], "a": 0, "e": "小腸內壁有皺褶和絨毛；大腸沒有絨毛。肌肉、蠕動、屬於消化道是兩者共同的。", "of": "sci-3-4-q086"}, {"id": "sci-3-4-q088", "u": "3-4", "t": "T8", "lv": "b", "s": 2, "k": "var", "src": "錯題類題", "q": "小腸是消化道中最長的器官，這對它的功能有什麼幫助？", "o": ["讓食物停留較久，有足夠時間消化與吸收", "讓食物更快排出", "讓胃酸更強", "讓大腸不必吸收水分"], "a": 0, "e": "小腸長、內壁又有皺褶和絨毛，食物停留時間長、接觸面積大，有利消化和吸收。", "of": "sci-3-4-q086"}, {"id": "sci-3-4-q089", "u": "3-4", "t": "T8", "lv": "b", "s": 1, "k": "orig", "src": "講義 p.80 試題16", "q": "小腸內壁的絨毛，主要的功能是哪一項？", "o": ["擴大吸收面積，以加速吸收", "消除廢物，便於吸收養分", "促進消化液分泌，以加速消化", "增加消化道運動，以加速吸收"], "a": 0, "e": "絨毛增加吸收養分和水分的表面積。"}, {"id": "sci-3-4-q090", "u": "3-4", "t": "T8", "lv": "b", "s": 2, "k": "orig", "src": "講義 p.85 素養題12", "q": "晶晶吃了一頓豐盛的晚餐，有關食物的消化與吸收，下列何者正確？", "o": ["經消化後的養分，可由小腸絨毛吸收", "胃最先將各類食物進行初步分解", "膽囊分泌膽汁分解脂質後由小腸絨毛吸收", "消化道各處皆有消化腺分泌消化液分解食物"], "a": 0, "e": "口腔最先分解澱粉；膽汁由肝臟分泌、只乳化不分解；食道、大腸沒有消化液注入。"}, {"id": "sci-3-4-q091", "u": "3-4", "t": "T8", "lv": "a", "s": 1, "k": "adapt", "src": "改編自台中市三光國中114學年補行評量題庫", "q": "小腸內壁有許多小突起，負責大量吸收消化後的小分子養分，這個構造是什麼？", "o": ["絨毛", "纖毛", "導管", "闌尾"], "a": 0, "e": "小腸內壁皺褶上的指狀突起稱為絨毛。"}, {"id": "sci-3-4-q092", "u": "3-4", "t": "T8", "lv": "b", "s": 1, "k": "key", "src": "講義 p.78 絨毛", "q": "被絨毛吸收的小分子養分，由什麼運送到全身細胞？", "o": ["絨毛內的微血管（血液）", "消化液", "神經", "導管"], "a": 0, "e": "小分子養分和水被吸收進絨毛內的微血管，再藉血管運送到全身。"}, {"id": "sci-3-4-q093", "u": "3-4", "t": "T8", "lv": "a", "s": 2, "k": "adapt", "src": "改編自新竹市培英國中110學年補考題", "q": "人體吸收「大部分」水分的器官是哪一個？", "o": ["小腸", "大腸", "胃", "食道"], "a": 0, "e": "講義：小腸吸收養分和大部分的水；大腸只吸收剩餘的水分。很多人誤以為是大腸。"}, {"id": "sci-3-4-q094", "u": "3-4", "t": "T8", "lv": "a", "s": 2, "k": "ext", "src": "講義 p.78 排便困難", "q": "便秘時建議多吃蔬菜水果，主要原因是什麼？", "o": ["纖維素無法被分解，可增加糞便體積、促進大腸蠕動", "蔬果中的酵素能分解糞便", "纖維素被分解後提供能量", "蔬果能讓大腸吸收更多水分"], "a": 0, "e": "人體沒有分解纖維素的酵素；纖維素增加糞便體積，促使大腸蠕動，有利排便。"}, {"id": "sci-3-4-q095", "u": "3-4", "t": "T8", "lv": "a", "s": 2, "k": "ext", "src": "講義 p.78 大腸", "q": "下列何者<u>不是</u>糞便的組成？", "o": ["已被吸收的葡萄糖", "食物殘渣", "剝落的大腸壁細胞", "腸內細菌"], "a": 0, "e": "糞便由食物殘渣、剝落的大腸壁細胞、腸內細菌混合而成。葡萄糖早已在小腸被吸收。"}, {"id": "sci-3-4-q096", "u": "3-4", "t": "T8", "lv": "a", "s": 2, "k": "ext", "src": "講義 p.78 排便困難", "q": "食物殘渣停留在大腸的時間太長，糞便會變得怎樣？", "o": ["越來越乾，排便困難", "越來越稀", "被再次消化成葡萄糖", "被絨毛吸收"], "a": 0, "e": "大腸持續吸收水分，糞便越來越乾，排遺越困難。"}, {"id": "sci-3-4-q097", "u": "3-4", "t": "T8", "lv": "a", "s": 3, "k": "ext", "src": "延伸題", "q": "下列哪一個構造或作用，和「增加表面積」<u>無關</u>？", "o": ["食道是長管狀，可推送食物到胃", "小腸內壁有許多皺褶", "皺褶上有指狀的絨毛", "牙齒把食物磨細"], "a": 0, "e": "皺褶和絨毛增加吸收面積；牙齒磨細食物增加和酵素接觸的面積。食道的長管狀是為了推送食物。"}, {"id": "sci-3-4-q098", "u": "3-4", "t": "T9", "lv": "b", "s": 2, "k": "orig", "src": "講義 p.84 素養題5", "q": "一種特定的酵素X固定在器具上仍有活性。把器具倒放在成分全為蛋白質的吉利丁凍上，吉利丁凍被分解。立即再把器具倒放在成分全為醣類的洋菜凍上（環境不變），洋菜凍會不會被酵素X分解？", "o": ["不會，因為酵素X不能分解醣類", "不會，因為酵素X作用後就被分解了", "會，因為酵素X可以重複作用", "會，因為酵素X可以分解凍狀物質"], "a": 0, "e": "酵素有專一性：酵素X會分解蛋白質，就不會分解醣類。酵素反應後不變、可重複使用，但只對自己的受質有用。", "h": "酵素X會分解蛋白質，它也會分解醣類嗎？想想「鑰匙和鎖」。", "w": 1, "c": "觀念不懂", "sus": 1}, {"id": "sci-3-4-q099", "u": "3-4", "t": "T9", "lv": "b", "s": 1, "k": "var", "src": "錯題類題", "q": "唾液中的澱粉酶可以分解澱粉，卻不能分解蛋白質，這說明酵素具有哪一種特性？", "o": ["專一性", "可重複使用", "耐熱性", "會被用完"], "a": 0, "e": "一種酵素只作用在特定的受質，叫做專一性。", "of": "sci-3-4-q098"}, {"id": "sci-3-4-q100", "u": "3-4", "t": "T9", "lv": "b", "s": 2, "k": "var", "src": "錯題類題", "q": "某酵素分解完一塊吉利丁（蛋白質）後，立刻放到另一塊吉利丁上，條件不變，結果會如何？", "o": ["仍會分解，因為酵素反應後不變、可重複使用", "不會，因為酵素已經用完", "不會，因為酵素被吉利丁分解", "會，但改成分解醣類"], "a": 0, "e": "酵素反應前後本質不變，可以重複使用；受質仍是蛋白質，所以會繼續分解。", "of": "sci-3-4-q098"}, {"id": "sci-3-4-q101", "u": "3-4", "t": "T9", "lv": "b", "s": 2, "k": "orig", "src": "講義 p.86 經典題2（109會考）", "q": "製作麵包時，可以添加澱粉酶、脂肪酶和蛋白酶。關於這三種酵素的「主要成分」，下列何者最合理？", "o": ["三種酵素的主要成分都是蛋白質", "分別是澱粉、脂肪、蛋白質", "分別是醣類、脂肪酸、胺基酸", "三種都是澱粉"], "a": 0, "e": "酵素的主要成分是蛋白質，和它分解什麼無關。「澱粉酶」只代表它分解澱粉。", "h": "酵素本身是用什麼做的？名字裡的「澱粉」說的是它的受質，還是它的成分？", "w": 1, "c": "記憶不牢"}, {"id": "sci-3-4-q102", "u": "3-4", "t": "T9", "lv": "b", "s": 1, "k": "var", "src": "錯題類題", "q": "脂肪酶的主要成分是什麼？", "o": ["蛋白質", "脂肪", "脂肪酸", "甘油"], "a": 0, "e": "所有酵素的主要成分都是蛋白質。", "of": "sci-3-4-q101"}, {"id": "sci-3-4-q103", "u": "3-4", "t": "T9", "lv": "b", "s": 2, "k": "var", "src": "錯題類題", "q": "下列何者的主要成分<u>不是</u>蛋白質？", "o": ["澱粉", "唾液澱粉酶", "胃蛋白酶", "胰島素"], "a": 0, "e": "兩種酵素和胰島素的主要成分都是蛋白質；澱粉屬於醣類。", "of": "sci-3-4-q101"}, {"id": "sci-3-4-q104", "u": "3-4", "t": "T9", "lv": "b", "s": 2, "k": "orig", "src": "講義 p.87 經典題9", "q": "唾液中的甲物質可以催化澱粉分解，胃液中的乙物質可以催化蛋白質分解。甲、乙兩種物質本身的主要成分為何？", "o": ["甲、乙皆為蛋白質", "甲、乙皆為澱粉", "甲為澱粉，乙為蛋白質", "甲為葡萄糖，乙為胺基酸"], "a": 0, "e": "甲、乙都是酵素，酵素的主要成分是蛋白質。", "h": "會「催化」分解的物質是什麼？它是用什麼做的？", "w": 1, "c": "記憶不牢"}, {"id": "sci-3-4-q105", "u": "3-4", "t": "T9", "lv": "b", "s": 2, "k": "var", "src": "錯題類題", "q": "酵素容易受到溫度、酸鹼值影響，主要原因是什麼？", "o": ["酵素的主要成分是蛋白質", "酵素是醣類", "酵素是脂質", "酵素是礦物質"], "a": 0, "e": "酵素是蛋白質，會影響蛋白質的因素（溫度、酸鹼值、重金屬）都會影響酵素。", "of": "sci-3-4-q104"}, {"id": "sci-3-4-q106", "u": "3-4", "t": "T9", "lv": "b", "s": 3, "k": "var", "src": "錯題類題", "q": "胃蛋白酶隨著食物進入小腸後，可能被哪一種消化液中的酵素分解？", "o": ["胰液", "唾液", "膽汁", "大腸黏液"], "a": 0, "e": "胃蛋白酶本身是蛋白質；胰液中有分解蛋白質的酵素，可以把它分解。膽汁不含酵素。", "of": "sci-3-4-q104"}, {"id": "sci-3-4-q107", "u": "3-4", "t": "T9", "lv": "b", "s": 2, "k": "orig", "src": "講義 p.86 經典題3（107會考）", "q": "將酵素甲和澱粉溶液在試管中混合均勻，定時測量澱粉濃度，結果如右圖。下列關於甲的敘述何者正確？", "o": ["若提高甲的活性，澱粉的分解速率會變快", "甲主要由葡萄糖組成", "甲與澱粉反應後，會被分解成胺基酸", "若降低甲的活性，澱粉的合成速率會變快"], "a": 0, "e": "澱粉濃度一直下降 → 甲在「分解」澱粉。甲是酵素（蛋白質），反應後不變；活性提高，分解得更快。", "h": "澱粉濃度一直下降，代表甲在做分解還是合成？酵素反應後會不見嗎？", "w": 1, "c": "觀念不懂", "fig": "starchConc"}, {"id": "sci-3-4-q108", "u": "3-4", "t": "T9", "lv": "b", "s": 2, "k": "var", "src": "錯題類題", "q": "同上圖的實驗，若改加入「煮沸過再冷卻」的酵素甲，澱粉濃度會怎樣變化？", "o": ["幾乎不變", "下降得更快", "先上升再下降", "立刻變成 0"], "a": 0, "e": "高溫使酵素永久失去活性，澱粉不會被分解，濃度幾乎不變。", "of": "sci-3-4-q107", "fig": "starchConc"}, {"id": "sci-3-4-q109", "u": "3-4", "t": "T9", "lv": "b", "s": 3, "k": "var", "src": "錯題類題", "q": "在澱粉量不變的試管中，加入更多的酵素甲，最後產生的葡萄糖總量會如何？", "o": ["不變，只是更快達到", "變多", "變少", "變成胺基酸"], "a": 0, "e": "酵素只加速反應，不增加產量。產物總量由澱粉（受質）的量決定。", "of": "sci-3-4-q107"}, {"id": "sci-3-4-q110", "u": "3-4", "t": "T9", "lv": "a", "s": 2, "k": "adapt", "src": "改編自台中市三光國中114學年補行評量題庫", "q": "下列關於酵素的敘述，何者<u>錯誤</u>？", "o": ["所有酵素在 55°C 時都一定會被破壞", "每種酵素有適合的溫度範圍", "酵素的成分是蛋白質", "酸鹼度會影響酵素的活性"], "a": 0, "e": "每種酵素的最適溫度不同，有些耐高溫（例如溫泉中生物的酵素），不能說全部在 55°C 都會被破壞。"}, {"id": "sci-3-4-q111", "u": "3-4", "t": "T9", "lv": "a", "s": 1, "k": "adapt", "src": "改編自臺北市民族國中106學年第二次段考", "q": "南美洲有把玉米嚼過再吐出釀酒的傳統。口水中能把澱粉分解成糖的物質是什麼？", "o": ["酵素", "激素", "維生素", "抗生素"], "a": 0, "e": "唾液中的澱粉酶（酵素）把澱粉分解成糖，糖再發酵成酒。"}, {"id": "sci-3-4-q112", "u": "3-4", "t": "T9", "lv": "a", "s": 3, "k": "adapt", "src": "改編自臺北市民族國中106學年第二次段考", "q": "下列哪一項過程<u>不需要</u>酵素協助？", "o": ["膽汁把脂質乳化成小油滴", "消化作用中的分解", "光合作用", "呼吸作用"], "a": 0, "e": "乳化只是把大油滴打散變小，屬於物理變化，膽汁也不含酵素。消化作用中的分解、光合作用、呼吸作用都是化學反應，需要酵素。"}, {"id": "sci-3-4-q113", "u": "3-4", "t": "T10", "lv": "b", "s": 2, "k": "orig", "src": "講義 p.80 試題14", "q": "下列哪一組試管中的溶液，分解蛋白質的效果最佳？", "o": ["3mL 胃液加兩滴強酸", "3mL 胃液加兩滴強鹼", "3mL 唾液加兩滴強酸", "3mL 唾液加兩滴強鹼"], "a": 0, "e": "胃液才能分解蛋白質，而且胃蛋白酶在酸性環境中活性高。"}, {"id": "sci-3-4-q114", "u": "3-4", "t": "T10", "lv": "b", "s": 2, "k": "orig", "src": "講義 p.81 基本題3", "q": "右圖為某種生物生存所必需的酵素，其活性與溫度的關係。這種生物最可能生存在哪裡？", "o": ["高溫溫泉", "溫帶草原", "熱帶河流", "河口沼澤"], "a": 0, "e": "這種酵素在 70～80°C 活性最高，只有高溫溫泉有這麼高的溫度。", "fig": "hotEnz"}, {"id": "sci-3-4-q115", "u": "3-4", "t": "T10", "lv": "b", "s": 1, "k": "orig", "src": "講義 p.81 基本題4", "q": "右圖為甲、乙、丙三種酵素在不同 pH 值下的活性。下列敘述何者正確？", "o": ["三種酵素各有其最適合的 pH 值", "pH 值增加，三種酵素活性持續增加", "pH 值減少，三種酵素活性持續增加", "三種酵素的活性大小和 pH 值無關"], "a": 0, "e": "三條曲線各有一個最高點，最高點的 pH 就是該酵素的最適 pH。", "fig": "ph3"}, {"id": "sci-3-4-q116", "u": "3-4", "t": "T10", "lv": "b", "s": 3, "k": "orig", "src": "講義 p.83 素養題2", "q": "酵素Y的活性與溫度關係如左圖，超過 50°C 就無法再回復催化能力。小庭在甲、乙、丙三支試管中裝入等量澱粉液和酵素Y，分別放在 10°C、30°C、55°C 中，第 0、35、70 分鐘取液體用碘液檢測，結果如右表。三支試管最可能各放在哪個溫度？", "o": ["甲 30°C、乙 10°C、丙 55°C", "甲 10°C、乙 30°C、丙 55°C", "甲 55°C、乙 30°C、丙 10°C", "甲 55°C、乙 10°C、丙 30°C"], "a": 0, "e": "黃褐色＝澱粉已被分解。甲在 35 分鐘就黃褐 → 分解最快 → 最適溫 30°C。乙到 70 分鐘才黃褐 → 慢 → 10°C（低溫活性低但還有）。丙一直藍黑 → 酵素被破壞 → 55°C。", "h": "黃褐色代表澱粉被分解了。哪一管最快變黃褐？哪一管一直是藍黑？", "w": 1, "c": "題意誤讀（讀圖表）", "fig": "enzY"}, {"id": "sci-3-4-q117", "u": "3-4", "t": "T10", "lv": "b", "s": 3, "k": "var", "src": "錯題類題", "q": "承上題，把原本放在 55°C 的丙試管移到 30°C，再放 35 分鐘後用碘液檢測，顏色為何？", "o": ["藍黑色，因為酵素已永久失去活性", "黃褐色，因為 30°C 是最適溫度", "先黃褐色再變藍黑色", "紅色"], "a": 0, "e": "超過 50°C 酵素Y就永久失去活性，移回 30°C 也不會恢復，澱粉還在，所以是藍黑色。", "of": "sci-3-4-q116", "fig": "enzY"}, {"id": "sci-3-4-q118", "u": "3-4", "t": "T10", "lv": "b", "s": 2, "k": "var", "src": "錯題類題", "q": "酵素Y在 10°C 時分解澱粉的速度較慢，原因是什麼？", "o": ["低溫使活性降低，但回溫後可以恢復", "低溫使酵素永久被破壞", "10°C 時澱粉變多了", "碘液在低溫下失效"], "a": 0, "e": "低溫只是暫時降低活性；回到適合的溫度，活性就恢復。", "of": "sci-3-4-q116"}, {"id": "sci-3-4-q119", "u": "3-4", "t": "T10", "lv": "b", "s": 2, "k": "orig", "src": "講義 p.83 素養題4", "q": "有些水果含有可分解蛋白質的酵素，能讓牛肉軟嫩。右圖為 15°C 時四種此類酵素甲、乙、丙、丁在不同 pH 值下的活性。若牛肉放在 15°C 的中性環境，加入等量的哪一種酵素，可使牛肉最快變軟嫩？", "o": ["乙", "甲", "丙", "丁"], "a": 0, "e": "中性是 pH＝7。在 pH 7 畫一條直線，乙的曲線最高，活性最大。", "h": "中性是 pH 多少？在那個位置畫一條直線，看哪一條線最高。", "w": 1, "c": "題意誤讀（讀圖）", "fig": "ph4"}, {"id": "sci-3-4-q120", "u": "3-4", "t": "T10", "lv": "b", "s": 2, "k": "var", "src": "錯題類題", "q": "同上圖，若要在酸性的醃料（約 pH 2）中讓牛肉軟嫩，應選哪一種酵素？", "o": ["甲", "乙", "丙", "丁"], "a": 0, "e": "在 pH 2 的位置，甲的活性最高。", "of": "sci-3-4-q119", "fig": "ph4"}, {"id": "sci-3-4-q121", "u": "3-4", "t": "T10", "lv": "b", "s": 1, "k": "var", "src": "錯題類題", "q": "同上圖，丁酵素最適合在哪一種環境中作用？", "o": ["鹼性", "酸性", "中性", "任何 pH 都一樣"], "a": 0, "e": "丁的最高點在 pH 約 11～12，大於 7，屬於鹼性。", "of": "sci-3-4-q119", "fig": "ph4"}, {"id": "sci-3-4-q122", "u": "3-4", "t": "T10", "lv": "b", "s": 3, "k": "orig", "src": "講義 p.84 素養題6", "q": "酵素X的活性與溫度關係如圖甲，置於超過 44°C 的環境中就無法再回復催化能力。小維在試管中加入具活性的酵素X，溫度隨時間變化如圖乙。在第 10、20、50、60 分鐘各取出 2mL 酵素X分析活性，哪一個時間點取得的酵素活性最大？", "o": ["10 分", "20 分", "50 分", "60 分"], "a": 0, "e": "第 10 分鐘約 39°C，酵素正常且接近最適溫度。約 15 分鐘後溫度超過 44°C，酵素永久失活，之後第 20、50、60 分鐘取出的酵素都沒有活性。", "h": "酵素只要超過 44°C 一次，就永遠回不來。哪個時間點之前還沒超過 44°C？", "w": 1, "c": "觀念不懂", "fig": "enzTime"}, {"id": "sci-3-4-q123", "u": "3-4", "t": "T10", "lv": "b", "s": 2, "k": "var", "src": "錯題類題", "q": "酵素X一旦超過 44°C 就無法回復催化能力。某試管中的酵素X在第 20 分鐘時溫度已升到 48°C，若在第 60 分鐘把溫度調回 40°C，酵素X的活性會如何？", "o": ["仍然沒有活性", "恢復到最高", "恢復一半", "比第 10 分鐘還高"], "a": 0, "e": "酵素X早已因超過 44°C 永久失活，溫度降回來也不會恢復。", "of": "sci-3-4-q122"}, {"id": "sci-3-4-q124", "u": "3-4", "t": "T10", "lv": "b", "s": 1, "k": "var", "src": "錯題類題", "q": "酵素在 0°C 和 90°C 時都沒有活性，兩者的差別是什麼？", "o": ["0°C 是暫時失活（回溫可恢復），90°C 是永久失活", "兩者都是永久失活", "兩者回溫都可以恢復", "0°C 是永久失活，90°C 是暫時失活"], "a": 0, "e": "低溫暫時、高溫永久。冰箱保存食物就是利用低溫暫時降低酵素活性。", "of": "sci-3-4-q122"}, {"id": "sci-3-4-q125", "u": "3-4", "t": "T10", "lv": "b", "s": 2, "k": "orig", "src": "講義 p.84 素養題7", "q": "右圖為某生物體內酵素活性隨溫度、pH 變化的示意圖。下列關於此酵素的敘述何者最恰當？", "o": ["其活性不會一直隨溫度升高而增加", "不可能是人體內的酵素", "在中性 pH 的環境中活性最高", "溫度對酵素活性的影響比 pH 值大"], "a": 0, "e": "溫度圖：活性升到約 40°C 後就下降，不是一直增加。pH 圖：最高點在 pH 約 3（酸性），像人體胃中的酵素，所以可能是人體酵素。圖中無法比較溫度和 pH 誰影響大。", "h": "溫度圖是一直往上嗎？人體內有沒有酸性的地方？", "w": 1, "c": "觀念不懂（讀圖）", "fig": "enzTP"}, {"id": "sci-3-4-q126", "u": "3-4", "t": "T10", "lv": "b", "s": 2, "k": "var", "src": "錯題類題", "q": "同上圖，這種酵素最可能在人體哪一個部位作用？", "o": ["胃", "口腔", "小腸", "大腸"], "a": 0, "e": "最適 pH 約 3（酸性）、最適溫度約 40°C，符合胃的環境。", "of": "sci-3-4-q125", "fig": "enzTP"}, {"id": "sci-3-4-q127", "u": "3-4", "t": "T10", "lv": "b", "s": 1, "k": "var", "src": "錯題類題", "q": "同上圖，酵素在約 40°C、pH 約 3 時，活性如何？", "o": ["活性最高", "活性最低", "永久失活", "無法判斷"], "a": 0, "e": "兩張圖的最高點分別在約 40°C 和 pH 約 3。", "of": "sci-3-4-q125", "fig": "enzTP"}, {"id": "sci-3-4-q128", "u": "3-4", "t": "T10", "lv": "b", "s": 3, "k": "orig", "src": "講義 p.88 經典題12（110會考修改）", "q": "某種酵素最適合在 37°C、pH＝8 的環境作用，在 pH＜5 的環境下會被完全破壞。若某人吃下這種酵素，它在口腔、胃、小腸中的活性，下列何者最合理？", "o": ["口腔有活性；胃和小腸都沒有活性", "口腔和小腸有活性，胃沒有", "小腸活性最高，口腔次之，胃沒有", "三處都有活性，胃最高"], "a": 0, "e": "口腔接近中性，有活性。胃是強酸（pH＜5），酵素被完全破壞。被破壞的酵素到了小腸也不會恢復，所以小腸也沒有活性。", "h": "吃下去的順序是口腔→胃→小腸。在胃裡被完全破壞後，到小腸還能恢復嗎？", "w": 1, "c": "觀念不懂"}, {"id": "sci-3-4-q129", "u": "3-4", "t": "T10", "lv": "b", "s": 2, "k": "var", "src": "錯題類題", "q": "同一種酵素（最適 pH 8，pH＜5 會被破壞），如果不經過胃，直接放進 pH 8 的小腸環境中，活性如何？", "o": ["很高", "沒有活性", "和在胃中一樣", "無法判斷"], "a": 0, "e": "沒有經過胃酸，酵素沒被破壞，在最適的 pH 8 環境中活性很高。", "of": "sci-3-4-q128"}, {"id": "sci-3-4-q130", "u": "3-4", "t": "T10", "lv": "b", "s": 1, "k": "var", "src": "改編自台中市大甲國中114學年補考題庫", "q": "唾液澱粉酶隨食物進入胃後，活性大幅降低，主要原因是什麼？", "o": ["胃中是酸性環境", "胃的溫度太高", "胃中沒有澱粉", "胃會吸收唾液"], "a": 0, "e": "唾液酵素在中性環境活性最好；胃是酸性，所以活性下降。", "of": "sci-3-4-q128"}, {"id": "sci-3-4-q131", "u": "3-4", "t": "T10", "lv": "b", "s": 3, "k": "orig", "src": "講義 p.87 經典題7（108會考）", "q": "綠茶和紅茶用同樣的茶葉，但製作過程不同。茶葉中的酵素X超過 70°C 就無法再有催化能力。右圖為兩種茶四個步驟（Ⅰ→Ⅱ→Ⅲ→Ⅳ）的溫度，比較各步驟結束時酵素X的活性，何者最合理？", "o": ["步驟Ⅳ結束時：綠茶＝紅茶", "步驟Ⅰ結束時：綠茶＞紅茶", "步驟Ⅱ結束時：綠茶＝紅茶", "步驟Ⅲ結束時：綠茶＜紅茶"], "a": 0, "e": "綠茶在步驟Ⅰ就超過 70°C，酵素失活；紅茶到步驟Ⅲ才超過 70°C。步驟Ⅲ之後兩者都失活，步驟Ⅳ活性都是 0，所以相等。", "fig": "tea"}, {"id": "sci-3-4-q132", "u": "3-4", "t": "T10", "lv": "a", "s": 3, "k": "adapt", "src": "改編自113年會考自然第41題", "q": "工廠用酵素X把物質甲轉變成物質乙，酵素X超過 75°C 就失去催化能力。製程溫度：10:00 為 30°C、10:10 為 50°C、10:20 為 70°C、10:30 為 80°C、10:40 為 60°C、10:50 為 40°C。下列哪兩個時間點的物質乙含量最接近？", "o": ["10:40 和 10:50", "10:00 和 10:10", "10:10 和 10:20", "10:20 和 10:30"], "a": 0, "e": "10:20 到 10:30 之間溫度超過 75°C，酵素永久失活，之後不再產生乙。10:40 和 10:50 都在失活之後，乙的量不變。其他時段酵素都還在作用，乙一直增加。"}, {"id": "sci-3-4-q133", "u": "3-4", "t": "T11", "lv": "b", "s": 1, "k": "orig", "src": "講義 p.81 基本題1", "q": "小美懷疑珍珠粉裡摻了澱粉，可以用下列哪一種試劑檢測？", "o": ["碘液", "本氏液", "亞甲藍液", "氯化亞鈷溶液"], "a": 0, "e": "碘液遇澱粉變藍黑色。本氏液測糖；亞甲藍是染色用。"}, {"id": "sci-3-4-q134", "u": "3-4", "t": "T11", "lv": "b", "s": 1, "k": "orig", "src": "講義 p.83 素養題1", "q": "兩包未標示的白色粉末，分別是葡萄糖與麵粉。下列哪一項實驗最適合區分兩者？", "o": ["各加入少量稀碘液，觀察是否變藍黑色", "用藍色石蕊試紙測試是否變色", "各加入一滴濃硫酸，觀察是否變黑", "配成水溶液後通電，觀察是否導電"], "a": 0, "e": "麵粉含澱粉，遇碘液變藍黑；葡萄糖不會。"}, {"id": "sci-3-4-q135", "u": "3-4", "t": "T11", "lv": "b", "s": 2, "k": "orig", "src": "講義 p.83 素養題3", "q": "甲管「澱粉液＋唾液」、乙管「澱粉液＋水」，放在溫水中 40 分鐘後各加一滴碘液，甲呈黃褐色、乙呈藍黑色。此實驗結果可支持哪一項敘述？", "o": ["唾液中含有可將澱粉轉化的物質", "唾液中含有葡萄糖", "水可使澱粉液呈藍黑色", "水溫升高，反應時間可縮短"], "a": 0, "e": "甲的澱粉不見了，代表唾液中有物質（酵素）分解澱粉。實驗沒有測糖、也沒有改變溫度。"}, {"id": "sci-3-4-q136", "u": "3-4", "t": "T11", "lv": "b", "s": 2, "k": "orig", "src": "講義 p.85 經典題1（111會考）", "q": "蜂蜜中含有分解澱粉的酵素。甲、乙兩支試管都裝等量澱粉液，隨機在其中一支加入蜂蜜、另一支加等量的水，放在適宜溫度足夠時間後用碘液檢測：甲呈藍黑色，乙呈黃褐色。哪一支加了蜂蜜？理由為何？", "o": ["乙，因為未檢測出澱粉", "甲，因為未檢測出澱粉", "甲，因為有檢測出澱粉", "乙，因為有檢測出澱粉"], "a": 0, "e": "黃褐色是碘液原本的顏色，代表沒有澱粉。乙的澱粉被蜂蜜中的酵素分解了，所以乙加了蜂蜜。", "h": "黃褐色＝碘液原本的顏色＝沒有澱粉。澱粉不見了，是誰做的？", "w": 1, "c": "觀念不懂（結果反推）"}, {"id": "sci-3-4-q137", "u": "3-4", "t": "T11", "lv": "b", "s": 3, "k": "var", "src": "錯題類題", "q": "兩支澱粉液試管，一支加鳳梨汁（含分解蛋白質的酵素），一支加等量的水，足夠時間後滴碘液，結果最可能為何？", "o": ["兩支都是藍黑色，因為鳳梨汁的酵素不分解澱粉", "加鳳梨汁的變黃褐色", "加水的變黃褐色", "兩支都是黃褐色"], "a": 0, "e": "酵素有專一性。鳳梨的酵素分解蛋白質，不分解澱粉，兩支的澱粉都還在。", "of": "sci-3-4-q136"}, {"id": "sci-3-4-q138", "u": "3-4", "t": "T11", "lv": "b", "s": 2, "k": "var", "src": "錯題類題", "q": "甲管「澱粉液＋某消化液」、乙管「澱粉液＋水」，一段時間後加本氏液隔水加熱：甲呈紅色，乙呈淡藍色。可推論什麼？", "o": ["某消化液能把澱粉分解成糖", "某消化液本身含有大量澱粉", "水能分解澱粉", "本氏液和澱粉反應會變紅"], "a": 0, "e": "甲出現糖、乙沒有，差別只在加了消化液，所以是消化液把澱粉分解成糖。", "of": "sci-3-4-q136"}, {"id": "sci-3-4-q139", "u": "3-4", "t": "T11", "lv": "b", "s": 3, "k": "orig", "src": "講義 p.87 經典題6（105會考）", "q": "甲、乙、丙三支試管裝等量溶液X，再分別加入等量的葡萄糖液、澱粉液、水，放在適宜溫度足夠時間後用碘液檢測，結果如右表。溶液X最可能含有什麼？", "o": ["分解澱粉的酵素", "澱粉", "葡萄糖", "分解葡萄糖的酵素"], "a": 0, "e": "三支都是黃褐色，代表都沒有澱粉。乙管明明加了澱粉卻檢測不到，表示X把澱粉分解了，X含有分解澱粉的酵素。如果X含澱粉，三支都會變藍黑。", "h": "三支都黃褐＝都沒有澱粉。乙管明明加了澱粉，為什麼沒有了？", "w": 1, "c": "觀念不懂（結果反推）", "fig": "xTable"}, {"id": "sci-3-4-q140", "u": "3-4", "t": "T11", "lv": "b", "s": 1, "k": "var", "src": "錯題類題", "q": "若某溶液X「含有澱粉」，把X和等量的水混合後滴碘液，應呈什麼顏色？", "o": ["藍黑色", "黃褐色", "紅色", "淡藍色"], "a": 0, "e": "有澱粉，碘液就會變藍黑色。", "of": "sci-3-4-q139"}, {"id": "sci-3-4-q141", "u": "3-4", "t": "T11", "lv": "b", "s": 2, "k": "var", "src": "錯題類題", "q": "某溶液Y加碘液呈藍黑色。把Y和唾液混合，放在 37°C 一段時間後再加碘液，變成黃褐色。Y最可能含有什麼？", "o": ["澱粉", "葡萄糖", "蛋白質", "脂質"], "a": 0, "e": "一開始藍黑 → 有澱粉；唾液分解澱粉後變黃褐。", "of": "sci-3-4-q139"}, {"id": "sci-3-4-q142", "u": "3-4", "t": "T11", "lv": "b", "s": 3, "k": "orig", "src": "講義 p.88 經典題13（112會考）", "q": "試管中裝葡萄糖液，管口用一層膜密封，倒置在裝澱粉液的燒杯中（如圖）。已知葡萄糖能通過此膜，澱粉不能。靜置一段時間平衡後，分別取出溶液檢測，下列何者最合理？", "o": ["以本氏液檢測，試管和燒杯中的溶液皆變色", "以碘液檢測，僅試管中的溶液變色", "以碘液檢測，試管和燒杯中的溶液皆變色", "以本氏液檢測，僅試管中的溶液變色"], "a": 0, "e": "葡萄糖會穿過膜，所以試管和燒杯都有葡萄糖 → 本氏液兩邊都變色。澱粉不能穿過膜，只留在燒杯 → 碘液只有燒杯變色。", "h": "誰能穿過膜？它最後在哪裡？本氏液測的是什麼？", "w": 1, "c": "觀念不懂", "fig": "membrane"}, {"id": "sci-3-4-q143", "u": "3-4", "t": "T11", "lv": "b", "s": 2, "k": "var", "src": "錯題類題", "q": "同上裝置，以碘液檢測時，哪裡會變藍黑色？", "o": ["只有燒杯", "只有試管", "兩者都會", "兩者都不會"], "a": 0, "e": "澱粉不能穿過膜，只在燒杯中。", "of": "sci-3-4-q142", "fig": "membrane"}, {"id": "sci-3-4-q144", "u": "3-4", "t": "T11", "lv": "b", "s": 2, "k": "var", "src": "錯題類題", "q": "「葡萄糖能通過膜、澱粉不能通過膜」的實驗，可以類比人體消化系統的哪一件事？", "o": ["小分子養分才能被吸收進入細胞，大分子不能", "大腸吸收水分", "胃分泌胃酸", "牙齒磨碎食物"], "a": 0, "e": "葡萄糖（小分子）通過膜、澱粉（大分子）不能，就像只有消化後的小分子才能通過細胞膜被吸收。", "of": "sci-3-4-q142"}, {"id": "sci-3-4-q145", "u": "3-4", "t": "T11", "lv": "b", "s": 2, "k": "orig", "src": "講義 p.84 素養題9", "q": "甲、乙、丙試管先加等量物質X，再分別加入足量的唾液、胃液、胰液，並調整到各消化液適合的條件。足夠時間後，三支試管內物質X的含量都沒有變化。X最可能是什麼？", "o": ["纖維素", "澱粉", "脂質", "蛋白質"], "a": 0, "e": "唾液分解澱粉；胃液分解蛋白質；胰液分解醣類、蛋白質、脂質。三種都分解不了的是纖維素。"}, {"id": "sci-3-4-q146", "u": "3-4", "t": "T11", "lv": "b", "s": 3, "k": "orig", "src": "講義 p.86 經典題4", "q": "把人體唾液和胃液的 pH 值調整為 6～7，再分別與澱粉液或葡萄糖液混合（如圖）。在適宜溫度放置一小時後，滴入本氏液隔水加熱，哪一支試管<u>不會</u>產生顏色變化？", "o": ["乙（胃液＋澱粉液）", "甲（唾液＋澱粉液）", "丙（唾液＋葡萄糖液）", "丁（胃液＋葡萄糖液）"], "a": 0, "e": "甲：唾液把澱粉分解成糖 → 變色。丙、丁：本來就有葡萄糖 → 變色。乙：胃液的酵素只分解蛋白質，不分解澱粉，沒有糖 → 不變色。", "fig": "tubes4"}, {"id": "sci-3-4-q147", "u": "3-4", "t": "T11", "lv": "b", "s": 1, "k": "key", "src": "講義 3-1 食物的養分測定", "q": "用本氏液檢測葡萄糖時，必須怎麼做才會看到顏色變化？", "o": ["隔水加熱", "直接滴加，不必加熱", "先加碘液", "放在陽光下"], "a": 0, "e": "本氏液一定要隔水加熱，才會和糖反應變色。"}, {"id": "sci-3-4-q148", "u": "3-4", "t": "T11", "lv": "b", "s": 1, "k": "key", "src": "講義 3-2 實驗", "q": "實驗中「澱粉液＋唾液」與「澱粉液＋水」兩組，加水那一組的目的是什麼？", "o": ["當對照組", "當實驗組", "稀釋唾液", "讓溫度上升"], "a": 0, "e": "兩組只差有沒有唾液，加水那組是對照組，用來證明變化是唾液造成的。"}, {"id": "sci-3-4-q149", "u": "3-4", "t": "T12", "lv": "b", "s": 2, "k": "orig", "src": "講義 p.81 基本題5", "q": "將某生物放在有水的透明容器中，密封後照陽光，記錄容器內氧氣含量的變化如右圖（氧氣持續增加）。此生物最可能是哪一種？", "o": ["矽藻", "珊瑚", "酵母菌", "大腸桿菌"], "a": 0, "e": "氧氣持續增加，代表生物在行光合作用。矽藻有葉綠體，可行光合作用；珊瑚是動物，酵母菌、大腸桿菌不行光合作用，只會消耗氧氣。", "h": "氧氣一直增加，代表這個生物在做哪一種作用？四個選項中，誰有葉綠體？", "w": 1, "c": "觀念不懂", "fig": "o2up"}, {"id": "sci-3-4-q150", "u": "3-4", "t": "T12", "lv": "b", "s": 2, "k": "var", "src": "錯題類題", "q": "密封容器中放入水草並照光，一段時間內容器中二氧化碳的量會如何？", "o": ["逐漸減少", "逐漸增加", "不變", "先增加後減少"], "a": 0, "e": "水草行光合作用，吸收二氧化碳、放出氧氣。", "of": "sci-3-4-q149"}, {"id": "sci-3-4-q151", "u": "3-4", "t": "T12", "lv": "b", "s": 3, "k": "var", "src": "錯題類題", "q": "把裝有水草的密封容器放在黑暗中，容器內的氧氣含量會如何？", "o": ["逐漸減少", "逐漸增加", "不變", "先增加後不變"], "a": 0, "e": "黑暗中不能行光合作用，只有呼吸作用消耗氧氣，所以氧氣減少。", "of": "sci-3-4-q149"}, {"id": "sci-3-4-q152", "u": "3-4", "t": "T12", "lv": "b", "s": 1, "k": "orig", "src": "講義 p.81 基本題6", "q": "有關綠色植物行光合作用的敘述，下列何者<u>錯誤</u>？", "o": ["不牽涉能量的轉換", "需要陽光提供能量", "產生葡萄糖和氧氣", "需要水分和二氧化碳"], "a": 0, "e": "光合作用把光能轉換成葡萄糖中的化學能，有能量轉換。", "h": "這題問「錯誤」。光能變成葡萄糖裡的能量，算不算能量轉換？", "w": 1, "c": "題意誤讀"}, {"id": "sci-3-4-q153", "u": "3-4", "t": "T12", "lv": "b", "s": 2, "k": "var", "src": "錯題類題", "q": "光合作用中，能量的轉換方式為何？", "o": ["光能轉換成養分中的化學能", "化學能轉換成光能", "熱能轉換成光能", "沒有能量轉換"], "a": 0, "e": "葉綠素吸收光能，把能量儲存在葡萄糖中。", "of": "sci-3-4-q152"}, {"id": "sci-3-4-q154", "u": "3-4", "t": "T12", "lv": "b", "s": 1, "k": "var", "src": "錯題類題", "q": "有關光合作用，下列何者「正確」？", "o": ["葉綠體吸收光能，把水和二氧化碳製造成葡萄糖", "不需要光", "只產生氧氣", "二氧化碳由根部吸收"], "a": 0, "e": "光合作用需要光，產生葡萄糖和氧氣；二氧化碳由氣孔進入，水由根吸收。", "of": "sci-3-4-q152"}, {"id": "sci-3-4-q155", "u": "3-4", "t": "T12", "lv": "b", "s": 3, "k": "orig", "src": "講義 p.84 素養題8", "q": "右圖為不同溫度下，甲、乙兩種植物光合作用的反應速率變化圖。下列敘述何者正確？", "o": ["單位時間內，乙植物在 30°C 產生的醣類較在 20°C 多", "10°C 時，乙植物的反應速率較甲植物高", "30°C 時，甲植物的反應速率較乙植物高", "單位時間內，甲植物在 30°C 產生的醣類較在 10°C 多"], "a": 0, "e": "逐項在圖上找兩點比較：10°C 甲比乙高；30°C 乙比甲高；甲在 30°C 比 10°C 低；乙在 30°C 比 20°C 高，產生的醣類較多。", "h": "每個選項都在圖上找兩個點比高低，一次只比一件事。", "w": 1, "c": "題意誤讀（讀圖）", "fig": "plantT"}, {"id": "sci-3-4-q156", "u": "3-4", "t": "T12", "lv": "b", "s": 2, "k": "var", "src": "錯題類題", "q": "同上圖，40°C 時哪一種植物的光合作用速率較高？", "o": ["乙植物", "甲植物", "一樣高", "無法判斷"], "a": 0, "e": "40°C 時甲幾乎降到最低，乙仍較高。", "of": "sci-3-4-q155", "fig": "plantT"}, {"id": "sci-3-4-q157", "u": "3-4", "t": "T12", "lv": "b", "s": 2, "k": "var", "src": "錯題類題", "q": "同上圖，甲植物最適合生長在哪一個溫度範圍？", "o": ["約 10～20°C 的涼爽環境", "約 40°C 的炎熱環境", "只要有光，溫度不影響", "0°C 以下"], "a": 0, "e": "甲在 10～20°C 速率最高，超過 25°C 就快速下降。", "of": "sci-3-4-q155", "fig": "plantT"}, {"id": "sci-3-4-q158", "u": "3-4", "t": "T12", "lv": "b", "s": 1, "k": "orig", "src": "講義 p.87 經典題8", "q": "某生理作用中，陽光、二氧化碳進入葉片，氧氣離開葉片，水由根部送來。此生理作用最可能是什麼？", "o": ["光合作用", "呼吸作用", "蒸散作用", "觸發運動"], "a": 0, "e": "吸收光能、二氧化碳和水，放出氧氣，就是光合作用。"}, {"id": "sci-3-4-q159", "u": "3-4", "t": "T12", "lv": "b", "s": 2, "k": "orig", "src": "講義 p.88 經典題11（108會考）", "q": "小帆想知道某植株在不同環境下葉片行光合作用的速率快慢，應依據哪一項資料推測最合理？", "o": ["單位時間內產生氧氣的量", "單位時間內消耗葉綠素的量", "單位時間內消耗葡萄糖的量", "單位時間內產生二氧化碳的量"], "a": 0, "e": "光合作用產生氧氣，氧氣產生得越多，速率越快。葉綠素不會被消耗；消耗葡萄糖、產生二氧化碳是呼吸作用。"}, {"id": "sci-3-4-q160", "u": "3-4", "t": "T6", "lv": "a", "s": 2, "k": "ext", "src": "延伸題", "q": "右圖中，曲線 c 一直到丁段才開始下降，這說明什麼？", "o": ["脂質要到小腸才開始被消化", "脂質在口腔就被消化", "脂質在胃中被消化完成", "脂質不需要消化"], "a": 0, "e": "c 是脂質，丁是小腸。脂質在口腔、胃都沒有被分解，到小腸才有膽汁乳化、胰液分解。", "fig": "undigest"}, {"id": "sci-3-4-q161", "u": "3-4", "t": "T6", "lv": "a", "s": 3, "k": "ext", "src": "延伸題", "q": "檢測某段消化道內的食物：澱粉已部分分解、蛋白質已部分分解、脂質還沒分解，而且呈酸性。這段消化道最可能是哪裡？", "o": ["胃", "口腔", "小腸", "大腸"], "a": 0, "e": "蛋白質已開始分解、環境是酸性 → 胃。脂質還沒分解 → 還沒到小腸。"}, {"id": "sci-3-4-q162", "u": "3-4", "t": "T6", "lv": "a", "s": 3, "k": "ext", "src": "延伸題", "q": "從小腸末端取出的內容物中，下列哪一種含量最多？", "o": ["纖維素等無法消化的殘渣", "澱粉", "蛋白質", "脂質"], "a": 0, "e": "澱粉、蛋白質、脂質在小腸已被分解並吸收；剩下的是無法消化的纖維素等殘渣，接著進入大腸。"}, {"id": "sci-3-4-q163", "u": "3-4", "t": "T6", "lv": "a", "s": 2, "k": "ext", "src": "延伸題", "q": "吃了一顆水煮蛋，蛋白質在哪裡「完全」被分解成胺基酸？", "o": ["小腸", "胃", "口腔", "大腸"], "a": 0, "e": "蛋白質在胃初步分解，在小腸由胰液、腸液分解完成。"}, {"id": "sci-3-4-q164", "u": "3-4", "t": "T9", "lv": "a", "s": 3, "k": "ext", "src": "延伸題", "q": "甲管：蛋白質塊＋胃液；乙管：蛋白質塊＋煮沸過再冷卻的胃液，都放在 37°C。數小時後甲的蛋白質塊變小，乙不變。這個實驗可以說明什麼？", "o": ["胃液中分解蛋白質的物質會被高溫破壞", "胃液會把蛋白質合成更大的分子", "高溫可以使蛋白質分解得更快", "胃液中分解蛋白質的物質是醣類"], "a": 0, "e": "兩管只差胃液有沒有煮沸。煮沸後就不能分解，表示胃液中的酵素被高溫破壞。"}, {"id": "sci-3-4-q165", "u": "3-4", "t": "T9", "lv": "a", "s": 2, "k": "ext", "src": "延伸題", "q": "酵素在反應中扮演「催化劑」的角色，這是什麼意思？", "o": ["加速反應進行，本身反應前後不變", "提供反應所需的原料", "反應後變成產物", "讓產物的總量變多"], "a": 0, "e": "催化劑只加速反應，本身不被用掉，也不增加產量。"}, {"id": "sci-3-4-q166", "u": "3-4", "t": "T9", "lv": "a", "s": 2, "k": "ext", "src": "延伸題", "q": "加酶洗衣粉中含有蛋白酶，最適合清除下列哪一種污漬？", "o": ["血漬或奶漬（含蛋白質）", "原子筆墨水", "泥沙", "鐵鏽"], "a": 0, "e": "蛋白酶有專一性，只分解蛋白質，所以適合清除血漬、奶漬這類含蛋白質的污漬。"}, {"id": "sci-3-4-q167", "u": "3-4", "t": "T9", "lv": "a", "s": 3, "k": "ext", "src": "延伸題", "q": "用 90°C 的熱水泡加酶洗衣粉，去污效果反而變差，原因是什麼？", "o": ["高溫使酵素永久失去活性", "熱水讓污漬中的蛋白質變多", "酵素在熱水中被用完", "高溫讓酵素改成分解醣類"], "a": 0, "e": "酵素是蛋白質，高溫會破壞它的結構，永久失去活性。"}, {"id": "sci-3-4-q168", "u": "3-4", "t": "T10", "lv": "a", "s": 2, "k": "ext", "src": "延伸題", "q": "把唾液放在 0°C 冰水中 10 分鐘，再拿回 37°C 加入澱粉液，結果會如何？", "o": ["澱粉仍可被分解", "澱粉不會被分解", "唾液變成葡萄糖", "澱粉變成蛋白質"], "a": 0, "e": "低溫只是暫時降低活性，回到 37°C 就恢復作用。"}, {"id": "sci-3-4-q169", "u": "3-4", "t": "T10", "lv": "a", "s": 2, "k": "ext", "src": "延伸題", "q": "下列哪一種情況，酵素「最可能」永久失去活性？", "o": ["曾經處在超過它能承受的高溫", "曾經處在 0°C", "溫度比最適溫度低 5°C", "放在冰箱一晚"], "a": 0, "e": "高溫才會永久破壞酵素；低溫只是暫時降低活性。"}, {"id": "sci-3-4-q170", "u": "3-4", "t": "T10", "lv": "a", "s": 1, "k": "ext", "src": "延伸題", "q": "依右圖，酵素Y在幾°C時活性最高？", "o": ["30°C", "0°C", "50°C", "55°C"], "a": 0, "e": "曲線最高點對應的溫度約 30°C，就是最適溫度。", "fig": "enzY"}, {"id": "sci-3-4-q171", "u": "3-4", "t": "T10", "lv": "a", "s": 2, "k": "ext", "src": "延伸題", "q": "胃中的酵素在 pH 約 2 時活性最高。若把胃液調成 pH 8（鹼性），分解蛋白質的速率會如何？", "o": ["明顯下降", "明顯上升", "不變", "改成分解澱粉"], "a": 0, "e": "離開最適 pH，酵素活性下降。酵素有專一性，不會因為 pH 改變就分解別的養分。"}, {"id": "sci-3-4-q172", "u": "3-4", "t": "T10", "lv": "a", "s": 3, "k": "ext", "src": "延伸題", "q": "發燒到 40°C 以上會影響身體正常運作，從酵素的角度，最合理的解釋是什麼？", "o": ["體溫高於最適溫度，酵素活性降低，代謝無法正常進行", "酵素活性變得太高", "酵素變成醣類", "消化液全部蒸發"], "a": 0, "e": "人體酵素約 37°C 活性最好；溫度太高，活性反而降低。"}, {"id": "sci-3-4-q173", "u": "3-4", "t": "T10", "lv": "a", "s": 3, "k": "ext", "src": "延伸題", "q": "胰液中分解蛋白質的酵素，最適合的 pH 值最可能是多少？", "o": ["約 8（鹼性）", "約 2（酸性）", "約 5（弱酸性）", "與 pH 無關"], "a": 0, "e": "胰液注入小腸，小腸是鹼性環境，所以它的酵素在鹼性中活性最好。"}, {"id": "sci-3-4-q174", "u": "3-4", "t": "T11", "lv": "a", "s": 2, "k": "ext", "src": "延伸題", "q": "一片吐司滴碘液呈藍黑色。另一片吐司在口中嚼 5 分鐘後吐出再滴碘液，藍黑色變淡。原因是什麼？", "o": ["唾液把部分澱粉分解了", "唾液把碘液破壞了", "口水把澱粉稀釋成葡萄糖", "吐司中的蛋白質被分解"], "a": 0, "e": "唾液中的酵素分解了部分澱粉，澱粉變少，藍黑色就變淡。"}, {"id": "sci-3-4-q175", "u": "3-4", "t": "T11", "lv": "a", "s": 3, "k": "ext", "src": "延伸題", "q": "想證明「唾液中分解澱粉的物質會被高溫破壞」，下列哪一組比較最合適？（其他條件都相同）", "o": ["澱粉液＋唾液 vs. 澱粉液＋煮沸過的唾液", "澱粉液＋唾液 vs. 葡萄糖液＋唾液", "澱粉液＋水 vs. 葡萄糖液＋水", "澱粉液＋唾液 vs. 澱粉液＋胃液"], "a": 0, "e": "要證明「高溫」的影響，兩組只能差在唾液有沒有煮沸，其他都一樣。"}, {"id": "sci-3-4-q176", "u": "3-4", "t": "T11", "lv": "a", "s": 2, "k": "ext", "src": "延伸題", "q": "某溶液加碘液呈黃褐色；另取此溶液加本氏液隔水加熱，呈橙色。此溶液含有什麼？", "o": ["含糖，不含澱粉", "含澱粉，不含糖", "澱粉和糖都有", "澱粉和糖都沒有"], "a": 0, "e": "碘液維持黃褐 → 沒有澱粉；本氏液變橙 → 有糖。"}, {"id": "sci-3-4-q177", "u": "3-4", "t": "T11", "lv": "a", "s": 3, "k": "ext", "src": "延伸題", "q": "某同學把澱粉液和唾液混合後，立刻滴碘液，結果呈藍黑色，就說「唾液不能分解澱粉」。這個結論錯在哪裡？", "o": ["沒有給酵素足夠的反應時間和適當溫度", "碘液不能檢測澱粉", "應該用本氏液檢測澱粉", "唾液本身就是藍黑色"], "a": 0, "e": "酵素分解需要時間，而且要在適合的溫度（約 37°C）。立刻檢測，澱粉當然還在。"}, {"id": "sci-3-4-q178", "u": "3-4", "t": "T11", "lv": "a", "s": 3, "k": "ext", "src": "延伸題", "q": "試管中裝澱粉液，管口用一層膜密封，倒置在裝葡萄糖液的燒杯中；此膜只讓葡萄糖通過，澱粉不能通過。平衡後以碘液檢測，哪裡會變藍黑色？", "o": ["只有試管", "只有燒杯", "兩者都會", "兩者都不會"], "a": 0, "e": "澱粉不能通過膜，只留在試管中，所以只有試管遇碘液變藍黑。"}, {"id": "sci-3-4-q179", "u": "3-4", "t": "T12", "lv": "a", "s": 1, "k": "ext", "src": "延伸題（3-3）", "q": "綠色植物行光合作用的主要場所，是細胞中的哪一個構造？", "o": ["葉綠體", "細胞核", "細胞壁", "液胞"], "a": 0, "e": "葉綠體中有葉綠素，可以吸收光能，是光合作用的場所。"}, {"id": "sci-3-4-q180", "u": "3-4", "t": "T12", "lv": "a", "s": 2, "k": "ext", "src": "延伸題（3-3）", "q": "把水草放入裝水的燒杯中照強光，水草會冒出氣泡。若把燈光移遠（光變弱），每分鐘冒出的氣泡數會如何？", "o": ["減少", "增加", "不變", "先增加後減少"], "a": 0, "e": "氣泡是光合作用產生的氧氣。光變弱，光合作用變慢，氣泡變少。"}, {"id": "sci-3-4-q181", "u": "3-4", "t": "T12", "lv": "a", "s": 2, "k": "ext", "src": "延伸題（3-3）", "q": "下列哪一種生物<u>不能</u>行光合作用？", "o": ["香菇", "水綿", "玉米", "矽藻"], "a": 0, "e": "香菇是真菌，沒有葉綠體，不能行光合作用。水綿、矽藻、玉米都有葉綠體。"}, {"id": "sci-3-4-q182", "u": "3-4", "t": "T12", "lv": "a", "s": 3, "k": "ext", "src": "延伸題（3-3）", "q": "兩個密封透明容器：甲放水草，乙放一隻小金魚，都照光。一段時間後容器內氧氣的變化為何？", "o": ["甲增加，乙減少", "甲減少，乙增加", "兩者都增加", "兩者都不變"], "a": 0, "e": "水草照光行光合作用，產生的氧氣多於消耗；金魚只行呼吸作用，消耗氧氣。"}, {"id": "sci-3-4-q183", "u": "3-4", "t": "T12", "lv": "a", "s": 3, "k": "ext", "src": "延伸題（跨節）", "q": "比較光合作用和消化作用，下列何者正確？", "o": ["光合作用把小分子合成葡萄糖；消化作用把大分子分解成小分子", "兩者都是分解作用", "兩者都需要陽光", "光合作用也在消化道中進行"], "a": 0, "e": "光合作用：水和二氧化碳（小分子）合成葡萄糖，屬於合成作用。消化作用：大分子分解成小分子，屬於分解作用。"}, {"id": "sci-3-4-q184", "u": "3-4", "t": "T9", "lv": "a", "s": 2, "k": "adapt", "src": "改編自109年國中教育會考參考試題", "q": "蛋白質在消化道中被酵素 X 分解成 Y，Y 再被小腸吸收。下列何者正確？", "o": ["X 的主要成分是蛋白質，Y 是胺基酸", "X 的主要成分是澱粉，Y 是胺基酸", "X 的主要成分是蛋白質，Y 是葡萄糖", "X 的主要成分是脂質，Y 是脂肪酸"], "a": 0, "e": "酵素的主要成分是蛋白質；蛋白質分解的最終產物是胺基酸。"}, {"id": "sci-3-4-q185", "u": "3-4", "t": "T5", "lv": "a", "s": 2, "k": "adapt", "src": "改編自109年國中教育會考參考試題", "q": "胃液和胰液分別在消化道的哪一個部位發揮消化作用？", "o": ["胃液在胃、胰液在小腸", "兩者都在胃", "兩者都在小腸", "胃液在小腸、胰液在胃"], "a": 0, "e": "胃腺分泌的胃液直接在胃中作用；胰臟不是消化道，胰液經導管注入小腸作用。"}, {"id": "sci-3-4-q186", "u": "3-4", "t": "T9", "lv": "a", "s": 2, "k": "adapt", "src": "改編自臺北市中山國中109學年七年級第二次段考", "q": "鳳梨含有可分解蛋白質的酵素，常用來醃肉使肉質變軟。下列敘述何者正確？", "o": ["此酵素具有專一性，主要分解肉中的蛋白質", "此酵素可把肉中的蛋白質合成澱粉", "此酵素加熱煮滾後效果更好", "此酵素反應後就消失，不能再使用"], "a": 0, "e": "酵素有專一性；高溫會使酵素失去活性；酵素反應前後不變，可重複使用。"}, {"id": "sci-3-4-q187", "u": "3-4", "t": "T9", "lv": "a", "s": 3, "k": "adapt", "src": "改編自臺北市中山國中109學年七年級第二次段考", "q": "在相同量的澱粉溶液中加入澱粉酶，加入的酵素越多，下列哪一項會改變？", "o": ["澱粉分解完成所需的時間變短", "最後產生的葡萄糖總量變多", "酵素反應後被消耗光", "澱粉變成蛋白質"], "a": 0, "e": "酵素只能加快反應速率，不能增加產物的總量；澱粉量固定，最後產物量就固定。"}, {"id": "sci-3-4-q188", "u": "3-4", "t": "T7", "lv": "a", "s": 2, "k": "adapt", "src": "改編自臺北市中山國中109學年七年級第二次段考", "q": "某人因膽結石而切除膽囊。手術後他應特別注意少吃哪一類食物？", "o": ["油炸、高脂肪食物", "米飯、麵包", "青菜、水果", "白開水"], "a": 0, "e": "膽囊儲存膽汁，切除後膽汁無法大量、集中地送進小腸，脂質的乳化較差，所以要少吃油膩食物。"}, {"id": "sci-3-4-q189", "u": "3-4", "t": "T7", "lv": "a", "s": 3, "k": "adapt", "src": "改編自臺北市中山國中109學年七年級第二次段考", "q": "某種減肥藥能抑制「分解脂質的酵素」作用，使脂質無法被吸收。這種藥主要在消化道的哪裡發揮作用？", "o": ["小腸", "口腔", "胃", "大腸"], "a": 0, "e": "脂質的消化從小腸開始（胰液、腸液中有分解脂質的酵素），也在小腸被吸收，所以藥物在小腸作用。"}, {"id": "sci-3-4-q190", "u": "3-4", "t": "T5", "lv": "a", "s": 2, "k": "adapt", "src": "改編自彰化縣大同國中106學年七年級第二次段考", "q": "下列哪一種消化液<u>不含</u>消化酵素？", "o": ["膽汁", "胰液", "唾液", "腸液"], "a": 0, "e": "膽汁由肝臟分泌、膽囊儲存，不含酵素，只能把大油滴乳化成小油滴。"}, {"id": "sci-3-4-q191", "u": "3-4", "t": "T5", "lv": "a", "s": 2, "k": "adapt", "src": "改編自臺中市安和國中113學年補行評量題庫", "q": "下列哪兩種消化液都可以分解澱粉？", "o": ["胰液和腸液", "胃液和膽汁", "胃液和胰液", "膽汁和腸液"], "a": 0, "e": "能分解澱粉的有唾液、胰液、腸液；胃液只分解蛋白質，膽汁不含酵素。"}, {"id": "sci-3-4-q192", "u": "3-4", "t": "T9", "lv": "a", "s": 2, "k": "adapt", "src": "改編自臺中市安和國中113學年補行評量題庫", "q": "關於酵素的敘述，下列何者<u>錯誤</u>？", "o": ["一種酵素可以催化許多種不同的反應", "酵素的主要成分是蛋白質", "酵素可以加快反應的速率", "酵素的活性會受溫度影響"], "a": 0, "e": "酵素具有專一性，一種酵素通常只能催化一種（或一類）反應。"}, {"id": "sci-3-4-q193", "u": "3-4", "t": "T8", "lv": "a", "s": 2, "k": "adapt", "src": "改編自臺中市國中補行評量題庫", "q": "小腸的絨毛和植物的根毛，兩者構造上的共同優點是什麼？", "o": ["增加吸收的表面積", "增加分泌消化液的量", "增加光合作用的效率", "增加肌肉收縮的力量"], "a": 0, "e": "絨毛和根毛都是突起的構造，可以增加表面積，提高吸收的效率。"}, {"id": "sci-3-4-q194", "u": "3-4", "t": "T9", "lv": "a", "s": 2, "k": "adapt", "src": "改編自臺中市大甲國中113學年補考題庫", "q": "唾液可以分解饅頭中的澱粉，卻不能分解雞蛋中的蛋白質。這說明酵素具有什麼特性？", "o": ["專一性", "可重複使用", "受 pH 值影響", "可合成養分"], "a": 0, "e": "一種酵素只作用在特定的物質上，這就是專一性。"}, {"id": "sci-3-4-q195", "u": "3-4", "t": "T11", "lv": "a", "s": 3, "k": "adapt", "src": "改編自112年國中教育會考（半透膜題型）", "q": "以半透膜做成袋子，裝入澱粉溶液和澱粉酶，放入裝清水的燒杯，在 37 ℃ 下放置一段時間。之後在燒杯的水中加入本氏液並隔水加熱。下列推論何者正確？", "o": ["燒杯中的水會出現顏色變化，因為澱粉被分解成葡萄糖後穿過半透膜", "燒杯中的水不會變色，因為澱粉無法穿過半透膜", "燒杯中的水不會變色，因為酵素在 37 ℃ 失去活性", "加入碘液才能檢驗葡萄糖"], "a": 0, "e": "澱粉酶把澱粉分解成小分子的糖，糖可以穿過半透膜進入燒杯；本氏液加熱後變色＝有糖。碘液是檢驗澱粉的。"}, {"id": "sci-3-4-q196", "u": "3-4", "t": "T4", "lv": "a", "s": 2, "k": "adapt", "src": "改編自臺中市大甲國中113學年補考題庫", "q": "關於消化道的蠕動，下列何者正確？", "o": ["是消化道管壁的肌肉收縮造成的", "只有食道會蠕動", "蠕動可以把蛋白質分解成胺基酸", "大腸沒有肌肉，不會蠕動"], "a": 0, "e": "消化道管壁有肌肉，收縮產生蠕動，推送食物並使食物與消化液混合；蠕動是物理作用，不會分解成胺基酸。"}, {"id": "sci-3-4-q197", "u": "3-4", "t": "T6", "lv": "a", "s": 3, "k": "adapt", "src": "改編自臺北市中山國中109學年七年級第二次段考", "q": "一口包著肉片的饅頭從口腔進入，依序經過消化道。下列哪一段的描述正確？", "o": ["口腔：饅頭的澱粉開始被分解", "胃：肉片中的脂質開始被分解", "小腸：澱粉開始被分解", "大腸：蛋白質被分解成胺基酸並吸收"], "a": 0, "e": "澱粉從口腔開始、蛋白質從胃開始、脂質從小腸開始分解；三種都在小腸完成分解並被吸收。"}, {"id": "sci-3-4-q198", "u": "3-4", "t": "T2", "lv": "a", "s": 1, "k": "adapt", "src": "改編自臺中市安和國中113學年補行評量題庫", "q": "下列哪一種物質不需要消化，就能直接被小腸吸收？", "o": ["維生素", "澱粉", "蛋白質", "脂質"], "a": 0, "e": "水、維生素、礦物質本身就是小分子，可直接吸收；澱粉、蛋白質、脂質都要先分解。"}];
