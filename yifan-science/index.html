<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="意帆自然">
<meta name="theme-color" content="#F6F8FB">
<style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;padding:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head><body>
<title>意帆自然衝刺</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* 版面概念：國中生的筆記本——紙張底色、紅筆標重點、藍筆寫答案；手機底部分頁，平板電腦左側分頁 */
:root{
  --paper:#F6F8FB;--sheet:#FFFFFF;--line:#E1E7F0;--rule:#C9D3E3;--ink:#1B2333;--ink2:#556074;
  --red:#C8322E;--blue:#2350C8;--green:#1F8A4C;--ok:#17845A;--okbg:#E5F4EC;--bad:#C8322E;--badbg:#FBE9E8;--warn:#A86A00;--warnbg:#FFF4DC;
  --hand:'LXGW WenKai TC','Kaiti TC','STKaiti','BiauKai',serif;--sans:'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif;--mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;--r:10px}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--paper:#11151D;--sheet:#181E29;--line:#252D3B;--rule:#303A4C;--ink:#E7EBF3;--ink2:#9AA5B8;--red:#FF6E68;--blue:#86A6FF;--green:#55C98A;--ok:#4CC48C;--okbg:#173327;--bad:#FF6E68;--badbg:#3A1E1F;--warn:#F2B544;--warnbg:#382B12;color-scheme:dark}}
:root[data-theme=dark]{--paper:#11151D;--sheet:#181E29;--line:#252D3B;--rule:#303A4C;--ink:#E7EBF3;--ink2:#9AA5B8;--red:#FF6E68;--blue:#86A6FF;--green:#55C98A;--ok:#4CC48C;--okbg:#173327;--bad:#FF6E68;--badbg:#3A1E1F;--warn:#F2B544;--warnbg:#382B12;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.65;padding-bottom:calc(72px + env(safe-area-inset-bottom,0px));-webkit-text-size-adjust:100%}
.wrap{max-width:820px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 28px}
h1,h2,h3{font-family:var(--hand);text-wrap:balance;margin:0;line-height:1.3}
h2{font-size:1.45rem}h3{font-size:1.15rem}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.r{color:var(--red)}.b{color:var(--blue)}
u{text-decoration-color:var(--red);text-decoration-thickness:2px;text-underline-offset:3px}
p{margin:0}
/* 標題列 */
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:8px 12px;padding-block:6px 12px;border-bottom:2px solid var(--ink)}
.top h1{font-size:1.55rem;min-width:0}
.top h1 small{display:block;font-family:var(--sans);font-size:.78rem;color:var(--ink2);font-weight:500;letter-spacing:.06em}
.count{font-family:var(--mono);text-align:right;line-height:1.1}.count b{font-size:1.9rem;color:var(--red)}.count span{display:block;font-family:var(--sans);font-size:.74rem;color:var(--ink2)}
.units{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
/* 分頁 */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--sheet);border-top:1px solid var(--rule);display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom,0);padding-left:env(safe-area-inset-left,0);padding-right:env(safe-area-inset-right,0)}
nav.tabs button{border:0;background:0 0;padding:8px 2px 9px;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:.78rem;color:var(--ink2);cursor:pointer;position:relative}
nav.tabs svg{width:23px;height:23px}
nav.tabs button[aria-current=true]{color:var(--red);font-weight:700}
.dot{min-width:18px;height:18px;border-radius:9px;background:var(--red);color:#fff;font-size:.68rem;line-height:18px;padding:0 5px;position:absolute;top:3px;left:calc(50% + 6px);font-family:var(--mono)}
.subtabs{display:flex;gap:4px;border-bottom:1px solid var(--rule);margin-top:14px;overflow-x:auto}
.subtabs button{border:0;background:0 0;padding:8px 14px;font-weight:700;color:var(--ink2);cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
.subtabs button[aria-current=true]{color:var(--ink);border-bottom-color:var(--red)}
/* 共用元件 */
.section{margin-top:16px;display:flex;flex-direction:column;gap:14px}
.sheet{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.label{font-size:.74rem;letter-spacing:.12em;color:var(--ink2);font-weight:700}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1.5px solid var(--rule);background:var(--sheet);border-radius:999px;padding:4px 13px;cursor:pointer;font-size:.9rem;line-height:1.5}
.chip[aria-pressed=true]{border-color:var(--ink);background:var(--ink);color:var(--sheet)}
.chip.flag{border-color:var(--red);color:var(--red)}
.btn{border:2px solid var(--ink);background:var(--ink);color:var(--sheet);border-radius:8px;padding:9px 16px;font-weight:700;cursor:pointer;font-size:.98rem}
.btn.ghost{background:0 0;color:var(--ink)}.btn.red{background:var(--red);border-color:var(--red);color:#fff}.btn.sm{padding:5px 11px;font-size:.88rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.muted{color:var(--ink2);font-size:.9rem}
.pill{display:inline-block;font-size:.72rem;font-weight:700;border-radius:4px;padding:1px 7px;letter-spacing:.03em;vertical-align:middle;white-space:nowrap}
.pill.bad{background:var(--badbg);color:var(--bad)}.pill.ok{background:var(--okbg);color:var(--ok)}.pill.warn{background:var(--warnbg);color:var(--warn)}.pill.info{background:color-mix(in srgb,var(--blue) 14%,transparent);color:var(--blue)}.pill.gray{background:var(--line);color:var(--ink2)}
.stars{color:var(--warn);letter-spacing:1px;font-size:.84rem}
.cols{display:grid;gap:14px}.cols>*{min-width:0}
.meter{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.meter div{background:var(--sheet);border:1px solid var(--line);border-radius:8px;padding:10px;text-align:center}
.meter b{display:block;font-family:var(--mono);font-size:1.5rem;font-variant-numeric:tabular-nums}.meter span{font-size:.78rem;color:var(--ink2)}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;background:var(--ok);transition:width .3s}
.bar.red i{background:var(--red)}
.banner{border:2px dashed var(--blue);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.banner ul{margin:0;padding-left:1.2em}
.tasks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.tasks li{display:grid;grid-template-columns:1.6em 1fr auto;gap:8px;align-items:center;padding:8px 10px;border-radius:8px;background:var(--paper)}
.tasks li b.n{font-family:var(--mono);color:var(--red)}
/* 架構 */
.root{border:2px solid var(--ink);border-radius:var(--r);padding:12px 14px;font-family:var(--hand);font-size:1.15rem;background:var(--sheet)}
.tree{display:grid;gap:10px}
.node{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;text-align:left;background:var(--sheet);border:1.5px solid var(--rule);border-radius:8px;padding:10px 12px;cursor:pointer;width:100%}
.node.main{border-color:var(--red);border-width:2px}
.node.sum{border-color:var(--blue);border-style:dashed;border-width:2px}
.node .k{font-family:var(--hand);font-weight:700;font-size:1.05rem}
.node .s{display:block;font-size:.84rem;color:var(--ink2)}
.node .tag{font-size:.75rem;font-weight:700;border-radius:4px;padding:1px 6px}
.node.main .tag{background:var(--badbg);color:var(--red)}.node .tag{background:var(--line);color:var(--ink2)}.node.sum .tag{background:color-mix(in srgb,var(--blue) 14%,transparent);color:var(--blue)}
.seen{color:var(--ok);font-size:.8rem;white-space:nowrap}
.branch{padding-left:18px;border-left:2px solid var(--rule);display:grid;gap:8px;margin-left:14px}
/* 學習卡 */
.learn h2{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.learn .body{display:flex;flex-direction:column;gap:12px;margin-top:10px}
.kt{border-collapse:collapse;width:100%;font-size:.95rem}
.kt th,.kt td{border:1px solid var(--rule);padding:6px 9px;text-align:left;vertical-align:top}
.kt th{background:var(--paper);white-space:nowrap}
.kt tr.hl td{background:color-mix(in srgb,var(--red) 6%,transparent)}
.tblwrap{overflow-x:auto}.kt.big{min-width:560px}
.pts{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:4px}
.why{background:var(--paper);border-left:4px solid var(--blue);padding:10px 12px;border-radius:0 8px 8px 0}
.note{font-size:.93rem;color:var(--ink2)}
.mnemo{border:2px dashed var(--blue);border-radius:var(--r);padding:10px 14px;font-family:var(--hand);font-size:1.08rem}
.mnemo b{color:var(--blue)}
.flow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-family:var(--hand);font-size:1.15rem}
.flow span{border:1.5px solid var(--rule);border-radius:8px;padding:4px 12px;background:var(--sheet)}
.flow span.hot{border-color:var(--red);color:var(--red);font-weight:700}
.flow i{font-style:normal;color:var(--ink2)}
.stations{display:grid;gap:6px}
.stations div{display:grid;grid-template-columns:4.2em 1fr;gap:10px;padding:7px 10px;background:var(--paper);border-radius:6px}
.stations b{font-family:var(--hand);font-size:1.05rem}
/* 動畫區 */
.lab{border:1px solid var(--line);border-radius:var(--r);padding:12px;background:var(--sheet);display:flex;flex-direction:column;gap:10px}
.lab h3{font-size:1.08rem;display:flex;gap:8px;align-items:center}
.lab h3::before{content:'';width:9px;height:9px;border-radius:50%;background:var(--red);flex:none}
.stage{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:10px;overflow-x:auto}
.stage svg{display:block;width:100%;height:auto;max-width:560px;margin:0 auto}
.readout{padding:9px 12px;border-left:4px solid var(--blue);background:var(--paper);font-size:.96rem;min-height:2.4em;border-radius:0 6px 6px 0}
.readout.bad{border-color:var(--red)}.readout.ok{border-color:var(--ok)}
.matchgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.matchgrid button{border:1.5px solid var(--rule);background:var(--sheet);border-radius:8px;padding:8px;cursor:pointer;text-align:center;font-size:.95rem}
.matchgrid button.sel{border-color:var(--blue);background:color-mix(in srgb,var(--blue) 12%,var(--sheet))}
.matchgrid button.done{border-color:var(--ok);background:var(--okbg);color:var(--ok);cursor:default}
.matchgrid button.no{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.jbars{display:grid;gap:6px}
.jbars>div{display:grid;grid-template-columns:3.6em 1fr 3em;gap:8px;align-items:center;font-size:.9rem}
.jbars .bar{height:12px}.jbars .bar i{transition:width .7s ease}
.jbars em{font-style:normal;font-family:var(--mono);text-align:right;font-variant-numeric:tabular-nums}
.stepper{display:flex;gap:6px;flex-wrap:wrap}
.stepper button{border:1.5px solid var(--rule);background:var(--sheet);border-radius:999px;padding:3px 11px;cursor:pointer;font-size:.86rem}
.stepper button[aria-current=true]{border-color:var(--red);background:var(--red);color:#fff}
.tubes{display:flex;gap:16px;justify-content:center;align-items:flex-end;flex-wrap:wrap;padding:6px}
.tube{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:.84rem;text-align:center;max-width:7.5em}
.tube .glass{width:44px;height:120px;border:2.5px solid var(--ink2);border-top:0;border-radius:0 0 22px 22px;position:relative;overflow:hidden}
.tube .liq{position:absolute;left:0;right:0;bottom:0;height:62%;transition:background-color 1.4s ease}
.tube .drop{position:absolute;left:50%;top:-14px;width:9px;height:12px;margin-left:-4.5px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;opacity:0}
.tube .drop.go{animation:drop .7s ease-in forwards}
@keyframes drop{0%{transform:translateY(0);opacity:1}85%{opacity:1}100%{transform:translateY(60px);opacity:0}}
.bath{position:relative;border-radius:10px;padding:8px 10px 14px;transition:background-color .6s}
.bath.on{background:color-mix(in srgb,var(--red) 10%,transparent)}
.bath.on::after{content:'♨ 隔水加熱中';position:absolute;right:8px;bottom:2px;font-size:.75rem;color:var(--red)}
.slider{display:grid;grid-template-columns:5.5em 1fr 4.5em;gap:10px;align-items:center}
.slider input{width:100%;accent-color:var(--red)}
.slider output{font-family:var(--mono);text-align:right}
/* 逐步圖解 */
.walk .stage svg{max-width:420px}
.wsvg .pt{transition:opacity .35s;cursor:pointer}
.wsvg.dim .pt{opacity:.25}
.wsvg .pt.hl{opacity:1!important;filter:drop-shadow(0 0 3px var(--red)) drop-shadow(0 0 7px var(--red))}
.wsvg .lb,.wsvg .ar,.wsvg .rev{opacity:0;transition:opacity .4s}
.wsvg .ar,.wsvg #wBolus,.wsvg .rev,.wsvg .lb line{pointer-events:none}.wsvg .lb{cursor:pointer}
.wsvg .lb.show,.wsvg .ar.show,.wsvg .rev.show{opacity:1}
.wsvg .lb.cur text{fill:var(--red)!important;font-weight:700}
.mn{display:flex;flex-wrap:wrap;gap:6px;font-family:var(--hand);font-size:1.15rem}
.mn span{border:1.5px dashed var(--rule);border-radius:6px;padding:1px 9px;color:var(--ink2);transition:all .3s}
.mn span.on{border-color:var(--blue);border-style:solid;color:var(--blue);font-weight:700}
.wcard{margin:0;padding-left:1.4em;display:flex;flex-direction:column;gap:3px;font-size:.95rem}
.wcard:empty{display:none}
.wcard li.warn b{color:var(--red)}
/* 題目 */
.qcard{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px}
.qmeta{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:.8rem;color:var(--ink2)}
.qtext{font-size:1.06rem;font-weight:500}
.fig{overflow-x:auto;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:8px}
.fig svg{display:block;width:100%;max-width:440px;height:auto;margin:0 auto}
.fig table{border-collapse:collapse;margin:0 auto;font-size:.88rem;font-variant-numeric:tabular-nums}
.fig td,.fig th{border:1px solid var(--rule);padding:4px 9px;text-align:center}
.fig th{background:var(--sheet);font-weight:700}
.figrow{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:center}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:grid;grid-template-columns:2em 1fr;gap:8px;align-items:start;text-align:left;border:1.5px solid var(--rule);background:var(--sheet);border-radius:8px;padding:10px 12px;cursor:pointer;font-size:1rem;line-height:1.5}
.opt .L{font-family:var(--mono);font-weight:600;color:var(--ink2)}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt.sel{border-color:var(--blue);background:color-mix(in srgb,var(--blue) 10%,var(--sheet))}
.opt.right{border-color:var(--ok);background:var(--okbg)}.opt.right .L{color:var(--ok)}
.opt.wrong{border-color:var(--bad);background:var(--badbg)}.opt.wrong .L{color:var(--bad)}
.opt:disabled{cursor:default}
.verdict{border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.verdict.ok{background:var(--okbg)}.verdict.bad{background:var(--badbg)}.verdict.hint{background:var(--warnbg)}
.verdict h4{margin:0;font-size:1.03rem}.verdict.ok h4{color:var(--ok)}.verdict.bad h4{color:var(--bad)}.verdict.hint h4{color:var(--warn)}
.reasons{display:flex;flex-wrap:wrap;gap:6px}
.reasons button{border:1.5px solid var(--bad);background:var(--sheet);color:var(--bad);border-radius:999px;padding:4px 12px;cursor:pointer;font-size:.88rem}
.reasons button[aria-pressed=true]{background:var(--bad);color:#fff}
.pips{display:inline-flex;gap:4px;vertical-align:middle}.pips i{width:11px;height:11px;border-radius:50%;border:2px solid var(--ok)}.pips i.on{background:var(--ok)}
.wb{display:grid;grid-template-columns:1fr auto;gap:6px 10px;align-items:center;padding:10px 0;border-bottom:1px dashed var(--line)}
.wb:last-child{border-bottom:0}.wb .q{font-size:.94rem;min-width:0}
.wb .m{font-size:.78rem;color:var(--ink2);grid-column:1/-1}
details summary{cursor:pointer;font-weight:700}
.sheetgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(36px,1fr));gap:6px}
.sheetgrid button{height:36px;border-radius:6px;border:1.5px solid var(--rule);background:var(--sheet);font-family:var(--mono);cursor:pointer;font-size:.85rem}
.sheetgrid button.done{background:var(--ink);color:var(--sheet);border-color:var(--ink)}
.sheetgrid button.cur{outline:3px solid var(--red);outline-offset:1px}
.sheetgrid button.r{background:var(--okbg);color:var(--ok);border-color:var(--ok)}.sheetgrid button.w{background:var(--badbg);color:var(--bad);border-color:var(--bad)}
.score{font-family:var(--mono);font-size:3.8rem;line-height:1;color:var(--red);font-variant-numeric:tabular-nums}.score small{font-size:1.15rem;color:var(--ink2)}
.hist{width:100%;border-collapse:collapse;font-size:.92rem;font-variant-numeric:tabular-nums}
.hist td,.hist th{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}.hist td:first-child{white-space:normal}
.hist tr.click{cursor:pointer}.hist tr.click:hover td{background:var(--paper)}
.confirm{border:2px solid var(--red);border-radius:8px;padding:12px;background:var(--badbg);display:flex;flex-direction:column;gap:8px}
.lock{border:2px dashed var(--rule);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:8px}
textarea{width:100%;min-height:90px;font-family:var(--mono);font-size:.78rem;border:1.5px solid var(--rule);border-radius:8px;padding:8px;background:var(--paper);color:var(--ink)}
.shot{border:2px solid var(--ink);border-radius:var(--r);padding:14px;background:var(--sheet);display:flex;flex-direction:column;gap:6px}
.typecard{display:flex;flex-direction:column;gap:8px}
.typecard .hd{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.typecard dl{display:grid;grid-template-columns:4.5em 1fr;gap:4px 10px;margin:0;font-size:.93rem}
.typecard dt{color:var(--ink2);font-weight:700}.typecard dd{margin:0}
@media (min-width:720px){.cols{grid-template-columns:1fr 1fr;align-items:start}.cols .span{grid-column:1/-1}.meter{grid-template-columns:repeat(4,1fr)}}
@media (min-width:900px){body{padding-bottom:0;padding-left:96px;font-size:17px}
 nav.tabs{top:0;bottom:0;right:auto;width:96px;grid-template-columns:1fr;grid-auto-rows:min-content;gap:4px;padding-top:calc(24px + env(safe-area-inset-top,0px));border-top:0;border-right:1px solid var(--rule)}
 nav.tabs button{padding:12px 4px;font-size:.86rem}nav.tabs button[aria-current=true]{background:var(--paper);box-shadow:inset 3px 0 0 var(--red)}
 .wrap{max-width:1040px;padding-left:max(32px,env(safe-area-inset-left,0px));padding-right:max(32px,env(safe-area-inset-right,0px))}.qwrap{max-width:780px}.top h1{font-size:2rem}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.noanim *{transition:none!important;animation:none!important}
</style>
<div class="wrap" id="app">
  <header class="top"><h1>意帆的自然衝刺<small id="unitSub">第 3 章 生物體的營養</small></h1><div class="count" id="count"></div></header>
  <div class="units" id="units"></div>
  <main id="view"></main>
</div>

<script>
window.LBANK=[{id:"E1",ch:"3-1",kind:"orig",g:"E1",star:2,src:"講義 p.59 隨堂4",c:"題意誤讀",q:"小香分別用碘液和本氏液檢測豆漿的成分，結果碘液呈藍黑色，本氏液呈紅色，則豆漿中含有什麼成分？",o:["含有澱粉及糖","只含澱粉","只含糖","不含澱粉也不含糖"],a:0,e:"碘液負責測「澱粉」：變藍黑 → 有澱粉。本氏液負責測「糖」：變紅 → 有糖，而且很多。兩個試劑各管一件事，兩個都有反應，就是兩種都有。",t:"先分開判斷，再合起來。不要只看最後一個試劑。"},{id:"E1a",ch:"3-1",kind:"var",g:"E1",star:1,src:"類題",q:"某果汁滴加碘液呈黃褐色；另取果汁加本氏液隔水加熱後呈橙色。這杯果汁：",o:["含糖，不含澱粉","含澱粉，不含糖","澱粉和糖都有","澱粉和糖都沒有"],a:0,e:"碘液維持黃褐色（碘液原本的顏色）→ 沒有澱粉。本氏液加熱後變橙色 → 有糖。"},{id:"E1b",ch:"3-1",kind:"var",g:"E1",star:2,src:"類題",q:"三杯飲料的檢測結果：甲杯「碘液藍黑、本氏液淡藍」；乙杯「碘液黃褐、本氏液紅」；丙杯「碘液藍黑、本氏液綠」。哪一杯同時含有澱粉和糖？",o:["丙杯","甲杯","乙杯","三杯都沒有"],a:0,e:"同時有澱粉和糖 → 碘液要藍黑，本氏液也要變色。丙杯碘液藍黑（有澱粉），本氏液變綠（有少量糖）。甲杯本氏液淡藍 = 沒糖；乙杯碘液黃褐 = 沒澱粉。",t:"本氏液變「綠」也算有糖，只是比較少。"},{id:"E1c",ch:"3-1",kind:"var",g:"E1",star:3,src:"類題",q:"小明在果汁中加入本氏液，沒有加熱就觀察，發現顏色維持淡藍色，於是說「這杯果汁沒有糖」。這個結論如何？",o:["不一定正確，本氏液必須隔水加熱才能判斷","正確，淡藍色代表沒有糖","正確，因為果汁一定沒有糖","不正確，因為應該改用碘液測糖"],a:0,e:"本氏液不加熱，不管有沒有糖都會維持淡藍色，所以不能下結論。測糖要「本氏液＋隔水加熱」；碘液是測澱粉，不是測糖。"},{id:"E2",ch:"3-1",kind:"orig",g:"E2",star:2,src:"講義 p.60 試題6",c:"觀念不懂",q:"目前流行的高纖食品，其所含纖維的作用為何？",o:["增加消化道蠕動","提供身體所需養分","增加香味","消滅體內細菌"],a:0,e:"纖維（纖維素）是組成植物細胞壁的醣類，但人體無法消化吸收，所以不能當養分、也不提供能量。它的作用是促進腸道蠕動、幫助排便，所以便祕要多吃蔬菜。",t:"跟你答對的「便祕吃竹筍、芹菜」是同一個觀念。"},{id:"E2a",ch:"3-1",kind:"var",g:"E2",star:2,src:"類題",q:"關於纖維素的敘述，下列何者正確？",o:["屬於醣類，是組成植物細胞壁的成分","人體可分解纖維素，獲得大量能量","主要存在於肉類中","可用碘液檢驗，會呈藍黑色"],a:0,e:"纖維素屬於醣類，組成植物細胞壁（課本焦點1表格）。人體無法分解它，所以得不到能量；它來自蔬菜水果而不是肉類；碘液測的是澱粉，不是纖維素。"},{id:"E2b",ch:"3-1",kind:"var",g:"E2",star:1,src:"類題",q:"醫生建議經常便祕的小寶多吃蔬菜，主要是因為蔬菜含有較多的：",o:["纖維素","脂質","蛋白質","澱粉"],a:0,e:"蔬菜中的纖維素無法被消化，可以增加消化道蠕動，幫助排便。"},{id:"E3",ch:"3-1",kind:"orig",g:"E3",star:3,src:"講義 p.60 試題12",c:"題意誤讀",fig:"rice",q:"依據上表三種米的數據分析，下列各項敘述何者<u>錯誤</u>？",o:["以維生素 B₂ 而言，兩碗糙米約等於一碗胚芽米","以磷的含量而言，糙米約為白米的兩倍","以鉀的含量而言，糙米約等於白米與胚芽米的總和","對表中五種營養素整體比較，以糙米的營養價值最高"],a:0,e:"每個選項都要實際算：磷 310 ÷ 140 ≈ 2.2，約兩倍 ✔。鉀 110 + 140 = 250，剛好等於糙米 ✔。B₂：兩碗糙米 = 0.06 × 2 = 0.12，胚芽米只有 0.05，不相等 ✘。五項糙米都最高 ✔。",t:"「錯誤」題：四個選項都算一遍，算出不成立的那個。"},{id:"E3a",ch:"3-1",kind:"var",g:"E3",star:2,src:"類題",fig:"rice",q:"依上表，以「鈣」而言，糙米的含量約為白米的幾倍？",o:["約 1.7 倍","約 1.2 倍","約 3 倍","約 5 倍"],a:0,e:"糙米鈣 10 mg，白米鈣 6 mg。10 ÷ 6 ≈ 1.67，約 1.7 倍。"},{id:"E3b",ch:"3-1",kind:"var",g:"E3",star:3,src:"講義 p.60 試題13",fig:"rice",q:"19～30 歲女性每日維生素 B₁ 建議攝取量為 1 mg。假設 B₁ 都由稻米攝取，下列何者最接近建議量？",o:["185 g 的糙米","200 g 的胚芽米","500 g 的白米","白米與糙米各 100 g"],a:0,e:"表中單位是「每 100 g」。糙米：0.54 × 1.85 ≈ 1.0 mg ✔。胚芽米：0.30 × 2 = 0.6 mg。白米：0.12 × 5 = 0.6 mg。各 100 g：0.12 + 0.54 = 0.66 mg。"},{id:"E3c",ch:"3-1",kind:"var",g:"E3",star:3,src:"類題",fig:"rice",q:"依上表，若要從白米攝取到與 100 g 糙米相同量的維生素 B₁，約需吃多少白米？",o:["450 g","225 g","300 g","540 g"],a:0,e:"100 g 糙米含 B₁ 0.54 mg；白米每 100 g 只有 0.12 mg。0.54 ÷ 0.12 = 4.5，所以要 4.5 × 100 = 450 g。"},{id:"E4",ch:"3-2",kind:"orig",g:"E4",star:2,src:"講義 p.65 隨堂6（附上第5題的實驗）",c:"觀念不懂",q:"實驗：甲管放「澱粉液＋唾液」，乙管放「澱粉液＋水」，放在 37°C 下 15 分鐘後加入本氏液隔水加熱，甲管變紅橙色，乙管維持淡藍色。根據結果，下列推論何者正確？",o:["唾液會使澱粉分解為糖","本氏液與澱粉隔水加熱會變色","本氏液加唾液經加熱後顏色會改變","唾液會使糖合成澱粉"],a:0,e:"乙管只有澱粉，加熱後仍淡藍 → 澱粉本身不會讓本氏液變色。甲管多了唾液就出現糖 → 糖是唾液（澱粉酶）分解澱粉產生的。實驗裡沒有「只放唾液」的試管，所以不能推論唾液本身會讓本氏液變色。方向是「澱粉 → 糖」，不是合成。",t:"對照你的筆記 p.80：甲管紅橙黃綠、乙丙管淡藍。"},{id:"E4a",ch:"3-2",kind:"var",g:"E4",star:2,src:"類題",q:"承上實驗，若改滴碘液：甲管（澱粉＋唾液）呈黃褐色，乙管（澱粉＋水）呈藍黑色。甲管不變藍黑的原因是：",o:["甲管的澱粉已被唾液分解","碘液被唾液破壞","乙管的水含有澱粉","甲管溫度太高"],a:0,e:"碘液遇澱粉才會變藍黑。甲管的澱粉已被唾液中的澱粉酶分解成糖，沒有澱粉了，所以保持碘液原本的黃褐色。"},{id:"E4b",ch:"3-2",kind:"var",g:"E4",star:3,src:"類題（筆記 p.80 丙管）",q:"丙管放「澱粉液＋先煮到 90°C 再冷卻的唾液」，放在 37°C 下 15 分鐘後滴碘液，結果呈什麼顏色？為什麼？",o:["藍黑色，高溫使酵素永久失去活性，澱粉沒被分解","黃褐色，澱粉已被分解","藍黑色，低溫使酵素暫時失去活性","紅色，產生了大量的糖"],a:0,e:"唾液煮到 90°C，澱粉酶被高溫破壞 → 永久失去活性，就算冷卻回 37°C 也救不回來。澱粉沒被分解，碘液變藍黑。"},{id:"E4c",ch:"3-2",kind:"var",g:"E4",star:2,src:"類題",q:"在此實驗中，乙管（澱粉液＋水）的主要作用是：",o:["當對照組，證明澱粉分解是唾液造成的","當實驗組","提供唾液需要的水分","讓澱粉溶解得更快"],a:0,e:"乙管和甲管只差「有沒有唾液」，其他條件都一樣。乙管就是對照組，用來證明變化是唾液造成的。"},{id:"E5",ch:"3-2",kind:"orig",g:"E5",star:2,src:"講義 p.65 試題2",c:"題意誤讀（讀圖）",fig:"enzSplit",q:"右圖為酵素與受質作用的示意圖，此酵素與受質作用的反應是何種作用？",o:["分解作用","合成作用","滲透作用","呼吸作用"],a:0,e:"看「進去幾塊、出來幾塊」：甲是一整塊進去，出來變成乙、丙兩塊 → 大分子變小分子 = 分解作用。丁反應前後形狀不變，就是酵素。",t:"讀圖 SOP：先數受質的塊數，1 → 2 是分解，2 → 1 是合成。"},{id:"E5a",ch:"3-2",kind:"var",g:"E5",star:2,src:"類題",fig:"enzJoin",q:"右圖中，兩個小分子 A、B 和酵素結合後，變成一個大分子 C，酵素離開後形狀不變。這是：",o:["合成作用","分解作用","光合作用","滲透作用"],a:0,e:"2 塊進去 → 1 塊出來，小分子變大分子 = 合成作用。"},{id:"E5b",ch:"3-2",kind:"var",g:"E5",star:1,src:"講義 p.65 試題1",fig:"enzSplit",q:"同上圖，何者為酵素？",o:["丁","甲","乙","丙"],a:0,e:"酵素反應前後本質不變、可以重複使用。圖中從頭到尾都在、形狀沒變的是丁。甲是受質，乙和丙是產物。"},{id:"E5c",ch:"3-2",kind:"var",g:"E5",star:2,src:"類題",q:"酵素參與分解作用後，酵素本身會：",o:["本質不變，可以重複使用","被分解成小分子","變成產物","和受質永久結合"],a:0,e:"筆記重點：反應前後酵素不會用完 → 可重複使用。"},{id:"E6",ch:"3-2",kind:"orig",g:"E6",star:3,src:"講義 p.65 試題4",c:"觀念不懂",q:"有關酵素的敘述，下列何者正確？(甲)將食物置於冰箱，可增加酵素活性以保新鮮；(乙)酵素會參與體內的代謝，但反應後本身不會產生變化；(丙)多數酵素種類不一樣，功能亦不同；(丁)酵素的種類不同，適宜的酸鹼度亦可不同。",o:["僅乙丙丁","甲乙丙丁","僅甲丙","僅乙丁"],a:0,e:"甲錯：冰箱低溫會「降低」酵素活性（暫時失活），食物中的酵素和細菌作用變慢，所以能保鮮。乙：可重複使用 ✔。丙：專一性，不同酵素功能不同 ✔。丁：胃（酸性）、唾液（中性）、小腸（鹼性） ✔。",t:"你筆記寫了「低溫暫時失活」，冰箱是降低活性。"},{id:"E6a",ch:"3-2",kind:"var",g:"E6",star:2,src:"類題",q:"食物放在冰箱可以保存較久，主要原因是：",o:["低溫使酵素活性降低，分解作用變慢","低溫使酵素活性增加","低溫使酵素永久失去活性","低溫讓蛋白質變成澱粉"],a:0,e:"低溫讓酵素活性變低（暫時），食物腐壞的分解作用變慢。低溫不是「永久」失活，拿出來回溫後活性會恢復。"},{id:"E6b",ch:"3-2",kind:"var",g:"E6",star:3,src:"類題",q:"把唾液放在 0°C 冰水中 10 分鐘，再拿到 37°C 環境，加入澱粉液。結果會如何？",o:["澱粉仍可被分解","澱粉不會被分解，酵素已永久失去活性","唾液會變成葡萄糖","澱粉會變成蛋白質"],a:0,e:"低溫只是「暫時」降低活性，回到 37°C 後酵素恢復作用，澱粉照樣被分解。高溫才是永久失活。"},{id:"E6c",ch:"3-2",kind:"var",g:"E6",star:1,src:"類題",q:"下列哪一種情況，會使人體的酵素「永久」失去活性？",o:["煮沸到 90°C","放進冰箱","放在 37°C","放在 20°C"],a:0,e:"高溫會破壞酵素（蛋白質）的結構，永久失活（筆記：例如高溫殺菌）。低溫只是暫時失活；37°C 是最適溫度。"},{id:"E7",ch:"3-3",kind:"orig",g:"E7",star:2,src:"講義 p.72 試題1",c:"記憶不牢",fig:"leaf",q:"右圖為葉橫切面的放大圖，下列敘述何者<u>錯誤</u>？",o:["丁是氣體進出的通道，水分也由此吸收","甲、戊部分具保護作用","乙是行光合作用的主要場所","丙是運送物質的構造"],a:0,e:"丁（氣孔）是 CO₂、O₂、水蒸氣進出的通道，前半句對；但光合作用的水分是「根」吸收，經莖和葉脈運到葉，後半句錯。甲、戊是表皮（保護）；乙是葉肉（光合作用）；丙是葉脈（運輸）。",t:"一句話有兩個說法時，兩半都要對才算對。"},{id:"E7a",ch:"3-3",kind:"var",g:"E7",star:1,src:"類題",q:"植物行光合作用所需的水分，主要來源是：",o:["由根吸收，經莖和葉脈運送到葉","由氣孔吸收空氣中的水","葉面直接吸收雨水","葉肉細胞自己製造"],a:0,e:"課本圖示：水「從根部吸收，經葉脈運輸」。氣孔進的是二氧化碳。"},{id:"E7b",ch:"3-3",kind:"var",g:"E7",star:2,src:"類題",fig:"leaf",q:"同上圖，哪一部分的細胞透明、沒有葉綠體，不能行光合作用？",o:["甲（表皮細胞）","乙（葉肉細胞）","丁（保衛細胞）","以上都有葉綠體"],a:0,e:"筆記：表皮細胞透明、無葉綠體，不行光合作用。葉肉細胞和保衛細胞都有葉綠體，可以行光合作用。"},{id:"E7c",ch:"3-3",kind:"var",g:"E7",star:1,src:"類題",q:"葉片表面角質層的主要功能是：",o:["防止水分散失","行光合作用","運輸養分","吸收二氧化碳"],a:0,e:"筆記：角質層可防止水分散失。"},{id:"E8",ch:"3-3",kind:"orig",g:"E8",star:2,src:"講義 p.72 試題2",c:"觀念不懂",q:"植物行光合作用時，保衛細胞與氣孔分別呈現何種狀態？",o:["吸水而膨脹彎曲，氣孔張開","吸水而膨脹彎曲，氣孔關閉","失去水而萎縮，氣孔關閉","失去水而萎縮，氣孔張開"],a:0,e:"光合作用需要二氧化碳從氣孔進來，所以氣孔要「開」。保衛細胞吸水膨脹、向外彎曲時，中間的氣孔就張開；失水萎縮時變直，氣孔關閉。",t:"口訣：吸水 → 彎 → 開；失水 → 直 → 關。"},{id:"E8a",ch:"3-3",kind:"var",g:"E8",star:3,src:"類題",q:"炎熱的中午植物缺水，保衛細胞失水萎縮。此時氣孔會如何？對光合作用有什麼影響？",o:["關閉；二氧化碳進入減少，光合作用變慢","張開；光合作用加快","張開；水分散失減少","關閉；氧氣進入變多"],a:0,e:"失水 → 保衛細胞變直 → 氣孔關閉。氣孔關了，原料二氧化碳進不來，光合作用就變慢。"},{id:"E8b",ch:"3-3",kind:"var",g:"E8",star:1,src:"類題",q:"陸生植物的氣孔大多分布在：",o:["葉片的下表皮","葉片的上表皮","葉脈","葉肉"],a:0,e:"筆記：氣孔由保衛細胞構成，陸生植物位於下表皮。"},{id:"E8c",ch:"3-3",kind:"var",g:"E8",star:2,src:"講義 p.72 探究提問",q:"在葉片上、下表皮都塗上凡士林蓋住氣孔，放在陽光下並適時澆水。這片葉子：",o:["無法行光合作用，因為缺少二氧化碳","可以行光合作用，因為有水和光","無法行光合作用，因為缺水","光合作用會更旺盛"],a:0,e:"凡士林蓋住氣孔，二氧化碳無法從空氣進入葉內，缺少原料，不能行光合作用。水是從根吸收，不受影響。"},{id:"E9",ch:"3-3",kind:"orig",g:"E9",star:2,src:"講義 p.73 試題5",c:"觀念不懂",q:"花生能提煉花生油，此油是光合作用的何種產物轉變而來？",o:["葡萄糖","水","二氧化碳","氧"],a:0,e:"課本 p.69「養分的轉換」：光合作用產生的葡萄糖，可以轉換成澱粉、蛋白質、脂質等，儲存在植物體內。花生油是脂質，由葡萄糖轉變而來。"},{id:"E9a",ch:"3-3",kind:"var",g:"E9",star:2,src:"類題",q:"地瓜（甘藷）中儲存的大量澱粉，最初是從哪裡來的？",o:["葉片光合作用產生的葡萄糖轉換而成","根從土壤吸收的澱粉","空氣中的澱粉","地瓜吃進的食物"],a:0,e:"葉片行光合作用產生葡萄糖，再轉換成澱粉運到根部儲存。土壤裡沒有澱粉可以吸收。"},{id:"E9b",ch:"3-3",kind:"var",g:"E9",star:1,src:"類題",q:"光合作用的產物中，可以再轉換成澱粉、蛋白質、脂質的是：",o:["葡萄糖","氧氣","水","二氧化碳"],a:0,e:"葡萄糖是光合作用製造的養分，可轉換成其他形式的養分。二氧化碳是原料，不是產物。"},{id:"E10",ch:"3-3",kind:"orig",g:"E10",star:3,src:"講義 p.74 試題11",c:"觀念不懂",q:"芳菁取楓樹及變葉木的紅葉各一片，置於熱水中煮沸 2 分鐘，再置於酒精中隔水加熱；10 分鐘後取出，用熱水漂洗，滴加碘液。結果楓樹的紅葉呈黃褐色，變葉木的紅葉呈藍黑色。下列敘述何者正確？",o:["楓樹的紅葉無法行光合作用","楓樹紅葉及變葉木紅葉對酒精的反應不同","碘液可測知呼吸作用的產物","變葉木的紅葉無法行光合作用"],a:0,e:"推論兩步：① 碘液黃褐 → 沒有澱粉；② 沒有澱粉 → 沒有光合作用的產物 → 不能行光合作用。所以楓樹紅葉不能行光合作用；變葉木呈藍黑 = 有澱粉 = 可以行光合作用。碘液測的澱粉是光合作用的產物，不是呼吸作用的產物。",t:"顏色 → 有沒有澱粉 → 能不能行光合作用，一定要推到最後一步。"},{id:"E10a",ch:"3-3",kind:"var",g:"E10",star:2,src:"類題",q:"鋁箔實驗中，被鋁箔包住的部分滴碘液後呈黃褐色，表示：",o:["該處沒有澱粉，因為沒照光不能行光合作用","該處含有澱粉","碘液已經失效","該處葉綠素太多"],a:0,e:"鋁箔不透光 → 沒光 → 不能行光合作用 → 沒產生澱粉 → 碘液保持黃褐色。"},{id:"E10b",ch:"3-3",kind:"var",g:"E10",star:3,src:"類題",q:"某同學做鋁箔實驗，結果整片葉子（包含包鋁箔的部分）滴碘液後都呈藍黑色。最可能的原因是：",o:["實驗前沒有先放在黑暗處，葉片原本的澱粉沒消耗掉","鋁箔透光太少","酒精加得太多","碘液滴得太少"],a:0,e:"實驗前要先放在黑暗處（約一週），把葉片原有的澱粉用掉。沒做這一步，包鋁箔處仍殘留舊的澱粉，也會變藍黑，就無法證明光合作用需要光。"},{id:"E10c",ch:"3-3",kind:"var",g:"E10",star:3,src:"類題",q:"斑葉植物的葉片有綠色和白色（無葉綠素）部分。照光後依標準步驟處理並滴碘液，白色部分呈什麼顏色？可說明什麼？",o:["黃褐色；光合作用需要葉綠素","藍黑色；光合作用需要光","藍黑色；光合作用需要葉綠素","黃褐色；光合作用需要二氧化碳"],a:0,e:"白色部分有照到光，但沒有葉綠素 → 不能行光合作用 → 沒澱粉 → 黃褐色。兩部分只差「有沒有葉綠素」，所以證明需要葉綠素。"},{id:"E11",ch:"3-3",kind:"orig",g:"E11",star:2,src:"講義 p.74 試題12",c:"題意誤讀",q:"下列哪一項步驟<u>不需要</u>加熱？",o:["碘液測澱粉","本氏液測葡萄糖","酒精溶解葉綠素","測定花生米所含熱量"],a:0,e:"本氏液要隔水加熱才會變色；酒精要隔水加熱溶解葉綠素；測花生熱量要燃燒花生加熱水。只有碘液直接滴上去就會變色，不用加熱。",t:"先圈出「不需要」，再一個一個問自己：這步驟有沒有開酒精燈？"},{id:"E11a",ch:"3-1",kind:"var",g:"E11",star:1,src:"類題",q:"下列哪一項實驗步驟需要「隔水加熱」？",o:["本氏液測葡萄糖","碘液測澱粉","剪下包鋁箔的葉片","把葉片平放在培養皿"],a:0,e:"本氏液測糖要隔水加熱（另一個要隔水加熱的是酒精溶解葉綠素）。碘液直接滴加即可。"},{id:"E11b",ch:"3-3",kind:"var",g:"E11",star:2,src:"類題",q:"溶解葉綠素時，酒精為什麼要「隔水加熱」，不能直接用火加熱？",o:["酒精易燃，直接加熱容易著火","酒精的沸點太高","直接加熱酒精會變成水","隔水加熱比較快"],a:0,e:"課本警示：酒精易著火，不可直接加熱；萬一著火，立即用溼抹布撲滅。"},{id:"E11c",ch:"3-1",kind:"var",g:"E11",star:2,src:"講義 p.60 試題11",q:"加本氏液的兩支試管（一支有葡萄糖、一支沒有），若不經加熱處理，短時間內溶液顏色會如何？",o:["都保持淡藍色","都保持綠色","加葡萄糖者呈綠色，未加者淡藍色","加葡萄糖者淡藍色，未加者紅色"],a:0,e:"本氏液一定要隔水加熱才會和糖反應，不加熱就都維持原本的淡藍色。"},{id:"E12",ch:"3-1",kind:"orig",g:"E12",star:1,src:"講義 p.60 試題8",c:"記憶不牢",q:"若欲測定薯條內是否含有澱粉，可用下列哪一種試劑檢驗出？",o:["碘液","石灰水","本氏液","亞甲藍液"],a:0,e:"測澱粉 → 碘液（黃褐變藍黑）。本氏液測糖；石灰水測二氧化碳；亞甲藍液是染色用。",t:"試劑配對：碘 → 澱粉；本氏 → 糖。"},{id:"E12a",ch:"3-1",kind:"var",g:"E12",star:2,src:"講義 p.58 實驗",q:"把白飯磨成飯液，加本氏液隔水加熱後仍呈淡藍色；白飯滴碘液則呈藍黑色。可推論白飯：",o:["含澱粉，但不含糖","含糖，但不含澱粉","澱粉和糖都有","不含任何養分"],a:0,e:"碘液藍黑 → 有澱粉；本氏液淡藍 → 沒有糖。課本實驗的結論：白飯含澱粉、水果含糖。"},{id:"E12b",ch:"3-1",kind:"var",g:"E12",star:1,src:"類題",q:"碘液原本的顏色，以及遇到澱粉後的顏色分別是：",o:["黃褐色 → 藍黑色","淡藍色 → 紅色","藍黑色 → 黃褐色","無色 → 綠色"],a:0,e:"碘液：黃褐 → 藍黑（有澱粉）。本氏液：淡藍 → 綠、黃、橙、紅（有糖，越紅越多）。"},{id:"K1",ch:"3-1",kind:"key",star:1,src:"講義 p.56 隨堂1",q:"(甲)醣類 (乙)蛋白質 (丙)水 (丁)維生素 (戊)脂質 (己)礦物質，以上哪些是可以提供能量的養分？",o:["甲乙戊","甲乙丁","甲乙丙","丁戊己"],a:0,e:"筆記：可產生能量 = 醣類、蛋白質、脂質。不能產生能量 = 水、維生素、礦物質。"},{id:"K2",ch:"3-1",kind:"key",star:1,src:"講義 p.56 隨堂2",q:"飲食中長期缺乏下列何種礦物質，可能會導致貧血？",o:["鐵","鈣","磷","鈉"],a:0,e:"缺鐵無法合成血紅素 → 貧血。鈣、磷缺乏 → 骨質疏鬆。"},{id:"K3",ch:"3-1",kind:"key",star:1,src:"筆記 缺乏症",q:"缺乏下列哪一種維生素，容易造成皮下或牙齦出血（壞血病）？",o:["維生素 C","維生素 A","維生素 D","維生素 B₁"],a:0,e:"筆記：維生素 C（抗壞血酸）缺乏 → 壞血病。A → 夜盲症；D → 軟骨症。"},{id:"K4",ch:"3-1",kind:"key",star:1,src:"筆記 缺乏症",q:"人體缺乏維生素 A，最可能出現下列哪一種症狀？",o:["夜間視力減退（夜盲症）","牙齦出血","軟骨症","貧血"],a:0,e:"維生素 A → 夜盲症，嚴重會失明。"},{id:"K5",ch:"3-1",kind:"key",star:2,src:"筆記 缺乏症",q:"被稱為「陽光維生素」，缺乏時容易造成軟骨症的是：",o:["維生素 D","維生素 A","維生素 C","鐵"],a:0,e:"筆記紅字：維生素 D 又叫陽光維生素，缺乏 → 軟骨症。"},{id:"K6",ch:"3-1",kind:"key",star:3,src:"筆記 熱量計算例題",q:"某食品營養標示：碳水化合物 23 g、蛋白質 5 g、脂質 8 g、鈉 0.122 g。此食品的總熱量約為多少大卡？",o:["184 大卡","144 大卡","216 大卡","284 大卡"],a:0,e:"醣類 23 × 4 = 92；蛋白質 5 × 4 = 20；脂質 8 × 9 = 72；鈉是礦物質 × 0。92 + 20 + 72 = 184 大卡。",t:"醣 4、蛋 4、脂 9，礦物質不算熱量。"},{id:"K7",ch:"3-1",kind:"key",star:3,src:"熱量計算",q:"一包洋芋片含醣類 20 g、脂質 10 g、蛋白質 2 g。總熱量約為多少大卡？",o:["178 大卡","128 大卡","152 大卡","288 大卡"],a:0,e:"20 × 4 = 80；10 × 9 = 90；2 × 4 = 8。80 + 90 + 8 = 178 大卡。脂質一公克 9 大卡，最容易漏乘。"},{id:"K8",ch:"3-1",kind:"key",star:2,src:"筆記 熱量計算",q:"關於熱量單位的敘述，何者正確？",o:["1 大卡 = 1000 卡","1 卡 = 1000 大卡","1 卡是使 1 公斤水上升 1°C 的熱量","脂質每公克可產生 4 大卡"],a:0,e:"筆記：1 卡是 1 公克水上升 1°C 所需的熱量；1 大卡 = 1000 卡。脂質每公克 9 大卡，醣類和蛋白質是 4 大卡。"},{id:"K9",ch:"3-1",kind:"key",star:1,src:"筆記 營養素",q:"人體內含量最多的物質是：",o:["水","蛋白質","脂質","醣類"],a:0,e:"水是生物體內含量最多的物質，約占 70%。細胞內大部分物質要先溶在水中才能反應。"},{id:"K10",ch:"3-1",kind:"key",star:2,src:"課本焦點1 表格",q:"動物的毛髮、肌肉、酵素、抗體，主要都是由哪一種養分組成？",o:["蛋白質","醣類","脂質","維生素"],a:0,e:"課本表格：毛髮、肌肉、酵素、抗體、膜上的通道都是蛋白質組成。"},{id:"K11",ch:"3-1",kind:"key",star:2,src:"課本焦點1 表格",q:"脂質分布在動物的皮膚下層，主要功能是：",o:["防止熱量散失，達到保溫","提供維生素","運送氧氣","組成植物細胞壁"],a:0,e:"脂質在皮下 → 保溫，也可保護內臟。組成植物細胞壁的是纖維素（醣類）。"},{id:"K12",ch:"3-1",kind:"key",star:1,src:"講義 p.59 試題2",q:"下列哪一種食物含有最豐富的醣類？",o:["乾燥烏龍麵","豆腐","鮮奶","新鮮高麗菜"],a:0,e:"飯、麵、甘藷富含醣類（澱粉）。豆腐偏蛋白質，高麗菜大多是水和纖維。"},{id:"K13",ch:"3-1",kind:"key",star:2,src:"講義 p.59 試題4",q:"相同重量時，下列哪一種食物的蛋白質含量<u>最低</u>？",o:["奶油","吳郭魚","豆腐","荷包蛋"],a:0,e:"奶油幾乎都是脂質。魚、豆腐、蛋都是蛋白質的好來源。"},{id:"K14",ch:"3-1",kind:"key",star:2,src:"講義 p.59 問題2",q:"葡萄糖的測定中，甲管「葡萄糖液＋本氏液」，乙管「水＋本氏液」。乙管的角色是：",o:["對照組，用來比較顏色變化","實驗組","用來加熱的熱水","用來稀釋本氏液"],a:0,e:"甲管含葡萄糖是實驗組；乙管不含葡萄糖、只有水，是對照組。"},{id:"K15",ch:"3-1",kind:"key",star:2,src:"筆記 本氏液",q:"本氏液隔水加熱後，哪一個顏色表示糖的含量最多？",o:["紅色","綠色","淡藍色","黃色"],a:0,e:"筆記：淡藍 = 無；綠 = 少；黃 → 橙 → 紅 越來越多。紅色最多。"},{id:"K16",ch:"3-1",kind:"key",star:1,src:"講義 p.60 試題9",q:"以本氏液測試某人的尿液，結果呈現橙色，表示尿液中含有：",o:["糖分","尿素","蛋白質","脂肪酸"],a:0,e:"本氏液變色 = 有糖。尿中有糖要注意血糖問題。"},{id:"K17",ch:"3-1",kind:"key",star:3,src:"講義 p.60 試題10",fig:"reagentTable",q:"右表為測定葡萄糖和澱粉的紀錄，「＋」表有反應，「－」表無反應。則甲乙丙丁依序為何？",o:["＋ － － ＋","＋ － ＋ －","－ － ＋ ＋","＋ ＋ － －"],a:0,e:"本氏液只和葡萄糖反應：甲＋、乙－。碘液只和澱粉反應：丙－、丁＋。所以是 ＋ － － ＋。"},{id:"K18",ch:"3-1",kind:"key",star:3,src:"講義 p.59 探究提問",q:"有些紙張製作時會加入澱粉。用碘液檢驗，下列哪一種紙最可能呈藍黑色？",o:["影印紙","衛生紙","實驗用濾紙","以上都不會"],a:0,e:"課本結果：圖畫紙與影印紙有澱粉（填補纖維空隙、讓紙更平滑好印刷）；衛生紙與濾紙沒有。"},{id:"K19",ch:"3-1",kind:"key",star:2,src:"講義 p.59 隨堂3",q:"欲測定未知溶液中是否有葡萄糖，步驟依序為何？(甲)加酒精 (乙)加亞甲藍液 (丙)加本氏液 (丁)加碘液 (戊)隔水加熱",o:["丙 → 戊","乙 → 戊","丁 → 戊","甲 → 丁"],a:0,e:"測葡萄糖：先加本氏液，再隔水加熱，看顏色。"},{id:"K20",ch:"3-1",kind:"key",star:1,src:"講義 p.59 試題1",q:"關於維生素和礦物質的敘述，下列何者<u>錯誤</u>？",o:["提供生物體活動所需的能量","維持生物體的正常機能","生物體對它們的需求量較少","在生物體內不能產生能量"],a:0,e:"維生素和礦物質「不能」提供能量，作用是調節生理機能。"},{id:"K21",ch:"3-1",kind:"key",star:2,src:"課本焦點1",q:"下列哪兩種礦物質是骨頭和牙齒的重要成分？",o:["鈣和磷","鐵和鈉","鉀和鐵","鈉和鉀"],a:0,e:"鈣、磷 → 骨頭與牙齒，缺乏易骨質疏鬆。鐵 → 血紅素。"},{id:"K22",ch:"3-2",kind:"key",star:1,src:"課本焦點1 代謝作用",q:"生物體內物質的分解與合成，合稱為：",o:["代謝作用","光合作用","消化作用","呼吸作用"],a:0,e:"分解作用（大 → 小）＋ 合成作用（小 → 大）＝ 代謝作用。"},{id:"K23",ch:"3-2",kind:"key",star:1,src:"筆記 酵素特性①",q:"酵素（又稱為酶）的主要成分是：",o:["蛋白質","醣類","脂質","礦物質"],a:0,e:"酵素主要由蛋白質構成，所以會影響蛋白質的因素（溫度、酸鹼值、重金屬）都會影響酵素。"},{id:"K24",ch:"3-2",kind:"key",star:2,src:"講義 p.62 隨堂2",q:"酵素具有專一性，「專一性」是指：",o:["一種酵素只能促進一種特定反應","一個酵素只能作用一次","一種酵素只能在某一段消化道作用","一種酵素只能在某一酸鹼範圍內反應"],a:0,e:"專一性：酵素和受質的結合像鑰匙和鎖，特定反應要特定酵素。只能作用一次是錯的（可重複使用）。"},{id:"K25",ch:"3-2",kind:"key",star:2,src:"課本焦點2",q:"唾液中的澱粉酶可以初步分解澱粉，卻不能分解蛋白質。這說明酵素具有：",o:["專一性","重複使用性","耐熱性","產生能量的特性"],a:0,e:"只對特定受質（澱粉）有作用 = 專一性。"},{id:"K26",ch:"3-2",kind:"key",star:2,src:"講義 p.65 試題3",q:"有關生物體內酵素的敘述，下列何者<u>錯誤</u>？",o:["離開生物體就會失去作用","可參與分解作用","可參與合成作用","主要成分是蛋白質"],a:0,e:"酵素離開生物體，只要溫度、酸鹼適當，仍可作用（例如試管中的唾液可以分解澱粉）。"},{id:"K27",ch:"3-2",kind:"key",star:1,src:"筆記 酸鹼值圖",q:"胃中的酵素適合在什麼環境下分解蛋白質？",o:["酸性","中性","鹼性","任何酸鹼值都可以"],a:0,e:"胃 → 酸性；唾液 → 中性；小腸 → 鹼性。"},{id:"K28",ch:"3-2",kind:"key",star:2,src:"課本 圖(四)",fig:"ph",q:"右圖為酸鹼性與人體內三種酵素活性的關係。在偏鹼性的環境中，活性最高的是哪一種酵素？",o:["小腸中的酵素","胃中的酵素","唾液中的酵素","三者一樣高"],a:0,e:"圖中最右邊（鹼性）的曲線是小腸中的酵素；最左邊（酸性）是胃；中間（中性）是唾液。"},{id:"K29",ch:"3-2",kind:"key",star:3,src:"素養題",q:"吞下的唾液進入胃後，唾液中的澱粉酶分解澱粉的活性會如何變化？",o:["降低，因為胃是酸性環境","升高，因為胃溫度較高","不變，酵素不受環境影響","升高，因為胃中有更多澱粉"],a:0,e:"唾液酵素在中性環境活性最佳；胃是酸性，所以活性大幅下降。"},{id:"K30",ch:"3-2",kind:"key",star:2,src:"講義 p.65 試題5",fig:"temp4",q:"右圖為甲、乙、丙、丁四種酵素活性與溫度的關係，哪一種酵素的耐熱程度最低？",o:["甲","乙","丙","丁"],a:0,e:"看曲線在哪個溫度「掉到 0」：甲大約 25°C 就失去活性，最早掉下來，最不耐熱。丙一路上升，最耐熱。"},{id:"K31",ch:"3-2",kind:"key",star:1,src:"課本 圖(五)",q:"人體內大多數酵素作用的最適溫度約為：",o:["37°C","0°C","60°C","100°C"],a:0,e:"人體酵素約 37°C 活性最佳；低於 37°C 活性較低，超過後活性下降。"},{id:"K32",ch:"3-2",kind:"key",star:3,src:"素養題",q:"人發高燒到 41°C 時會很不舒服，從酵素的角度看，主要原因是：",o:["體溫超過最適溫度，酵素活性降低，代謝無法正常進行","酵素活性升高太多","酵素變成了醣類","體內的水全部蒸發"],a:0,e:"課本：溫度超過 37°C，酵素活性反而降低，無法維持正常的代謝作用。"},{id:"K33",ch:"3-2",kind:"key",star:1,src:"講義 p.61 隨堂1",q:"科學家在火雞和鵝的砂囊中，發現可以分解碎肉和麥粒的液體，原因是砂囊的液體中含有：",o:["酵素","水","澱粉","糖"],a:0,e:"義大利生物學家斯巴蘭贊尼的發現，液體中的酵素可以分解食物。"},{id:"K34",ch:"3-2",kind:"key",star:2,src:"補充教材 酵素的發現",q:"下列配對何者正確？",o:["屈內 — 1878 年將它命名為「酵素（enzyme）」","斯巴蘭贊尼 — 命名酵素","沛因和貝索茲 — 發現砂囊液體","古埃及人 — 從大麥提煉分解澱粉的物質"],a:0,e:"斯巴蘭贊尼：砂囊液體；沛因和貝索茲：大麥提煉出分解澱粉的物質；屈內：1878 年命名 enzyme；古埃及人：野生酵母讓麵糰發酵。"},{id:"K35",ch:"3-2",kind:"key",star:3,src:"筆記 酵素特性②",q:"在澱粉分解實驗中加入更多的酵素，下列敘述何者正確？",o:["反應速率加快，但產物總量不會增加","產物總量會增加","反應速率變慢","酵素會被用完"],a:0,e:"筆記：酵素是催化劑，可以加速反應進行，但不增加產量。產物多少取決於受質（澱粉）有多少。"},{id:"K36",ch:"3-2",kind:"key",star:2,src:"筆記 酵素特性⑤",q:"下列何者<u>不是</u>影響酵素活性的因素？",o:["光線的顏色","溫度","酸鹼值","重金屬"],a:0,e:"筆記：溫度、酸鹼值、重金屬會影響酵素活性（因為酵素是蛋白質）。"},{id:"K37",ch:"3-3",kind:"key",star:1,src:"課本焦點2",q:"光合作用的原料是：",o:["水和二氧化碳","葡萄糖和氧氣","水和氧氣","澱粉和二氧化碳"],a:0,e:"原料：水（根吸收）＋ 二氧化碳（氣孔進入）。產物：葡萄糖、氧氣、水。"},{id:"K38",ch:"3-3",kind:"key",star:1,src:"筆記 反應式",q:"光合作用的反應式，下列何者正確？",o:["水＋二氧化碳 → 葡萄糖＋氧氣＋水","葡萄糖＋氧氣 → 水＋二氧化碳","水＋氧氣 → 葡萄糖＋二氧化碳","澱粉＋水 → 葡萄糖"],a:0,e:"筆記：水＋二氧化碳 →（陽光、葉綠體）→ 葡萄糖＋氧氣＋水。"},{id:"K39",ch:"3-3",kind:"key",star:1,src:"講義 p.73 試題4",q:"進行光合作用所需的動力（能量）來源是：",o:["日光","二氧化碳","水","葉綠素"],a:0,e:"葉綠素「吸收」光能，但能量本身來自日光。"},{id:"K40",ch:"3-3",kind:"key",star:1,src:"課本焦點2",q:"光合作用主要進行的細胞構造（反應場所）是：",o:["葉綠體","細胞核","細胞壁","液胞"],a:0,e:"主要反應器官是葉，反應場所是葉綠體（內含葉綠素）。"},{id:"K41",ch:"3-3",kind:"key",star:2,src:"講義 p.70 隨堂2",q:"有關光合作用的敘述，下列何者正確？",o:["植物可利用光能和二氧化碳製造養分","光合作用所需的氣體由根部進入","光合作用在晚上也可以進行","光合作用的主要目的是製造氧氣"],a:0,e:"二氧化碳由氣孔進入；需要光，晚上不行；主要目的是製造養分（葡萄糖），氧氣是附帶產物。"},{id:"K42",ch:"3-3",kind:"key",star:3,src:"課本 兩階段補充",q:"光合作用產生的氧氣，是由哪一種物質分解而來？",o:["水","二氧化碳","葡萄糖","葉綠素"],a:0,e:"光反應：葉綠素吸收光能，使「水」被分解產生氧氣，經氣孔排出。二氧化碳是在碳反應中轉換成葡萄糖。"},{id:"K43",ch:"3-3",kind:"key",star:2,src:"延伸學習 光反應與碳反應",q:"光合作用的「碳反應」是指：",o:["利用光反應的能量，把二氧化碳轉換成葡萄糖和水","吸收光能把水分解成氧氣","把葡萄糖分解產生能量","根部吸收水分"],a:0,e:"光反應：需光，水 → 氧氣。碳反應：用光反應的能量，二氧化碳 → 葡萄糖和水。"},{id:"K44",ch:"3-3",kind:"key",star:2,src:"補充教材 柳樹實驗",q:"凡赫芒的柳樹實驗：五年後柳樹重量增加為 33 倍多，土壤卻幾乎沒減少。他認為柳樹增加的物質來自：",o:["雨水","土壤","陽光","肥料"],a:0,e:"凡赫芒認為增加的物質由雨水「變」來的；他的重要創舉是用「定量」方法研究生物學問題。"},{id:"K45",ch:"3-3",kind:"key",star:2,src:"補充教材",q:"1897 年將「植物需要陽光照射才能合成所需養分」的現象命名為「光合作用」的是：",o:["德國科學家佩弗","比利時醫師凡赫芒","義大利斯巴蘭贊尼","德國屈內"],a:0,e:"佩弗命名光合作用；屈內命名酵素；凡赫芒是柳樹實驗。"},{id:"K46",ch:"3-3",kind:"key",star:2,src:"筆記 葉片構造③",q:"下列哪一種植物不行光合作用？",o:["菟絲子","玉米","水稻","向日葵"],a:0,e:"筆記：菟絲子（寄生）和水晶蘭（腐生）不行光合作用。"},{id:"K47",ch:"3-3",kind:"key",star:2,src:"實驗 3-3 步驟",q:"光與光合作用實驗中，照光後葉片的處理順序何者正確？",o:["沸水加熱 → 酒精隔水加熱 → 熱水漂洗 → 滴碘液","酒精隔水加熱 → 沸水加熱 → 滴碘液 → 熱水漂洗","滴碘液 → 沸水加熱 → 酒精隔水加熱","熱水漂洗 → 滴碘液 → 酒精隔水加熱"],a:0,e:"筆記流程：沸水（軟化角質層）→ 酒精隔水加熱（去除葉綠素）→ 熱水漂洗（去除酒精）→ 碘液檢測。"},{id:"K48",ch:"3-3",kind:"key",star:2,src:"實驗 3-3",q:"實驗中把葉片放入沸水加熱的目的是：",o:["使葉的角質層軟化","溶解葉綠素","檢測澱粉","增加葉片的澱粉"],a:0,e:"沸水 → 軟化角質層；酒精 → 溶解葉綠素；碘液 → 檢測澱粉。"},{id:"K49",ch:"3-3",kind:"key",star:1,src:"講義 p.74 試題14",q:"實驗中把葉片放在酒精中隔水加熱，加酒精的目的是：",o:["溶解葉綠素，方便觀察碘液顏色","酒精比水容易煮沸","酒精升溫比水快","保持葉片翠綠"],a:0,e:"酒精可溶解葉綠素，葉片褪色後，才看得清楚碘液的顏色變化。酒精因此變成綠色。"},{id:"K50",ch:"3-3",kind:"key",star:2,src:"實驗 3-3 說明",q:"實驗前要先將植株放在完全黑暗的環境約一週，目的是：",o:["消耗掉葉片原本儲存的澱粉","讓葉片長得更大","增加葉綠素","讓氣孔打開"],a:0,e:"先用掉原有澱粉，才能確定之後檢測到的澱粉是本次實驗中照光產生的。"},{id:"K51",ch:"3-3",kind:"key",star:1,src:"講義 p.72 隨堂3",q:"以剪有十字形圖樣的鋁箔包裹葉片，其目的是要證明光合作用需要：",o:["日光","水","二氧化碳","葉綠素"],a:0,e:"鋁箔「不透光」，十字鏤空處照得到光。比較照光和不照光的部位，證明需要日光。"},{id:"K52",ch:"3-3",kind:"key",star:2,src:"講義 p.73 試題9",fig:"foilLeaf",q:"先將盆栽放在暗室 3 天，再用長條鋁箔包住一片葉子的中段，放在陽光下 2～3 天後依標準步驟處理並滴碘液。葉片顏色為：",o:["中段黃褐色，兩端藍黑色","中段藍黑色，兩端黃褐色","整片藍黑色","整片黃褐色"],a:0,e:"中段被鋁箔遮住 → 沒光 → 沒澱粉 → 黃褐色。兩端照光 → 有澱粉 → 藍黑色。"},{id:"K53",ch:"3-3",kind:"key",star:2,src:"講義 p.74 試題13",q:"溶解葉綠素的正確裝置為何？",o:["葉片放入裝酒精的小燒杯，小燒杯再放進裝水的大燒杯中加熱","葉片放入裝水的小燒杯，小燒杯再放進裝酒精的大燒杯中加熱","葉片和酒精一起放在大燒杯中直接加熱","葉片放在水中，酒精倒在燒杯外側"],a:0,e:"葉片要泡在「酒精」裡，酒精杯放在「水」裡加熱（隔水加熱），避免酒精著火。"},{id:"K54",ch:"3-3",kind:"key",star:1,src:"講義 p.74 試題15",q:"小華的褲子沾到草的綠色汁液，用什麼方法最容易洗掉？",o:["用酒精清洗","用自來水洗","用沸水清洗","用肥皂水清洗"],a:0,e:"綠色是葉綠素，酒精可以溶解葉綠素。"},{id:"K55",ch:"3-3",kind:"key",star:2,src:"講義 p.74 試題10",q:"在光合作用實驗中，用下列哪一種方式處理葉片，與用鋁箔包裹的結果相同？",o:["用黑色紙包裹葉片","用透明塑膠袋包裹葉片","用蠟塗抹葉柄","用透光的玻璃罩住整株植物"],a:0,e:"鋁箔的作用是不透光。黑色紙也不透光，結果相同。透明的東西會透光。"},{id:"K56",ch:"3-3",kind:"key",star:3,src:"講義 p.73 試題7",fig:"lightco2",q:"右圖為光合作用速率與光強度、二氧化碳濃度的關係。將植物放在哪一種條件下生長情形最好？",o:["二氧化碳約 0.10%，強光","二氧化碳低於 0.05%，強光","二氧化碳約 0.10%，普通光度","二氧化碳約 0.2%，弱光"],a:0,e:"強光曲線最高。強光曲線在 0.10% 左右已接近最高點，比 0.05% 高很多。弱光就算二氧化碳再多，速率也只有 40% 左右。"},{id:"K57",ch:"3-3",kind:"key",star:1,src:"講義 p.72 試題3",q:"綠色植物<u>無法</u>自己製造出下列哪一種物質？",o:["礦物質","澱粉","葡萄糖","維生素"],a:0,e:"礦物質要由根從土壤吸收。葡萄糖、澱粉、維生素都可以自己製造。"},{id:"K58",ch:"3-3",kind:"key",star:2,src:"講義 p.69 隨堂1",q:"葉片中，下列哪兩種細胞含有葉綠體、可以行光合作用？",o:["葉肉細胞和保衛細胞","表皮細胞和葉肉細胞","表皮細胞和保衛細胞","只有葉脈細胞"],a:0,e:"表皮細胞透明、無葉綠體；葉肉細胞和保衛細胞都有葉綠體。"},{id:"K59",ch:"3-3",kind:"key",star:2,src:"素養題",q:"把水草放在裝水的燒杯中照強光，水草表面不斷冒出小氣泡。這些氣泡主要是：",o:["氧氣","二氧化碳","水蒸氣","氮氣"],a:0,e:"光合作用產生氧氣，由水分解而來，從葉片釋放出來形成氣泡。"},{id:"K60",ch:"3-3",kind:"key",star:3,src:"素養題",q:"溫室栽培番茄的農夫想提高產量，下列哪一個做法最合理？",o:["適度提高溫室內二氧化碳濃度，並給予充足光照","把溫室完全遮黑","降低二氧化碳濃度","把氣孔塗上凡士林"],a:0,e:"光和二氧化碳都是光合作用的條件，兩者充足時光合作用速率較快，製造的養分多。"},{id:"K61",ch:"3-3",kind:"key",star:2,src:"課本 重要性",q:"綠色植物行光合作用對地球環境的重要性，下列何者正確？",o:["吸收二氧化碳並釋出氧氣，穩定大氣成分","吸收氧氣並釋出二氧化碳","製造礦物質供動物利用","使土壤中的水分增加"],a:0,e:"光合作用吸收 CO₂、釋放 O₂，穩定大氣並提供生物呼吸所需的氧氣。"},{id:"K62",ch:"3-3",kind:"key",star:2,src:"實驗 3-3 說明",q:"光合作用實驗用碘液檢測葉片，原因是：",o:["光合作用產生的葡萄糖會轉換成澱粉儲存在葉片中","碘液可以測出氧氣","碘液可以測出葉綠素","碘液可以測出二氧化碳"],a:0,e:"葡萄糖轉成澱粉儲存在葉片，所以用碘液測澱粉，就能判斷有沒有行光合作用。"}],window.LNOTES={"3-1":[{h:"一、營養素",items:[["可產生能量",'<b class="r">醣類</b>：又稱碳水化合物，主要能量來源（米飯、麵包）<span class="kcal">1g＝4大卡</span>'],["",'<b class="r">蛋白質</b>：構成身體主要成分，具多種功能（豆、蛋、奶、肉）<span class="kcal">1g＝4大卡</span>'],["",'<b class="r">脂質</b>：可產生大量能量，保暖、保護內臟（油脂、奶油）<span class="kcal">1g＝9大卡</span>'],["不能產生能量","<b>水</b>：身體中最多的物質（約 70%）"],["",'<b class="r">維生素</b>（維他命）、<b class="r">礦物質</b>（鈣、鐵）→ 調節生理機能']]},{h:"二、缺乏導致的疾病",items:[["維生素 A","夜盲症，嚴重會失明"],["維生素 C",'<b class="r">壞血病</b>（皮下出血、牙齦出血）；又叫抗壞血酸'],["維生素 D",'軟骨症；又叫<b class="r">陽光維生素</b>'],["鈣、磷","骨質疏鬆（骨頭與牙齒的成分）"],["鐵","貧血（無法合成血紅素）"]]},{h:"三、熱量計算",items:[["卡路里",'<b class="r">1 卡</b>：1 公克水上升 1°C 的能量；<b class="r">1 大卡＝1000 卡</b>'],["例題",'醣 23g×4＝92；蛋白質 5g×4＝20；脂質 8g×9＝72；鈉×0 → <b class="r">184 大卡</b>']]},{h:"四、食物的養分測定",items:[["澱粉",'<b class="r">碘液</b>：黃褐色（無）→ <b class="b">藍黑色</b>（有澱粉）　例：米飯'],["葡萄糖",'<b class="r">本氏液</b>＋<b class="b">隔水加熱</b>：淡藍（無）→ 綠（少）→ 黃 → 橙 → 紅（多）　例：水果'],["★ 不加熱","本氏液沒加熱，有糖也不會變色，都維持淡藍"],["★ 纖維素","屬醣類，組成植物細胞壁；人體不能消化 → 促進腸道蠕動、防便祕"]]}],"3-2":[{h:"一、酵素的特性",items:[["①",'又稱為<b class="r">酶</b>，成分主要是<b class="r">蛋白質</b>'],["②",'可以<b class="r">加速反應</b>進行，作為<b class="r">催化劑</b><span class="kcal">不增加產量</span>'],["③",'和<b class="r">受質</b>發生反應，具<b class="r">專一性</b>　例：澱粉酶、蛋白酶'],["④",'反應前後酵素<b class="r">不會用完</b> → 可重複使用'],["分解／合成",'分解：<b class="r">大分子 → 小分子</b>；合成：<b class="r">小分子 → 大分子</b>'],["★ 代謝作用","分解作用＋合成作用＝代謝作用"]]},{h:"二、影響酵素活性",items:[["⑤",'<b class="r">溫度、酸鹼值、重金屬</b>會影響酵素活性'],["酸鹼值",'<b>胃液</b>：酸性　<b class="r">唾液</b>：中性（pH 7）　<b class="b">腸液</b>：鹼性'],["溫度","37°C 最適；溫度↑活性↑，超過 37°C 溫度↑活性↓"],["低溫",'<b class="b">暫時失活</b>（回溫可恢復）　例：冰箱保存食物'],["高溫",'約 45～50°C 以上 <b class="r">永久失活</b>　例：高溫殺菌']]},{h:"三、實驗：溫度對唾液分解澱粉（p.80）",items:[["試管","甲：澱粉＋唾液　乙：澱粉＋水　丙：澱粉＋唾液（90°C）→ 37°C 15 分鐘"],["本氏液","甲：紅橙黃綠（有糖）　乙、丙：淡藍（無糖）"],["碘液","甲：黃褐（澱粉沒了）　乙、丙：藍黑（澱粉還在）"],["原理","澱粉 →（唾液中的澱粉酶）→ 糖"]]}],"3-3":[{h:"一、葉片構造（p.82）",items:[["①",'葉是植物行<b class="r">光合作用</b>的主要場所'],["角質層","防止水分散失"],["表皮細胞",'透明，<b class="r">無葉綠體</b>（不行光合作用）'],["葉肉細胞",'可進行<b class="r">光合作用</b>產生養分'],["葉脈",'運輸<b class="r">養分和水分</b>'],["氣孔",'由<b class="r">保衛細胞</b>構成，陸生植物位於下表皮，是<b class="r">氣體進出的通道</b>'],["③",'不行光合作用的植物：<b class="r">菟絲子</b>（寄生）、<b class="r">水晶蘭</b>（腐生）']]},{h:"二、光合作用",items:[["①",'綠色植物利用光合作用產生<b class="r">養分（葡萄糖）</b>'],["反應式",'水＋二氧化碳 —陽光、葉綠體→ <b class="r">葡萄糖＋氧氣＋水</b>'],["光反應",'吸收陽光，把來自根部的<b class="r">水分解成氧氣</b>'],["碳反應",'用光反應的能量，把<b class="r">二氧化碳</b>轉成葡萄糖和水'],["轉換",'葡萄糖 → <b class="b">澱粉</b>（也可轉成蛋白質、脂質，例如花生油）']]},{h:"三、實驗：光與光合作用",items:[["步驟",'鋁箔包葉（<b class="r">不透光</b>）一週 → 沸水（軟化角質層）→ 酒精隔水加熱（去除葉綠素）→ 熱水漂洗（去除酒精）→ 碘液檢測'],["結果",'照光處 <b class="b">藍黑色</b>（有澱粉）；包鋁箔處 <b>黃褐色</b>（無澱粉）'],["⚠ 筆記更正",'筆記上鋁箔旁寫「透光」，應為<b class="r">不透光</b>'],["★ 實驗前","先放黑暗處約一週，消耗原有的澱粉"]]}]}
</script>
