name: progress-cloud-keepalive
# 每 3 天呼叫一次雲端進度資料庫，避免免費方案閒置 7 天被暫停；也順便檢查同步功能正常
on:
  schedule:
    - cron: "17 3 */3 * *"
  push:
    paths: [".github/workflows/keepalive.yml"]
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: check cloud progress API
        env:
          API: https://lmdxdwkgdiccsgytambx.supabase.co/rest/v1/rpc
          KEY: sb_publishable_Np_R4cgqHCbGWx0f1zlC5g_6v6RZJdj
        run: |
          set -e
          H=(-H "apikey: $KEY" -H "Content-Type: application/json")
          echo "rev of yifan-science:"; curl -sf "${H[@]}" -d '{"p_k":"yifan-science-L5u8vJ6NqlqBwfEfrXSLd-41"}' "$API/get_rev"; echo
          T="healthcheck-$(date +%s)-0000000000000000"
          R=$(curl -sf "${H[@]}" -d "{\"p_k\":\"$T\",\"p_data\":{\"ok\":1},\"p_base\":0}" "$API/put_progress"); echo "put: $R"; echo "$R" | grep -q '"ok" *: *true'
          G=$(curl -sf "${H[@]}" -d "{\"p_k\":\"$T\"}" "$API/get_progress"); echo "get: $G"; echo "$G" | grep -q '"ok" *: *1'
          C=$(curl -s -o /dev/null -w "%{http_code}" -X OPTIONS -H "Origin: https://dreamchiz.github.io" -H "Access-Control-Request-Method: POST" -H "Access-Control-Request-Headers: apikey,content-type" "$API/get_rev"); echo "cors preflight: $C"; test "$C" -lt 300
