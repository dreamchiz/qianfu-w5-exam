<title>千賦 Unit 1–2 單字複習</title>
<style>
*{-webkit-box-sizing:border-box;-moz-box-sizing:border-box;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:#fff7ee;color:#2a2733;font:17px/1.6 -apple-system,"PingFang TC","Heiti TC","Noto Sans TC","Microsoft JhengHei",sans-serif;-webkit-text-size-adjust:100%}
#app{max-width:680px;margin:0 auto;padding:0 16px 120px}
button{font:inherit;color:inherit;cursor:pointer;-webkit-appearance:none}
.hide{display:none!important}
.btn{display:block;width:100%;min-height:52px;margin:10px 0;padding:10px 16px;border:2px solid #eee2d3;border-radius:14px;background:#fff;font-weight:bold;font-size:17px}
.btn.pri{background:#ff7a45;border-color:#ff7a45;color:#fff}
.btn.big{font-size:19px;min-height:62px}
.btn.ghost{background:transparent;border-color:transparent;color:#6f6a7c}
.btn small{display:block;font-weight:normal;font-size:13px;opacity:.85}
.bar{position:relative;margin:0 -16px 12px;padding:10px 16px;background:#fff7ee;border-bottom:1px solid #eee2d3;min-height:52px;line-height:32px}
.back{border:0;background:#fff;border-radius:12px;padding:4px 12px;font-weight:bold;box-shadow:0 2px 6px rgba(80,50,20,.12);margin-right:8px}
.bt{font-weight:bold;font-size:18px}
.qn{float:right;color:#6f6a7c;font-size:15px}
.hero{text-align:center;padding:22px 0 6px}
.h-sm{color:#e8602b;font-weight:bold;letter-spacing:1px}
.h-big{font-size:26px;font-weight:bold;margin:4px 0}
.sub{color:#6f6a7c;font-size:15px}
.card{background:#fff;border-radius:18px;padding:14px 16px;margin:12px 0;box-shadow:0 2px 10px rgba(80,50,20,.08)}
.ucard{display:block;width:100%;text-align:left;border:2px solid #eee2d3;background:#fff;border-radius:18px;padding:14px 16px;margin:12px 0}
.ucard .ue{float:left;font-size:40px;line-height:52px;margin-right:12px}
.ucard b{font-size:20px}
.ucard .us{display:block;color:#6f6a7c;font-size:14px}
.prog{height:10px;background:#eee2d3;border-radius:5px;margin:8px 0 2px;overflow:hidden;clear:both}
.prog div{height:10px;background:#22a05b}
.tabs{clear:both;margin:0 -1% 6px;text-align:center;white-space:nowrap}
.tab{display:inline-block;width:31.3%;margin:0 1%;min-height:50px;border:2px solid #eee2d3;border-radius:14px;background:#fff;font-weight:bold;font-size:16px;padding:6px 2px}
.tab.on{background:#ff7a45;border-color:#ff7a45;color:#fff}
.tool{text-align:right;margin:4px 0}
.chip{display:inline-block;border:2px solid #eee2d3;background:#fff;border-radius:20px;padding:4px 12px;font-size:14px;font-weight:bold;margin-left:6px}
.chip.on{background:#fff0e2;border-color:#ffb48f;color:#c2410c}
.pnum{display:inline-block;background:#ff7a45;color:#fff;border-radius:12px;padding:0 10px;font-weight:bold;font-size:14px;margin-right:6px}
.phead{margin-bottom:6px;line-height:36px}
.pplay{float:right;border:0;background:#ff7a45;color:#fff;border-radius:12px;padding:4px 14px;font-weight:bold;font-size:15px}
.sen{padding:8px 0;border-top:1px dashed #f0e4d6}
.sen:first-of-type{border-top:0}
.en{font-size:20px;line-height:1.75}
.zh{color:#6f6a7c;font-size:16px;margin-top:2px}
.ssp{border:0;background:#fff0e2;border-radius:10px;padding:0 8px;font-size:16px;margin-right:6px;vertical-align:1px;min-height:30px}
.note{margin:8px 0 0;padding:8px 12px;background:#eef5ff;border-radius:12px;font-size:15px}
.wd{border-bottom:1px dotted #c9b9a6;cursor:pointer}
.wd.kw{background:#fff1a8;font-weight:bold;border-bottom:2px solid #ff7a45;padding:0 2px;border-radius:4px}
.wd.nb{background:#e3f6e9;border-bottom:2px solid #22a05b}
.wd.kw.nb{background:#fff1a8}
.wd.sel{background:#ffd9c4}
.lab{display:inline-block;margin:4px 6px 4px 0;padding:4px 10px;background:#fffaf3;border:1px solid #f0e4d6;border-radius:10px;font-size:17px}
.lab i{font-style:normal;color:#6f6a7c;font-size:14px}
.dlg{margin:6px 0;padding:8px 12px;border-radius:14px;background:#fffaf3}
.dlg.b{background:#eef5ff;margin-left:30px}
.kc{background:#fff;border-radius:18px;padding:12px 14px;margin:12px 0;box-shadow:0 2px 10px rgba(80,50,20,.08)}
.kc .ke{float:right;font-size:34px;line-height:40px}
.kw1{font-size:28px;font-weight:bold;cursor:pointer}
.kw1 i{font-style:normal;font-size:15px;color:#6f6a7c;font-weight:normal;margin-left:6px}
.kz{font-size:19px;margin:2px 0}
.sy{font-family:Menlo,Courier,monospace;color:#c2410c;font-size:17px;letter-spacing:1px}
.tip{font-size:14px;color:#6f6a7c;margin:2px 0}
.kex{margin-top:8px;padding:8px 10px;background:#fffaf3;border-radius:12px;font-size:17px;line-height:1.7}
.kex .zh{font-size:14px}
.kbtn{display:inline-block;border:0;background:#fff0e2;color:#c2410c;border-radius:12px;padding:6px 12px;margin:6px 6px 0 0;font-weight:bold;font-size:15px;min-height:38px}
.kbtn.g{background:#e3f6e9;color:#167a43}
.stars{color:#f5a623;font-size:16px;letter-spacing:1px}
.stars .o{color:#e2d6c6}
#pop{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:0 12px 12px}
.popin{max-width:520px;margin:0 auto;background:#fff;border-radius:18px;padding:16px;box-shadow:0 -4px 24px rgba(0,0,0,.25)}
.popw{font-size:30px;font-weight:bold}
.popw .spk{font-size:20px;vertical-align:4px}
.popl{color:#6f6a7c;font-size:15px}
.popz{font-size:22px;margin:4px 0}
.popz i{font-style:normal;color:#6f6a7c;font-size:15px;margin-right:6px}
.popk{display:inline-block;background:#fff1a8;color:#7a4b00;border-radius:10px;padding:0 8px;font-size:13px;font-weight:bold;vertical-align:6px}
.spk{border:0;background:#fff0e2;border-radius:10px;padding:2px 10px;font-size:18px}
.pbtns{margin:8px -1% 0}
.pbtns .btn{display:inline-block;width:48%;margin:4px 1%;min-height:48px;font-size:16px}
.btn.nbadd{background:#22a05b;border-color:#22a05b;color:#fff}
#toast{position:fixed;left:16px;right:16px;top:-80px;z-index:30;text-align:center;background:#2a2733;color:#fff;border-radius:14px;padding:12px;-webkit-transition:top .25s;transition:top .25s}
#toast.show{top:16px}
.qcard{background:#fff;border-radius:20px;padding:18px 16px;box-shadow:0 2px 10px rgba(80,50,20,.08);position:relative;text-align:center}
.qcard.wrong{border:3px solid #e5484d}
.qtype{display:inline-block;background:#fff0e2;color:#c2410c;border-radius:10px;padding:2px 10px;font-size:14px;font-weight:bold;margin-bottom:6px}
.qe{font-size:46px;line-height:1.2}
.qbig{font-size:36px;font-weight:bold;margin:4px 0;word-wrap:break-word}
.qzh{font-size:24px;font-weight:bold;margin:4px 0}
.qzh i{font-style:normal;font-size:15px;color:#6f6a7c;font-weight:normal}
.hint{font-family:Menlo,Courier,monospace;font-size:28px;font-weight:bold;letter-spacing:4px;margin:8px 0;color:#2a2733;white-space:nowrap}
.hint.sm{font-size:18px;letter-spacing:0}
.bigspk{border:0;background:#ff7a45;color:#fff;border-radius:16px;padding:8px 18px;font-size:20px;font-weight:bold;margin:6px 4px}
.bigspk.l{background:#fff0e2;color:#c2410c}
input[type=text]{display:block;width:100%;font-size:26px;padding:12px 14px;margin:12px 0 4px;border:2px solid #eee2d3;border-radius:14px;background:#fff;-webkit-appearance:none;text-align:center;font-family:Menlo,Courier,monospace}
.wt{color:#e5484d;font-weight:bold;font-size:20px;margin-bottom:6px}
.ua{font-size:24px;font-weight:bold;font-family:Menlo,Courier,monospace;letter-spacing:1px}
.ua .bad{color:#e5484d;text-decoration:underline}
.ca{font-size:30px;font-weight:bold;color:#22a05b;font-family:Menlo,Courier,monospace;letter-spacing:1px}
.okflash{position:absolute;left:0;right:0;top:35%;text-align:center;font-size:30px;font-weight:bold;color:#22a05b;background:rgba(230,247,237,.96);padding:16px;border-radius:16px;margin:0 16px}
.prog2{height:8px;background:#eee2d3;border-radius:4px;margin:-4px 0 10px;overflow:hidden}
.prog2 div{height:8px;background:#ff7a45}
.phase{font-size:14px;color:#6f6a7c;text-align:center;margin:-4px 0 8px}
.celebrate{margin:10px 0;padding:16px;background:#fff1a8;border-radius:16px;font-size:24px;font-weight:bold;text-align:center;-webkit-animation:pop .6s ease;animation:pop .6s ease}
@-webkit-keyframes pop{0%{-webkit-transform:scale(.6)}70%{-webkit-transform:scale(1.08)}100%{-webkit-transform:scale(1)}}
@keyframes pop{0%{transform:scale(.6)}70%{transform:scale(1.08)}100%{transform:scale(1)}}
.rl{padding:8px 2px;border-top:1px solid #f3e9dc;font-size:17px}
.rl:first-child{border-top:0}
.rl .x{float:right;border:0;background:transparent;color:#a7a1b3;font-size:18px;padding:0 6px}
.rl small{color:#6f6a7c}
.empty{text-align:center;color:#a7a1b3;padding:20px 0}
.tapinfo{font-size:13px;color:#a7a1b3;text-align:center;margin:4px 0}
.leg span{display:inline-block;margin-right:10px;font-size:13px;color:#6f6a7c}
.leg b{display:inline-block;width:14px;height:14px;border-radius:3px;vertical-align:-2px;margin-right:3px}
</style>

      h+='<div class="card"><div class="phead"><span class="pnum">對話</span><button class="pplay" data-act="play" data-a="'+b.a+'">🔊 朗讀</button></div>';
      for(j=0;j<b.s.length;j++){var d=b.s[j];
        h+='<div class="dlg'+(j%2?' b':'')+'"><div class="en"><button class="ssp" data-act="play" data-a="'+d.a+'">🔊</button>'+rTok(d.t,[u,i,j])+'</div>'+(S.zh?'<div class="zh">'+esc(d.z)+'</div>':'')+'</div>';}
      h+='</div>';
    }}
  h+='<div class="tapinfo">黃色是課本螢光筆重點字 ・ 點任何字都能查</div>';
  return h;
}
function rKeys(u){
  var h='<div class="tapinfo">依課本出現順序 ・ 點「🔤 拼讀」會一個字母一個字母唸</div>',i,ids=KIDS[u];
  for(i=0;i<ids.length;i++){var I=info('k:'+ids[i]),s=sentOf(I.ex);
    h+='<div class="kc"><span class="ke">'+I.e+'</span><div class="kw1" data-act="say" data-w="'+esc(I.w)+'">'+esc(I.w)+'<i>'+esc(I.p)+'</i></div>'
      +'<div class="kz">'+esc(I.z)+'</div><div class="sy">'+esc(I.sy)+'</div><div class="tip">💡 '+esc(I.tip)+(I.f.length?'　課文：'+esc(I.f.join(', ')):'')+'</div>'
      +'<button class="kbtn" data-act="say" data-w="'+esc(I.w)+'">🔊 發音</button><button class="kbtn" data-act="spell" data-w="'+esc(I.w)+'">🔤 拼讀</button>'
      +'<span style="float:right;line-height:44px">'+starHtml(stars(I.ref))+'</span>'
      +'<div class="kex"><button class="ssp" data-act="play" data-a="'+s.a+'">🔊</button>'+rTok(s.t,I.ex,I.ref)+'<div class="zh">'+esc(s.z)+'</div></div></div>';}
  return h;
}
function rPracMenu(u){
  var ids=KIDS[u],weak=0,i;for(i=0;i<ids.length;i++)if(stars('k:'+ids[i])<3)weak++;
  var h='<div class="card"><div class="sub">每個字都會：<br>① 聽發音、看拼法、照著打一次<br>② 看提示（部分字母）拼出來<br>③ 只聽發音＋看中文，自己拼出來<br>拼錯的字會再回來，直到全部拼對為止。</div></div>';
  h+='<button class="btn pri big" data-act="prac" data-src="u'+u+'" data-mode="full">✏️ 完整練習（'+ids.length+' 個字）<small>聽 → 提示拼 → 聽寫</small></button>';
  h+='<button class="btn big" data-act="prac" data-src="u'+u+'" data-mode="dict">🎧 聽寫挑戰（'+ids.length+' 個字）<small>只聽寫，錯的重來到全對</small></button>';
  if(weak&&weak<ids.length)h+='<button class="btn big" data-act="prac" data-src="w'+u+'" data-mode="full">💪 只練還沒三顆星的字（'+weak+' 個）</button>';
  return h;
}

function rNB(){
  var h=bar('📒 我的生字本',S.list.length+' 個'),i;
  if(!S.list.length)return h+'<div class="card empty">還沒有生字。<br>在課文裡點一個字，按「➕ 加入生字本」就會出現在這裡。</div>';
  h+='<button class="btn pri big" data-act="prac" data-src="nb" data-mode="full">✏️ 練習生字本拼寫（'+S.list.length+' 個）</button>';
  h+='<div class="card">';
  for(i=S.list.length-1;i>=0;i--){var ref=S.list[i],I=info(ref),e=S.nb[ref];
    h+='<div class="rl"><button class="x" data-act="nbx" data-r="'+esc(ref)+'">✕</button><button class="spk" data-act="say" data-w="'+esc(I.w)+'">🔊</button> <b>'+esc(I.w)+'</b>'+(I.key?' <span class="popk">⭐</span>':'')+' <small>'+esc(I.p)+'</small> '+esc(I.z)+' '+starHtml(stars(ref));
    if(e&&e.ctx){var s=sentOf(e.ctx);h+='<div class="kex"><button class="ssp" data-act="play" data-a="'+s.a+'">🔊</button>'+rTok(s.t,e.ctx,ref)+'<div class="zh">'+esc(s.z)+'</div></div>';}
    h+='</div>';}
  return h+'</div>';
}

/* ===== 拼寫練習（不是考試：錯了就看、再打，直到全對） ===== */
var P=null;
function startPrac(src,mode){
  var refs=[],i,u;
  if(src==='all'){for(u=1;u<=2;u++)for(i=0;i<KIDS[u].length;i++)refs.push('k:'+KIDS[u][i]);}
  else if(src==='nb')refs=S.list.slice();
  else{u=+src.charAt(1);for(i=0;i<KIDS[u].length;i++){var r='k:'+KIDS[u][i];if(src.charAt(0)==='u'||stars(r)<3)refs.push(r);}}
  if(!refs.length){toast('沒有要練習的字');return;}
  P={src:src,mode:mode,refs:refs,q:[],wrong:{},first:{},dwrong:{},total:0,back:V};
  var ph=mode==='full'?['learn','hint','dict']:['dict'];
  var j;for(j=0;j<ph.length;j++){var part=(ph[j]==='learn')?refs.slice():shuffle(refs.slice());for(i=0;i<part.length;i++)P.q.push({ref:part[i],ph:ph[j]});}
  P.total=P.q.length;
  go({scr:'prac'});sayCur();
}
function curQ(){return P.q[0];}
function sayCur(){var q=curQ();if(q)playWord(info(q.ref).w);}
function hintPat(w){
  var out='',i,c,letters=[];for(i=0;i<w.length;i++)if(/[a-z]/i.test(w.charAt(i)))letters.push(i);
  var show={};show[letters[0]]=1;
  var others=shuffle(letters.slice(1)),keep=Math.floor(letters.length/2)-1;
  for(i=0;i<keep&&i<others.length;i++)show[others[i]]=1;
  for(i=0;i<w.length;i++){c=w.charAt(i);out+=(c===' ')?'　':(show[i]?c:'_');out+=' ';}
  return out;
}
function blankPat(w){var out='',i,c;for(i=0;i<w.length;i++){c=w.charAt(i);out+=(c===' ')?'　 ':'_ ';}return out;}
var PH_NAME={learn:'① 聽＆照著打',hint:'② 看提示拼',dict:'③ 聽寫',fix:'✍️ 訂正：照著打一次'};
function rPrac(){
  var h='<div id="ptop">'+pTop()+'</div><div class="qcard" id="qc"><div id="qbody">'+pBody()+'</div>';
  h+='<input type="text" id="ans" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="在這裡打英文">';
  h+='<button class="btn pri big" data-act="check">確定</button></div>';
  return h;
}
function pTop(){var q=curQ(),done=P.total-P.q.length;
  return bar('✏️ 拼寫練習',(done+1)+' / '+P.total)+'<div class="prog2"><div style="width:'+Math.round(done*100/P.total)+'%"></div></div><div class="phase">'+PH_NAME[q.ph]+'</div>';}
function pBody(){
  var q=curQ(),I=info(q.ref),h='';
  if(q.ph==='fix'){
    h+='<div class="wt">差一點！看清楚再打一次</div><div class="sub">你打的</div><div class="ua">'+diffHtml(q.ua,I.w)+'</div><div class="sub" style="margin-top:6px">正確拼法</div><div class="ca">'+esc(I.w)+'</div>'
      +(I.sy?'<div class="sy">'+esc(I.sy)+'</div>':'')+'<div class="qzh">'+esc(I.z)+'</div>'+(I.tip?'<div class="tip">💡 '+esc(I.tip)+'</div>':'');
  }else{
    if(I.e)h+='<div class="qe">'+I.e+'</div>';
    if(q.ph==='learn'){h+='<div class="qbig">'+esc(I.w)+'</div>'+(I.sy?'<div class="sy">'+esc(I.sy)+'</div>':'');}
    h+='<div class="qzh"><i>'+esc(I.p)+'</i> '+esc(I.z)+'</div>';
    if(q.ph==='learn'&&I.tip)h+='<div class="tip">💡 '+esc(I.tip)+'</div>';
    if(q.ph==='hint'){if(!q.pat)q.pat=hintPat(I.w);h+='<div class="hint'+(I.w.length>9?' sm':'')+'">'+esc(q.pat)+'</div>';}
    if(q.ph==='dict')h+='<div class="hint'+(I.w.length>9?' sm':'')+'">'+blankPat(I.w)+'</div><div class="sub">'+I.w.replace(/ /g,'').length+' 個字母'+(I.w.indexOf(' ')>=0?'（兩個字）':'')+'</div>';
  }
  h+='<div><button class="bigspk" data-act="say" data-w="'+esc(I.w)+'">🔊 再聽一次</button>'+((q.ph==='learn'||q.ph==='fix')?'<button class="bigspk l" data-act="spell" data-w="'+esc(I.w)+'">🔤 拼讀</button>':'')+'</div>';
  return h;
}
function updPrac(){
  if(!$('ans')){render();return;}
  $('ptop').innerHTML=pTop();$('qbody').innerHTML=pBody();$('qc').className='qcard'+(curQ().ph==='fix'?' wrong':'');
  var inp=$('ans');inp.value='';try{inp.focus();}catch(e){}
}
function diffHtml(ua,ans){var h='',i,a=ua||'',b=ans.toLowerCase();for(i=0;i<a.length;i++){var c=a.charAt(i);h+=(b.charAt(i)===c.toLowerCase())?esc(c):'<span class="bad">'+esc(c)+'</span>';}if(!a)h='<span class="bad">（空白）</span>';else if(a.length<b.length)h+='<span class="bad">…</span>';return h;}
function okAns(ref,v){var I=info(ref),a=norm(v),w=norm(I.w);if(a===w)return true;if(a.replace(/ /g,'')===w.replace(/ /g,'')&&ref==='k:heat_wave')return true;return false;}
var busy=false;
function check(){
  if(busy)return;var inp=$('ans');if(!inp)return;var v=inp.value;
  if(!norm(v)){toast('先打字再按確定');return;}
  var q=curQ(),ok=okAns(q.ref,v);
  if(ok){
    if(q.ph==='dict'&&!P.dwrong[q.ref]&&!P.first[q.ref]){P.first[q.ref]=1;S.st[q.ref]=Math.min(3,stars(q.ref)+1);save();}
    var f=document.createElement('div');f.className='okflash';f.innerHTML='✔ '+(q.ph==='fix'?'記住了！':'答對了！');$('qbody').appendChild(f);
    playWord(info(q.ref).w);busy=true;
    setTimeout(function(){busy=false;P.q.shift();nextQ();},750);
  }else{
    if(q.ph==='learn'){toast('照著上面的拼法打一次喔');inp.value='';return;}
    if(q.ph==='fix'){toast('再看一次正確拼法');inp.value='';return;}
    P.wrong[q.ref]=(P.wrong[q.ref]||0)+1;
    P.q.shift();
    P.q.unshift({ref:q.ref,ph:'fix',ua:v});P.total++;
    if(q.ph==='dict'){
      if(!P.dwrong[q.ref]&&!P.first[q.ref]&&stars(q.ref)>0){S.st[q.ref]=stars(q.ref)-1;save();}
      P.dwrong[q.ref]=1;
      var pos=Math.min(P.q.length,3+Math.floor(Math.random()*3));P.q.splice(pos,0,{ref:q.ref,ph:'dict'});P.total++;
    }
    updPrac();playWord(info(q.ref).w);
  }
}
function nextQ(){if(!P.q.length){go({scr:'done'});return;}updPrac();var q=curQ();if(q.ph!=='fix')sayCur();}
function rDone(){
  var h=bar('🎉 練習完成',''),i,n=0;
  for(i=0;i<P.refs.length;i++)if(!P.wrong[P.refs[i]])n++;
  h+='<div class="celebrate">🎉 '+P.refs.length+' 個字全部拼對了！</div>';
  h+='<div class="card"><div class="sub">一次就拼對：'+n+' 個 ・ 拼錯後訂正：'+(P.refs.length-n)+' 個</div>';
  for(i=0;i<P.refs.length;i++){var I=info(P.refs[i]);
    h+='<div class="rl"><button class="spk" data-act="say" data-w="'+esc(I.w)+'">🔊</button> <b>'+esc(I.w)+'</b> '+esc(I.z)+' '+starHtml(stars(I.ref))+(P.wrong[I.ref]?' <small style="color:#e5484d">錯 '+P.wrong[I.ref]+' 次</small>':'')+'</div>';}
  h+='</div><button class="btn pri big" data-act="again">🔁 再練一次</button><button class="btn big" data-act="back">回上一頁</button>';
  return h;
}

/* ===== 事件 ===== */
function findAct(el){while(el&&el!==document.body){if(el.getAttribute&&(el.getAttribute('data-act')||el.getAttribute('data-t')))return el;el=el.parentNode;}return null;}
document.addEventListener('click',function(ev){
  var el=findAct(ev.target);
  if(!el){if(!$('pop').contains(ev.target))closePop();return;}
  var t=el.getAttribute('data-t');
  if(t!==null&&t!==''&&!el.getAttribute('data-act')){openPop(TOKS[+t]);return;}
  var a=el.getAttribute('data-act');
  if(a==='say'){playWord(el.getAttribute('data-w'));return;}
  if(a==='spell'){spellOut(el.getAttribute('data-w'));return;}
  if(a==='play'){play(el.getAttribute('data-a'),'');return;}
  if(a==='close'){closePop();return;}
  if(a==='nbadd'){nbAdd(popRef,popTok);toast('已加入生字本 📒');var keep=popTok;rerenderKeep(keep);return;}
  if(a==='nbdel'){nbDel(popRef);toast('已從生字本移除');rerenderKeep(popTok);return;}
  if(a==='nbx'){nbDel(el.getAttribute('data-r'));render();return;}
  if(a==='unit'){go({scr:'unit',u:+el.getAttribute('data-u'),tab:'text'});return;}
  if(a==='tab'){V.tab=el.getAttribute('data-tab');render();window.scrollTo(0,0);return;}
  if(a==='zh'){S.zh=S.zh?0:1;save();var y=window.pageYOffset;render();window.scrollTo(0,y);return;}
  if(a==='nb'){go({scr:'nb'});return;}
  if(a==='prac'){var back={};var k;for(k in V)if(V.hasOwnProperty(k))back[k]=V[k];startPrac(el.getAttribute('data-src'),el.getAttribute('data-mode'));P.back=back;return;}
  if(a==='check'){check();return;}
  if(a==='again'){var b=P.back;startPrac(P.src,P.mode);P.back=b;return;}
  if(a==='back'){if((V.scr==='prac'||V.scr==='done')&&P){go(P.back);return;}go({scr:'home'});return;}
},false);
document.addEventListener('keydown',function(ev){if(ev.keyCode===13&&$('ans')){ev.preventDefault();check();}},false);
function rerenderKeep(tok){var y=window.pageYOffset;render();window.scrollTo(0,y);if(tok){var i;for(i=0;i<TOKS.length;i++)if(TOKS[i].ref===tok.ref){openPop(TOKS[i]);break;}}}

load();render();
</script>
