<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ff7a45">
<title>Week 5 考卷特訓</title>
<style>
:root{--bg:#fff7ee;--card:#ffffff;--ink:#2a2733;--mute:#6f6a7c;--pri:#ff7a45;--pri-d:#e8602b;--ok:#22a05b;--ok-bg:#e6f7ed;--bad:#e5484d;--bad-bg:#fdecec;--line:#eee2d3;--tag:#fff0e2;--t:#c2410c;--n:#2563eb;--hi:#fff1a8;--why:#eef5ff;--shadow:0 2px 10px rgba(80,50,20,.08)}
@media (prefers-color-scheme:dark){:root{--bg:#1d1b22;--card:#29262f;--ink:#f1edf5;--mute:#a7a1b3;--line:#3b3743;--tag:#3a2e26;--t:#ff9a66;--n:#7fb0ff;--hi:#5b4e12;--why:#23304a;--ok-bg:#163826;--bad-bg:#43201f;--shadow:none}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 -apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif}
#app{max-width:680px;margin:0 auto;padding:0 16px 48px}
button{font:inherit;color:inherit;cursor:pointer}
.btn{display:block;width:100%;min-height:52px;margin:10px 0;padding:10px 16px;border:2px solid var(--line);border-radius:14px;background:var(--card);font-weight:700}
.btn:disabled{opacity:.45;cursor:default}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.big{font-size:19px;min-height:58px}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.bar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:8px;margin:0 -16px 12px;padding:10px 16px;background:var(--bg);border-bottom:1px solid var(--line)}
.back{border:0;background:var(--card);border-radius:12px;padding:8px 12px;font-weight:700;box-shadow:var(--shadow)}
.bt{font-weight:800;font-size:18px}
.hero{text-align:center;padding:28px 0 10px}
.hero h1{margin:4px 0;font-size:34px}
.h-sm{color:var(--pri-d);font-weight:800;letter-spacing:.5px}
.h-sub{color:var(--mute)}
.steps{display:grid;gap:12px;margin-top:14px}
.step{display:flex;gap:14px;align-items:center;text-align:left;padding:16px;border:0;border-radius:20px;background:var(--card);box-shadow:var(--shadow);border-left:8px solid var(--pri)}
.step.s2{border-left-color:#3b82f6}.step.s3{border-left-color:#22a05b}
.step.lock{opacity:.55}
.si{font-size:36px}
.sb{flex:1}.sn{font-size:21px;font-weight:800}.sd{color:var(--mute);font-size:15px}.sp{font-size:14px;font-weight:700;margin-top:4px}
.mini{height:8px;border-radius:8px;background:var(--line);margin-top:8px;overflow:hidden}.mini div{height:100%;background:var(--pri)}
.tools{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.tool{border:0;background:var(--card);border-radius:16px;padding:14px 4px;font-size:26px;box-shadow:var(--shadow)}
.tool span{display:block;font-size:15px;font-weight:700}
.foot{text-align:center;color:var(--mute);font-size:14px;margin-top:20px}
.lg{padding:0 2px}
.card{background:var(--card);border-radius:20px;padding:18px;margin:12px 0;box-shadow:var(--shadow)}
.card.c{text-align:center}
.ctitle{margin:0 0 10px;font-size:22px}
section{border-top:1px dashed var(--line);padding-top:12px;margin-top:14px}
section h3{margin:0 0 8px;font-size:17px}
section h3 small,.lab{color:var(--mute);font-weight:600;font-size:13px}
.whead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.bigword{font-size:40px;font-weight:800;line-height:1.1;letter-spacing:.5px;word-break:break-word}
.wmeta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:6px}
.tag{display:inline-block;background:var(--tag);color:var(--pri-d);border-radius:8px;padding:1px 8px;font-size:14px;font-weight:700}
.zhbig{font-size:22px;font-weight:800}
.forms{color:var(--mute);font-size:15px;margin-top:4px}
.spcol{display:flex;flex-direction:column;gap:8px}
.spk{border:0;background:var(--tag);border-radius:12px;min-width:44px;min-height:44px;font-size:20px;vertical-align:middle}
.sent,.qsent{font-size:20px;line-height:1.9}
.w{cursor:pointer;border-radius:5px;padding:0 1px}
.w:active{background:var(--hi)}
.wt{font-weight:800;color:var(--t)}
.wn{text-decoration:underline;text-decoration-style:dotted;text-decoration-color:var(--n);text-decoration-thickness:2px;text-underline-offset:4px}
.hi{background:var(--hi)}
.blank{display:inline-block;min-width:90px;border-bottom:3px solid var(--ink);color:transparent}
.blank.num{color:var(--pri-d);font-weight:800;text-align:center;font-size:16px}
.mbin{display:grid;gap:8px;margin-top:14px}
.mbrow{display:flex;align-items:center;gap:8px}.mbrow span{font-weight:800;color:var(--pri-d);min-width:30px}
.retype .rt{margin-bottom:6px}
.mbx{font-size:16px}
.chip small{color:var(--bad);font-weight:800}
.chunks{display:grid;gap:6px;margin:6px 0}
.ck{display:grid;grid-template-columns:1.2fr 1fr;gap:10px;background:var(--bg);border-radius:12px;padding:8px 12px;align-items:center}
.cke{font-size:17px}.ckz{color:var(--mute);font-size:15px}
.zhline{font-size:18px;font-weight:700;margin:8px 0}
.why{background:var(--why);border-radius:14px;padding:12px 14px;font-size:16px;margin-top:8px}
.tip{background:var(--tag);border-radius:14px;padding:12px 14px;margin:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--line);background:var(--bg);border-radius:999px;padding:8px 14px;font-weight:700;min-height:44px}
.note{color:var(--mute);font-size:15px}.note.c{text-align:center}
.lnav{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;margin-top:8px}
.lnav .btn{margin:0;font-size:15px}
.dots{display:flex;gap:4px;flex-wrap:wrap;justify-content:center;max-width:120px}
.d{width:9px;height:9px;border-radius:50%;background:var(--line)}.d.ok{background:var(--ok)}.d.cur{outline:2px solid var(--pri);outline-offset:1px}
.chkh{margin:22px 0 4px}
.pbar{height:12px;border-radius:12px;background:var(--line);overflow:hidden;margin-top:6px}.pbar div{height:100%;background:linear-gradient(90deg,var(--pri),#ffb347);transition:width .3s}
.pmeta{color:var(--mute);font-size:14px;margin:6px 0;font-weight:600}
.qcard{background:var(--card);border-radius:20px;padding:18px;box-shadow:var(--shadow)}
#chk .qcard{background:var(--bg);box-shadow:none}
.qlab{color:var(--mute);font-weight:700;font-size:15px;margin-bottom:6px}
.qword{font-size:34px;font-weight:800}
.qzh{font-size:28px;font-weight:800}
.qpos{color:var(--mute)}
.hint{font-family:ui-monospace,Menlo,monospace;font-size:20px;letter-spacing:1px;margin-top:6px}
.bigspk{display:flex;gap:10px}.bigspk .btn{margin:6px 0}
.spkbig{background:var(--tag);border-color:transparent}
.opts{display:grid;gap:10px;margin-top:14px}
.opt{text-align:left;padding:14px 16px;min-height:56px;border:2px solid var(--line);border-radius:14px;background:var(--card);font-size:17px;font-weight:600}
.opt.ok{border-color:var(--ok);background:var(--ok-bg)}.opt.bad{border-color:var(--bad);background:var(--bad-bg)}.opt.sel{border-color:var(--pri);background:var(--tag)}
.posrow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.pos{min-height:56px;border:2px solid var(--line);border-radius:14px;background:var(--card);font-size:19px;font-weight:800}
.pos small{display:block;font-size:12px;color:var(--mute);font-weight:600}
.pos.sel{border-color:var(--pri);background:var(--tag)}
.ansrow{display:flex;gap:8px;margin-top:14px}
.ansrow .btn{width:auto;margin:0;flex:none}
input.ans,input.rt{flex:1;min-width:0;width:100%;font:inherit;font-size:22px;padding:10px 14px;border:2px solid var(--line);border-radius:14px;background:var(--bg);color:var(--ink)}
input.ok{border-color:var(--ok);background:var(--ok-bg)}input.bad{border-color:var(--bad);background:var(--bad-bg)}
.fb{margin-top:14px;border-radius:14px;padding:12px 14px}
.fb.good{background:var(--ok-bg);color:var(--ok);font-weight:800;text-align:center;font-size:19px}
.badbox{background:var(--bad-bg)}
.fbt{font-weight:800;color:var(--bad);margin-bottom:4px}
.right{font-size:18px;margin:4px 0}.right b{color:var(--ok);font-size:21px}
.exp{background:var(--card);border-radius:12px;padding:10px 12px;margin:8px 0}
.retype{margin:10px 0}
.winfo .wi1 b{font-size:22px}.wi2{font-size:18px;font-weight:700}.wi3{color:var(--mute);font-size:14px}
.done{text-align:center;font-size:22px;font-weight:800;padding:14px;background:var(--ok-bg);border-radius:18px;margin-top:16px}
.done .btn{font-size:17px}
.done.big{padding:24px 16px}
.ds{font-size:16px;font-weight:600;color:var(--mute);margin:6px 0}
.intro{color:var(--mute)}
.rlist{display:grid;gap:10px}
.rr{display:flex;align-items:center;gap:12px;text-align:left;border:0;border-radius:18px;padding:14px;background:var(--card);box-shadow:var(--shadow)}
.rr.rd{background:var(--ok-bg)}.rr.lock{opacity:.5}
.ri{font-size:30px}.rb{flex:1}.rn{font-weight:800;font-size:18px}.rd2{color:var(--mute);font-size:14px}.rp{color:var(--pri-d);font-size:13px;font-weight:700}.rs{font-size:22px}
.tb{width:100%;border-collapse:collapse;font-size:15px;text-align:left}
.tb th,.tb td{padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
.tb th{color:var(--mute);font-size:13px}
.vs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.vs>div{background:var(--bg);border-radius:14px;padding:12px;font-size:15px}
.vs b.w{font-size:19px}
.ex{font-size:15px}
.score{font-size:72px;font-weight:900;color:var(--pri-d);line-height:1}.score small{font-size:24px}.score.hi{color:var(--ok)}
.msg{font-size:20px;font-weight:800;margin:8px 0}
.meta{color:var(--mute);font-size:15px;margin-bottom:8px}
.sech{margin:22px 4px 6px;font-size:18px}
.wr .sec{color:var(--mute);font-size:13px;font-weight:700}
.qlab.sm{display:none}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stats>div{background:var(--card);border-radius:16px;padding:14px 6px;text-align:center;box-shadow:var(--shadow)}
.stats b{display:block;font-size:30px;color:var(--pri-d)}.stats span{font-size:13px;color:var(--mute)}
.chart{display:flex;align-items:flex-end;gap:6px;height:150px;margin-top:8px}
.col{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center}
.cb{width:100%;max-width:34px;background:var(--pri);border-radius:8px 8px 4px 4px}.cb.full{background:var(--ok)}
.cv{font-size:12px;font-weight:700}
.lnk{border:0;background:none;color:var(--n);font-weight:700;padding:4px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--card);border-radius:14px;padding:4px;gap:4px}
.seg button{border:0;background:none;border-radius:10px;padding:10px 4px;font-weight:700}.seg .on{background:var(--pri);color:#fff}
.wl{padding:6px 12px}
.wrow{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);cursor:pointer}
.wrow:last-child{border:0}
.we{font-weight:800;font-size:18px;flex:1;min-width:0}
.wz{text-align:right;font-size:15px;max-width:55%}.wz small{display:block;color:var(--mute);font-size:12px}
.wrow.hz:not(.open) .wz,.wrow.he:not(.open) .we{color:transparent;background:var(--line);border-radius:8px}
.wrow.he:not(.open) [data-say]{visibility:hidden}
.sheet.hidden{display:none}
.sh-bg{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:20}
.sh{position:fixed;left:0;right:0;bottom:0;z-index:21;max-width:680px;margin:0 auto;background:var(--card);border-radius:24px 24px 0 0;padding:16px 20px calc(24px + env(safe-area-inset-bottom));box-shadow:0 -6px 30px rgba(0,0,0,.2);animation:up .18s ease-out;max-height:80vh;overflow:auto}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
.sh-top{display:flex;justify-content:space-between;align-items:center}
.x{border:0;background:var(--bg);border-radius:50%;width:40px;height:40px;font-size:18px}
.badge{border-radius:8px;padding:2px 10px;font-size:13px;font-weight:800}
.badge.bT{background:var(--tag);color:var(--t)}.badge.bn{background:var(--why);color:var(--n)}.badge.bb{background:var(--bg);color:var(--mute)}
.sh-w{font-size:36px;font-weight:800;margin:6px 0}
.sh-btns{display:flex;gap:10px}.sh-btns .btn{margin:4px 0}
.sh-pos{color:var(--mute);font-weight:700;margin-top:6px}
.sh-zh{font-size:24px;font-weight:800}
.sh-f{color:var(--mute)}
.sh-def{background:var(--bg);border-radius:12px;padding:10px 12px;margin-top:10px}.zh2{color:var(--mute)}
.toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:700;z-index:30}
@media (max-width:420px){.bigword{font-size:34px}.sent,.qsent{font-size:18px}.ck{grid-template-columns:1fr}.vs{grid-template-columns:1fr}}
</style>
</head>

function wspan(raw,k,o){
  const e=D[k];
  if(!o.click)return o.hi===k?`<b class="hi">${esc(raw)}</b>`:esc(raw);
  const cls="w"+(e.tier==="T"?" wt":e.tier==="N"?" wn":"")+(o.hi===k?" hi":"");
  return `<span class="${cls}" data-k="${esc(k)}">${esc(raw)}</span>`;
}
function rt(text,opt){
  const o=Object.assign({click:true,hi:null,blank:null},opt||{});
  text=text.replace(/_{3,}/g,"\u0000");
  if(o.blank)[].concat(o.blank).forEach(b=>{text=text.replace(new RegExp("\\b"+b+"\\b"),"\u0000");});
  let bn=0;const multi=Array.isArray(o.blank)&&o.blank.length>1;
  const toks=text.match(/[A-Za-z]+(?:[-'][A-Za-z]+)*|\u0000|[^A-Za-z\u0000]+/g)||[];
  let out="";
  for(let i=0;i<toks.length;i++){
    const t=toks[i];
    if(t==="\u0000"){bn++;out+=multi?`<span class="blank num">(${bn})</span>`:'<span class="blank">________</span>';continue;}
    if(!/^[A-Za-z]/.test(t)){out+=esc(t);continue;}
    let done=false;
    for(const n of [3,2]){
      const idx=[i];
      while(idx.length<n){const l=idx[idx.length-1];if(toks[l+1]===" "&&toks[l+2]&&/^[A-Za-z]/.test(toks[l+2]))idx.push(l+2);else break;}
      if(idx.length===n){const ph=idx.map(x=>toks[x].toLowerCase()).join(" ");const k=PHR[ph];
        if(k){out+=wspan(toks.slice(i,idx[n-1]+1).join(""),k,o);i=idx[n-1];done=true;break;}}
    }
    if(done)continue;
    const k=keyOf(t);out+=k?wspan(t,k,o):esc(t);
  }
  return out;
}

function renderQ(box,q,cb,quiet){

  function next(){
    if(!st.queue.length){if(o.key){S.rounds[o.key]={done:true,total:st.total,wrong:st.wrong,at:Date.now()};save();}o.onDone&&o.onDone(st);return;}
    const id=st.queue[0];const q=buildQ(id);

    const qc=el.querySelector(".qcard");

}

const SEC={dict:"一、聽寫＋詞性",dw:"二、原考卷 B：看定義寫單字",fb:"三、原考卷 C：句子填空",nf:"四、新句子填空",tf:"五、動詞形式填空",mb:"六、多格填空",nb:"七、生字填空",sm:"句子意思",sp:"生字拼寫",vm:"生字意思",cf:"易混字"};
// 依常錯程度加權抽題（錯越多次越容易被抽到）
function wsample(items,n,keysFn){const pool=items.map(x=>({x,w:1+3*keysFn(x).reduce((s,k)=>s+missOf(k),0)}));const out=[];
  while(out.length<n&&pool.length){let r=Math.random()*pool.reduce((s,p)=>s+p.w,0);let i=0;for(;i<pool.length-1;i++){r-=pool[i].w;if(r<=0)break;}out.push(pool.splice(i,1)[0].x);}
  return out;}
function genTest(){

  shuffle(TK).forEach(k=>ids.push("dw:"+k));
  shuffle(TK).forEach(k=>ids.push("fb:"+k));
  wsample(NEWS,10,x=>[x.t]).forEach(x=>ids.push("nf:"+x.t+":"+x.i));
  wsample(TF.map((_,i)=>i),4,i=>[TF[i].k]).forEach(i=>ids.push("tf:"+i));
  wsample(MB.map((_,i)=>i),8,i=>MB[i].ans.map(keyOf).filter(Boolean)).forEach(i=>ids.push("mb:"+i));
  const nbk=wsample(NW.filter(k=>NB.some(n=>n.k===k)),5,k=>[k]);
  nbk.forEach(k=>{const c=NB.map((n,i)=>({n,i})).filter(o=>o.n.k===k);ids.push("nb:"+c[Math.random()*c.length|0].i);});
  return ids;
}
const topMiss=n=>Object.entries(S.miss||{}).filter(e=>e[1]>0).sort((a,b)=>b[1]-a[1]).slice(0,n);
let inTest=false;
function runTest(el){
  const ids=genTest(),ans=[],t0=Date.now();let i=0;inTest=true;
  function next(){
    if(i>=ids.length)return finish();
    const id=ids[i],q=buildQ(id);
    el.innerHTML=`<div class="pbar"><div style="width:${i/ids.length*100}%"></div></div><div class="pmeta">第 ${i+1} / ${ids.length} 題 · ${SEC[id.split(":")[0]]}</div><div class="qcard"></div>`;
    renderQ(el.querySelector(".qcard"),q,(ok,given)=>{ans.push({id,ok,given});i++;setTimeout(next,350);},true);
  }
  function finish(){inTest=false;const score=ans.filter(a=>a.ok).length*2;ans.filter(a=>!a.ok).forEach(a=>addMiss(a.id));
    S.tests.push({at:Date.now(),score,dur:Math.round((Date.now()-t0)/1000),ans});save();go("result",S.tests.length-1);}
  next();
}

function fmtDate(ms){const d=new Date(ms);return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`;}
function fmtDur(s){return Math.floor(s/60)+" 分 "+(s%60)+" 秒";}
const best=()=>S.tests.length?Math.max(...S.tests.map(t=>t.score)):null;

function go(v,arg){

}
